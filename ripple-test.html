<style>
:root{
  --bg-top:#e7f2e8; --bg-bot:#bcd9c8; --ink:#1f3d37; --ink-soft:#4d6b63; --card:#fffcf3;
  --line:#d8e5da; --accent:#2c8a7e; --accent-ink:#ffffff; --gold:#f0b429; --gold-dim:#c9d6cd;
  --btn:#ffffff; --btn-ink:#1f3d37; --shadow:0 6px 18px rgba(31,61,55,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  overflow-x:hidden;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px}
h1#title{margin:0;font-size:28px;letter-spacing:.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:default}
h1#title svg{width:30px;height:30px}
.icon{width:48px;height:48px;border-radius:16px;border:0;background:var(--btn);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.icon svg{width:24px;height:24px}
.icon[aria-pressed="true"]{opacity:.65}
.hidden{display:none!important}
.screen{flex:1;display:flex;flex-direction:column}
/* level select */
.sub{margin:6px 2px 14px;color:var(--ink-soft);font-size:16px;line-height:1.35}
.totals{font-weight:700;color:var(--ink-soft);margin:0 2px 10px;font-size:15px}
#levelGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:12px 6px 10px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .num{font-size:26px;font-weight:800;color:var(--accent)}
.tile .nm{font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.tile .st{display:flex;gap:2px}
.tile .st svg{width:16px;height:16px}
.tile.locked{background:#e5ede6;box-shadow:none}
.tile.locked .num{color:#a3b5ab}
.tile .lock{width:22px;height:22px;opacity:.55}
.tile .badge{position:absolute;top:7px;right:8px;font-size:10.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:8px;padding:2px 6px}
.tester{margin-top:14px;font-size:13px;color:var(--ink-soft);text-align:center}
/* play */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px;min-height:40px}
.lvname{font-weight:800;font-size:17px;line-height:1.15}
.lvname small{display:block;font-weight:600;color:var(--ink-soft);font-size:13px}
.counter{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);font-weight:700;font-size:15px;white-space:nowrap}
.counter b{font-size:20px}
.counter .par{color:var(--ink-soft);font-weight:600}
.helpbtn{width:40px;height:40px;border-radius:14px;font-weight:800;font-size:18px}
.boardWrap{width:100%;max-width:min(520px,calc(100dvh - 330px));min-width:min(100%,300px);margin:0 auto;aspect-ratio:1/1;position:relative}
#board{width:100%;height:100%;display:block;touch-action:manipulation;overflow:visible}
.stoneBar{display:flex;gap:10px;justify-content:center;margin:10px 0 0}
.stone{flex:1;max-width:200px;min-height:52px;border-radius:16px;border:3px solid transparent;background:var(--btn);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px}
.stone svg{width:26px;height:26px}
.stone[aria-pressed="true"]{border-color:var(--accent);background:#e8f6f2}
.stone:disabled{opacity:.45;cursor:default}
.coach{margin:10px 0 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:2px solid #f3dc8b}
.coach p{margin:0;font-size:17px;line-height:1.35;font-weight:650}
.coachRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.coachRow span{color:var(--ink-soft);font-size:13px;font-weight:700}
.coach.nudge{animation:nudge .35s}
@keyframes nudge{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.btn{min-height:48px;padding:0 18px;border-radius:16px;border:0;background:var(--btn);box-shadow:var(--shadow);font-weight:750;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.controls{display:flex;gap:10px;justify-content:center;margin-top:12px}
.controls .btn{flex:1;max-width:170px}
.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(240,180,41,.55),var(--shadow)}}
/* overlay */
.overlay{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(24,52,46,.18);z-index:10;pointer-events:none}
.overlay .card{pointer-events:auto}
.card{width:100%;max-width:420px;background:var(--card);border-radius:24px;box-shadow:0 14px 40px rgba(31,61,55,.25);padding:20px 18px 18px;text-align:center;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.card h2{margin:0 0 6px;font-size:26px}
.card p{margin:4px 0;color:var(--ink-soft);font-size:16px}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.stars svg{width:46px;height:46px}
.stars svg.on{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.card .row{display:flex;gap:10px;margin-top:14px}
.card .row .btn{flex:1}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;z-index:20;transition:opacity .3s}
/* svg bits */
.leaf{transition:transform 240ms cubic-bezier(.25,.8,.35,1)}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(2deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.25);opacity:0}}
.tapdot{animation:tapdot 1.2s ease-in-out infinite}
@keyframes tapdot{50%{opacity:.35}}
.hl{animation:hl 1.4s ease-in-out infinite}
@keyframes hl{50%{opacity:.35}}
.padring{transition:opacity .3s}
.home .padring{opacity:1!important}
.hit{fill:transparent;cursor:pointer}
@media (min-width:700px){ #levelGrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ .bob,.pulse,.glow{animation:none} }
</style>

<script>
/* Ripple - shared move logic. Used by the game (inlined into prototype.html by build.js)
 * and by solver.js / gen.js / check.js in node. Keep this file the ONLY source of rules.
 *
 * RULES
 * - Grid w x h. Cell index = r*w + c.
 * - Static pieces: rocks (fill a cell), anchored lilies (fill a cell), reeds (sit on the
 *   EDGE between two neighbouring cells).
 * - Movable pieces: leaves. A leaf carries a critter (frog, duck, turtle) or is plain ('leaf').
 * - A move = tap an EMPTY water cell (no rock, no anchored lily, no leaf). Pads are water,
 *   so an empty pad can be tapped.
 * - Ripple reach: the 2 cells in each of the 4 straight directions from the splash.
 *   Rocks and reeds do NOT stop the ripple (it washes over them).
 *   An anchored lily DOES stop the ripple: cells behind it on that line are not reached.
 *   The bank (grid edge) ends the line.
 * - Every leaf reached slides directly away from the splash: 1 step for a pebble,
 *   2 steps for a big stone (one step at a time, stopping at the first blocked step).
 * - A step is blocked by: the bank, a rock, an anchored lily, a reed on the edge being
 *   crossed, or a leaf in the target cell (as the board stands at that moment).
 *
 * SIMULTANEOUS-MOVE RESOLUTION (one fixed rule, used by game and solver alike):
 *   Leaves are resolved FARTHEST FROM THE SPLASH FIRST (distance 2 before distance 1).
 *   Each leaf finishes all of its steps before the next leaf moves, and the board is
 *   updated live. So when two leaves sit in a line, the far one moves first and the
 *   near one can then follow into the cell it left ("a little train"). If the far one
 *   is blocked, the near one is blocked by it too.
 *   Leaves on different lines move in different directions away from the splash and can
 *   never meet, so ties at the same distance are processed in fixed order up, down,
 *   left, right; the order cannot change the result.
 * - Win: every critter leaf sits on the pad of its own kind. Plain leaves don't matter.
 *   Pads can be left again, so order matters.
 */
(function (root) {
  'use strict';
  var DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]]; // up, down, left, right
  var CRITTERS = ['frog', 'duck', 'turtle'];

  function edgeKey(a, b) { return a < b ? a + ':' + b : b + ':' + a; }

  // Build the static board from a level object.
  function makeBoard(level) {
    var w = level.w, h = level.h, n = w * h;
    var cell = new Uint8Array(n); // 0 water, 1 rock, 2 anchored lily
    (level.rocks || []).forEach(function (p) { cell[p[0] * w + p[1]] = 1; });
    (level.anchors || []).forEach(function (p) { cell[p[0] * w + p[1]] = 2; });
    var reeds = {};
    // reed: [r, c, 'E'] = between (r,c) and (r,c+1); [r, c, 'S'] = between (r,c) and (r+1,c)
    (level.reeds || []).forEach(function (e) {
      var a = e[0] * w + e[1];
      var b = e[2] === 'E' ? a + 1 : a + w;
      reeds[edgeKey(a, b)] = true;
    });
    var kinds = level.leaves.map(function (l) { return l.k; });
    var pads = {};
    (level.pads || []).forEach(function (p) { pads[p.k] = p.r * w + p.c; });
    return { w: w, h: h, n: n, cell: cell, reeds: reeds, kinds: kinds, pads: pads };
  }

  function initialState(level) {
    return {
      pos: level.leaves.map(function (l) { return l.r * level.w + l.c; }),
      big: level.big || 0
    };
  }

  function leafAt(state, idx) {
    for (var i = 0; i < state.pos.length; i++) if (state.pos[i] === idx) return i;
    return -1;
  }

  function canTap(board, state, idx, useBig) {
    if (idx < 0 || idx >= board.n) return false;
    if (board.cell[idx] !== 0) return false;
    if (leafAt(state, idx) !== -1) return false;
    if (useBig && state.big <= 0) return false;
    return true;
  }

  // Which leaves the ripple reaches, in resolution order (farthest first).
  function reached(board, state, idx) {
    var w = board.w, r0 = (idx / w) | 0, c0 = idx % w, out = [];
    for (var d = 0; d < 4; d++) {
      for (var k = 1; k <= 2; k++) {
        var r = r0 + DIRS[d][0] * k, c = c0 + DIRS[d][1] * k;
        if (r < 0 || r >= board.h || c < 0 || c >= w) break;
        var j = r * w + c;
        if (board.cell[j] === 2) break; // anchored lily soaks up the ripple
        var li = leafAt(state, j);
        if (li !== -1) out.push({ i: li, dir: d, dist: k });
      }
    }
    out.sort(function (a, b) { return b.dist - a.dist || a.dir - b.dir; }); // stable tiebreak
    return out;
  }

  // Apply a tap. Returns { state, moves:[{i, from, to, steps, dir}], reached:[...] } or null if illegal.
  function applyMove(board, state, idx, useBig) {
    if (!canTap(board, state, idx, useBig)) return null;
    var w = board.w;
    var pos = state.pos.slice();
    var occ = {};
    pos.forEach(function (p, i) { occ[p] = i; });
    var hits = reached(board, state, idx);
    var push = useBig ? 2 : 1;
    var moves = [];
    hits.forEach(function (hit) {
      var cur = pos[hit.i], from = cur, steps = 0;
      var dr = DIRS[hit.dir][0], dc = DIRS[hit.dir][1];
      for (var s = 0; s < push; s++) {
        var r = ((cur / w) | 0) + dr, c = (cur % w) + dc;
        if (r < 0 || r >= board.h || c < 0 || c >= w) break;      // bank
        var nx = r * w + c;
        if (board.cell[nx] !== 0) break;                           // rock / anchored lily
        if (board.reeds[edgeKey(cur, nx)]) break;                  // reed
        if (occ[nx] !== undefined) break;                          // another leaf
        delete occ[cur]; occ[nx] = hit.i; cur = nx; steps++;
      }
      pos[hit.i] = cur;
      moves.push({ i: hit.i, from: from, to: cur, steps: steps, dir: hit.dir });
    });
    return { state: { pos: pos, big: state.big - (useBig ? 1 : 0) }, moves: moves, reached: hits };
  }

  function isWin(board, state) {
    for (var i = 0; i < board.kinds.length; i++) {
      var k = board.kinds[i];
      if (k === 'leaf') continue;
      if (state.pos[i] !== board.pads[k]) return false;
    }
    return true;
  }

  // Canonical key: plain leaves are interchangeable, so sort their positions.
  function key(board, state) {
    var crit = [], plain = [];
    for (var i = 0; i < state.pos.length; i++) {
      if (board.kinds[i] === 'leaf') plain.push(state.pos[i]); else crit.push(state.pos[i]);
    }
    plain.sort(function (a, b) { return a - b; });
    return crit.join(',') + '/' + plain.join(',') + '|' + state.big;
  }

  // All legal taps from a state: [{idx, big}]
  function legalMoves(board, state) {
    var out = [];
    for (var idx = 0; idx < board.n; idx++) {
      if (!canTap(board, state, idx, false)) continue;
      out.push({ idx: idx, big: false });
      if (state.big > 0) out.push({ idx: idx, big: true });
    }
    return out;
  }

  // Breadth-first search. Returns array of taps [{idx, big}] (shortest), or null.
  // Optional maxDepth: give up on paths longer than that (used by the level generator).
  function solve(level, startState, maxStates, maxDepth) {
    var board = makeBoard(level);
    var start = startState || initialState(level);
    maxStates = maxStates || 2000000;
    if (isWin(board, start)) return [];
    var seen = new Map();
    var k0 = key(board, start);
    seen.set(k0, null);
    var queue = [start], keys = [k0], depth = [0], head = 0;
    maxDepth = maxDepth || Infinity;
    while (head < queue.length) {
      var st = queue[head], sk = keys[head], dp = depth[head]; head++;
      if (dp >= maxDepth) continue;
      var ms = legalMoves(board, st);
      for (var m = 0; m < ms.length; m++) {
        var res = applyMove(board, st, ms[m].idx, ms[m].big);
        var nk = key(board, res.state);
        if (seen.has(nk)) continue;
        seen.set(nk, { prev: sk, move: ms[m] });
        if (isWin(board, res.state)) {
          var path = [], cur = nk;
          while (seen.get(cur)) { path.unshift(seen.get(cur).move); cur = seen.get(cur).prev; }
          return path;
        }
        if (seen.size > maxStates) return null;
        queue.push(res.state); keys.push(nk); depth.push(dp + 1);
      }
    }
    return null;
  }

  var api = {
    DIRS: DIRS, CRITTERS: CRITTERS, makeBoard: makeBoard, initialState: initialState,
    leafAt: leafAt, canTap: canTap, reached: reached, applyMove: applyMove, isWin: isWin,
    key: key, legalMoves: legalMoves, solve: solve
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RippleLogic = api;
})(this);

$('btnMute').addEventListener('click', function () { setMute(!muted); });
var titleTaps = 0, titleTimer = null;
$('title').addEventListener('click', function () {
  titleTaps++; clearTimeout(titleTimer); titleTimer = setTimeout(function () { titleTaps = 0; }, 1500);
  if (titleTaps >= 5) { titleTaps = 0; setTester(); }
});

setMute(muted);
if (tester) $('btnSolve').classList.remove('hidden');
// test hook (read-only view of state, used by the Playwright check)
window.__ripple = { get state() { return { level: G.li + 1, taps: G.taps, won: G.won, busy: G.busy, coach: G.coach ? G.coach.i : -1 }; },
  solution: function () { return L.solve(G.level, G.st); }, start: function (i) { startLevel(i); } };
// first visit: go straight into the tutorial pond
if (!progress.stars[LEVELS[0].id]) startLevel(0); else showSelect();
})();
