html,body{height:100%}
body{background:linear-gradient(var(--sky2),var(--sky) 40%);background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-user-select:none;user-select:none;touch-action:manipulation}

.dots button.cur{border-color:var(--accent);color:var(--accent)}
.dots button:disabled{opacity:.35;cursor:default}
.dots button{position:relative;height:40px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}

.dots button .st i{font-style:normal;opacity:.3;color:var(--soft)}
.dots button .bx{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.pkey{font:600 .78rem var(--body);color:var(--soft);margin:0 0 8px}
.pkey b{color:var(--accent)}
/* the board takes what height is left after the header, tip and buttons, so the controls never fall below the fold */
.boardwrap{position:relative;width:min(100%,max(240px,calc(100vh - 250px)));width:min(100%,max(240px,calc(100dvh - 250px)));aspect-ratio:1;margin:0 auto}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:22px}
.tip{min-height:3.2em;font-weight:700;line-height:1.35;text-wrap:balance}
.tip b{color:var(--accent)}
.tip.bad{color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;white-space:nowrap;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;font:800 1rem var(--body);cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.card{max-height:88vh;max-height:88dvh;overflow-y:auto;background:var(--card);color:var(--ink);width:min(560px,100%);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);margin:0;font-size:1.6rem;text-wrap:balance}
.card h3{margin:4px 0 0;font:800 .8rem var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--soft)}
.helplist{display:flex;flex-direction:column;gap:8px}
.helplist .btn{text-align:left;flex:none}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-weight:700}
.goals li.no{color:var(--soft);font-weight:600}
.guide{display:flex;flex-direction:column;gap:10px}
.guide div{display:flex;gap:12px;align-items:center;line-height:1.35}
.guide canvas{width:56px;height:56px;flex:none;border-radius:14px;background:var(--leaf)}
.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.stars{font-size:2rem;letter-spacing:4px;color:var(--accent)}
.small{color:var(--soft);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function turnOf(y){return y.t===1?0:y.t===2?2:y.t===3?(y.p?2:1):1}

 tap:{h:"Send the bird home",steps:["The whole game in one line: birds fly the way they face, and every takeoff ruffles the birds right beside it so they turn. You'll learn it one step at a time.","Each bird looks the way it will fly. Tap the bird and it flies off the roost.","Clear every bird to finish the level."]},
 block:{h:"Birds can't fly through birds",steps:["A bird can only leave if nothing is in its way.","The left bird is facing another bird, so it's stuck for now.","Send the right bird first, then the left bird has a clear sky."]},
 startle:{h:"Flapping ruffles neighbors",steps:["When a bird takes off, the birds directly beside it (above, below, left or right, not diagonal) get their feathers ruffled.","A ruffled bird turns a quarter turn clockwise ↻.","Here the two right birds block each other. Send the middle bird and watch the one beside it turn to face a clear path."]},
 use:{h:"Plan the turns",steps:["Now you choose which bird goes first.","Press and hold any bird to preview: its path lights up, and every bird that will turn shows its new direction. Letting go after a hold never moves it. Tap the bird when you want it to fly.","If every bird gets stuck, tap Undo as often as you like. There is always a way, and the level still counts."]},
 owl:{h:"Meet the owl",steps:["Owls are calm. Their feathers never ruffle, so they never turn.","Owls still ruffle their neighbors when they fly.","Use the owl's steady gaze to plan around it."]},
 flip:{h:"Meet the flip bird",steps:["Welcome to the Mixed Flock! The purple bird with the dark eye mask and the white U on its chest is a <b>flip bird</b>.","When a bird beside it takes off, a flip bird turns all the way around (a U-turn) instead of a quarter turn.","Hold a bird to preview: a songbird beside it shows ↻, a flip bird shows U, an owl shows –.","Here the flip bird faces a stuck bird. Send the glowing bird and watch the flip bird turn around."]},

   const mx=x-s*.32,my=y+s*.3;cx.fillStyle="#f6c443";cx.strokeStyle=css("--card");cx.lineWidth=Math.max(1.5,s*.03);cx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?s*.065:s*.15;k?cx.lineTo(mx+Math.cos(a)*rr,my+Math.sin(a)*rr):cx.moveTo(mx+Math.cos(a)*rr,my+Math.sin(a)*rr)}cx.closePath();cx.stroke();cx.fill()}

 tumbles=tumbles.filter(q=>now-q.t<520);

 for(const f of flying){const t=(now-f.t)/700;if(t>1)continue;const dist=t*t*N*1.4*s;

  if(!calm.matches){cx.strokeStyle=f.o?"#9b7652":f.f?FLIP:f.z?DIZZY:f.col;cx.globalAlpha=.45*(1-t);cx.lineWidth=s*.08*(1-t*.5);cx.lineCap="round";cx.beginPath();cx.moveTo((f.c+.5)*s+DC[f.d]*dist*.35,(f.r+.5)*s+DR[f.d]*dist*.35);cx.lineTo((f.c+.5)*s+DC[f.d]*dist*.9,(f.r+.5)*s+DR[f.d]*dist*.9);cx.stroke();cx.globalAlpha=1}drawBird(f,(f.c+.5)*s+DC[f.d]*dist,(f.r+.5)*s+DR[f.d]*dist,s*(1+t*.3),f.d*Math.PI/2,now/40,false)}
 flying=flying.filter(f=>now-f.t<700);
