<body>
<title>Ruffled Roost (test version)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen phone game. A treetop roost board under a dawn sky, controls stacked below. */
:root{
  --sky:#eaf1f4; --sky2:#f7e9dc; --ink:#2c3a34; --soft:#5d6d65; --meadow:#cfe0b4; --meadow2:#b9d199; --tuft:#86a95f;
  --accent:#d9733f; --warn:#c2492f; --card:#fffdf8; --line:#d7dccf;
  --leaf:#b9d39a; --leaf2:#9fc07c; --leaf3:#d5e6bd; --bark:#9a6a42; --bark2:#c08c5c; --barkd:#6b4529; --nest:#d9b98a;
  --display:"Grandstander","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky:#17222b;--sky2:#24263a;--ink:#eef2ea;--soft:#a9b7ae;--meadow:#2c3b2c;--meadow2:#334632;--tuft:#5f7e47;--accent:#f0915c;--warn:#ff7a5c;--card:#1f2a2e;--line:#3a4840;--leaf:#203226;--leaf2:#2a4230;--leaf3:#2f4a35;--bark:#7a5434;--bark2:#9b6f47;--barkd:#4a3020;--nest:#8a6f4c;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#17222b;--sky2:#24263a;--ink:#eef2ea;--soft:#a9b7ae;--meadow:#2c3b2c;--meadow2:#334632;--tuft:#5f7e47;--accent:#f0915c;--warn:#ff7a5c;--card:#1f2a2e;--line:#3a4840;--leaf:#203226;--leaf2:#2a4230;--leaf3:#2f4a35;--bark:#7a5434;--bark2:#9b6f47;--barkd:#4a3020;--nest:#8a6f4c;color-scheme:dark}
html,body{height:100%}
body{background:linear-gradient(var(--sky2),var(--sky) 40%);background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,7.5vw,2rem);white-space:nowrap;margin:0;letter-spacing:.5px;color:var(--accent);cursor:default}
.lvl{font-weight:800;white-space:nowrap;color:var(--soft);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dots .pack{flex-basis:100%;font:800 .78rem var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--soft);margin-top:2px}
.btn[hidden]{display:none}
.btn:disabled{opacity:.45;cursor:default}
.dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--soft);font:700 .8rem var(--body);padding:0;cursor:pointer}
.dots button.done{background:var(--meadow2);border-color:var(--tuft);color:var(--ink)}
.dots button.cur{border-color:var(--accent);color:var(--accent)}
.dots button:disabled{opacity:.35;cursor:default}
.boardwrap{position:relative;width:100%;aspect-ratio:1;max-width:100%}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:22px}
.tip{min-height:3.2em;font-weight:700;line-height:1.35;text-wrap:balance}
.tip b{color:var(--accent)}
.tip.bad{color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 10px;font:800 1rem var(--body);cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.card{background:var(--card);color:var(--ink);width:min(560px,100%);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);margin:0;font-size:1.6rem;text-wrap:balance}
.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.stars{font-size:2rem;letter-spacing:4px;color:var(--accent)}
.small{color:var(--soft);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app">
  <header><h1 id="title">Ruffled Roost</h1><span class="lvl" id="lvl">Level 1 of 12</span></header>
  <div class="dots" id="dots"></div>
  <div class="boardwrap"><canvas id="cv" aria-label="Game board"></canvas></div>
  <div class="tip" id="tip"></div>
  <div class="row">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="hint">Hint</button>
    <button class="btn" id="nudge" hidden>Nudge (1)</button>
  </div>
  <div class="small">Prototype v0.3 for testing. Press and hold a bird to see where it will fly. Let go on the bird to send it, or slide off it to cancel.</div>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="cardbody"></div></div>
<script>
const LEVELS=[{"n":3,"b":[[1,1,0,0]],"intro":"tap"},{"n":3,"b":[[1,0,1,0],[1,2,0,0]],"intro":"block"},{"n":3,"b":[[1,1,0,0],[1,2,2,0],[2,2,0,0]],"intro":"startle"},{"n":4,"b":[[2,0,1,0],[2,1,3,0],[0,0,1,0],[1,0,1,0]],"intro":"use"},{"n":4,"b":[[2,1,3,0],[2,2,1,0],[0,1,2,0],[1,1,0,0]]},{"n":5,"b":[[3,4,0,0],[3,3,1,0],[2,3,3,0],[2,1,3,0],[4,1,2,0],[3,0,3,0],[0,4,2,0],[2,2,0,0]]},{"n":5,"b":[[1,1,2,0],[0,2,3,0],[3,1,0,0],[4,3,0,0],[3,4,2,0],[4,2,0,0],[4,1,0,0],[3,3,2,0],[0,3,1,0]]},{"n":5,"b":[[2,0,0,0],[1,2,1,0],[3,2,2,0],[1,1,3,0],[3,1,3,0],[0,3,1,0],[4,3,0,0],[1,3,2,0],[4,2,2,0]]},{"n":6,"b":[[4,4,1,0],[3,0,2,0],[1,1,0,0],[4,2,0,0],[4,1,0,0],[3,4,1,0],[4,3,0,0],[5,4,0,0],[5,2,2,0],[4,0,0,0]]},{"n":4,"b":[[0,1,0,0],[1,1,0,1],[1,2,3,0]],"intro":"owl"},{"n":6,"b":[[0,5,0,1],[0,2,1,1],[3,1,1,0],[0,3,1,0],[1,3,3,0],[0,1,1,0],[3,0,3,0],[4,5,0,0],[0,0,0,0],[5,3,3,0],[2,1,1,0],[1,0,0,0],[1,1,1,0],[2,3,3,0]]},{"n":6,"b":[[1,3,0,1],[1,4,1,1],[2,3,0,1],[2,0,0,0],[2,1,2,0],[4,4,1,0],[5,5,2,0],[5,1,0,0],[5,0,2,0],[2,4,3,0],[2,2,0,0],[5,2,3,0]]},{"n":3,"b":[[1,0,1,0],[1,1,3,2],[2,1,2,0],[0,1,2,1]],"intro":"flip"},{"n":4,"b":[[0,1,2,2],[0,0,1,2],[0,2,3,0],[1,0,0,0],[1,2,2,0]]},{"n":5,"b":[[1,2,1,2],[1,0,1,2],[3,3,1,0],[0,3,2,0],[4,3,0,0],[3,0,0,0],[1,1,2,0]]},{"n":5,"b":[[4,3,0,2],[2,4,1,2],[0,3,2,2],[2,2,0,0],[0,0,1,0],[2,3,1,0],[1,4,2,0],[4,2,3,0],[0,2,2,0]]},{"n":5,"b":[[1,2,2,1],[0,2,3,1],[4,0,0,2],[3,2,3,2],[4,2,2,0],[3,0,3,0],[4,1,3,0],[1,0,2,0],[0,3,1,0]]},{"n":6,"b":[[5,2,3,1],[5,5,0,1],[4,3,3,2],[2,4,3,2],[3,3,1,2],[5,3,0,0],[4,1,1,0],[2,3,0,0],[1,5,1,0],[2,1,2,0],[2,0,1,0],[2,2,0,0]]},{"n":3,"b":[[1,0,1,0],[1,1,3,0]],"k":1,"intro":"nudge"},{"n":5,"b":[[1,4,0,1],[0,2,0,2],[1,0,1,2],[4,1,0,0],[0,4,2,0],[0,0,1,0],[3,0,0,0],[0,3,2,0]],"k":1}];
const PACKS=[{name:"First Flight",from:0},{name:"Mixed Flock",from:12}];
const TURN=[1,0,2];
const DR=[-1,0,1,0],DC=[0,1,0,-1];
const COLORS=["#e07a5f","#f2b84b","#8cc084","#f28e6b","#6cc3c1","#e5a3b6","#d9a36a"];
const FLIP="#7457c9";
const INTRO={
 tap:{h:"Send the bird home",steps:["The whole game in one line: birds fly the way they face, and every takeoff ruffles the birds right beside it so they turn. You'll learn it one step at a time.","Each bird looks the way it will fly. Tap the bird and it flies off the roost.","Clear every bird to finish the level."]},
 block:{h:"Birds can't fly through birds",steps:["A bird can only leave if nothing is in its way.","The left bird is facing another bird, so it's stuck for now.","Send the right bird first, then the left bird has a clear sky."]},
 startle:{h:"Flapping ruffles neighbors",steps:["When a bird takes off, the birds directly beside it (above, below, left or right, not diagonal) get their feathers ruffled.","A ruffled bird turns a quarter turn clockwise ↻.","Here the two right birds block each other. Send the middle bird and watch the one beside it turn to face a clear path."]},
 use:{h:"Plan the turns",steps:["Now you choose which bird goes first.","Press and hold any bird to preview: its path lights up and the birds that will turn show ↻. Let go on the bird to send it, or slide off it to cancel.","If every bird gets stuck, tap Undo. There is always a way."]},
 owl:{h:"Meet the owl",steps:["Owls are calm. Their feathers never ruffle, so they never turn.","Owls still ruffle their neighbors when they fly.","Use the owl's steady gaze to plan around it."]},
 flip:{h:"Meet the flip bird",steps:["Welcome to the Mixed Flock! The purple bird with the dark eye mask and the white U on its chest is a <b>flip bird</b>.","When a bird beside it takes off, a flip bird turns all the way around (a U-turn) instead of a quarter turn.","Hold a bird to preview: a songbird beside it shows ↻, a flip bird shows U, an owl shows –.","Here the flip bird faces a stuck bird. Send the glowing bird and watch the flip bird turn around."]},
 nudge:{h:"Your Nudge",steps:["Some levels give you one free <b>Nudge</b>. It comes back every time you play the level.","Tap <b>Nudge</b>, then tap a bird. That bird turns a quarter turn ↻ and nobody flies.","Owls won't budge. Tap Nudge again to cancel, or Undo to take it back.","These two birds block each other. Nudge the glowing bird, then send them both home."]}
};
let store={get(k,d){try{const v=localStorage.getItem("flit."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("flit."+k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done",{}),seenIntro=store.get("intro",{}),unlocked=/[?&]unlock=1/.test(location.search)||store.get("unlock",false);
let cur=0,birds=[],hist=[],undos=0,nudges=0,nudging=false,blinks=[],startN=0,flying=[],ruffles=[],feathers=[],press=null,hintId=null,shake=null,nextId=0;
const cv=document.getElementById("cv");let cx=cv.getContext("2d");
let W=0,dpr=1;
function n(){return LEVELS[cur].n}
function seedRand(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function load(i){cur=i;const L=LEVELS[i];const rnd=seedRand(i*977+13);birds=L.b.map(([r,c,d,t],k)=>({id:nextId++,r,c,d,t,o:t===1,f:t===2,ang:d*Math.PI/2,col:COLORS[Math.floor(rnd()*COLORS.length)],j:rnd()*6.28}));hist=[];undos=0;nudges=L.k||0;nudging=false;blinks=[];startN=birds.length;flying=[];ruffles=[];feathers=[];hintId=null;nudgeBtn();tip();drawDots();
 document.getElementById("lvl").textContent="Level "+(i+1)+" of "+LEVELS.length;
 if(L.intro&&!seenIntro[L.intro])showIntro(L.intro);else if(L.intro)tutorialHint();}
function at(r,c){return birds.find(b=>b.r===r&&b.c===c)}
function blocker(b){let r=b.r+DR[b.d],c=b.c+DC[b.d];while(r>=0&&c>=0&&r<n()&&c<n()){const x=at(r,c);if(x)return x;r+=DR[b.d];c+=DC[b.d]}return null}
function neighbors(b){return birds.filter(y=>y!==b&&Math.abs(y.r-b.r)+Math.abs(y.c-b.c)===1)}
function snapshot(){return {b:birds.map(b=>({...b})),k:nudges}}
function canMove(){return birds.some(b=>!blocker(b))}
function nudgeBtn(){const el=document.getElementById("nudge");el.hidden=!(LEVELS[cur].k);el.textContent=nudging?"Cancel":"Nudge ("+nudges+")";el.disabled=!nudges&&!nudging;el.classList.toggle("main",nudging)}
// solver for hints: birds as [r,c,d,t], k = nudges left; returns moves ["f"|"n",r,c]
function key(s,k){return k+"#"+s.map(x=>x.join(",")).sort().join("|")}
function solve(s,k,N,m){if(!s.length)return[];const sk=key(s,k);if(m.has(sk))return m.get(sk);m.set(sk,null);
 const tryIt=(t,x,ns,nk)=>{const sol=solve(ns,nk,N,m);if(sol){const res=[[t,x[0],x[1]],...sol];m.set(sk,res);return res}return null};
 for(let i=0;i<s.length;i++){const x=s[i];let r=x[0]+DR[x[2]],c=x[1]+DC[x[2]],ok=true;while(r>=0&&c>=0&&r<N&&c<N){if(s.some(y=>y[0]===r&&y[1]===c)){ok=false;break}r+=DR[x[2]];c+=DC[x[2]]}if(!ok)continue;const ns=s.filter((_,j)=>j!==i).map(y=>Math.abs(y[0]-x[0])+Math.abs(y[1]-x[1])===1?[y[0],y[1],(y[2]+TURN[y[3]])%4,y[3]]:y);const res=tryIt("f",x,ns,k);if(res)return res}
 if(k>0)for(let i=0;i<s.length;i++){const x=s[i];if(x[3]===1)continue;const res=tryIt("n",x,s.map((y,j)=>j===i?[y[0],y[1],(y[2]+1)%4,y[3]]:y),k-1);if(res)return res}
 return null}
function nextStep(){const s=solve(birds.map(b=>[b.r,b.c,b.d,b.t]),nudges,n(),new Map());return s&&s.length?{t:s[0][0],b:at(s[0][1],s[0][2])}:null}
function nextMove(){const s=nextStep();return s?s.b:null}
function tutorialHint(){const L=LEVELS[cur];if(["tap","block","startle","owl","flip","nudge"].includes(L.intro)&&birds.length){const m=nextMove();hintId=m?m.id:null}}
function send(b){
 const bl=blocker(b);
 if(bl){shake={id:b.id,t:performance.now(),bl:bl.id};chirp(220,.08);tip("That bird is blocked by the bird in its way. Free the path first.",true);return}
 hist.push(snapshot());nudging=false;
 const nb=neighbors(b);birds=birds.filter(x=>x!==b);
 flying.push({...b,t:performance.now()});
 for(const y of nb){if(y.o){blinks.push({id:y.id,t:performance.now()});continue}y.d=(y.d+TURN[y.t])%4;ruffle(y)}
 if(nb.some(y=>y.o))setTimeout(()=>hoot(),120);
 chirp(660+Math.random()*200,.12);hintId=null;nudgeBtn();
 if(!birds.length){setTimeout(win,650);tip("Clear sky!");return}
 stuckTip();
 tutorialHint();
}
function stuckTip(){if(canMove())tip();else if(nudges)tip("No bird can fly. Use your <b>Nudge</b>, or tap <b>Undo</b>.",true);else tip("No bird can fly now. Tap <b>Undo</b> to take the last move back.",true)}
function doNudge(b){if(b.o){shake={id:b.id,t:performance.now()};hoot();tip("Owls won't budge. Nudge a songbird or a flip bird.",true);return}
 hist.push(snapshot());nudges--;nudging=false;b.d=(b.d+1)%4;ruffle(b,true);hintId=null;nudgeBtn();stuckTip();tutorialHint()}
const calm=matchMedia("(prefers-reduced-motion: reduce)");
// feather ruffle: the bird puffs up and a few loose feathers drift off
function ruffle(y,soft){const t=performance.now();ruffles.push({id:y.id,t});if(soft){setTimeout(()=>chirp(520,.06),40);return}const k=calm.matches?2:6;
 for(let i=0;i<k;i++){const a=Math.random()*6.283,v=.6+Math.random()*.9;feathers.push({r:y.r,c:y.c,t:t+i*25,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,rot:Math.random()*6.28,vr:(Math.random()-.5)*8,col:y.col,len:.2+Math.random()*.08})}
 setTimeout(()=>y.f?squawk():chirp(380+Math.random()*80,.05),90)}
function win(){done[cur]=Math.max(done[cur]||0,undos===0?3:undos<=2?2:1);store.set("done",done);drawDots();
 const s=done[cur],last=cur===LEVELS.length-1;
 const packEnd=PACKS.some(p=>p.from===cur+1);
 card('<h2>'+(last?"You cleared every level!":"Level "+(cur+1)+" cleared")+'</h2><div class="stars" aria-label="'+s+' of 3 stars">'+"★".repeat(undos===0?3:undos<=2?2:1)+"☆".repeat(3-(undos===0?3:undos<=2?2:1))+'</div><p class="small">'+(undos===0?"No undos. Perfect flight plan!":"Clear it with no undos for three stars.")+'</p>'+(packEnd?'<p><b>'+PACKS.find(p=>p.from===cur+1).name+'</b> unlocked: new birds are joining the roost.</p>':'')+(last?'<p>Thanks for playing the prototype. Which level did you like most, and where did you get stuck?</p>':'')+'<div class="row">'+(last?'':'<button class="btn main" id="nx">Next level</button>')+'<button class="btn" id="again">Play again</button></div>');
 const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{closeCard();load(cur+1)};document.getElementById("again").onclick=()=>{closeCard();load(cur)};(nx||document.getElementById("again")).focus();}
function showIntro(k){const it=INTRO[k];card('<h2>'+it.h+'</h2><ol>'+it.steps.map(s=>'<li>'+s+'</li>').join("")+'</ol><div class="row"><button class="btn main" id="ok">Got it</button></div>');const ok=document.getElementById("ok");ok.focus();ok.onclick=()=>{seenIntro[k]=1;store.set("intro",seenIntro);closeCard();tutorialHint();tip()}}
function card(h){document.getElementById("cardbody").innerHTML=h;document.getElementById("sheet").hidden=false}
function closeCard(){document.getElementById("sheet").hidden=true}
function tip(t,bad){const el=document.getElementById("tip");const L=LEVELS[cur];
 if(t==null&&(L.intro==="block"||L.intro==="startle")&&birds.length<startN)t="Nice! Now tap the <b>glowing bird</b>.";
 if(t==null){t=L.intro==="tap"?"Tap the <b>glowing bird</b>.":L.intro==="block"?"Send the <b>glowing bird</b> first. The other one is blocked.":L.intro==="startle"?"Send the <b>glowing bird</b>. The bird beside it gets ruffled and turns ↻.":L.intro==="owl"?"The brown owl won't turn. Follow the <b>glow</b>.":L.intro==="flip"?(birds.length<startN?"It turned all the way around! Follow the <b>glow</b>.":"Send the <b>glowing bird</b>. The flip bird beside it makes a U-turn."):L.intro==="nudge"?(nudges?"Tap <b>Nudge</b>, then the <b>glowing bird</b>.":"Now send them home. Follow the <b>glow</b>."):"Birds left: <b>"+birds.length+"</b>."+(L.k?" Nudges: <b>"+nudges+"</b>.":"")+" Hold a bird to preview its flight."}
 if(nudging&&!bad)t="Tap a bird to nudge it a quarter turn ↻. Tap <b>Cancel</b> to keep your Nudge.";
 el.innerHTML=t;el.classList.toggle("bad",!!bad)}
function drawDots(){const d=document.getElementById("dots");d.innerHTML="";LEVELS.forEach((_,i)=>{const pk=PACKS.find(p=>p.from===i);if(pk){const lb=document.createElement("div");lb.className="pack";lb.textContent=pk.name;d.appendChild(lb)}const b=document.createElement("button");b.textContent=i+1;b.className=(done[i]?"done ":"")+(i===cur?"cur":"");b.disabled=!(unlocked||i===0||done[i-1]||done[i]);b.setAttribute("aria-label","Level "+(i+1)+(done[i]?", cleared":""));b.onclick=()=>load(i);d.appendChild(b)})}
document.getElementById("undo").onclick=()=>{if(!hist.length)return;const s=hist.pop();birds=s.b;nudges=s.k;nudging=false;undos++;flying=[];ruffles=[];feathers=[];nudgeBtn();tip();tutorialHint()};
document.getElementById("nudge").onclick=()=>{if(!nudges&&!nudging)return;nudging=!nudging;nudgeBtn();tip()};
document.getElementById("restart").onclick=()=>load(cur);
document.getElementById("hint").onclick=()=>{const m=nextStep();if(m){hintId=m.b.id;tip(m.t==="n"?"Use your <b>Nudge</b> on the <b>glowing bird</b>.":"Try the <b>glowing bird</b>.")}else tip("This position can't be cleared. Tap <b>Undo</b> or <b>Restart</b>.",true)};
let taps=0,tapT=0;document.getElementById("title").onclick=()=>{const t=Date.now();taps=t-tapT<600?taps+1:1;tapT=t;if(taps>=5){unlocked=true;store.set("unlock",true);drawDots();tip("Tester mode: every level is open.")}};
// sound
let ac=null;function chirp(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,ac.currentTime+d);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.06)}catch(e){}}
function squawk(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(900,ac.currentTime);o.frequency.exponentialRampToValueAtTime(420,ac.currentTime+.16);g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.22)}catch(e){}}
function hoot(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(330,ac.currentTime);o.frequency.exponentialRampToValueAtTime(280,ac.currentTime+.25);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.07,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.32)}catch(e){}}
// input
function cellAt(e){const r=cv.getBoundingClientRect(),s=r.width/n();return [Math.floor((e.clientY-r.top)/s),Math.floor((e.clientX-r.left)/s)]}
cv.addEventListener("pointerdown",e=>{const [r,c]=cellAt(e),b=at(r,c);if(b){press={id:b.id};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener("pointerup",e=>{if(!press)return;const [r,c]=cellAt(e),b=at(r,c);if(b&&b.id===press.id)nudging?doNudge(b):send(b);press=null});
cv.addEventListener("pointercancel",()=>press=null);
// drawing
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;cv.width=W*dpr;cv.height=W*dpr}
addEventListener("resize",resize);
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function blob(x,y,rad,seed,pts=11,j=.12){cx.beginPath();for(let i=0;i<=pts;i++){const a=i/pts*6.283,k=1+Math.sin(a*3+seed)*j*.6+Math.sin(a*5+seed*2)*j*.4,px=x+Math.cos(a)*rad*k,py=y+Math.sin(a)*rad*k;i?cx.lineTo(px,py):cx.moveTo(px,py)}cx.closePath()}
function drawBird(b,x,y,s,ang,flap,glow,puff=0,blink=0){
 cx.save();cx.translate(x,y);cx.rotate(ang);const R=s*.3*(1+puff*.22);
 const body=b.o?"#9b7652":b.f?FLIP:b.col,dark=shade(body,-45),mid=shade(body,-22);
 if(glow){cx.fillStyle=css("--accent");cx.globalAlpha=.4+.2*Math.sin(performance.now()/250);blob(0,0,R*1.7,b.j,14,.08);cx.fill();cx.globalAlpha=1}
 // soft shadow on the perch
 cx.fillStyle="rgba(40,25,10,.18)";cx.beginPath();cx.ellipse(R*.08,R*.22,R*1.05,R*.95,0,0,6.3);cx.fill();
 // tail fan: three rounded feathers behind the body
 for(const k of[-1,0,1]){cx.save();cx.rotate(k*.38);cx.fillStyle=k?mid:dark;cx.beginPath();cx.ellipse(0,R*1.05,R*.2,R*.5,0,0,6.3);cx.fill();cx.strokeStyle=shade(body,-60);cx.lineWidth=Math.max(1,s*.012);cx.beginPath();cx.moveTo(0,R*.7);cx.lineTo(0,R*1.45);cx.stroke();cx.restore()}
 // ruffled: feather tips stick out around the body
 if(puff>0){cx.fillStyle=mid;const k=14;cx.beginPath();for(let i=0;i<=k*2;i++){const a=i/(k*2)*6.283,rr=R*(i%2?1.02:1.02+.32*puff);i?cx.lineTo(Math.cos(a)*rr,R*.1+Math.sin(a)*rr):cx.moveTo(Math.cos(a)*rr,R*.1+Math.sin(a)*rr)}cx.closePath();cx.fill()}
 // body
 cx.fillStyle=body;blob(0,R*.1,R*(b.o?1.1:1),b.j,12,.1);cx.fill();cx.strokeStyle=dark;cx.lineWidth=Math.max(1.5,s*.025);cx.stroke();
 // light belly
 cx.fillStyle=b.o?"#d9c09a":shade(body,48);cx.globalAlpha=.85;cx.beginPath();cx.ellipse(0,R*.3,R*.5,R*.55,0,0,6.3);cx.fill();cx.globalAlpha=1;
 if(b.o){cx.strokeStyle="#8a6a48";cx.lineWidth=Math.max(1,s*.012);for(let i=0;i<3;i++){const yy=R*(.1+i*.22);cx.beginPath();cx.moveTo(-R*.12,yy);cx.lineTo(0,yy+R*.08);cx.lineTo(R*.12,yy);cx.stroke()}}
 // wings with feather scallops
 const w=Math.sin(flap)*.9;
 for(const sd of[-1,1]){cx.save();cx.translate(sd*R*.78,R*.2);cx.rotate(sd*(.3+w));cx.fillStyle=mid;cx.beginPath();cx.ellipse(0,0,R*.3,R*.55,0,0,6.3);cx.fill();
  cx.strokeStyle=shade(body,-55);cx.lineWidth=Math.max(1,s*.012);for(let i=0;i<3;i++){cx.beginPath();cx.arc(0,R*(-.18+i*.2),R*.22,.3,Math.PI-.3);cx.stroke()}cx.restore()}
 if(b.o){// owl: ear tufts, pale face disc, big eyes, brow
  cx.fillStyle="#7a5a3c";for(const sd of[-1,1]){cx.beginPath();cx.moveTo(sd*R*.7,-R*.5);cx.lineTo(sd*R*.98,-R*1.18);cx.lineTo(sd*R*.32,-R*.82);cx.fill()}
  cx.fillStyle="#efdcae";blob(0,-R*.3,R*.7,b.j,12,.05);cx.fill();
  cx.fillStyle="#f9efcf";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.32,-R*.3,R*.25,0,6.3);cx.fill()}
  if(blink>0){// slow, unbothered blink: lids close then open
   cx.fillStyle="#b88f60";for(const sd of[-1,1]){cx.beginPath();cx.ellipse(sd*R*.32,-R*.3,R*.26,R*.26*blink,0,0,6.3);cx.fill()}
   cx.strokeStyle="#6b4a2e";cx.lineWidth=Math.max(1,s*.014);for(const sd of[-1,1]){cx.beginPath();cx.moveTo(sd*R*.32-R*.2,-R*.3);cx.lineTo(sd*R*.32+R*.2,-R*.3);cx.stroke()}}
  if(blink<.9){cx.fillStyle="#2c2a24";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.32,-R*.32,R*.13*(1-blink),0,6.3);cx.fill()}
  cx.fillStyle="#fff";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.28,-R*.37,R*.045*(1-blink),0,6.3);cx.fill()}}
  cx.strokeStyle="#6b4a2e";cx.lineWidth=Math.max(1.5,s*.02);cx.lineCap="round";cx.beginPath();cx.moveTo(-R*.6,-R*.62);cx.lineTo(0,-R*.48);cx.lineTo(R*.6,-R*.62);cx.stroke()}
 else{if(b.f){// flip bird: two curled crest feathers, white U-turn mark on the chest, dark eye mask
   cx.strokeStyle=dark;cx.lineWidth=Math.max(2,s*.035);cx.lineCap="round";for(const sd of[-1,1]){cx.beginPath();cx.moveTo(sd*R*.12,-R*.72);cx.quadraticCurveTo(sd*R*.2,-R*1.18,sd*R*.48,-R*1.08);cx.quadraticCurveTo(sd*R*.62,-R*.92,sd*R*.42,-R*.88);cx.stroke()}
   cx.strokeStyle="#fff";cx.globalAlpha=.92;cx.lineWidth=Math.max(2,s*.04);cx.beginPath();cx.moveTo(-R*.24,R*.02);cx.lineTo(-R*.24,R*.3);cx.arc(0,R*.3,R*.24,Math.PI,0,true);cx.lineTo(R*.24,R*.06);cx.stroke();
   cx.fillStyle="#fff";cx.beginPath();cx.moveTo(R*.24,-R*.08);cx.lineTo(R*.38,R*.1);cx.lineTo(R*.1,R*.1);cx.closePath();cx.fill();cx.globalAlpha=1;
   cx.fillStyle="#2a2342";cx.beginPath();cx.ellipse(0,-R*.4,R*.62,R*.17,0,0,6.3);cx.fill()}
  else{// songbird: crest, rosy cheeks
   cx.fillStyle=dark;for(const k of[-1,0,1]){cx.save();cx.translate(k*R*.16,-R*.72);cx.rotate(k*.5);cx.beginPath();cx.ellipse(0,R*.12,R*.08,R*.24,0,0,6.3);cx.fill();cx.restore()}
   cx.fillStyle="rgba(240,120,130,.45)";for(const sd of[-1,1]){cx.beginPath();cx.ellipse(sd*R*.58,-R*.18,R*.13,R*.09,0,0,6.3);cx.fill()}}
  if(puff>.15){// ruffled: eyes squeeze shut into > <, with a little squawk mark
   cx.strokeStyle=b.f?"#fff":"#2c2a24";cx.lineWidth=Math.max(1.5,s*.025);cx.lineCap="round";for(const sd of[-1,1]){cx.beginPath();cx.moveTo(sd*R*.48,-R*.52);cx.lineTo(sd*R*.26,-R*.42);cx.lineTo(sd*R*.48,-R*.32);cx.stroke()}
   cx.save();cx.rotate(-ang);cx.fillStyle="#fff";cx.strokeStyle="#2c2a24";cx.lineWidth=Math.max(1,s*.015);cx.globalAlpha=Math.min(1,puff*1.6);cx.beginPath();cx.ellipse(R*.95,-R*1.05,R*.3,R*.28,0,0,6.3);cx.fill();cx.stroke();cx.fillStyle="#2c2a24";cx.font="900 "+(R*.42)+"px "+css("--body");cx.textAlign="center";cx.textBaseline="middle";cx.fillText(b.f?"?!":"!",R*.95,-R*1.03);cx.restore();cx.globalAlpha=1}
  else{cx.fillStyle=b.f?"#fff":"#2c2a24";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.36,-R*.4,R*.12,0,6.3);cx.fill()}
   cx.fillStyle=b.f?"#2c2a24":"#fff";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*(b.f?.38:.32),-R*(b.f?.4:.45),R*(b.f?.06:.045),0,6.3);cx.fill()}}}
 // beak points forward (up in local space)
 cx.fillStyle="#f4a52a";cx.strokeStyle="#b8741a";cx.lineWidth=Math.max(1,s*.015);cx.beginPath();cx.moveTo(-R*.28,-R*.8);cx.lineTo(0,-R*(b.o?1.25:1.5));cx.lineTo(R*.28,-R*.8);cx.closePath();cx.fill();cx.stroke();
 // direction chevron ahead of the beak
 if(!flap||Math.abs(flap)<1){cx.strokeStyle=b.o?"#7a5a3c":b.f?"#9d86e8":shade(body,-40);cx.globalAlpha=.85;cx.lineWidth=Math.max(2,s*.045);cx.lineCap="round";cx.lineJoin="round";cx.beginPath();cx.moveTo(-R*.32,-R*1.62);cx.lineTo(0,-R*1.9);cx.lineTo(R*.32,-R*1.62);cx.stroke();cx.globalAlpha=1}
 cx.restore();}
// a loose feather: quill plus soft vane
function drawFeather(x,y,len,rot,col,a){cx.save();cx.translate(x,y);cx.rotate(rot);cx.globalAlpha=a;cx.fillStyle=col;cx.beginPath();cx.ellipse(0,0,len*.28,len*.5,0,0,6.3);cx.fill();cx.strokeStyle=shade(col,-50);cx.lineWidth=Math.max(1,len*.06);cx.beginPath();cx.moveTo(0,-len*.5);cx.lineTo(0,len*.62);cx.stroke();cx.restore()}
// the roost: leafy canopy, one branch per row, a twig nest at every perch
const bg=document.createElement("canvas");let bgKey="";
function drawRoost(N,s){
 cx.fillStyle=css("--leaf");cx.beginPath();cx.roundRect?cx.roundRect(0,0,W,W,22):cx.rect(0,0,W,W);cx.fill();
 cx.save();cx.beginPath();cx.rect(0,0,W,W);cx.clip();
 // background leaf clusters
 for(let i=0;i<N*N*1.6;i++){const x=((Math.sin(i*12.9898)*43758.5453)%1+1)%1*W,y=((Math.sin(i*78.233)*12345.678)%1+1)%1*W,rot=i*1.7;cx.fillStyle=i%3?css("--leaf2"):css("--leaf3");cx.save();cx.translate(x,y);cx.rotate(rot);cx.beginPath();cx.ellipse(0,0,s*.09,s*.2,0,0,6.3);cx.fill();cx.restore()}
 for(let r=0;r<N;r++){const y=(r+.5)*s+s*.1,th=s*.17;
  // branch with a gentle wave
  const wave=x=>Math.sin(x/W*Math.PI*2+r*1.7)*s*.04;
  cx.fillStyle=css("--bark");cx.beginPath();cx.moveTo(-5,y-th/2+wave(0));for(let x=0;x<=W+5;x+=8)cx.lineTo(x,y-th/2+wave(x));for(let x=W+5;x>=-5;x-=8)cx.lineTo(x,y+th/2+wave(x)*.8);cx.closePath();cx.fill();
  cx.strokeStyle=css("--bark2");cx.lineWidth=Math.max(1,s*.018);cx.beginPath();for(let x=0;x<=W;x+=8)x?cx.lineTo(x,y-th*.22+wave(x)):cx.moveTo(x,y-th*.22+wave(x));cx.stroke();
  cx.strokeStyle=css("--barkd");cx.lineWidth=Math.max(1,s*.012);for(let k=0;k<N*2;k++){const gx=(k+.3)*s/2+((r*37+k*11)%7)*s*.03;cx.beginPath();cx.moveTo(gx,y+th*.12+wave(gx));cx.lineTo(gx+s*.14,y+th*.18+wave(gx));cx.stroke()}
  // small leafy twigs between perches
  for(let c=0;c<N-1;c++){const tx=(c+1)*s,ty=y+wave(tx),up=(r+c)%2?-1:1;cx.strokeStyle=css("--bark");cx.lineWidth=Math.max(1.5,s*.03);cx.lineCap="round";cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(tx+s*.08,ty+up*s*.2);cx.stroke();cx.fillStyle=css("--leaf2");cx.save();cx.translate(tx+s*.1,ty+up*s*.26);cx.rotate(up*.6);cx.beginPath();cx.ellipse(0,0,s*.06,s*.12,0,0,6.3);cx.fill();cx.restore()}
  // twig nest ring at each perch
  for(let c=0;c<N;c++){const x=(c+.5)*s,ny=(r+.5)*s+s*.05;cx.strokeStyle=css("--nest");cx.globalAlpha=.6;cx.lineWidth=Math.max(1,s*.022);for(let k=0;k<3;k++){cx.beginPath();cx.ellipse(x,ny,s*.3-k*s*.015,s*.22-k*s*.012,(k*.6+r+c)%3*.3,.2+k*1.3,.2+k*1.3+4.2);cx.stroke()}cx.globalAlpha=1}}
 cx.restore()}
function shade(h,a){const v=parseInt(h.slice(1),16);let r=(v>>16)+a,g=(v>>8&255)+a,bb=(v&255)+a;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));bb=Math.max(0,Math.min(255,bb));return"rgb("+r+","+g+","+bb+")"}
function frame(now){
 if(!W)resize();cx.setTransform(dpr,0,0,dpr,0,0);const N=n(),s=W/N;cx.clearRect(0,0,W,W);
 // the roost art only changes with the level, size or theme, so it is drawn once into a cached layer
 const bk=N+"|"+W+"|"+dpr+"|"+css("--leaf");if(bk!==bgKey){bgKey=bk;bg.width=W*dpr;bg.height=W*dpr;const main=cx;cx=bg.getContext("2d");cx.setTransform(dpr,0,0,dpr,0,0);drawRoost(N,s);cx=main}
 cx.drawImage(bg,0,0,W,W);
 // preview
 const pb=press&&birds.find(b=>b.id===press.id);
 if(pb){const bl=blocker(pb);cx.strokeStyle=bl?css("--warn"):css("--accent");cx.lineWidth=s*.06;cx.setLineDash([s*.06,s*.12]);cx.lineCap="round";cx.beginPath();cx.moveTo((pb.c+.5)*s,(pb.r+.5)*s);
  const ex=bl?(bl.c+.5)*s-DC[pb.d]*s*.35:(pb.c+.5+DC[pb.d]*N*2)*s,ey=bl?(bl.r+.5)*s-DR[pb.d]*s*.35:(pb.r+.5+DR[pb.d]*N*2)*s;cx.lineTo(ex,ey);cx.stroke();cx.setLineDash([]);
  if(!bl)for(const y of neighbors(pb)){const x0=(y.c+.5)*s,y0=(y.r+.5)*s;cx.fillStyle=css("--card");cx.beginPath();cx.arc(x0+s*.3,y0-s*.3,s*.16,0,6.3);cx.fill();cx.fillStyle=y.o?css("--soft"):y.f?FLIP:css("--accent");cx.font="800 "+(s*.22)+"px "+css("--body");cx.textAlign="center";cx.textBaseline="middle";cx.fillText(y.o?"–":y.f?"U":"↻",x0+s*.3,y0-s*.29)}}
 // birds
 for(const b of birds){const tgt=b.d*Math.PI/2;let diff=tgt-b.ang;while(diff<-Math.PI)diff+=Math.PI*2;while(diff>Math.PI)diff-=Math.PI*2;if(Math.abs(diff)>=Math.PI-.01)diff=Math.PI;b.ang+=diff*(b.f?.16:.25);
  let x=(b.c+.5)*s,y=(b.r+.5)*s;
  if(shake&&shake.id===b.id){const t=(now-shake.t)/400;if(t<1)x+=Math.sin(t*30)*s*.06*(1-t);else shake=null}
  if(shake&&shake.bl===b.id&&(now-shake.t)<600){cx.strokeStyle=css("--warn");cx.lineWidth=s*.05;blob(x,y,s*.42,b.j,12,.06);cx.stroke()}
  const rf=ruffles.find(q=>q.id===b.id);let puff=0;if(rf&&!calm.matches){const t=(now-rf.t)/520;if(t<1)puff=Math.sin(t*Math.PI)*(1-t*.3)}
  const bk=blinks.find(q=>q.id===b.id);let blink=0;if(bk){const t=(now-bk.t)/700;if(t<1)blink=Math.sin(t*Math.PI)}
  if(nudging&&!b.o){cx.strokeStyle=css("--accent");cx.globalAlpha=.55;cx.lineWidth=s*.035;cx.setLineDash([s*.05,s*.07]);blob(x,y,s*.42,b.j,12,.06);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}
  drawBird(b,x,y,s,b.ang,Math.sin(now/600+b.j)*.15+puff*Math.sin(now/30)*.4,b.id===hintId,puff,blink)}
 ruffles=ruffles.filter(q=>now-q.t<520);blinks=blinks.filter(q=>now-q.t<700);
 for(const f of flying){const t=(now-f.t)/700;if(t>1)continue;const dist=t*t*N*1.4*s;drawBird(f,(f.c+.5)*s+DC[f.d]*dist,(f.r+.5)*s+DR[f.d]*dist,s*(1+t*.3),f.d*Math.PI/2,now/40,false)}
 flying=flying.filter(f=>now-f.t<700);
 for(const f of feathers){const t=(now-f.t)/1100;if(t<0||t>1)continue;const e=1-(1-t)*(1-t);const fx=(f.c+.5)*s+f.vx*e*s*.9+Math.sin(t*9+f.rot)*s*.05,fy=(f.r+.5)*s+f.vy*e*s*.9+t*t*s*.6;drawFeather(fx,fy,f.len*s,f.rot+f.vr*t,f.col,(1-t)*.9)}
 feathers=feathers.filter(f=>now-f.t<1100);
 requestAnimationFrame(frame)}
window.claude?.hot?.snapshot?.(()=>({cur,done}));
function start(d){if(d&&d.done)done=d.done;let first=0;while(done[first]&&first<LEVELS.length-1)first++;load(d&&d.cur!=null?d.cur:first);requestAnimationFrame(frame)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
