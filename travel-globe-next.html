<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<!-- Travel Globe prototype v0.7.2 (working title; travel memories app, 2026-11-09). Unlisted preview page (next version, so the reviewers keep travel-globe-test.html stable). Not linked from the site. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Travel Globe (next version)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed night globe; a docked panel (bottom sheet on phones, right rail on wide screens) holds trips, collections, golf and diary. Deliberately one dark "night sky" look. */
:root{
  --space:#060a14; --ocean:#0b1530; --land:#1b2741; --land-edge:#2b3a5c;
  --lit:#f2b24a; --lit-soft:#ffd88c; --ink:#eef1f8; --muted:#97a3bd; --faint:#5d6a86;
  --panel:#0e1529; --panel-2:#141d36; --line:rgba(190,205,240,.12);
  --golf:#6fd496; --food:#ff8f6b; --hike:#7cc4ff; --view:#c9a2ff; --bucket:#9fb3d9;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lit);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto}
@media (min-width:900px){.app{grid-template-columns:1fr 400px;grid-template-rows:1fr}}
.stage{position:relative;min-height:0;overflow:hidden}
canvas#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas#globe.dragging{cursor:grabbing}

/* top bar over the globe */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{pointer-events:auto}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;letter-spacing:.2px}
.brand h1 em{color:var(--lit-soft)}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.chip-tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:6px}
.layers{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;pointer-events:auto;max-width:60%}
.layer{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(14,21,41,.7);color:var(--muted);display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.layer .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.layer[aria-pressed="true"]{color:var(--ink);border-color:rgba(242,178,74,.45)}
.layer[data-k="trips"] .dot{background:var(--lit)} .layer[data-k="golf"] .dot{background:var(--golf)}
.layer[data-k="diary"] .dot{background:var(--lit-soft)} .layer[data-k="bucket"] .dot{background:transparent;border:1.5px solid var(--bucket)}
.layer[data-k="snaps"] .dot{background:conic-gradient(var(--food) 0 25%,var(--hike) 0 50%,var(--view) 0 75%,#ff7ab8 0)}
.coltile.newcol{border:1.5px dashed var(--line);background:var(--panel-2)}
.coltile.newcol::after{display:none}

.scan{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);text-align:center;background:rgba(10,16,32,.82);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:250px;backdrop-filter:blur(6px)}
.scan b{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.scan span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.scan button{margin-top:8px;font-size:12px;color:var(--lit-soft);text-decoration:underline}

.zoomctl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:6px}
.zoomctl button,.fab{width:40px;height:40px;border-radius:12px;background:rgba(14,21,41,.8);border:1px solid var(--line);font-size:18px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.fab{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:16px;width:auto;padding:0 16px 0 12px;height:46px;border-radius:999px;background:var(--lit);color:#241603;font-weight:700;display:flex;gap:8px;align-items:center;border:0;box-shadow:0 6px 24px rgba(242,178,74,.35)}
.fab svg{width:20px;height:20px}
.panelAdd{display:none}
.stage:has(#scan:not([hidden])) .fab,.stage:has(#scan:not([hidden])) .zoomctl{display:none}
.wherechip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.wherechip b{font-weight:600;flex:1;min-width:120px}
.wherechip .btn{font-size:12px;padding:6px 10px}
.whereres{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.whereres:empty{display:none}
.whereres button{text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;background:var(--panel-2)}
.whereres button small{color:var(--muted);margin-left:6px;font-size:12px}
.pinmark,.pinbar{display:none}
body.pinmode .pinmark{display:block;position:absolute;left:50%;top:50%;width:34px;height:44px;margin:-44px 0 0 -17px;pointer-events:none;z-index:4;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
body.pinmode .pinbar{display:flex;position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;width:min(94%,420px);flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
body.pinmode .pinbar b{font-size:15px}
body.pinmode .pinbar span{font-size:12px;color:var(--muted)}
body.pinmode .pinbar div{display:flex;gap:8px;justify-content:flex-end}
body.pinmode .fab,body.pinmode .layers,body.pinmode .panelAdd,body.pinmode #placecard,body.pinmode .zoomctl button:nth-child(n+3){display:none!important}
body.pinmode .zoomctl{bottom:auto;top:50%;transform:translateY(-50%)}
body.tinystage .fab,body.tinystage .zoomctl,body.tinystage .layers,body.tinystage .brand p,body.tinystage .chip-tag,body.tinystage #placecard{display:none!important}
body.tinystage .brand h1{font-size:20px}
body.tinystage .panelAdd{display:flex;position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:3;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--lit);color:#241603;gap:4px;align-items:center}
body.shortstage .zoomctl button:nth-child(n+3){display:none}

/* place card over the globe */
.placecard{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;width:min(92%,380px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.placecard h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.placecard .meta{font-size:12px;color:var(--muted);margin-top:2px}
.placecard .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.strip img{width:84px;height:63px;object-fit:cover;border-radius:8px;flex:none;cursor:pointer}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}
.btn.primary{background:var(--lit);color:#241603;border-color:transparent}
.btn.green{background:var(--golf);color:#06210f;border-color:transparent}

/* panel */
.panel{position:relative;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:44vh;max-height:44vh}
@media (min-width:900px){.panel{height:auto;max-height:none;border-top:0;border-left:1px solid var(--line)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stats{grid-template-columns:repeat(4,minmax(0,1fr)) auto}
.stat{text-align:left;padding:4px 6px;border-radius:10px;min-width:0}
button.stat:hover{background:var(--panel-2)}
.stat span{display:flex;align-items:center;gap:5px;line-height:1.2}
.stat span i{flex:none;width:7px;height:7px;border-radius:50%}
.editstats{width:34px;height:34px;align-self:center;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:15px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:2px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 4px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lit)}
.tabbody{overflow-y:auto;flex:1;min-height:0;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.otd{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,rgba(242,178,74,.16),rgba(242,178,74,.02));border:1px solid rgba(242,178,74,.3);border-radius:14px;padding:10px;text-align:left}
.otd img{width:70px;height:54px;border-radius:9px;object-fit:cover;flex:none}
.otd small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--lit-soft)}
.otd div{min-width:0}
.otd p{margin:2px 0 0;font-size:14px}
.item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;text-align:left;width:100%}
.item:hover{background:var(--panel-2)}
.item img{width:64px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.item .txt{min-width:0;flex:1}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12px;color:var(--muted)}
.item .flag{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(111,212,150,.12);color:var(--golf)}
.item .flag.ring{background:transparent;border:1.5px dashed var(--bucket);color:var(--bucket)}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.suggest{border:1px solid rgba(111,212,150,.35);background:rgba(111,212,150,.07);border-radius:14px;padding:12px}
.suggest b{font-weight:600}
.suggest p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.colgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.coltile{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;text-align:left}
.coltile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coltile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(6,10,20,.85))}
.coltile span{position:absolute;left:10px;bottom:8px;z-index:1;font-weight:700;font-size:14px}
.coltile small{display:block;font-weight:500;font-size:11px;color:#d6dbe8}
.coltile[aria-pressed="true"]{outline:2px solid var(--lit);outline-offset:-2px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.stars{color:var(--lit);letter-spacing:1px;font-size:12px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel-2);border-radius:12px;padding:12px}
.switch input{width:44px;height:24px;accent-color:var(--lit)}

/* full overlays */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(4,7,14,.6);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:900px){.sheet{align-items:center}}
.sheet-in{background:var(--panel);width:min(100%,560px);max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheet-in{border-radius:20px;max-height:88%}}
.hero{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:20px 20px 0 0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(14,21,41,.95))}
.hero .cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:1}
.hero h2{margin:0;font-family:var(--display);font-weight:400;font-size:36px;line-height:1;text-wrap:balance}
.hero .cap p{margin:6px 0 0;color:#cfd6e6;font-size:13px}
.close{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:10px;background:rgba(6,10,20,.6);font-size:18px}
.sheet .pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 0;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.facts div{background:var(--panel-2);border-radius:10px;padding:8px}
.facts b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.facts span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stop{border-left:2px solid rgba(242,178,74,.35);padding-left:14px;position:relative;display:flex;flex-direction:column;gap:8px}
.stop::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--lit);box-shadow:0 0 10px var(--lit)}
.stop h4{margin:0;font-size:16px;font-weight:600}
.stop .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prompts{display:flex;gap:6px;flex-wrap:wrap}
.prompts button{font-size:12px;padding:4px 9px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
textarea,input[type=text],input[type=search]{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:14px;padding:9px 10px;resize:vertical}
textarea{min-height:58px}
.saved{font-size:11px;color:var(--golf);height:14px}

/* scorecard */
.scorewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.score{border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:100%}
table.score th,table.score td{padding:6px 5px;text-align:center;border-right:1px solid var(--line);white-space:nowrap}
table.score th{color:var(--muted);font-weight:500;background:var(--panel-2)}
table.score td.lbl,table.score th.lbl{text-align:left;padding-left:10px;position:sticky;left:0;background:var(--panel);font-family:var(--body);font-weight:600;font-size:12px}
table.score th.lbl{background:var(--panel-2)}
table.score tr+tr td{border-top:1px solid var(--line)}
td.b{color:#06210f;background:var(--golf);border-radius:50%}
td.e{color:var(--lit-soft)}
td.tot{font-weight:600;color:var(--ink)}
table.score input{width:26px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--ink);text-align:center;font:inherit;padding:3px 0}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(3,5,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lightbox img{max-width:100%;max-height:70vh;border-radius:12px}
.lightbox .cap{text-align:center;max-width:520px}
.lightbox .cap b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.lightbox .cap span{font-size:12px;color:var(--muted)}
.lightbox .nav{display:flex;gap:10px}

/* replay */
.replay{position:absolute;inset:0;pointer-events:none}
.replay .card{position:absolute;left:50%;top:76px;transform:translateX(-50%);width:min(88%,360px);background:rgba(10,15,30,.9);border:1px solid var(--line);border-radius:16px;overflow:hidden;pointer-events:auto;transition:opacity .4s}
.replay .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.replay .card .c{padding:10px 14px 12px}
.replay .card h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.replay .card p{margin:4px 0 0;font-size:13px;color:#cfd6e6;font-style:italic}
.replay .card .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.replay .bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;gap:8px;align-items:center;pointer-events:auto;background:rgba(10,15,30,.88);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.replay .prog{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.replay .prog i{display:block;height:100%;width:0;background:var(--lit)}
.replay .bar .btn{padding:6px 10px}
body.replaying .panel,body.replaying .topbar,body.replaying .fab,body.replaying .zoomctl,body.replaying .scan{display:none!important}
body.replaying .app{grid-template-columns:1fr;grid-template-rows:1fr}
.replay .card{top:auto;bottom:84px;width:min(90%,420px)}
.legchip{position:absolute;top:max(18px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:3;background:rgba(10,15,30,.86);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
.legchip span{margin-right:4px}
.moment{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .7s ease;pointer-events:none;background:#05070d;overflow:hidden}
.moment.on{opacity:1}
.moment .pics img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:mfade .9s ease forwards,kb 9s ease-out forwards}
.moment::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.35) 0%,rgba(5,7,13,0) 30%,rgba(5,7,13,0) 45%,rgba(5,7,13,.92) 100%)}
.mtxt{position:absolute;left:max(22px,env(safe-area-inset-left,0px));right:max(22px,env(safe-area-inset-right,0px));bottom:92px;z-index:1;max-width:720px}
.mtxt h2{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,64px);line-height:1;text-wrap:balance}
.mtxt p{margin:8px 0 0;font-size:clamp(17px,2.4vw,22px);line-height:1.35;font-style:italic;color:#f1ead8}
.mtxt p.best{font-style:normal;font-family:var(--display);font-size:clamp(24px,4.6vw,36px);line-height:1.15;color:#fff6e2;text-wrap:balance}
.mtxt .who{font-size:clamp(15px,2vw,18px);color:#f2cf8a;margin-top:8px;font-weight:600}
.mtxt.still > *{animation:none;opacity:1}
.mtxt p.n{font-style:normal;font-size:clamp(14px,1.8vw,17px);color:#c9d1e3}
.mtxt .d{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#d9c9a5;margin-top:8px}
.mtxt > *{opacity:0}
.mtxt.show > *{animation:rise .8s ease forwards}
.mtxt.show > :nth-child(2){animation-delay:.15s}.mtxt.show > :nth-child(3){animation-delay:.6s}.mtxt.show > :nth-child(4){animation-delay:1.1s}.mtxt.show > :nth-child(5){animation-delay:1.4s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.16) translate(-2%,-1.5%)}}
.titlecard{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 50%,rgba(6,10,20,.35),rgba(6,10,20,.88));transition:opacity .9s ease;pointer-events:none}
.titlecard.out{opacity:0}
.titlecard h2{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1;text-wrap:balance}
.titlecard p{margin:10px 0 0;color:#d6dbe8;font-size:16px}
.titlecard .d{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--lit-soft)}
.replay .bar{z-index:4}
.replay .bar .btn{padding:6px 10px;min-width:38px}
@media (prefers-reduced-motion:reduce){.moment .pics img{animation:mfade .3s forwards}}
.stage.light .brand h1{color:#22170c} .stage.light .brand h1 em{color:#b4531c} .stage.light .brand p{color:#4b3b2a} .stage.light .chip-tag{color:#4b3b2a;border-color:rgba(60,40,20,.25)}
.stage[data-look="toy"] .brand h1{color:#143466} .stage[data-look="toy"] .brand h1 em{color:#e0336a} .stage[data-look="toy"] .brand p,.stage[data-look="toy"] .chip-tag{color:#2a4878}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.themeopt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2)}
.themeopt img{width:100%;aspect-ratio:1/1;border-radius:10px;max-width:100%}
.themeopt b{font-size:14px} .themeopt span{font-size:12px;color:var(--muted);line-height:1.35}
.themeopt[aria-pressed="true"]{border-color:var(--lit);box-shadow:0 0 0 1px var(--lit)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:40;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5)}

.catchips{display:flex;flex-wrap:wrap;gap:6px}
.catchips .chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.catchips .chip.on{color:#1a1205;background:var(--lit);border-color:transparent}
.stategrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.stategrid .st{font-family:var(--mono);font-size:12px;text-align:center;padding:7px 0;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.stategrid .st.on{background:var(--lit);color:#1a1205;border-color:transparent;font-weight:700}
.catchips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.catchips button[aria-pressed="true"]{color:#1a1205;background:var(--lit);border-color:transparent}
.snapprev{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:14px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;position:relative}
.snapprev img{width:100%;height:100%;object-fit:cover}
.snapprev input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ratepick button{font-size:22px;color:var(--faint);padding:0 2px}
.ratepick button.on{color:var(--lit)}
label.l{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.foot{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;padding-top:8px}
.grab{display:none}
@media (max-width:899px){
 .panel{height:var(--ph,50dvh);max-height:none;transition:height .25s ease}
 .panel.dragging{transition:none}
 .grab{display:flex;justify-content:center;width:100%;padding:8px 0 2px;touch-action:none;cursor:grab}
 .grab i{width:44px;height:5px;border-radius:3px;background:var(--faint)}
 .layers{max-width:56%}
 .layer{padding:5px 8px;font-size:11px}
}
.otdhero{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(242,178,74,.35);background:var(--panel-2);flex:none}
.otdhero img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block}
.otdhero .c{padding:10px 12px 12px}
.otdhero small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--lit-soft)}
.otdhero h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.otdhero p{margin:4px 0 0;font-size:13px;color:#cfd6e6}
.postcard{position:relative;border-radius:16px;border:1.5px dashed rgba(242,178,74,.45);background:linear-gradient(160deg,rgba(242,178,74,.10),rgba(242,178,74,.02));padding:12px 14px;flex:none}
.postcard > small{display:block;padding-right:50px}
.postcard small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--lit-soft)}
.postcard h3{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;padding-right:46px}
.postcard .stamp{position:absolute;top:10px;right:12px;width:38px;height:44px;border:2px dotted rgba(242,178,74,.6);border-radius:4px;display:grid;place-items:center;font-size:20px}
.postcard .yr{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.postcard .yr:first-of-type{border-top:0}
.postcard .yr b{font-family:var(--mono);font-size:12px;color:var(--lit-soft);min-width:38px;padding-top:1px}
.postcard .yr span{flex:1;color:var(--ink)}
.postcard .yr button{font-size:12px;color:var(--lit-soft);text-decoration:underline;white-space:nowrap}
.postcard .note{margin:6px 0 0}
.otdhero .x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:rgba(6,10,20,.65)}
.tripitem{display:flex;align-items:center;gap:6px}
.tripitem .item{flex:1;min-width:0}
.playbtn{width:40px;height:40px;border-radius:50%;background:rgba(242,178,74,.16);color:var(--lit-soft);flex:none;font-size:14px}
.storyf{display:grid;gap:4px}
.storyf .l{margin:4px 0 0}
.stopbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stopbtns button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stop.ignored{opacity:.55}
.stop.ignored::before{background:var(--faint);box-shadow:none}
.guide-stop{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:8px}
.guide-stop img{width:56px;height:42px;border-radius:8px;object-fit:cover;flex:none}
.guide-stop .txt{flex:1;min-width:0}
.guide-stop .t{font-weight:600;font-size:14px}
.guide-stop .s{font-size:12px;color:var(--muted)}
.guide-stop.ok{box-shadow:inset 0 0 0 1.5px rgba(111,212,150,.6)}
.guide-stop.ignored{opacity:.5}
.seg{display:flex;gap:4px;flex:none}
.seg button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--golf);color:#06210f;border-color:transparent}
.seg.lab button{width:auto;min-width:58px;height:auto;padding:5px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.seg.lab small{font-size:10.5px;font-weight:600}
.guide-stop{flex-wrap:wrap}
@media (max-width:520px){.guide-stop .seg.lab{width:100%;justify-content:flex-end}}
.seg button[data-gs="ignored"][aria-pressed="true"]{background:#ff8f6b;color:#2a0d04}
.steps{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lit-soft)}
.toast{display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);box-sizing:border-box}
.toast button{color:var(--lit-soft);font-weight:700;text-decoration:underline;flex:none}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(255,122,184,.18);color:#ffb3d4;vertical-align:1px}
.morerow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--panel-2);text-align:left;width:100%;position:relative;box-sizing:border-box}
.morerow .txt{flex:1;min-width:0}
.morerow .t{font-weight:600;font-size:14px}
.morerow .s{font-size:12px;color:var(--muted)}
.morerow .flag,.tripitem .flag{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.flag.ring{border:1.5px dashed var(--bucket);color:var(--bucket)}
.rdel{color:var(--muted);font-size:11px;padding:0 2px}
.replay .card p.n{font-style:normal;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function photo(scene, seed, w = 480, h = 360){
  if (scene === "real"){ const im = imgCache.get("rp:" + seed); if (im) return im; scene = "city"; }
  const key = scene + "|" + seed + "|" + w;
  if (photoCache.has(key)) return photoCache.get(key);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); const r = rng(seed + scene);
  paint(x, w, h, scene, r);
  // film grain + vignette
  const g = x.createRadialGradient(w/2, h/2, h*.3, w/2, h/2, h*.85); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.35)"); x.fillStyle = g; x.fillRect(0,0,w,h);
  for (let i = 0; i < 900; i++){ x.fillStyle = `rgba(255,255,255,${r()*.05})`; x.fillRect(r()*w, r()*h, 1.2, 1.2); }

}

function water(x, w, h, y, a, b){ const g = x.createLinearGradient(0,y,0,h); g.addColorStop(0,a); g.addColorStop(1,b); x.fillStyle = g; x.fillRect(0,y,w,h-y); x.strokeStyle = "rgba(255,255,255,.18)"; for (let i = 0; i < 14; i++){ const yy = y + 6 + i*(h-y)/14; x.beginPath(); x.moveTo(w*.1+((i*37)%60), yy); x.lineTo(w*.4+((i*53)%120), yy); x.stroke(); } }
function paint(x, w, h, s, r){

function tap(e){
  if (replayState) return;
  const b = canvas.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;

/* Sunday postcard: this week in past years */
function postcardData(){
  const now = new Date(); const ds = d => { const x = new Date(d + "T12:00:00"); return Date.UTC(2001, x.getMonth(), x.getDate()); };
  const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
  const a = Date.UTC(2001, sun.getMonth(), sun.getDate()), b = Date.UTC(2001, sat.getMonth(), sat.getDate());
  const inWeek = d => { const v = ds(d); return a <= b ? v >= a && v <= b : v >= a || v <= b; };
  const inMonth = d => new Date(d + "T12:00:00").getMonth() === now.getMonth();
  const thisYear = now.getFullYear();
  const collect = test => { const ev = [];
    TRIPS.forEach(t => stopsOf(t).forEach(s => { if (test(s.date) && +s.date.slice(0, 4) < thisYear) ev.push({y:+s.date.slice(0, 4), d:s.date, name:stopName(s), trip:t.id}); }));
    allSnaps().forEach(sn => { if (sn.date && test(sn.date) && +sn.date.slice(0, 4) < thisYear) ev.push({y:+sn.date.slice(0, 4), d:sn.date, name:sn.by ? `${sn.name} (${sn.by})` : sn.name, mem:sn.id}); });
    COURSES.forEach(c => c.rounds.forEach(r => { if (test(r.date) && +r.date.slice(0, 4) < thisYear) ev.push({y:+r.date.slice(0, 4), d:r.date, name:`Golf at ${c.name}`}); }));
    return ev; };
  let ev = collect(inWeek), span = `${fmtShort(sun.toISOString().slice(0, 10))} – ${fmtShort(sat.toISOString().slice(0, 10))}`, label = "This week in past years";
  if (!ev.length){ ev = collect(inMonth); label = `This ${now.toLocaleDateString("en-US", {month:"long"})} in past years`; span = ""; }
  const years = {}; ev.sort((x, y) => x.d.localeCompare(y.d)).forEach(e => (years[e.y] = years[e.y] || []).push(e));
  return {label, span, years:Object.keys(years).sort((x, y) => y - x).slice(0, 4).map(y => ({y:+y, items:years[y]})), sunday: now.getDay() === 0};

/* ---------------- tall sheet (phone) ---------------- */
const SHEET_H = {peek:26, half:50, full:86};
let sheetPos = "half";
function setSheet(pos){ sheetPos = pos; const p = $("#panel"); p.style.setProperty("--ph", SHEET_H[pos] + "dvh"); p.dataset.pos = pos; $("#grab").setAttribute("aria-label", pos === "full" ? "Shrink the panel" : "Grow the panel"); }
(function(){
  const gr = $("#grab"), pn = $("#panel"); let y0 = null, h0 = 0, mv = 0;
  gr.addEventListener("pointerdown", e => { gr.setPointerCapture(e.pointerId); y0 = e.clientY; h0 = pn.getBoundingClientRect().height; mv = 0; pn.classList.add("dragging"); });
  gr.addEventListener("pointermove", e => { if (y0 === null) return; const dy = y0 - e.clientY; mv = Math.max(mv, Math.abs(dy)); const vh = innerHeight / 100; pn.style.setProperty("--ph", Math.max(18*vh, Math.min(90*vh, h0 + dy)) + "px"); });
  const end = () => { if (y0 === null) return; y0 = null; pn.classList.remove("dragging");
    if (mv < 6){ setSheet(sheetPos === "peek" ? "half" : sheetPos === "half" ? "full" : "half"); return; }
    const hv = pn.getBoundingClientRect().height / (innerHeight / 100);
    setSheet(Object.entries(SHEET_H).sort((a, b) => Math.abs(a[1] - hv) - Math.abs(b[1] - hv))[0][0]); };
  gr.addEventListener("pointerup", end); gr.addEventListener("pointercancel", end);
  gr.addEventListener("keydown", e => { if (e.key === "ArrowUp"){ setSheet(sheetPos === "peek" ? "half" : "full"); e.preventDefault(); } if (e.key === "ArrowDown"){ setSheet(sheetPos === "full" ? "half" : "peek"); e.preventDefault(); } });
})();

async function doRestore(){
  const d = pendingRestore; if (!d) return;
  // 1. snapshot what's here now, so a failed restore can be undone
  const snap = {}; try { Object.keys(localStorage).filter(k => k.startsWith("tg.")).forEach(k => snap[k] = localStorage.getItem(k)); } catch(e){ toast("Couldn't restore: this browser blocked storage"); return; }
  const rollback = () => { try { Object.keys(localStorage).filter(k => k.startsWith("tg.")).forEach(k => localStorage.removeItem(k)); Object.entries(snap).forEach(([k, v]) => localStorage.setItem(k, v)); } catch(e){} };
  // 2. write the backup's settings and stories
  try { Object.keys(snap).forEach(k => localStorage.removeItem(k)); Object.entries(d.keys).forEach(([k, v]) => { if (k.startsWith("tg.") && typeof v === "string") localStorage.setItem(k, v); }); }
  catch(e){ rollback(); toast("Couldn't restore (storage is full). Nothing was changed."); return; }
  // 3. photos: replace old ones, count what made it
  const imgs = Object.entries(d.images || {}).filter(([k, v]) => typeof v === "string" && v.startsWith("data:image/")); let ok = 0;
  try { await idb.clearPhotos(new Set(imgs.map(x => x[0]))); } catch(e){}
  for (const [k, v] of imgs){ try { await idb.put(k, v); ok++; } catch(e){} }
  let n = 0; try { n = JSON.parse(d.keys["tg.snaps"] || "[]").length; } catch(e){}
  try { sessionStorage.setItem("tgRestored", JSON.stringify({n, ok, of:imgs.length})); } catch(e){}
  location.reload();
}

    LIGHT_ORDER.forEach((id, i) => { const local = Math.max(0, Math.min(1, (k * LIGHT_ORDER.length - i))); if (local > 0) lit.set(id, local); });
    pinsShown = Math.floor(k * totalStops);
    $("#scanCount").textContent = `${Math.round(k * totalPhotos)} photos · ${Math.min(nC, 6)} countries`;
    if (k < 1) requestAnimationFrame(step); else res(); })(); });
  pinsShown = 999; LIGHT_ORDER.forEach(id => lit.set(id, 1));
  $("#scanTitle").textContent = "Your globe is ready";
  $("#scanCount").textContent = `${totalPhotos} photos · 6 countries · ${TRIPS.length} trips`;
  $("#skipScan").textContent = "Let's relive one";
  introRunning = false;
  let done = false;
  const next = () => { if (done) return; done = true; $("#scan").hidden = true; if (!store.get("guided", false) && !document.querySelector(".sheet") && !replayState) openGuide(1); };
  $("#skipScan").onclick = next; setTimeout(next, skipped ? 1500 : 3000);
}

/* ---------------- boot ---------------- */
window.addEventListener("resize", resize);
if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => resize()).observe($("#stage"));
setSheet("half"); resize(); rerender(); applyTheme();
if (store.get("seen", false)){ LIGHT_ORDER.forEach(id => lit.set(id, 1)); pinsShown = 999; introRunning = false; $("#scan").hidden = true; if (!store.get("guided", false)) setTimeout(() => { if (!document.querySelector(".sheet")) openGuide(1); }, 900); }
else { intro(); store.set("seen", true); }
loadImages(); restoredNotice(); realAddedNotice(); if (REAL_TRIPS.length) $("#chipTag").textContent = NOSAMPLE ? "Prototype · your trips" : "Prototype · your trips + sample";
requestAnimationFrame(loop);
</script>
</body>
