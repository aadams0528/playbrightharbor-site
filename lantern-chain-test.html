<style>
/* Layout: one phone-width column; top bar, a short score row, the board, a coach tray, then three big buttons.
   Night festival look, single deliberate dark theme (lanterns read best against a night sky). */
:root {
  color-scheme: dark;
  --sky-top: #1b2050;
  --sky-low: #3a2f6b;
  --ink: #fff8ec;          /* main text on the sky */
  --ink-soft: #d9d2f2;     /* secondary text on the sky */
  --card: #fff6e3;         /* cream cards and buttons */
  --card-edge: #c9a874;
  --card-ink: #2b2140;     /* text on cards */
  --gold: #ffc44d;         /* lit flame, primary action */
  --gold-edge: #b36b12;
  --rose: #e0587a;         /* shy lantern warning */
  --font-display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 100%) fixed, var(--sky-top);
  color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app {
  height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box;
}
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 10px; }
button { font-family: var(--font-display); }
.btn {
  min-height: 56px; padding: 0 18px; border-radius: 18px; border: 1.5px solid var(--card-edge);
  background: linear-gradient(180deg, #fffdf6, var(--card)); color: var(--card-ink);
  font-size: 20px; font-weight: 800; box-shadow: 0 4px 0 var(--card-edge); cursor: pointer;
  transition: transform .08s, box-shadow .08s; touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge); }
.btn.primary { background: linear-gradient(180deg, #ffe08a, var(--gold)); border-color: var(--gold-edge); box-shadow: 0 4px 0 var(--gold-edge); color: #3a2200; }
.btn.primary:active { box-shadow: 0 1px 0 var(--gold-edge); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .lvl:focus-visible, .icon:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* title */
#title { align-items: stretch; justify-content: flex-start; overflow-y: auto; }
#scene { width: 100%; height: 190px; display: block; }
h1 { font-family: var(--font-display); font-size: 44px; line-height: 1; margin: 0; text-align: center; letter-spacing: .5px;
  color: #ffe6a8; text-shadow: 0 3px 0 #7a3d10, 0 0 18px rgba(255,196,77,.45); user-select: none; cursor: default; }
.lede { text-align: center; color: var(--ink-soft); margin: 0 8px; font-size: 19px; text-wrap: balance; }
#levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.lvl { min-height: 70px; border-radius: 16px; border: 1.5px solid var(--card-edge); background: linear-gradient(180deg,#fffdf6,var(--card));
  color: var(--card-ink); box-shadow: 0 4px 0 var(--card-edge); font-size: 24px; font-weight: 800; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 4px 0; }
.lvl:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge); }
.lvl small { font-size: 15px; letter-spacing: 1px; color: #c47a00; }
.lvl.locked { background: #4a4380; border-color: #2f2a5c; box-shadow: 0 4px 0 #2f2a5c; color: #c9c3ee; cursor: default; }
.lvl.locked small { color: #c9c3ee; }
.lvl.next { background: linear-gradient(180deg, #ffe08a, var(--gold)); border-color: var(--gold-edge); box-shadow: 0 4px 0 var(--gold-edge); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.testerbar { border: 2px dashed #9d93e0; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.testerbar p { margin: 0; font-size: 16px; color: var(--ink-soft); }
.done { background: var(--card); color: var(--card-ink); border-radius: 18px; border: 1.5px solid var(--gold-edge); box-shadow: 0 4px 0 var(--gold-edge); padding: 12px 14px; text-align: center; }
.done b { display: block; font-family: var(--font-display); font-size: 24px; }
.done p { margin: 2px 0 0; font-size: 18px; }
.ver { text-align: center; margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); opacity: .8; }

/* game */
.top { display: flex; align-items: center; gap: 10px; }
.icon { min-width: 52px; height: 52px; border-radius: 16px; font-size: 22px; padding: 0 12px; }
.lvname { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 21px; font-weight: 800; line-height: 1.15; text-align: center; }
.lvname span { display: block; font-size: 15px; font-weight: 600; color: var(--ink-soft); }
.hud { display: flex; justify-content: center; gap: 10px; }
.chip { background: rgba(255,255,255,.12); border-radius: 999px; padding: 4px 16px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip b { color: #ffe08a; font-size: 22px; }
#boardWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { display: block; touch-action: manipulation; }
/* fixed height so the board never jumps when the text changes (e2e checks every text fits) */
#tray { background: var(--card); color: var(--card-ink); border-radius: 18px; border: 1.5px solid var(--card-edge); box-shadow: 0 4px 0 var(--card-edge);
  padding: 10px 14px; height: 128px; box-sizing: border-box; overflow: hidden; flex: none; display: flex; align-items: center; gap: 12px; font-size: 19px; line-height: 1.32; }
#tray p { margin: 0; flex: 1; min-width: 0; }
#trayBtn { flex: 1; }
#tray.warn { background: #ffe3ea; border-color: var(--rose); box-shadow: 0 4px 0 var(--rose); }
#tray.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.controls { display: flex; gap: 10px; padding-bottom: 4px; flex: none; }
.controls.tut #undoBtn, .controls.tut #restartBtn, .controls.tut #hintBtn { display: none; }
.controls .btn { flex: 1; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(14,12,40,.62); display: flex; align-items: center; justify-content: center;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.sheet { background: var(--card); color: var(--card-ink); border-radius: 24px; border: 1.5px solid var(--card-edge); box-shadow: 0 6px 0 var(--card-edge);
  width: 100%; max-width: 420px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto; box-sizing: border-box; }
.sheet h2 { font-family: var(--font-display); margin: 0; font-size: 30px; text-align: center; text-wrap: balance; }
.sheet p { margin: 0; text-align: center; font-size: 19px; }
.stars { text-align: center; font-size: 52px; letter-spacing: 6px; line-height: 1; color: #f0a500; text-shadow: 0 3px 0 #a35f00; }
.stars .off { color: #d8ccb4; text-shadow: 0 3px 0 #b5a688; }
.sheet .stick { position: sticky; bottom: -22px; margin-bottom: -22px; padding-bottom: 22px; background: var(--card); }
.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 18px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { .btn.pulse { animation: none; } #tray.shake { animation: none; } }
</style>

  <section id="title" class="screen">
    <canvas id="scene" aria-hidden="true"></canvas>

  </section>

  <section id="game" class="screen" hidden>
    <div class="top">
      <button class="btn icon" id="homeBtn" aria-label="Back to levels">‹</button>

</div>

</div>

<script>
/* Lantern Chain rules (shared by prototype.html and check.js; no packages).
 * Board rows use one character per cell:
 *   .  grass (empty)            1-5  lantern with that number
 *   z  shy lantern (keep dark)  ~    pond water
 *   a-e  lantern floating on the pond (number 1-5)
 *   Z  shy lantern floating on the pond
 *   ^ v < >  wind arrow
 * Rules:
 *   Tap an unlit lantern (not a shy one): it lights. A lit lantern's flame hops exactly n cells
 *   (n = its number) up, down, left and right, ignoring everything in between.
 *   A flame that lands on an unlit lantern lights it, and that lantern hops in turn (a chain).
 *   A flame that lands on water goes out, even when a lantern floats there.
 *   A flame that lands on a wind arrow is blown: it hops the same n cells again in the arrow's direction.
 *   A flame that lands on a shy lantern wakes it (it lights but never hops). Shy lanterns must stay dark.
 *   Shy lanterns hide behind a lit friend: while a lit lantern stands right beside one (up, down, left
 *   or right), a flame that lands on it just fizzles. (Without this, shy lanterns could never matter:
 *   every other lantern must light and hop sooner or later, so order has to count for something.)
 *   Win: every lantern that is not shy is lit, and every shy lantern is dark. Par = fewest taps. */
(function (root) {
  'use strict';
  var DIRS = { '^': [-1, 0], 'v': [1, 0], '<': [0, -1], '>': [0, 1] };
  var FOUR = [[-1, 0], [0, 1], [1, 0], [0, -1]];
  var MAX_BENDS = 8;

  function parse(level) {
    var h = level.rows.length, w = level.rows[0].length, cells = [], lanterns = [], lidx = {};
    for (var r = 0; r < h; r++) {
      if (level.rows[r].length !== w) throw new Error('level ' + level.id + ': ragged row ' + r);
      for (var c = 0; c < w; c++) {
        var ch = level.rows[r][c], cell = { r: r, c: c, ch: ch, kind: 'grass', water: false, n: 0, shy: false, wind: null };
        if (ch >= '1' && ch <= '5') { cell.kind = 'lantern'; cell.n = +ch; }
        else if (ch >= 'a' && ch <= 'e') { cell.kind = 'lantern'; cell.n = ch.charCodeAt(0) - 96; cell.water = true; }
        else if (ch === 'z') { cell.kind = 'lantern'; cell.shy = true; }
        else if (ch === 'Z') { cell.kind = 'lantern'; cell.shy = true; cell.water = true; }
        else if (ch === '~') { cell.kind = 'water'; cell.water = true; }
        else if (DIRS[ch]) { cell.kind = 'wind'; cell.wind = DIRS[ch]; }
        else if (ch !== '.') throw new Error('level ' + level.id + ': bad cell ' + ch);
        if (cell.kind === 'lantern') { lidx[r * w + c] = lanterns.length; cell.li = lanterns.length; lanterns.push(r * w + c); }
        cells.push(cell);
      }
    }
    return { w: w, h: h, cells: cells, lanterns: lanterns, lidx: lidx };
  }

  // Where does one flame go? Returns { path: [cell indices, first is the source], end: idx|-1 (off board) }
  function flight(b, from, n, d) {
    var r = b.cells[from].r, c = b.cells[from].c, path = [from], dr = d[0], dc = d[1];
    for (var bends = 0; bends <= MAX_BENDS; bends++) {
      r += dr * n; c += dc * n;
      if (r < 0 || c < 0 || r >= b.h || c >= b.w) { path.push({ r: r, c: c }); return { path: path, end: -1 }; }
      var i = r * b.w + c; path.push(i);
      var cell = b.cells[i];
      if (cell.kind === 'wind') { dr = cell.wind[0]; dc = cell.wind[1]; continue; }
      return { path: path, end: i };
    }
    return { path: path, end: -2 }; // blown around in circles: the flame fades (levels never rely on this)
  }

  // lit: array of booleans per lantern. Returns null if the tap is not allowed, else
  // { lit: newLit, events: [{ depth, from, path, end, result }] } where result is
  // 'light' | 'shy' | 'water' | 'grass' | 'lit' | 'off'
  // Is this shy lantern hiding? It is when a lit lantern stands right beside it (up, down, left or right).
  function hidden(b, lit, i) {
    var c = b.cells[i];
    for (var k = 0; k < 4; k++) {
      var r = c.r + FOUR[k][0], cc = c.c + FOUR[k][1];
      if (r < 0 || cc < 0 || r >= b.h || cc >= b.w) continue;
      var n = b.cells[r * b.w + cc];
      if (n.kind === 'lantern' && !n.shy && lit[n.li]) return true;
    }
    return false;
  }

  // lit: array of booleans per lantern. Returns null if the tap is not allowed, else
  // { lit: newLit, events: [{ depth, from, path, end, result }] } where result is
  // 'light' | 'shy' (woke a shy lantern) | 'hid' (shy lantern hid behind a lit friend) |
  // 'water' | 'grass' | 'lit' | 'off'.
  // The chain runs in waves: every flame of wave d lands at the same moment, judged against
  // the lanterns that were lit when the wave set off.
  function tap(b, lit, idx) {
    var li = b.lidx[idx];
    if (li == null) return null;
    var cell = b.cells[idx];
    if (cell.shy || lit[li]) return null;
    var nl = lit.slice(); nl[li] = true;
    var events = [], wave = [idx], depth = 0;
    while (wave.length) {
      var before = nl.slice(), next = [];
      for (var w = 0; w < wave.length; w++) {
        var from = wave[w], n = b.cells[from].n;
        for (var k = 0; k < 4; k++) {
          var f = flight(b, from, n, FOUR[k]), res;
          if (f.end < 0) res = 'off';
          else {
            var t = b.cells[f.end];
            if (t.water) res = 'water';
            else if (t.kind !== 'lantern') res = 'grass';
            else if (before[t.li] || nl[t.li]) res = 'lit';
            else if (t.shy) { if (hidden(b, before, f.end)) res = 'hid'; else { res = 'shy'; nl[t.li] = true; } }
            else { res = 'light'; nl[t.li] = true; next.push(f.end); }
          }
          events.push({ depth: depth, from: from, path: f.path, end: f.end, result: res });
        }
      }
      wave = next; depth++;
    }
    return { lit: nl, events: events };
  }

  function initial(b) { return b.lanterns.map(function () { return false; }); }
  function shyLit(b, lit) { for (var i = 0; i < b.lanterns.length; i++) if (lit[i] && b.cells[b.lanterns[i]].shy) return true; return false; }
  function isWin(b, lit) {
    for (var i = 0; i < b.lanterns.length; i++) { var s = b.cells[b.lanterns[i]].shy; if (s === lit[i]) return false; }
    return true;
  }
  function key(lit) { var s = ''; for (var i = 0; i < lit.length; i++) s += lit[i] ? '1' : '0'; return s; }
  function moves(b, lit) { var m = []; for (var i = 0; i < b.lanterns.length; i++) { var x = b.lanterns[i]; if (!lit[i] && !b.cells[x].shy) m.push(x); } return m; }

  // Exhaustive breadth-first search over lit-sets. Returns { par, line, states, firstGood, firstAll }.
  // A state that wakes a shy lantern is a dead end (lit lanterns never go out), so it is pruned.
  function solve(b, from) {
    var start = from || initial(b), seen = {}, q = [{ lit: start, line: [] }], head = 0, best = null;
    seen[key(start)] = 1;
    while (head < q.length) {
      var s = q[head++];
      if (isWin(b, s.lit)) { best = s; break; }
      var ms = moves(b, s.lit);
      for (var j = 0; j < ms.length; j++) {
        var r = tap(b, s.lit, ms[j]);
        if (shyLit(b, r.lit)) continue;
        var k = key(r.lit); if (seen[k]) continue; seen[k] = 1;
        q.push({ lit: r.lit, line: s.line.concat([ms[j]]) });
      }
    }
    return best ? { par: best.line.length, line: best.line, states: Object.keys(seen).length } : null;
  }

  var api = { hidden: hidden, parse: parse, flight: flight, tap: tap, initial: initial, isWin: isWin, shyLit: shyLit, solve: solve, moves: moves, key: key };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.LanternLogic = api;
})(this);

</script>

  if (G.busy) finishAnim();
  if (L.shyLit(G.b, G.lit)) { tray('A shy lantern is awake. Tap Undo first.', { warn: true }); $('undoBtn').classList.add('pulse'); return; }
  var s = L.solve(G.b, G.lit);
  if (!s || !s.line.length) return;
  if (!G.hintStage) { // first press: a nudge to reason with; second press: show the lantern
    G.hintStage = 1; G.hint = -1;
    tray((hasShy() ? 'Which lantern could shelter the shy one? Light it before any flame lands there.' : 'Which lantern can no flame reach? It will need a match of its own.') + ' Press Hint again to see one.');
    wake(); return;
  }
  G.hint = s.line[0];
  tray(G.matches + s.par > G.level.par ? 'Try the glowing lantern. Restart if you want to match par.' : 'Try the glowing lantern.');
  wake();
}
$('undoBtn').onclick = undo; $('restartBtn').onclick = restart; $('hintBtn').onclick = hint;

/* ---------- win ---------- */
function win() {
  G.won = true;
  var lv = G.level, st = starsFor(G.matches, lv.par);
  var first = !progress.stars[lv.id];
  progress.stars[lv.id] = Math.max(progress.stars[lv.id] || 0, st);
  progress.best[lv.id] = Math.min(progress.best[lv.id] || 99, G.matches);
  store.set('progress', progress);
  if (lv.intro && !seen[lv.intro]) { seen[lv.intro] = true; store.set('seen', seen); }
  var last = G.li === LEVELS.length - 1;
  $('winTitle').textContent = last ? 'The festival is lit!' : st === 3 ? 'All lit!' : 'All lit! Can you match par?';
  $('winStars').innerHTML = '★'.repeat(st) + '<span class="off">' + '★'.repeat(3 - st) + '</span>';
  $('winStars').setAttribute('aria-label', st + ' of 3 stars');
  $('winText').textContent = G.matches + (G.matches === 1 ? ' match' : ' matches') + '. Par ' + lv.par + '.' + (st < 3 ? ' Try again for 3 stars.' : '');
  $('nextBtn').textContent = last ? 'Back to levels' : 'Next level';
  tray(''); // clear the tutorial bubble / tip before the win card
  var li = G.li;
  if (G.winTimer) clearTimeout(G.winTimer);
  G.winTimer = setTimeout(function () { // cleared by startLevel, show and undo; re-check state in case
    G.winTimer = 0;
    if (!G.won || G.li !== li || $('game').hidden) return;
    $('winBox').hidden = false; confetti(); $('nextBtn').focus({ preventScroll: true });
  }, 350);
}
$('nextBtn').onclick = function () { $('winBox').hidden = true; if (G.li < LEVELS.length - 1) startLevel(G.li + 1); else show('title'); };
$('replayBtn').onclick = function () { $('winBox').hidden = true; startLevel(G.li); };

var confettiGen = 0;
function stopConfetti() { confettiGen++; var c = $('confetti'); if (!c.hidden) { c.getContext('2d').clearRect(0, 0, c.width, c.height); c.hidden = true; } }
function confetti() {
  if (reduced) return;
  var gen = ++confettiGen;
  var c = $('confetti'), ctx = c.getContext('2d'), W = innerWidth, H = innerHeight, dpr = window.devicePixelRatio || 1;
  c.hidden = false; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var cols = ['#ffd34d', '#ff8fa3', '#8fd3ff', '#b8f28a', '#ffffff'], ps = [];
  for (var i = 0; i < 60; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vy: 2 + Math.random() * 2.5, vx: -1 + Math.random() * 2, r: Math.random() * 6, c: cols[i % 5], s: 5 + Math.random() * 5 });
  var t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(function (p) { p.x += p.vx + Math.sin((t + p.r * 100) / 300); p.y += p.vy; p.r += 0.08;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = 'rgba(40,20,60,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); });
    if (gen !== confettiGen) return; // a new board started: stopConfetti already cleared it
    if (t - t0 < 2600) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(t0);
}

/* ---------- rules sheet ---------- */
var SHY_AT = INTRO.shy != null ? INTRO.shy : 99, WATER_AT = INTRO.water != null ? INTRO.water : 99, WIND_AT = INTRO.wind != null ? INTRO.wind : 99;
var RULES = [
  [0, 'Tap a dark lantern to light it with a match.'],
  [0, 'A lit lantern\'s flame hops exactly as many cells as its number, in all four directions: up, down, left and right. It jumps over whatever is in between.'],
  [0, 'A flame that lands on a dark lantern lights it, and that lantern hops too. That\'s a chain.'],
  [0, 'Light every lantern. Match par (the fewest matches) for 3 stars. Undo, Restart and Hint are always free.'],
  [SHY_AT, 'Shy lanterns have their eyes shut. Keep them dark: a flame that lands on one wakes it.'],
  [SHY_AT, 'A shy lantern pulls its shade down when a lantern right next to it is lit. Flames can\'t wake it then.'],
  [SHY_AT, 'The check happens as each wave of flames sets off. Lanterns lit by the same wave don\'t shelter yet.'],
  [WATER_AT, 'A flame that lands on the pond goes out, even on a floating lantern. Floating lanterns need their own match.'],
  [WIND_AT, 'A flame that lands on a wind arrow is blown along: it hops the same distance again, the way the arrow points.']
];
$('rulesBtn').onclick = function () {
  var ol = $('rulesList'); ol.innerHTML = '';
  RULES.forEach(function (r) { if (G.li >= r[0]) { var li = document.createElement('li'); li.textContent = r[1]; ol.appendChild(li); } });
  $('rulesBox').hidden = false;
};
$('rulesClose').onclick = function () { $('rulesBox').hidden = true; };

/* ---------- tester tools (5 taps on the title, or ?unlock=1) ---------- */
var titleTaps = 0, titleTimer = null;
$('logo').addEventListener('click', function () {
  titleTaps++; clearTimeout(titleTimer); titleTimer = setTimeout(function () { titleTaps = 0; }, 1500);
  if (titleTaps >= 5) { titleTaps = 0; tester = true; buildLevels(); }
});
$('testerOff').onclick = function () { tester = false; buildLevels(); };
$('resetBtn').onclick = function () { store.clear(); progress = { stars: {}, best: {} }; seen = {}; buildLevels(); };
$('testBtn').onclick = function () {
  var j = $('jump'); j.innerHTML = '';
  LEVELS.forEach(function (lv, i) { var b = document.createElement('button'); b.className = 'btn'; b.textContent = i + 1; b.setAttribute('aria-label', 'Jump to level ' + (i + 1));
    b.onclick = function () { $('testBox').hidden = true; startLevel(i); }; j.appendChild(b); });
  $('testBox').hidden = false;
};
$('testClose').onclick = function () { $('testBox').hidden = true; };
$('solveBtn').onclick = function () {
  $('testBox').hidden = true;
  var li = G.li; startLevel(li); G.tut = null; refresh();
  var line = L.solve(G.b, G.lit).line.slice();
  tray('Playing the par solution (' + line.length + (line.length === 1 ? ' match' : ' matches') + ').');
  (function next() { if (!line.length || G.li !== li || $('game').hidden) return; if (G.busy) { setTimeout(next, 200); return; } doTap(line.shift(), performance.now()); setTimeout(next, 300); })();
};

/* ---------- start ---------- */
$('homeBtn').onclick = function () { if (G.busy) finishAnim(); show('title'); };
window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { screen: $('game').hidden ? 'title' : 'game', li: G.li }; });
function boot(data) { buildLevels(); if (data && data.screen === 'game' && LEVELS[data.li]) startLevel(data.li); else show('title'); drawScene(performance.now()); }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
window.__lc = { G: G, L: L, LEVELS: LEVELS, store: store }; // for automated tests
})();
</script>
