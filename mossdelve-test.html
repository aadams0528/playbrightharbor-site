<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- Mossdelve prototype v0.2.1 (working title; pocket dungeon). Unlisted test page: not linked from the site. Built from /mnt/project-files/ideas/mossdelve/ (node build.js). Replace this file to update. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mossdelve (test version)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
:root {
  --ink: #f4ead6; --ink2: #c9bc9f; --panel: rgba(22,20,16,.86); --panel2: rgba(40,35,27,.92); --line: rgba(244,234,214,.14);
  --amber: #f2b54a; --amber2: #ffd98a; --red: #e0574a; --green: #8fcf6a; --c: #c3cdb3; --f: #74b9ff; --r: #ffc94a;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0d0c0a; color: var(--ink); overflow: hidden;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 10px) 14px 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  background: linear-gradient(rgba(8,7,6,.85), rgba(8,7,6,0)); }
.hudrow { display: flex; align-items: center; gap: 10px; }
.hpbar { flex: 1; height: 20px; border-radius: 10px; background: rgba(0,0,0,.55); border: 1px solid var(--line); position: relative; overflow: hidden; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#e46b5d, #b83d33); border-radius: 10px; transition: width .2s; }
.hpbar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.chip { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 10px; background: rgba(0,0,0,.45); border: 1px solid var(--line); white-space: nowrap; }
#place { font-size: 13px; color: var(--ink2); flex: 1; }
.dots { display: flex; gap: 4px; }
.dots b { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.18); }
.dots b.on { background: var(--amber); }
.dots b.boss { border-radius: 2px; transform: rotate(45deg); }
#bagBtn { pointer-events: auto; font-size: 13px; padding: 4px 10px; border-radius: 10px; background: rgba(0,0,0,.45); border: 1px solid var(--line); }

/* bottom bar */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(var(--sab) + 16px); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
  background: linear-gradient(rgba(8,7,6,0), rgba(8,7,6,.8)); }
#hint { font-size: 16px; font-weight: 700; text-align: center; min-height: 22px; text-shadow: 0 1px 3px #000; }
#flare { pointer-events: auto; width: 86px; height: 86px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center;
  background: conic-gradient(var(--amber) calc(var(--p, 0) * 1turn), rgba(255,255,255,.12) 0); transition: transform .1s; }
#flare::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #4a3a20, #1c160d); }
#flare span { position: relative; font-family: var(--display); font-size: 15px; font-weight: 800; letter-spacing: 1px; color: var(--ink2); text-align: center; line-height: 1.1; }
#flare.ready { animation: pulse 1s infinite; }
#flare.ready::before { background: radial-gradient(circle at 50% 40%, #ffe7a6, #e09a2a 60%, #8a5410); }
#flare.ready span { color: #3a2408; }
#flare:active { transform: scale(.94); }
#flare.lift { z-index: 60; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(242,181,74,.7); } 50% { box-shadow: 0 0 0 14px rgba(242,181,74,0); } }

/* camp */
#camp { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
#campTop { padding: calc(var(--sat) + 22px) 18px 0; text-align: center; }
#campTop h1 { margin: 0; font-family: var(--display); font-size: 42px; letter-spacing: 2px; color: var(--amber2); text-shadow: 0 2px 0 #3d2a0c, 0 0 24px rgba(242,181,74,.35); font-weight: 800; }
#campTop p { margin: 4px 0 0; color: var(--ink2); font-size: 15px; }
#campStats { margin-top: 10px; font-size: 13px; color: var(--ink2); }
#mute { position: absolute; right: 14px; top: calc(var(--sat) + 12px); pointer-events: auto; font-size: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.4); }
#campBottom { pointer-events: auto; margin: 0 12px calc(var(--sab) + 14px); padding: 14px; border-radius: 18px; background: linear-gradient(rgba(43,34,24,.94), rgba(21,17,12,.94)); border: 1px solid rgba(242,181,74,.45); box-shadow: inset 0 0 0 3px rgba(0,0,0,.4), inset 0 0 0 4px rgba(242,181,74,.14); display: flex; flex-direction: column; gap: 12px; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); padding: 8px 6px; text-align: center; min-height: 86px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.slot .ic { font-size: 28px; line-height: 1.2; }
.slot .nm { font-size: 12.5px; font-weight: 700; }
.slot .lb { font-size: 11px; color: var(--ink2); text-transform: uppercase; letter-spacing: .6px; }
.slot.new { box-shadow: 0 0 0 2px var(--amber); }
.row2 { display: flex; gap: 8px; }
.btn { flex: 1; border-radius: 14px; padding: 13px 10px; font-weight: 800; font-size: 16px; background: var(--panel2); border: 1px solid var(--line); }
.btn.main { font-family: var(--display); letter-spacing: 1px; background: linear-gradient(#f6c463, #d99327); color: #2c1c06; border: 0; font-size: 20px; padding: 16px; box-shadow: 0 3px 0 #8a5a14; }
.btn.small { flex: 0 0 auto; font-size: 14px; padding: 10px 12px; }
.tierRow { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: var(--ink2); }
.tierRow button { width: 34px; height: 34px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); font-size: 16px; }
.tierRow b { color: var(--ink); min-width: 110px; text-align: center; }

/* overlays */
#overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.5); z-index: 40; padding: 0 12px calc(var(--sab) + 14px); }
.sheet { width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; border-radius: 18px; background: linear-gradient(#2b2218, #15110c); border: 1px solid rgba(242,181,74,.5); box-shadow: inset 0 0 0 3px rgba(0,0,0,.45), inset 0 0 0 4px rgba(242,181,74,.16), 0 12px 40px rgba(0,0,0,.7); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet .foot { position: sticky; bottom: -16px; margin: 4px -16px -16px; padding: 12px 16px 16px; background: linear-gradient(rgba(22,20,16,0), rgba(22,20,16,.97) 28%); display: flex; flex-direction: column; gap: 8px; }
.gearBig.reveal .ic { animation: pop .55s cubic-bezier(.2,1.6,.4,1); position: relative; }
.gearBig.reveal .ic::before { content: ""; position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; z-index: -1;
  background: repeating-conic-gradient(rgba(255,214,120,.28) 0 10deg, rgba(255,214,120,0) 10deg 22deg); animation: spin 6s linear infinite; -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%); }
.gearBig.reveal.f .ic::before { background: repeating-conic-gradient(rgba(116,185,255,.28) 0 10deg, rgba(116,185,255,0) 10deg 22deg); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@keyframes spin { to { transform: rotate(1turn); } }
#quest { display: flex; gap: 10px; align-items: center; border-radius: 14px; background: var(--panel2); border: 1px dashed rgba(242,181,74,.5); padding: 8px 10px; font-size: 13px; color: var(--ink2); text-align: left; }
#quest b { color: var(--ink); }
#quest .qi { flex: 0 0 auto; }
#quest .qbar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 5px; overflow: hidden; }
#quest .qbar i { display: block; height: 100%; background: var(--amber); }
#quest { position: relative; overflow: hidden; }
#quest.done { border-style: solid; border-color: var(--amber); animation: pulse 1.2s 2; }
#quest .conf { position: absolute; width: 6px; height: 9px; border-radius: 2px; top: 50%; left: 30px; animation: conf 1.3s ease-out forwards; pointer-events: none; }
@keyframes conf { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
.sil { filter: brightness(0) drop-shadow(0 0 4px rgba(242,181,74,.75)); opacity: .9; }
#quest .qi.fadein { animation: pop .5s ease-out; }
#flare small { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
@media (prefers-reduced-motion: reduce) { #flare.ready { animation: none; box-shadow: 0 0 0 4px rgba(242,181,74,.6); } .gearBig.reveal .ic, .gearBig.reveal .ic::before, .sheet, #quest.done, #quest .conf, #quest .qi.fadein { animation: none; } #quest .conf { display: none; } }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: 1px; text-align: center; color: var(--amber2); text-shadow: 0 2px 0 #2a1a06; }
.sheet h2::before, .sheet h2::after { content: "◆"; font-size: 10px; color: rgba(242,181,74,.6); vertical-align: middle; margin: 0 10px; }
.sheet p { margin: 0; text-align: center; color: var(--ink2); font-size: 15px; line-height: 1.35; }
.card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-radius: 16px; padding: 12px 14px; background: var(--panel2); border: 1px solid var(--line); }
.card:active { transform: scale(.98); }
.card .ic { font-size: 30px; width: 52px; flex: 0 0 52px; text-align: center; }
.card .tx b { display: block; font-size: 17px; }
.card .tx span { font-size: 14px; color: var(--ink2); }
.card.rar-f { border-color: rgba(116,185,255,.55); }
.card.rar-r { border-color: rgba(255,201,74,.7); box-shadow: inset 0 0 18px rgba(255,201,74,.12); }
.tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; }
.tag.c { color: var(--c); } .tag.f { color: var(--f); } .tag.r { color: var(--r); }
.gearBig { text-align: center; padding: 8px 0 2px; }
.gearBig .ic { font-size: 54px; }
.gearBig b { display: block; font-size: 22px; margin-top: 4px; }
.gearBig ul, .cmp ul { list-style: none; padding: 0; margin: 6px 0 0; font-size: 15px; color: var(--ink); }
.cmp { font-size: 13px; color: var(--ink2); text-align: center; border-top: 1px solid var(--line); padding-top: 8px; }
.cmp ul { font-size: 13px; color: var(--ink2); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gcell { border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); padding: 8px 2px; text-align: center; font-size: 11px; min-height: 74px; }
.gcell .ic { font-size: 26px; display: block; }
.card .ic img, .slot .ic img { display: block; margin: 0 auto; }
.gcell.lock { opacity: .35; }
.gcell.qcell { opacity: .9; border: 1px dashed rgba(242,181,74,.6); }
.gcell.eq { box-shadow: 0 0 0 2px var(--amber); }
.statlist { font-size: 14px; color: var(--ink2); display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.statlist b { color: var(--ink); }

/* coach */
#coach { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
#coach .spot { position: absolute; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); border: 2px solid rgba(255,217,138,.8); transition: all .2s; }
#coach .dim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
#coach .ccard { position: absolute; left: 14px; right: 14px; max-width: 440px; margin: 0 auto; pointer-events: auto; background: #fbf3e2; color: #2b2214; border-radius: 18px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.5); font-size: 16.5px; line-height: 1.4; }
#coach .ccard .step { font-size: 12px; font-weight: 800; color: #a0712a; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 3px; }
#coach .ccard button { margin-top: 10px; float: right; background: #2b2214; color: #fbf3e2; border-radius: 12px; padding: 9px 18px; font-weight: 800; }
#coach .ccard::after { content: ""; display: block; clear: both; }
#coach .finger { position: absolute; font-size: 40px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
#coach .finger.swipe { animation: swipeL 2.2s infinite ease-in-out; }
#coach .finger.swipeUp { animation: swipeU 1.8s infinite ease-in-out; }
#coach .finger.tap { animation: tap 1s infinite; }
@keyframes swipeL { 0%,10% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 45% { transform: translateX(-70px); opacity: 1; } 50%,55% { transform: translateX(0); opacity: 0; } 65% { opacity: 1; } 90% { transform: translateX(70px); opacity: 1; } 100% { transform: translateX(70px); opacity: 0; } }
@keyframes swipeU { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 80% { transform: translateY(-70px); opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
@keyframes tap { 0%,100% { transform: scale(1); } 50% { transform: scale(.85); } }

#toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); z-index: 45; padding: 8px 16px; border-radius: 14px; background: rgba(0,0,0,.7); font-weight: 800; font-size: 18px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
#toast.on { opacity: 1; }
#banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; z-index: 44; pointer-events: none; opacity: 0; transition: opacity .5s; }
#banner.on { opacity: 1; }
#banner small { display: block; font-family: var(--display); font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: var(--ink2); }
#banner b { display: block; font-family: var(--display); font-size: 34px; letter-spacing: 1px; color: var(--amber2); text-shadow: 0 2px 10px #000, 0 0 24px rgba(242,181,74,.4); }
#banner b::after { content: ""; display: block; width: 220px; height: 10px; margin: 6px auto 0; background: radial-gradient(circle, var(--amber) 0 3px, transparent 4px) center/12px 10px no-repeat, linear-gradient(90deg, transparent, rgba(242,181,74,.8), transparent) center/100% 1px no-repeat; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="camp">
    <div id="campTop">
      <h1 id="title">Mossdelve</h1>
      <p>Delve the mossy deep. Find gear. Go deeper.</p>
      <div id="campStats"></div>
    </div>
    <button id="mute" aria-label="Sound on or off">🔊</button>
    <div id="campBottom">
      <button id="quest"></button>
      <div class="slots" id="slots"></div>
      <div class="tierRow hidden" id="tierRow"><button id="tierDown" aria-label="Easier">◀</button><b id="tierLbl"></b><button id="tierUp" aria-label="Harder">▶</button></div>
      <div class="row2">
        <button class="btn small" id="collBtn">Collection</button>
        <button class="btn main" id="delveBtn">Delve</button>
      </div>
      <button class="btn hidden" id="abandonBtn" style="font-size:13px;padding:8px">Start a new delve instead</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div id="hud">
      <div class="hudrow">
        <div class="hpbar"><i id="hpFill"></i><span id="hpTxt"></span></div>
        <div class="chip" id="atkChip">⚔ 4</div>
      </div>
      <div class="hudrow">
        <div id="place"></div>
        <div class="dots" id="dots"></div>
        <button id="bagBtn">Upgrades</button>
      </div>
    </div>
    <div id="bottom">
      <div id="hint"></div>
      <button id="flare" class="hidden" aria-label="Flare"><span>FLARE<small id="flareDmg"></small></span></button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="banner"><small id="bannerSmall"></small><b id="bannerBig"></b></div>
  <div id="overlay" class="hidden"></div>
  <div id="coach" class="hidden"></div>
</div>

<script>
/*LOGIC-START*/
// ---- Mossdelve rules: pure data and functions (shared by the game and the balance bot) ----
const ROOMS_PER_DEPTH = 6;      // normal rooms per depth; the guardian comes after these
const BASE = { maxHp: 40, atk: 4, def: 0, spd: 0, crit: 0.05, life: 0, thorns: 0, regen: 0, flareRate: 0.16, flareMult: 2.5, lastStand: 0 };
const BASE_INTERVAL = 0.9;

const RAR = { c: 'Common', f: 'Fine', r: 'Rare' };

const GEAR = [
  // weapons
  { id: 'twig_sword', slot: 'weapon', name: 'Twig Sword', rar: 'c', s: { atk: 2 } },
  { id: 'rusty_blade', slot: 'weapon', name: 'Rusty Blade', rar: 'c', s: { atk: 3 } },
  { id: 'bone_knife', slot: 'weapon', name: 'Bone Knife', rar: 'c', s: { atk: 2, spd: 0.12 } },
  { id: 'thorn_whip', slot: 'weapon', name: 'Thorn Whip', rar: 'f', s: { atk: 3, thorns: 2 } },
  { id: 'moss_blade', slot: 'weapon', name: 'Moss Blade', rar: 'f', s: { atk: 4, life: 0.06 } },
  { id: 'flint_axe', slot: 'weapon', name: 'Flint Axe', rar: 'f', s: { atk: 6, spd: -0.1 } },
  { id: 'ember_spear', slot: 'weapon', name: 'Ember Spear', rar: 'r', s: { atk: 6, crit: 0.08 } },
  { id: 'moonfang', slot: 'weapon', name: 'Moonfang', rar: 'r', s: { atk: 5, spd: 0.15, crit: 0.05 } },
  // armor
  { id: 'patched_cloak', slot: 'armor', name: 'Patched Cloak', rar: 'c', s: { maxHp: 8 } },
  { id: 'bark_vest', slot: 'armor', name: 'Bark Vest', rar: 'c', s: { maxHp: 6, def: 1 } },
  { id: 'reed_wrap', slot: 'armor', name: 'Reed Wrap', rar: 'c', s: { maxHp: 12 } },
  { id: 'beetle_shell', slot: 'armor', name: 'Beetle Shell', rar: 'f', s: { maxHp: 4, def: 2 } },
  { id: 'mossweave', slot: 'armor', name: 'Mossweave', rar: 'f', s: { maxHp: 16, regen: 3 } },
  { id: 'bramble_mail', slot: 'armor', name: 'Bramble Mail', rar: 'f', s: { def: 1, thorns: 3 } },
  { id: 'stone_plate', slot: 'armor', name: 'Stone Plate', rar: 'r', s: { maxHp: 10, def: 3, spd: -0.05 } },
  { id: 'heartwood_coat', slot: 'armor', name: 'Heartwood Coat', rar: 'r', s: { maxHp: 25, def: 1, regen: 4 } },
  // charms
  { id: 'lucky_pebble', slot: 'charm', name: 'Lucky Pebble', rar: 'c', s: { crit: 0.06 } },
  { id: 'glowworm_jar', slot: 'charm', name: 'Glowworm Jar', rar: 'c', s: { flareRate: 0.05 } },
  { id: 'fox_tooth', slot: 'charm', name: 'Fox Tooth', rar: 'c', s: { spd: 0.08 } },
  { id: 'heartseed', slot: 'charm', name: 'Heartseed', rar: 'f', s: { maxHp: 12 } },
  { id: 'owl_feather', slot: 'charm', name: 'Owl Feather', rar: 'f', s: { crit: 0.08, flareMult: 0.5 } },
  { id: 'leech_ring', slot: 'charm', name: 'Leech Ring', rar: 'f', s: { life: 0.08 } },
  { id: 'ember_heart', slot: 'charm', name: 'Ember Heart', rar: 'r', s: { flareRate: 0.08, flareMult: 1 } },
  { id: 'stag_horn', slot: 'charm', name: 'Stag Horn', rar: 'r', s: { atk: 3, thorns: 2 } },
];
const GEAR_BY_ID = Object.fromEntries(GEAR.map(g => [g.id, g]));
const STARTER = { weapon: 'twig_sword', armor: 'patched_cloak', charm: null };

const UPGRADES = [
  { id: 'sharpen', name: 'Sharpen', icon: '🗡️', rar: 'c', desc: '+2 attack', s: { atk: 2 } },
  { id: 'whet', name: 'Riverstone Edge', icon: '⚔️', rar: 'r', desc: '+5 attack', s: { atk: 5 } },
  { id: 'toughen', name: 'Toughen Up', icon: '❤️', rar: 'c', desc: '+12 max health, and heal 12', s: { maxHp: 12 }, heal: 12 },
  { id: 'swift', name: 'Quick Hands', icon: '💨', rar: 'c', desc: 'Attack 12% faster', s: { spd: 0.12 } },
  { id: 'keen', name: 'Keen Eye', icon: '🎯', rar: 'c', desc: '+8% chance to hit for double damage', s: { crit: 0.08 } },
  { id: 'leech', name: 'Leech Moss', icon: '🌿', rar: 'f', desc: 'Heal 7% of the damage you deal', s: { life: 0.07 } },
  { id: 'bramble', name: 'Bramble Skin', icon: '🌵', rar: 'c', desc: 'Foes take 2 damage each time they hit you', s: { thorns: 2 } },

function addStats(t, s) { if (s) for (const k in s) t[k] = (t[k] || 0) + s[k]; return t; }

function calcStats(run) {
  const st = Object.assign({}, BASE);
  for (const slot of ['weapon', 'armor', 'charm']) { const id = run.eq[slot]; if (id) addStats(st, GEAR_BY_ID[id].s); }
  for (const u of run.ups) addStats(st, UP_BY_ID[u].s);
  st.maxHp += run.bonusHp || 0;
  st.interval = Math.max(0.3, BASE_INTERVAL / Math.max(0.4, 1 + st.spd));
  st.crit = Math.min(0.6, st.crit);
  st.life = Math.min(0.4, st.life);
  return st;
}

function monScale(run) {

}

    int: b.int, def: b.def || 0, regen: b.regen || 0, thorns: b.thorns || 0, trait: b.trait || null, boss: !!b.boss, elite: !!elite, timer: b.int, stun: 0 };
}

}

// Advance a fight by dt seconds. Returns events for the screen.

  f.hTimer -= dt;

    const it = pickWeighted(pool.map(u => ({ u, w: u.rar === 'c' ? 60 : u.rar === 'f' ? 30 : (shrine ? 25 : 8) })), rng);

// Doors for the room the hero is standing in. A door is { kind: 'fight'|'chest'|'spring'|'shrine'|'guard', mon? }

function payCost(run, kind) { const full = doorCost(run, kind); if (kind === 'chest' && full === 0) run.freeChests = (run.freeChests || 0) + 1;

// Doors for the room the hero is standing in. A door is { kind: 'fight'|'chest'|'spring'|'shrine'|'guard', mon?, elite? }
function genDoors(run, rng) {
  const d = DEPTHS[run.depth];
  if (run.room >= ROOMS_PER_DEPTH) return [{ kind: 'guard', mon: d.guard }];
  if (run.no === 1 && run.depth === 0 && run.room === 0) return [{ kind: 'fight', mon: 'blob' }, { kind: 'fight', mon: 'bat' }];
  if (run.no === 1 && run.depth === 0 && run.room === 1) return [{ kind: 'chest' }, { kind: 'fight', mon: 'crab' }];
  const early = run.depth === 0 && run.room < 3;

    if (chestsLeft) opts.push({ k: 'chest', w: 18 });

function pickGear(depth, owned, rng, minRar, quest) {

}

// ---------------- coach (step-by-step lessons) ----------------
function coach(o) {
  return new Promise(res => {
    const el = $('coach'); el.innerHTML = ''; show(el, true); coachOpen = true; paused = true;
    let rect = null;
    if (o.target instanceof Element) { const b = o.target.getBoundingClientRect(); rect = { x: b.left - 6, y: b.top - 6, w: b.width + 12, h: b.height + 12 }; }
    else if (o.target) rect = o.target;
    if (rect) { const sp = document.createElement('div'); sp.className = 'spot'; Object.assign(sp.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' }); el.appendChild(sp); }
    else { const d = document.createElement('div'); d.className = 'dim'; el.appendChild(d); }
    const card = document.createElement('div'); card.className = 'ccard';
    card.innerHTML = (o.step ? `<div class="step">${o.step}</div>` : '') + o.text + (o.btn ? `<button>${o.btn}</button>` : '');
    el.appendChild(card);
    const below = rect && rect.y + rect.h / 2 < H * 0.5;
    if (below) card.style.top = Math.min(H - 180, rect.y + rect.h + 14) + 'px'; else card.style.bottom = Math.max(16, (rect ? H - rect.y + 14 : H * 0.4)) + 'px';
    if (o.finger) { const f = document.createElement('div'); f.className = 'finger ' + o.finger; f.textContent = '👆'; const fxp = o.fingerAt || { x: W / 2 - 20, y: (rect ? rect.y + rect.h + 30 : H / 2) };
      f.style.left = fxp.x + 'px'; f.style.top = fxp.y + 'px'; el.appendChild(f); }
    const done = () => { coachClose = null; el.innerHTML = ''; show(el, false); coachOpen = false; paused = false; res(); }; coachClose = done;
    if (o.btn) card.querySelector('button').onclick = e => { e.stopPropagation(); done(); };
    if (o.until) o.until(done);
  });
}
async function lesson(key, steps) {
  if (S.seen[key]) return; S.seen[key] = 1; save();
  for (let i = 0; i < steps.length; i++) await coach(Object.assign({ btn: i < steps.length - 1 ? 'Next' : 'Got it', step: steps.length > 1 ? `Step ${i + 1} of ${steps.length}` : '' }, steps[i]));
}
