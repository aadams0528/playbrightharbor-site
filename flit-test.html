</head>
<body>
<title>Flit (test version)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone game. A meadow board under a dawn sky, controls stacked below. */
:root{
  --sky:#eaf1f4; --sky2:#f7e9dc; --ink:#2c3a34; --soft:#5d6d65; --meadow:#cfe0b4; --meadow2:#b9d199; --tuft:#86a95f;
  --accent:#d9733f; --warn:#c2492f; --card:#fffdf8; --line:#d7dccf;
  --display:"Grandstander","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky:#17222b;--sky2:#24263a;--ink:#eef2ea;--soft:#a9b7ae;--meadow:#2c3b2c;--meadow2:#334632;--tuft:#5f7e47;--accent:#f0915c;--warn:#ff7a5c;--card:#1f2a2e;--line:#3a4840;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#17222b;--sky2:#24263a;--ink:#eef2ea;--soft:#a9b7ae;--meadow:#2c3b2c;--meadow2:#334632;--tuft:#5f7e47;--accent:#f0915c;--warn:#ff7a5c;--card:#1f2a2e;--line:#3a4840;color-scheme:dark}
html,body{height:100%}
body{background:linear-gradient(var(--sky2),var(--sky) 40%);background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;letter-spacing:.5px;color:var(--accent);cursor:default}
.lvl{font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--soft);font:700 .8rem var(--body);padding:0;cursor:pointer}
.dots button.done{background:var(--meadow2);border-color:var(--tuft);color:var(--ink)}
.dots button.cur{border-color:var(--accent);color:var(--accent)}
.dots button:disabled{opacity:.35;cursor:default}
.boardwrap{position:relative;width:100%;aspect-ratio:1;max-width:100%}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:22px}
.tip{min-height:3.2em;font-weight:700;line-height:1.35;text-wrap:balance}
.tip b{color:var(--accent)}
.tip.bad{color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 10px;font:800 1rem var(--body);cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.card{background:var(--card);color:var(--ink);width:min(560px,100%);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);margin:0;font-size:1.6rem;text-wrap:balance}
.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.stars{font-size:2rem;letter-spacing:4px;color:var(--accent)}
.small{color:var(--soft);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app">
  <header><h1 id="title">Flit</h1><span class="lvl" id="lvl">Level 1 of 12</span></header>
  <div class="dots" id="dots"></div>
  <div class="boardwrap"><canvas id="cv" aria-label="Game board"></canvas></div>
  <div class="tip" id="tip"></div>
  <div class="row">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="hint">Hint</button>
  </div>
  <div class="small">Prototype for testing. Press and hold a bird to see where it will fly, then let go to send it.</div>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="cardbody"></div></div>
<script>
const LEVELS=[{"n":3,"b":[[1,1,0,0]],"intro":"tap"},{"n":3,"b":[[1,0,1,0],[1,2,0,0]],"intro":"block"},{"n":3,"b":[[1,1,0,0],[1,2,2,0],[2,2,0,0]],"intro":"startle"},{"n":4,"b":[[2,0,1,0],[2,1,3,0],[0,0,1,0],[1,0,1,0]],"intro":"use"},{"n":4,"b":[[2,1,3,0],[3,0,0,0],[2,2,1,0],[0,1,2,0],[3,3,1,0],[1,1,0,0]]},{"n":5,"b":[[3,4,0,0],[3,3,1,0],[2,3,3,0],[2,1,3,0],[4,1,2,0],[3,0,3,0],[0,4,2,0],[2,2,0,0]]},{"n":5,"b":[[1,1,2,0],[0,2,3,0],[4,0,1,0],[3,1,0,0],[4,3,0,0],[3,4,2,0],[4,2,0,0],[4,1,0,0],[3,3,2,0],[0,3,1,0]]},{"n":5,"b":[[2,0,0,0],[1,2,1,0],[3,2,2,0],[1,1,3,0],[0,2,1,0],[3,1,3,0],[0,3,1,0],[4,0,2,0],[4,3,0,0],[1,3,2,0],[4,2,2,0],[0,0,0,0]]},{"n":6,"b":[[4,4,1,0],[3,0,2,0],[1,1,0,0],[4,2,0,0],[0,4,1,0],[4,1,0,0],[3,4,1,0],[0,0,0,0],[4,3,0,0],[2,5,1,0],[5,4,0,0],[1,0,1,0],[5,2,2,0],[4,0,0,0]]},{"n":4,"b":[[0,1,0,0],[1,1,0,1],[1,2,3,0]],"intro":"owl"},{"n":6,"b":[[0,5,0,1],[0,2,1,1],[3,1,1,0],[0,3,1,0],[1,3,3,0],[0,1,1,0],[3,0,3,0],[4,5,0,0],[0,0,0,0],[5,3,3,0],[2,1,1,0],[1,0,0,0],[1,1,1,0],[2,3,3,0]]},{"n":6,"b":[[1,3,0,1],[1,4,1,1],[2,3,0,1],[2,0,0,0],[2,1,2,0],[4,4,1,0],[5,5,2,0],[5,1,0,0],[5,0,2,0],[2,4,3,0],[2,2,0,0],[3,4,2,0],[3,0,2,0],[5,4,2,0],[4,5,1,0],[5,2,3,0]]}];
const DR=[-1,0,1,0],DC=[0,1,0,-1];
const COLORS=["#e07a5f","#f2b84b","#5b9bd5","#8cc084","#c879b9","#f28e6b","#6cc3c1","#e5a3b6"];
const INTRO={
 tap:{h:"Send the bird home",steps:["Each bird looks the way it will fly.","Tap the bird. It flies off the field.","Clear every bird to finish the level."]},
 block:{h:"Birds can't fly through birds",steps:["A bird can only leave if nothing is in its way.","The left bird is facing another bird, so it's stuck for now.","Send the right bird first, then the left bird has a clear sky."]},
 startle:{h:"Flapping startles neighbors",steps:["When a bird takes off, the birds right next to it get startled.","A startled bird turns a quarter turn clockwise ↻.","Here the two right birds block each other. Send the middle bird and watch the one beside it turn to face a clear path."]},
 use:{h:"Plan the turns",steps:["Now you choose which bird goes first.","Press and hold any bird to preview: its path lights up and the birds that will turn show ↻.","If every bird gets stuck, tap Undo. There is always a way."]},
 owl:{h:"Meet the owl",steps:["Owls are calm. They never turn when a bird flies off beside them.","Owls still startle their neighbors when they fly.","Use the owl's steady gaze to plan around it."]}
};
let store={get(k,d){try{const v=localStorage.getItem("flit."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("flit."+k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done",{}),seenIntro=store.get("intro",{}),unlocked=/[?&]unlock=1/.test(location.search)||store.get("unlock",false);
let cur=0,birds=[],hist=[],undos=0,flying=[],press=null,hintId=null,shake=null,nextId=0;
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
let W=0,dpr=1;
function n(){return LEVELS[cur].n}
function seedRand(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function load(i){cur=i;const L=LEVELS[i];const rnd=seedRand(i*977+13);birds=L.b.map(([r,c,d,o],k)=>({id:nextId++,r,c,d,o:!!o,ang:d*Math.PI/2,col:COLORS[Math.floor(rnd()*COLORS.length)],j:rnd()*6.28}));hist=[];undos=0;flying=[];hintId=null;tip();drawDots();
 document.getElementById("lvl").textContent="Level "+(i+1)+" of "+LEVELS.length;
 if(L.intro&&!seenIntro[L.intro])showIntro(L.intro);else if(L.intro)tutorialHint();}
function at(r,c){return birds.find(b=>b.r===r&&b.c===c)}
function blocker(b){let r=b.r+DR[b.d],c=b.c+DC[b.d];while(r>=0&&c>=0&&r<n()&&c<n()){const x=at(r,c);if(x)return x;r+=DR[b.d];c+=DC[b.d]}return null}
function neighbors(b){return birds.filter(y=>y!==b&&Math.abs(y.r-b.r)+Math.abs(y.c-b.c)===1)}
function snapshot(){return birds.map(b=>({...b}))}
function canMove(){return birds.some(b=>!blocker(b))}
// solver for hints: list of [r,c,d,o]
function key(s){return s.map(x=>x[0]+","+x[1]+","+x[2]).sort().join("|")}
function solve(s,N,m){if(!s.length)return[];const k=key(s);if(m.has(k))return m.get(k);m.set(k,null);for(let i=0;i<s.length;i++){const x=s[i];let r=x[0]+DR[x[2]],c=x[1]+DC[x[2]],ok=true;while(r>=0&&c>=0&&r<N&&c<N){if(s.some(y=>y[0]===r&&y[1]===c)){ok=false;break}r+=DR[x[2]];c+=DC[x[2]]}if(!ok)continue;const ns=s.filter((_,j)=>j!==i).map(y=>(!y[3]&&Math.abs(y[0]-x[0])+Math.abs(y[1]-x[1])===1)?[y[0],y[1],(y[2]+1)%4,y[3]]:y);const sol=solve(ns,N,m);if(sol){const res=[[x[0],x[1]],...sol];m.set(k,res);return res}}return null}
function nextMove(){const s=solve(birds.map(b=>[b.r,b.c,b.d,b.o]),n(),new Map());return s&&s.length?at(s[0][0],s[0][1]):null}
function tutorialHint(){const L=LEVELS[cur];if(["tap","block","startle","owl"].includes(L.intro)&&birds.length){const m=nextMove();hintId=m?m.id:null}}
function send(b){
 const bl=blocker(b);
 if(bl){shake={id:b.id,t:performance.now(),bl:bl.id};chirp(220,.08);tip("That bird is blocked by the bird in its way. Free the path first.",true);return}
 hist.push(snapshot());
 const nb=neighbors(b);birds=birds.filter(x=>x!==b);
 flying.push({...b,t:performance.now()});
 for(const y of nb)if(!y.o)y.d=(y.d+1)%4;
 chirp(660+Math.random()*200,.12);hintId=null;
 if(!birds.length){setTimeout(win,650);tip("Clear sky!");return}
 if(!canMove())tip("No bird can fly now. Tap <b>Undo</b> to take the last move back.",true);else tip();
 tutorialHint();
}
function win(){done[cur]=Math.max(done[cur]||0,undos===0?3:undos<=2?2:1);store.set("done",done);drawDots();
 const s=done[cur],last=cur===LEVELS.length-1;
 card('<h2>'+(last?"You cleared every level!":"Level "+(cur+1)+" cleared")+'</h2><div class="stars" aria-label="'+s+' of 3 stars">'+"★".repeat(undos===0?3:undos<=2?2:1)+"☆".repeat(3-(undos===0?3:undos<=2?2:1))+'</div><p class="small">'+(undos===0?"No undos. Perfect flight plan!":"Clear it with no undos for three stars.")+'</p>'+(last?'<p>Thanks for playing the prototype. Which level did you like most, and where did you get stuck?</p>':'')+'<div class="row">'+(last?'':'<button class="btn main" id="nx">Next level</button>')+'<button class="btn" id="again">Play again</button></div>');
 const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{closeCard();load(cur+1)};document.getElementById("again").onclick=()=>{closeCard();load(cur)};(nx||document.getElementById("again")).focus();}
function showIntro(k){const it=INTRO[k];card('<h2>'+it.h+'</h2><ol>'+it.steps.map(s=>'<li>'+s+'</li>').join("")+'</ol><div class="row"><button class="btn main" id="ok">Got it</button></div>');const ok=document.getElementById("ok");ok.focus();ok.onclick=()=>{seenIntro[k]=1;store.set("intro",seenIntro);closeCard();tutorialHint();tip()}}
function card(h){document.getElementById("cardbody").innerHTML=h;document.getElementById("sheet").hidden=false}
function closeCard(){document.getElementById("sheet").hidden=true}
function tip(t,bad){const el=document.getElementById("tip");const L=LEVELS[cur];
 if(t==null){t=L.intro==="tap"?"Tap the <b>glowing bird</b>.":L.intro==="block"?"Send the <b>glowing bird</b> first. The other one is blocked.":L.intro==="startle"?"Send the <b>glowing bird</b>. The bird beside it turns ↻.":L.intro==="owl"?"The brown owl won't turn. Follow the <b>glow</b>.":"Birds left: <b>"+birds.length+"</b>. Hold a bird to preview its flight."}
 el.innerHTML=t;el.classList.toggle("bad",!!bad)}
function drawDots(){const d=document.getElementById("dots");d.innerHTML="";LEVELS.forEach((_,i)=>{const b=document.createElement("button");b.textContent=i+1;b.className=(done[i]?"done ":"")+(i===cur?"cur":"");b.disabled=!(unlocked||i===0||done[i-1]||done[i]);b.setAttribute("aria-label","Level "+(i+1)+(done[i]?", cleared":""));b.onclick=()=>load(i);d.appendChild(b)})}
document.getElementById("undo").onclick=()=>{if(!hist.length)return;birds=hist.pop();undos++;flying=[];tip();tutorialHint()};
document.getElementById("restart").onclick=()=>{const u=undos+(hist.length?1:0);load(cur);undos=u};
document.getElementById("hint").onclick=()=>{const m=nextMove();if(m){hintId=m.id;tip("Try the <b>glowing bird</b>.")}else tip("This position can't be cleared. Tap <b>Undo</b> or <b>Restart</b>.",true)};
let taps=0,tapT=0;document.getElementById("title").onclick=()=>{const t=Date.now();taps=t-tapT<600?taps+1:1;tapT=t;if(taps>=5){unlocked=true;store.set("unlock",true);drawDots();tip("Tester mode: every level is open.")}};
// sound
let ac=null;function chirp(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,ac.currentTime+d);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.06)}catch(e){}}
// input
function cellAt(e){const r=cv.getBoundingClientRect(),s=r.width/n();return [Math.floor((e.clientY-r.top)/s),Math.floor((e.clientX-r.left)/s)]}
cv.addEventListener("pointerdown",e=>{const [r,c]=cellAt(e),b=at(r,c);if(b){press={id:b.id};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener("pointerup",e=>{if(!press)return;const [r,c]=cellAt(e),b=at(r,c);if(b&&b.id===press.id)send(b);press=null});
cv.addEventListener("pointercancel",()=>press=null);
// drawing
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;cv.width=W*dpr;cv.height=W*dpr}
addEventListener("resize",resize);
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function blob(x,y,rad,seed,pts=11,j=.12){cx.beginPath();for(let i=0;i<=pts;i++){const a=i/pts*6.283,k=1+Math.sin(a*3+seed)*j*.6+Math.sin(a*5+seed*2)*j*.4,px=x+Math.cos(a)*rad*k,py=y+Math.sin(a)*rad*k;i?cx.lineTo(px,py):cx.moveTo(px,py)}cx.closePath()}
function drawBird(b,x,y,s,ang,flap,glow){
 cx.save();cx.translate(x,y);cx.rotate(ang);const R=s*.3;
 if(glow){cx.fillStyle=css("--accent");cx.globalAlpha=.25+.15*Math.sin(performance.now()/250);blob(0,0,R*1.65,b.j,14,.08);cx.fill();cx.globalAlpha=1}
 // tail (behind, pointing down = back)
 cx.fillStyle=b.o?"#7a5a3c":shade(b.col,-30);cx.beginPath();cx.moveTo(-R*.35,R*.7);cx.lineTo(0,R*1.35);cx.lineTo(R*.35,R*.7);cx.closePath();cx.fill();
 // body
 cx.fillStyle=b.o?"#9b7652":b.col;blob(0,R*.1,R*(b.o?1.1:1),b.j,12,.1);cx.fill();
 cx.strokeStyle=shade(b.o?"#9b7652":b.col,-45);cx.lineWidth=Math.max(1.5,s*.025);cx.stroke();
 // wings
 const w=Math.sin(flap)*.9;cx.fillStyle=shade(b.o?"#9b7652":b.col,-22);
 for(const sd of[-1,1]){cx.save();cx.translate(sd*R*.75,R*.2);cx.rotate(sd*(.3+w));blob(0,0,R*.42,b.j+sd,8,.15);cx.scale(1,1);cx.fill();cx.restore()}
 if(b.o){cx.fillStyle="#7a5a3c";for(const sd of[-1,1]){cx.beginPath();cx.moveTo(sd*R*.75,-R*.55);cx.lineTo(sd*R*.95,-R*1.15);cx.lineTo(sd*R*.35,-R*.8);cx.fill()}
  cx.fillStyle="#f6e7b8";for(const sd of[-1,1]){blob(sd*R*.38,-R*.25,R*.3,b.j,9,.06);cx.fill()}cx.fillStyle="#2c2a24";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.38,-R*.3,R*.12,0,6.3);cx.fill()}}
 else{cx.fillStyle="#2c2a24";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.36,-R*.4,R*.11,0,6.3);cx.fill()}cx.fillStyle="#fff";for(const sd of[-1,1]){cx.beginPath();cx.arc(sd*R*.33,-R*.44,R*.04,0,6.3);cx.fill()}}
 // beak points forward (up in local space)
 cx.fillStyle="#f4a52a";cx.strokeStyle="#b8741a";cx.lineWidth=Math.max(1,s*.015);cx.beginPath();cx.moveTo(-R*.3,-R*.78);cx.lineTo(0,-R*(b.o?1.3:1.5));cx.lineTo(R*.3,-R*.78);cx.closePath();cx.fill();cx.stroke();
 // direction chevron ahead of the beak
 if(!flap||Math.abs(flap)<1){cx.strokeStyle=b.o?"#7a5a3c":shade(b.col,-40);cx.globalAlpha=.8;cx.lineWidth=Math.max(2,s*.045);cx.lineCap="round";cx.lineJoin="round";cx.beginPath();cx.moveTo(-R*.32,-R*1.62);cx.lineTo(0,-R*1.9);cx.lineTo(R*.32,-R*1.62);cx.stroke();cx.globalAlpha=1}
 cx.restore();}
function shade(h,a){const v=parseInt(h.slice(1),16);let r=(v>>16)+a,g=(v>>8&255)+a,bb=(v&255)+a;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));bb=Math.max(0,Math.min(255,bb));return"rgb("+r+","+g+","+bb+")"}
function frame(now){
 if(!W)resize();cx.setTransform(dpr,0,0,dpr,0,0);const N=n(),s=W/N;cx.clearRect(0,0,W,W);
 // meadow ground
 cx.fillStyle=css("--meadow");cx.beginPath();cx.roundRect?cx.roundRect(0,0,W,W,22):cx.rect(0,0,W,W);cx.fill();
 cx.save();cx.beginPath();cx.rect(0,0,W,W);cx.clip();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=(c+.5)*s,y=(r+.5)*s,sd=r*7+c*13;cx.fillStyle=css("--meadow2");blob(x,y+s*.08,s*.38,sd,10,.18);cx.fill();
  cx.strokeStyle=css("--tuft");cx.lineWidth=Math.max(1.2,s*.02);cx.lineCap="round";for(let k=0;k<4;k++){const tx=x+(Math.sin(sd+k*2.1))*s*.3,ty=y+s*.32+Math.cos(sd+k)*s*.04;cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(tx-s*.03,ty-s*.08);cx.moveTo(tx,ty);cx.lineTo(tx+s*.03,ty-s*.09);cx.stroke()}}
 cx.restore();
 // preview
 const pb=press&&birds.find(b=>b.id===press.id);
 if(pb){const bl=blocker(pb);cx.strokeStyle=bl?css("--warn"):css("--accent");cx.lineWidth=s*.06;cx.setLineDash([s*.06,s*.12]);cx.lineCap="round";cx.beginPath();cx.moveTo((pb.c+.5)*s,(pb.r+.5)*s);
  const ex=bl?(bl.c+.5)*s-DC[pb.d]*s*.35:(pb.c+.5+DC[pb.d]*N*2)*s,ey=bl?(bl.r+.5)*s-DR[pb.d]*s*.35:(pb.r+.5+DR[pb.d]*N*2)*s;cx.lineTo(ex,ey);cx.stroke();cx.setLineDash([]);
  if(!bl)for(const y of neighbors(pb)){const x0=(y.c+.5)*s,y0=(y.r+.5)*s;cx.fillStyle=css("--card");cx.beginPath();cx.arc(x0+s*.3,y0-s*.3,s*.16,0,6.3);cx.fill();cx.fillStyle=y.o?css("--soft"):css("--accent");cx.font="800 "+(s*.22)+"px "+css("--body");cx.textAlign="center";cx.textBaseline="middle";cx.fillText(y.o?"–":"↻",x0+s*.3,y0-s*.29)}}
 // birds
 for(const b of birds){const tgt=b.d*Math.PI/2;let diff=tgt-b.ang;while(diff<-Math.PI)diff+=Math.PI*2;while(diff>Math.PI)diff-=Math.PI*2;b.ang+=diff*.25;
  let x=(b.c+.5)*s,y=(b.r+.5)*s;
  if(shake&&shake.id===b.id){const t=(now-shake.t)/400;if(t<1)x+=Math.sin(t*30)*s*.06*(1-t);else shake=null}
  if(shake&&shake.bl===b.id&&(now-shake.t)<600){cx.strokeStyle=css("--warn");cx.lineWidth=s*.05;blob(x,y,s*.42,b.j,12,.06);cx.stroke()}
  drawBird(b,x,y,s,b.ang,Math.sin(now/600+b.j)*.15,b.id===hintId)}
 for(const f of flying){const t=(now-f.t)/700;if(t>1)continue;const dist=t*t*N*1.4*s;drawBird(f,(f.c+.5)*s+DC[f.d]*dist,(f.r+.5)*s+DR[f.d]*dist,s*(1+t*.3),f.d*Math.PI/2,now/40,false)}
 flying=flying.filter(f=>now-f.t<700);
 requestAnimationFrame(frame)}
window.claude?.hot?.snapshot?.(()=>({cur,done}));
function start(d){if(d&&d.done)done=d.done;let first=0;while(done[first]&&first<LEVELS.length-1)first++;load(d&&d.cur!=null?d.cur:first);requestAnimationFrame(frame)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
