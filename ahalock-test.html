<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- Ahalock prototype v0.10 (formerly Truthlock; daily logic puzzles). Unlisted test page: not linked from the site. Built from /mnt/project-files/ideas/truthlock/ (node build.js). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahalock (test version)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#13203a; --bg2:#1b2c4d; --panel:#fbf4e4; --panel2:#f1e6cc; --ink:#1d2433; --ink2:#5b6273; --line:#e0d3b4;
  --gold:#f4c430; --gold2:#ffe08a; --green:#2fa866; --amber:#eb9b1c; --red:#d94c3d; --grey:#a3a9b6; --cardred:#b3343a;
  --disp:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:var(--body)}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#24396a 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);position:relative}
h1,h2,h3{font-family:var(--disp);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;font-family:var(--disp);font-weight:600;font-size:20px;background:var(--gold);color:#2a2000;box-shadow:0 4px 0 #b88a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.small{min-height:40px;font-size:16px;padding:0 14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:34px;letter-spacing:.5px}
.logo h1 span{color:var(--gold)}
.streak{font-family:var(--disp);font-size:18px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px}
.tag{font-size:14px;color:#c6d0e6;margin:2px 0 16px}
.today{background:var(--panel);color:var(--ink);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.today .when{display:flex;justify-content:space-between;align-items:baseline}
.today h2{font-size:24px}
.mood{font-size:14px;font-weight:800;color:var(--ink2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;position:relative}
.tile .ico{height:44px;display:flex;align-items:center;justify-content:center}
.tile .nm{font-family:var(--disp);font-weight:600;font-size:15px;margin-top:4px}
.dots{display:flex;gap:4px;justify-content:center;margin-top:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--amber)}
.tile.done{border-color:var(--green);background:#eefaf2}
.tile.done::after{content:"✓";position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 8px}
.wd{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 0;text-align:center;font-size:13px;color:#c6d0e6;border:2px solid transparent}
.wd b{display:block;font-family:var(--disp);font-size:18px;color:#fff}
.wd .m{font-size:12px;height:14px}
.wd.sel{border-color:var(--gold)}
.wd.today b{color:var(--gold)}
.wd.full{background:rgba(47,168,102,.35)}
.sect{font-family:var(--disp);font-size:16px;color:#c6d0e6;margin:18px 0 8px}
.howrow{display:flex;gap:10px}
.howrow .btn{flex:1}
.foot{font-size:12px;color:#8d9ab6;text-align:center;margin-top:20px}

/* ---------- puzzle ---------- */
.pz-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pz-top .back{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);font-size:22px}
.pz-top .ttl{flex:1}
.pz-top .ttl h2{font-size:21px}
.pz-top .ttl div{font-size:13px;color:#c6d0e6}
.timer{font-family:var(--disp);font-size:18px;color:#c6d0e6;min-width:52px;text-align:right}
.progress{display:flex;gap:6px;margin-bottom:12px}
.progress i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.progress i.on{background:var(--gold)}
.progress i.ok{background:var(--green)}
.board{background:var(--panel);color:var(--ink);border-radius:22px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);position:relative}

/* lock */
.lockwrap{display:flex;justify-content:center;margin:2px 0 10px}
.padlock{position:relative;width:250px;height:150px}
.padlock.n4{width:290px}
.shackle{position:absolute;left:50%;top:0;width:110px;height:84px;margin-left:-55px;border:14px solid #8b93a3;border-bottom:0;border-radius:60px 60px 0 0;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.padlock.open .shackle{transform:translateY(-22px) translateX(26px) rotate(14deg)}
.lbody{position:absolute;left:0;right:0;bottom:0;height:96px;border-radius:20px;background:linear-gradient(#2c3446,#1a2030);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 6px 0 #0d111b;display:flex;align-items:center;justify-content:center;gap:10px}
.lbody .led{position:absolute;top:9px;left:50%;width:34px;height:6px;margin-left:-17px;border-radius:3px;background:#5a6275}
.padlock.open .led{background:#4ee08a;box-shadow:0 0 10px #4ee08a}
.padlock.bad .led{background:var(--red)}
.slot{width:50px;height:62px;border-radius:12px;background:#f6f1e3;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:38px;display:flex;align-items:center;justify-content:center;border:3px solid transparent;box-shadow:inset 0 3px 0 rgba(0,0,0,.12)}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,196,48,.4)}
.padlock.bad .lbody{animation:shake .4s}
@keyframes ahapop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}45%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.aha{position:fixed;left:50%;top:42%;z-index:60;font-family:Fredoka,sans-serif;font-weight:700;font-size:64px;color:var(--gold);text-shadow:0 4px 0 #b8860b,0 8px 24px rgba(0,0,0,.45);pointer-events:none;animation:ahapop 1.1s ease-out forwards;white-space:nowrap}
.ansrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-weight:800;color:var(--ink2);font-size:14px}
.ansbox{min-width:84px;height:48px;padding:0 14px;border-radius:12px;border:3px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:28px;color:#b8860b;background:#fffbea}
.ansbox.full{border-style:solid;color:var(--ink)}
.wheels{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin:4px 0 2px}
.wheel{position:relative;width:42%;max-width:132px;border-radius:50%;transition:box-shadow .2s}
.wheels.n4 .wheel{width:40%}
.wheel svg{display:block;width:100%;height:auto}
.wheel .wt{font-family:var(--disp);font-weight:700;font-size:27px;text-anchor:middle;fill:#1d2433}
.wheel .wt.big{font-size:29px}
.wheel .wt.q{fill:#c99700}
.wheel.hl{box-shadow:0 0 0 5px rgba(244,196,48,.75)}
.wheel.badc{box-shadow:0 0 0 5px rgba(217,76,61,.6)}
.wheel .wno{position:absolute;left:-2px;top:-2px;width:24px;height:24px;border-radius:50%;background:var(--ink2);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.seq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 4px;margin:8px 0 4px}
.seq .tb{min-width:44px;height:48px;padding:0 6px;border-radius:12px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:22px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.seq .tb.q{border:3px dashed var(--gold);background:#fffbea;color:#b8860b}
.seq .tb.q.full{border-style:solid;color:var(--ink)}
.seq .sa{color:var(--ink2);font-weight:800;font-size:18px}
.seq .tb.lq{padding:0 4px;gap:3px}
.ls{min-width:34px;height:38px;border:0;border-radius:8px;background:transparent;font-family:var(--disp);font-weight:700;font-size:22px;color:inherit}
.tb.lq.two .ls{background:#fff;border:2px solid var(--line)}
.tb.lq.two .ls.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,196,48,.5)}
.abc{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin:10px 0 2px;background:#f3eedf;border-radius:10px;padding:5px 3px}
.abc div{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.abc b{font-family:var(--disp);font-size:14px;color:var(--ink)}
.abc small{font-size:9.5px;color:var(--ink2);font-weight:700}
.abc.pulse{box-shadow:0 0 0 4px rgba(244,196,48,.7)}
.keys.az{grid-template-columns:repeat(7,1fr);gap:5px}
.keys.az .key{height:40px;font-size:19px;border-radius:10px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:5px;margin:8px 0 2px}
.prow{display:flex;gap:5px}
.brick{width:52px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:20px;transition:box-shadow .2s}
.brick.given{background:#e9a86b;color:#3b2214;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brick.empty{background:#fff;border:2px dashed #cdbf9e}
.brick.q{background:#fffbea;border:3px dashed var(--gold);color:#b8860b}
.brick.q.full{border-style:solid;color:var(--ink)}
.brick.hl{box-shadow:0 0 0 4px rgba(244,196,48,.8)}
.brick.badc{box-shadow:0 0 0 4px rgba(217,76,61,.6)}
.storycard{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 14px;border-radius:18px;border:0;background:linear-gradient(135deg,#2c3f6b,#3d2f5c);color:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.storycard .sc-ico{font-size:34px}
.storycard .sc-t{flex:1;display:flex;flex-direction:column;gap:2px}
.storycard b{font-family:var(--disp);font-size:18px}
.storycard span{font-size:13px;color:#d9dcef;font-weight:700}
.storycard .sc-go{font-size:28px;color:var(--gold)}
.hmap{position:relative;height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(#5f8fc2,#3d6ea3);margin:6px 0 12px;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.hmap.lit{background:linear-gradient(#ffd98a,#5f8fc2 55%,#3d6ea3)}
.hmap > svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0}
.stop .pin{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:3px solid #fff}
.stop.open .pin{border-color:var(--gold);animation:pulse 1.6s infinite}
.stop.done .pin{border-color:var(--green)}
.stop.locked .pin{background:#d8d2c3;font-size:22px}
.stop .sn{font-size:11.5px;font-weight:800;color:#3b2d14;background:rgba(255,255,255,.85);padding:2px 7px;border-radius:9px;white-space:nowrap}
.hmap .deco{position:absolute;transform:translate(-50%,-50%);font-size:22px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.hmap .boat{animation:sail 6s ease-in-out infinite alternate}
@keyframes sail{from{transform:translate(-50%,-50%)}to{transform:translate(-10%,-60%)}}
.hmap .glow{position:absolute;width:110px;height:110px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(rgba(255,214,110,.75),rgba(255,214,110,0) 65%);pointer-events:none}
.hmap .beam{position:absolute;width:240px;height:34px;transform-origin:0 50%;margin-top:-17px;background:linear-gradient(90deg,rgba(255,236,150,.85),rgba(255,236,150,0));clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);animation:sweep 5s linear infinite;pointer-events:none}
@keyframes sweep{from{transform:rotate(130deg)}to{transform:rotate(490deg)}}
@media (prefers-reduced-motion:reduce){.hmap .boat,.hmap .beam{animation:none}.hmap .beam{transform:rotate(200deg)}}
.lh{width:1.05em;height:1.05em;vertical-align:-.15em;display:inline-block}
.stop .pin .lh{width:30px;height:30px}
.scene{padding:0;overflow:hidden}
.scsvg{display:block;width:100%;height:120px;border-radius:16px}
.slots.vert{flex-direction:column-reverse;align-items:center;gap:6px}
.slots.vert .gslot{flex-direction:row;max-width:none;width:200px;gap:10px}
.slots.vert .gslot .box{width:64px;flex:none;font-size:30px}
.slots.vert .gslot .lab{min-height:0;text-align:left}
.chain{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chain.vert{flex-direction:column-reverse;align-items:center}
.chain span{display:flex;flex-direction:column;align-items:center;min-width:54px;padding:6px 6px 4px;border-radius:12px;background:#e9e2d0;opacity:.35;filter:grayscale(1);animation:litup .5s ease forwards}
.chain span b{font-size:26px;line-height:1.1}
.chain span small{font-size:11px;font-weight:800;color:var(--ink2)}
@keyframes litup{to{opacity:1;filter:none;background:#fff3c4;box-shadow:0 0 0 2px #f4c430,0 0 18px rgba(244,196,48,.6)}}
@media (prefers-reduced-motion:reduce){.chain span{animation-duration:.01s}}
.wsum{background:#fff3c4;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:800;color:var(--ink);font-size:14.5px;line-height:1.35}
.ic{width:1.2em;height:1.2em;vertical-align:-.25em;display:inline-block;flex:none}
.gslot .box .ic{width:70%;height:70%}
.chip .em .ic{width:26px;height:26px;vertical-align:middle}
.stop .pin .ic{width:32px;height:32px}
.actions.stick{flex-wrap:wrap}
.actmsg{flex:0 0 100%}
.actmsg:empty{display:none}
.rp-fire small,.rp-sail small{max-width:62px;font-size:9.5px}
.actmsg .msg{margin:0 0 8px}
.repair{position:relative;height:150px;border-radius:16px;overflow:hidden;margin:10px 0 6px}
.repair small{font-size:10.5px;font-weight:800;line-height:1.1;text-align:center}
.repair b{font-size:10px;font-family:var(--disp);background:#2b3245;color:#fff;border-radius:8px;padding:0 5px;margin-bottom:2px}
.rp0{background:#f6d7a7}
.rp-bench{position:absolute;left:0;right:0;bottom:0;height:30px;background:#b98b55;border-top:4px solid #8a6339}
.rp-glow{position:absolute;left:50%;bottom:30px;width:200px;height:200px;margin:0 0 -90px -100px;border-radius:50%;background:radial-gradient(rgba(255,214,110,.85),rgba(255,214,110,0) 62%);opacity:0;animation:rpfade .7s ease forwards}
.rp-stack{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.rp-drop{display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(-34px);animation:rpdrop .45s ease-out forwards;color:var(--ink)}
.rp-drop .ic{width:32px;height:32px}
.rp1{background:#bfe3f2}.rp2{background:linear-gradient(#26345e,#55639c)}
.rp-sea{position:absolute;left:0;right:0;bottom:0;height:58%;background:#3d6ea3}
.rp-pier{position:absolute;left:0;bottom:52%;width:16%;height:9px;background:#8a6339}
.rp-boats,.rp-sigs{position:absolute;left:4%;right:4%;bottom:10%;display:flex;justify-content:space-around;align-items:flex-end}
.rp-boats{left:18%}
.rp-sail,.rp-fire{display:flex;flex-direction:column;align-items:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rp-sail{opacity:0;transform:translateX(-70px);animation:rpsail .8s ease-out forwards}
.rp-sail .ic,.rp-fire .ic{width:36px;height:36px}
.rp-fire{filter:grayscale(1) brightness(.55);animation:rpfire .45s ease forwards}
.rp-fire .ic{border-radius:50%}
.rp-beam{position:absolute;right:-10px;top:10px;width:85%;height:46px;background:linear-gradient(270deg,rgba(255,236,150,.9),rgba(255,236,150,0));clip-path:polygon(100% 40%,0 0,0 100%,100% 60%);opacity:0;animation:rpfade .8s ease forwards}
@keyframes rpdrop{to{opacity:1;transform:none}}
@keyframes rpsail{to{opacity:1;transform:none}}
@keyframes rpfire{to{filter:none;transform:scale(1.08)}}
@keyframes rpfade{to{opacity:1}}
.rp-fire{transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){.repair *{animation-duration:.01s!important;animation-delay:0s!important}}
.newisle{position:absolute;left:6%;top:6%;font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.beat{background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;font-weight:600}
.scene{border-radius:18px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 0 10px;filter:grayscale(.55) brightness(.92);transition:filter .4s}
.scene.fixed{filter:none;box-shadow:0 0 0 3px var(--gold)}
.sc-big{display:flex;gap:18px;font-size:46px}
.scene{position:relative}
.scene .sc-glow{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap}
.sc-glow{margin-top:4px;font-weight:800;color:#5a3d00}
.objs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.obj{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.obj .oi{font-size:30px}
.obj .ot{flex:1;display:flex;flex-direction:column}
.obj b{font-family:var(--disp);font-size:17px}
.obj small{font-size:12.5px;color:var(--ink2);font-weight:700}
.obj .og{font-size:22px;color:var(--ink2)}
.obj.done{border-color:var(--green);background:#eef8f0}
.obj.locked{opacity:.65}
.obj.fin{border-color:var(--gold)}
.obj.fin.locked{border-color:var(--line)}
.etray{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ecard{background:#fffdf5;border:2px solid #e3d3a3;border-radius:12px;padding:8px 10px}
.ecard .et{font-size:12px;font-weight:800;color:#8a6d3b;text-transform:uppercase;letter-spacing:.3px}
.ecard .en{font-size:12px;opacity:.7;margin-top:4px}
.ecard .ex{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:2px}
.ecard.missing{border-style:dashed;opacity:.7}
.ecard.missing .ex{color:var(--ink2);font-weight:600}
.ecard.big{margin:10px 0}
.evtag{display:inline-block;font-size:11px;font-weight:800;color:#8a6d3b;background:#f5ecd2;border-radius:7px;padding:1px 6px;margin-right:6px}
.msg.info{background:#eef3ff;color:#26345c}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rules-mini{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.pip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:3px}
.pip.g{background:var(--green)} .pip.y{background:var(--amber)} .pip.x{background:#fff;border:2px solid var(--grey)}
.clues{display:flex;flex-direction:column;gap:7px}
.clue{display:grid;grid-template-columns:30px auto 1fr;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 10px}
.clue .no{width:28px;height:28px;border-radius:50%;background:var(--cardred);color:#fff;font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center}
.digs{display:flex;gap:5px}

/* Truthlock logic: generators, solvers, explainers for Code Lock and Truth Cards.
   Works in the browser (window.TL) and in node (module.exports). */
(function (root) {
  'use strict';
  // ---------- RNG ----------
  function rngFrom(seedStr) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0;
    const r = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.int = (n) => Math.floor(r() * n);
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.shuffle = (arr) => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; };
    return r;
  }
  const NUM = ['No', 'One', 'Two', 'Three', 'Four'];
  function listWords(items, conj) {
    conj = conj || 'and';
    if (items.length <= 1) return items.join('');
    if (items.length === 2) return items[0] + ' ' + conj + ' ' + items[1];
    return items.slice(0, -1).join(', ') + ' ' + conj + ' ' + items[items.length - 1];
  }

  // =====================================================================
  // CODE LOCK
  // =====================================================================
  function feedback(code, guess) {
    let a = 0, b = 0;
    for (let i = 0; i < guess.length; i++) {
      if (guess[i] === code[i]) a++; else if (code.indexOf(guess[i]) >= 0) b++;
    }
    return [a, b];
  }
  function fbWords(a, b) {

  function genLock(rng, tier) {

    for (let attempt = 0; attempt < 400; attempt++) {

          const [a, b] = feedback(code, g);

          if (a + b === 0 && tier !== 'E') { if (rng() < 0.75) continue; }
          if (a + b === 0 && tier === 'E') continue;
          if (n === 4 && a + b < 1) continue;
          const nc = cands.filter(c => { const f = feedback(c, g); return f[0] === a && f[1] === b; });
          if (nc.length === cands.length) continue;
          // prefer modest cuts on hard tiers, big cuts on easy
          const score = tier === 'E' ? nc.length : (tier === 'M' ? Math.abs(nc.length - cands.length * 0.3) : Math.abs(nc.length - cands.length * 0.2));

        }
        if (!best) { stuck++; continue; }

        cands = best.nc;

      // minimize
      let cl = clues.slice();

        if (tier === 'E' && idx === 0) continue;

        if (lockSolutions({ n, clues: trial }).length === 1) cl = trial;

      const ex = explainLock(puz);

  }

  function checkLock(p, entry) {
    if (entry.some(d => d === null || d === undefined)) return { ok: false, msg: 'Fill in every spot first.' };
    if (new Set(entry).size !== entry.length) return { ok: false, msg: 'All the numbers in the code are different.', rule: true };
    for (let i = 0; i < p.clues.length; i++) {
      const cl = p.clues[i]; const f = feedback(entry, cl.g);
      if (f[0] !== cl.a || f[1] !== cl.b) {
        return { ok: false, clue: i, msg: 'Clue ' + (i + 1) + ' says "' + fbWords(cl.a, cl.b).toLowerCase() + '". With ' + entry.join(' ') + ' it would be "' + fbWords(f[0], f[1]).toLowerCase() + '".', got: f };
      }

    return { ok: true };

  // =====================================================================
  // TRUTH CARDS
  // =====================================================================
  const RN = { K: 'King', Q: 'Queen', J: 'Jack' };
  const PERMS = [['K', 'Q', 'J'], ['K', 'J', 'Q'], ['Q', 'K', 'J'], ['Q', 'J', 'K'], ['J', 'K', 'Q'], ['J', 'Q', 'K']];
  function stmtText(st, speaker) {
    switch (st.t) {
      case 'self': return st.neg ? 'I am not the ' + RN[st.r] + '.' : 'I am the ' + RN[st.r] + '.';
      case 'other': return 'Card ' + (st.c + 1) + (st.neg ? ' is not the ' : ' is the ') + RN[st.r] + '.';
      case 'lie': return 'Card ' + (st.c + 1) + (st.liar ? ' is lying.' : ' is telling the truth.');
      case 'either': return 'Card ' + (st.c + 1) + ' is the ' + RN[st.r1] + ' or the ' + RN[st.r2] + '.';
    }
  }
  function evalStmt(st, speaker, perm, stmts, depth) {
    depth = depth || 0;
    switch (st.t) {
      case 'self': return (perm[speaker] === st.r) !== !!st.neg;
      case 'other': return (perm[st.c] === st.r) !== !!st.neg;
      case 'either': return perm[st.c] === st.r1 || perm[st.c] === st.r2;
      case 'lie': {
        const v = evalStmt(stmts[st.c], st.c, perm, stmts, depth + 1);
        return st.liar ? !v : v;
      }

function check() {

  if (r.ok) { solved(); return; }
  if (r.rule || r.clue !== undefined || r.card !== undefined) P.miss++;
  P.bad = r.clue !== undefined ? r.clue : r.card !== undefined ? r.card : null;
  P.hl = null;
  P.msg = { k: 'bad', t: '✗ Not quite. ' + esc(r.msg) };
  if (P.told.indexOf(r.msg) < 0) P.told.push(r.msg);
  P.toldClue = r.clue !== undefined ? r.clue : null;
  renderPuzzle();
  const pl = document.getElementById('pl'); if (pl) { pl.classList.add('bad'); }
  const el = document.getElementById(TYPES[pz.type].hid(P.bad)); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (P.tutorial) tutWrong();

function hint() {
  if (P.solved) return;

  let k = P.hintPos;
  const quoted = (st) => P.toldClue !== null && P.toldClue !== undefined && st.kind === 'clue' && st.clues && st.clues.length === 1 && st.clues[0] === P.toldClue;
  while (k < steps.length && (P.told.indexOf(steps[k].text) >= 0 || (quoted(steps[k]) && k + 1 < steps.length))) k++;
  P.toldClue = null;
  if (k >= steps.length) { P.msg = { k: 'hint', t: '💡 You have every step now. Fill in the answer!' }; renderPuzzle(); return; }
  const s = steps[k]; P.hintPos = k + 1; P.hints++;
  P.hl = s.clues && s.clues.length ? s.clues : s.cards || null;
  P.msg = { k: 'hint', t: '💡 Step ' + (k + 1) + ' of ' + steps.length + ': ' + esc(s.text) };
  renderPuzzle();
}
