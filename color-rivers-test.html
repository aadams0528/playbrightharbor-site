<style>
/* Layout: one phone-width column on a night pond. Top bar, level tip, the board is the stage, tools along the bottom. */
:root{
  --pond:#0e2236;        /* deep night water */
  --pond-deep:#081726;
  --pond-lift:#173550;   /* tiles, cards */
  --ink:#eef5ff;
  --ink-soft:#9fb6cc;
  --lantern:#ffd27a;     /* warm UI accent: stars, buttons */
  --lantern-deep:#e2a943;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--pond-lift) 0%,var(--pond) 45%,var(--pond-deep) 100%) fixed,var(--pond-deep);color:var(--ink);font-family:var(--body);margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 14px;box-sizing:border-box}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin-right:auto;background:linear-gradient(90deg,#ff5d6c,#ff9a3c,#ffd23f,#3fd68a,#4da3ff,#b678ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.2px}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-soft);-webkit-text-fill-color:var(--ink-soft);margin-top:2px}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.pill .st{color:var(--lantern)}
button.pill{color:inherit;font-family:inherit;cursor:pointer;flex:none;white-space:nowrap}
.brand{min-width:0}.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.done{border-color:rgba(63,214,138,.6)}
.streak{font-size:15px;font-weight:800;margin:4px 0 2px}
.iconbtn{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:17px;font-weight:800;padding:0}

.tip{display:flex;flex-direction:column;gap:6px;min-height:52px;position:relative}
.coach.float{position:absolute;left:0;right:0;top:26px;z-index:5;background:#16283a;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tip h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;text-wrap:balance}
.tip p{margin:0;font-size:14.5px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.coach{display:flex;flex-direction:column;gap:8px;padding:11px 13px;border-radius:14px;background:rgba(255,210,122,.09);border:1.5px solid rgba(255,210,122,.35);animation:coachIn .35s ease}
.coach .step{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--lantern)}
.coach .say{font-size:15.5px;font-weight:800;line-height:1.35;color:#eef5fb}
.coach .row{display:flex;gap:8px;justify-content:flex-end}
.coach button{border-radius:11px;padding:7px 14px;font-weight:800;font-size:13.5px;border:1.5px solid rgba(255,255,255,.18);background:transparent}
.coach button.go{background:linear-gradient(180deg,var(--lantern),var(--lantern-deep));color:#2b1a00;border:0}
.showme{background:none;border:0;padding:0;color:var(--lantern);font-weight:800;font-size:13.5px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.glow-ink{box-shadow:0 0 0 2px var(--lantern),0 0 18px rgba(255,210,122,.5);border-radius:10px}
@keyframes coachIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mix{display:flex;flex-wrap:wrap;gap:6px}

.tun{width:12px;height:12px;border-radius:50%;display:inline-block;background:radial-gradient(#000308,#123650);border:2px solid #5fe0d0}

[hidden]{display:none!important}

.card h3{margin:0;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05}
.card p{margin:0;color:var(--ink-soft);font-weight:700;font-size:14.5px;line-height:1.4}
.stars{font-size:40px;letter-spacing:6px;color:var(--lantern);text-shadow:0 0 18px rgba(255,210,122,.5)}
.stars .off{color:rgba(255,255,255,.16);text-shadow:none}
.big{background:linear-gradient(180deg,var(--lantern),var(--lantern-deep));color:#2b1a00;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:17px;font-family:var(--display)}
.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;font-weight:800;font-size:14px}
.ask{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.ask b{font-size:14px}
.ask .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ask .row button{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 2px;font-weight:800;font-size:12.5px}
.ask .row button.on{background:var(--lantern);color:#2b1a00;border-color:var(--lantern)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);font-family:var(--display);font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px;max-width:100%}
.lv small{font-family:var(--body);font-size:10px;color:var(--lantern);letter-spacing:1px}
.lv[disabled]{opacity:.35;cursor:default}
.chap{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -4px;font-family:var(--display);font-size:15px;text-align:left}.chap span{font-size:12px;color:var(--lantern)}
.chnote{font-size:12px;opacity:.7;margin:-4px 2px 0;text-align:left}
.adbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 12px;border-radius:14px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 12px,rgba(255,255,255,.02) 12px 24px);border:1.5px dashed rgba(255,255,255,.2)}
.adbox small{opacity:.7;font-size:12px}.adcount{font-family:var(--display);font-size:30px;color:var(--lantern)}
.big:disabled{opacity:.45}
.lv.cur{border-color:var(--lantern)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-weight:800;font-size:14.5px}
.set small{display:block;color:var(--ink-soft);font-weight:700;font-size:12.5px}
.tog{width:52px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.18);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:#3fd68a}.tog.on::after{left:25px}
.answers{font-size:12.5px;color:var(--ink-soft);font-weight:700;text-align:left;line-height:1.5}
.toast{position:fixed;left:50%;top:9%;transform:translateX(-50%);background:rgba(8,20,34,.92);border:1.5px solid rgba(255,255,255,.16);padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.tog::after,.toast{transition:none}}

<script id="engine">
// ---------- Engine (no DOM). Rules live here so tests can run them headless. ----------
// Colors are sets of paint primaries: red=1, yellow=2, blue=4. Mixing is set union. All three = mud.
const MASK={R:1,Y:2,B:4};
const NEST={r:1,y:2,b:4,o:3,g:6,p:5};
const COLORS={0:"#cfe0ee",1:"#ff5d6c",2:"#ffd23f",4:"#4da3ff",3:"#ff9a3c",6:"#3fd68a",5:"#b678ff",7:"#9a7454"};
const NAMES={0:"see-through",1:"red",2:"yellow",4:"blue",3:"orange",6:"green",5:"purple",7:"mud"};

// Map legend: R Y B = critter dens, r y b o g p = nests (the color they want), # rock, = bridge (cross without mixing),
// T = tunnel mouth (paired in reading order: 1st+2nd, 3rd+4th), 1 2 4 = filter that takes red / yellow / blue out of a stream.
// homes = shape nests: "nest x,y":"den x,y" means that nest only takes that den's critters.
// sol = intended route from each den in reading order (U/D/L/R). Its total length is the 3-star par.
// These are the hand-made levels: teaching levels for each chapter, plus the later-chapter preview.
const HAND=[
 {name:"Lead the way",tip:"Drag from the critter den to the nest of the same color.",
  map:["R....",".##..",".#...",".#.#.","...#r"],sol:["RRRRDDDD"]},
 {name:"Two streams",tip:"Each color goes home. If streams cross, their colors mix, so keep these apart.",
  map:["R.B..",".#.#.",".#...",".###.","r...b"],sol:["DDDD","DDRRDD"]},
 {name:"Make purple",firstMix:true,tip:"Two purple nests, but only red and blue critters. What happens if their streams cross?",
  map:["..R..",".....","B...p",".....","..p.."],sol:["DDDD","RRRR"]},
 {name:"Odd one out",tip:"Make two purples, but keep the yellow stream clean. Streams cross straight over each other, never turning on a crossing.",mix:true,
  map:[".R...Y","......","B..p.#",".....#","......",".p...y"],sol:["DDDDD","DLDDDRD","RRR"]},
 {name:"Going green",tip:"Yellow and blue make green. Red just wants to go home.",mix:true,
  map:["..Y..R","......","B...g.","...#..","......","..g..r"],sol:["DDDDD","DDDDD","RRRR"]},
 {name:"Bridge",tip:"These two have to cross. Cross on the bridge and nothing mixes.",mix:true,
  map:["..B...","......","R.=..r","......","#...#.","..b..."],sol:["DDDDD","RRRRR"]},
 {name:"Orange crush",tangle:true,tip:"Make two oranges. Blue has to get past them, so find the bridge.",mix:true,
  map:["...Y..","R....o","......","......","B..=.b","...o.."],sol:["DDDDD","RRRRR","RRRRR"]},
 {name:"Uh oh, mud",tip:"Yellow and blue make green. All three colors together make mud, so keep red away from the green.",mix:true,mud:true,
  map:[".....",".....","r...B",".g...","..RgY"],sol:["LDD","LLUU","ULLL"]},
 {name:"Go around",tip:"Purple plus yellow is mud. Let yellow find a way around the purple.",mix:true,mud:true,
  map:["..#Y..","......","..B...","...y..",".....R",".p..p#"],sol:["DDD","DDDRR","LLLLD"]},
 {name:"Mud alert",tangle:true,tip:"Purple plus yellow makes mud. Nobody likes mud. Use the bridge.",mix:true,mud:true,
  map:[".R.Y..","......","B...=p","......","......",".p.y.."],sol:["DDDDD","DRDDDDL","RRRRR"]},
 {name:"Two pairs",tangle:true,tip:"One purple pair, one green pair. Watch which streams touch.",mix:true,mud:true,
  map:[".R...Y.",".......","...#...","B....=p",".......","..g...B",".p...g."],sol:["DDDDDD","DDDDDD","RRRRRR","LLLL"]},
 {name:"Rainbow knot",tangle:true,tip:"Six streams, three pairs: orange, green and purple. Bridges keep pairs apart.",mix:true,mud:true,
  map:[".Y...B.","R....=o","...Y...",".#g.B#.","...g...","p=....R",".o...p."],sol:["DDLDDRDD","DDRDDLDD","RRRRRR","DD","LL","LLLLLL"]},
 {name:"Who goes where",tip:"New! Each nest now shows whose home it is. Round critters go to the round home, square critters to the square home.",mix:true,
  map:["R...R",".....",".....",".....","r...r"],homes:{"0,4":"4,0","4,4":"0,0"},sol:["DDRRRRDD","LLDDDLLD"]},
 {name:"Purple homes",tip:"Two purple homes and a red home, each for one den. Check the shape in each nest. Bridges help.",mix:true,mud:true,
  map:["R.R..B","..=...","......","......","...=..","p..r.p"],homes:{"0,5":"5,0","5,5":"0,0","3,5":"2,0"},sol:["RDDDDRRRRD","DDDRDD","DLLLLLDDDD"]},
 {name:"Dive",tip:"New! The dam blocks the way, but a stream that dives into a pool comes up in the matching pool on the other side.",
  map:["R.#..","..#..",".T#T.","..#..","..#.r"],sol:["DDRDDR"]},
 {name:"Underground",tip:"New! A stream that dives into a pool comes up in the matching pool, on the other side of the dam.",mix:true,
  map:["R.#...",".T#T..","..#...","..#...",".T#T.r","B.#..b"],sol:["RDRDDDR","URDRR"]},
 {name:"Two dams",tip:"One dam has an underground channel under it, the other you go around. Make two purples.",mix:true,
  map:["R.#....","..#.#..",".T#T#..","..#.#..","..#B#..","..#...p","..#..p."],sol:["RDDUURRDDDDDD","DRRR"]},
 {name:"Sieve",tip:"New! A filter takes one color out of a stream. Orange through the yellow filter comes out red.",mix:true,
  map:[".R....","......","Y.....","......",".2....",".r..o."],sol:["DDDDD","RRRRDDD"]},
 {name:"Filters",tip:"New! A filter takes one color out of a stream. Purple through the red filter comes out blue.",mix:true,
  map:["..R...","......","B.....","......","..1...","..b..p"],sol:["DDDDD","RRRRRDDD"]},
];

function parseLevel(L){
  const h=L.map.length,w=L.map[0].length,cells=[],sources=[],nests=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=L.map[y][x],i=y*w+x;
    if(ch==="#")cells.push({t:"rock"});
    else if(ch==="=")cells.push({t:"bridge"});
    else if(ch==="T")cells.push({t:"tunnel"});
    else if(ch==="1"||ch==="2"||ch==="4")cells.push({t:"filter",f:+ch});
    else if(MASK[ch]){cells.push({t:"src",id:sources.length,mask:MASK[ch]});sources.push({x,y,i,mask:MASK[ch]});}
    else if(NEST[ch]){cells.push({t:"nest",id:nests.length,mask:NEST[ch]});nests.push({x,y,i,mask:NEST[ch]});}
    else cells.push({t:"empty"});
  }
  // pair tunnel mouths in reading order
  const partner={},tun=cells.map((c,i)=>c.t==="tunnel"?i:-1).filter(i=>i>=0);
  for(let k=0;k+1<tun.length;k+=2){partner[tun[k]]=tun[k+1];partner[tun[k+1]]=tun[k];}
  // shape nests: which den a nest belongs to
  Object.entries(L.homes||{}).forEach(([n,d])=>{const [nx,ny]=n.split(",").map(Number),[dx,dy]=d.split(",").map(Number);
    const nest=nests.find(q=>q.x===nx&&q.y===ny),den=sources.findIndex(q=>q.x===dx&&q.y===dy);nest.den=den;cells[nest.i].den=den;});
  const G={w,h,cells,sources,nests,partner,par:0};
  G.par=L.sol.reduce((a,s,k)=>a+solPath(G,k,s).length-1,0);
  return G;
}
function isJump(G,a,b){return G.partner&&G.partner[a]===b;}
function adj(G,a,b){const ax=a%G.w,ay=(a-ax)/G.w,bx=b%G.w,by=(b-bx)/G.w;return Math.abs(ax-bx)+Math.abs(ay-by)===1;}
function others(paths,cell,p){const r=[];paths.forEach((q,k)=>{if(k!==p&&q.indexOf(cell)>0)r.push(k);});return r;}
// Try to extend path p into cell n. Returns true if the path changed.
function tryStep(G,paths,p,n){
  const path=paths[p],last=path[path.length-1];
  if(n<0||n>=G.cells.length||!adj(G,last,n))return false;
  if(G.cells[last].t==="tunnel"&&path.length>1&&!isJump(G,path[path.length-2],last))return false; // in a tunnel: you come out the other end
  if(path.length>1&&path[path.length-2]===n){path.pop();return true;}   // back up
  const k=path.indexOf(n); if(k>=0){path.length=k+1;return true;}      // pull back to an earlier cell
  if(G.cells[last].t==="nest")return false;                            // already home
  if(path.length>=2&&others(paths,last,p).length){                     // sitting on a crossing: go straight
    if(n-last!==last-path[path.length-2])return false;
  }
  if(path.length>=2&&G.cells[last].t==="bridge"&&n-last!==last-path[path.length-2])return false; // bridges run straight: no turning on one
  const c=G.cells[n];
  if(c.t==="rock"||c.t==="src")return false;
  const o=others(paths,n,p);
  if(c.t==="nest"){if(o.length)return false;path.push(n);return true;}
  if(c.t==="tunnel"){if(o.length||others(paths,G.partner[n],p).length||path.indexOf(G.partner[n])>=0)return false;path.push(n,G.partner[n]);return true;} // pop out the far end
  if(c.t==="filter"){if(o.length)return false;path.push(n);return true;}
  if(!o.length){path.push(n);return true;}
  if(o.length>1)return false;
  const q=paths[o[0]],j=q.indexOf(n);
  if(j<=0)return false;                                                // can't cross a den
  const tipThere=j===q.length-1,qd=tipThere?q[j]-q[j-1]:q[j+1]-q[j];  // an unfinished stream's tip can be crossed too;
  if(!tipThere&&qd!==q[j]-q[j-1])return false;                         // ...otherwise it must run straight through
  if(Math.abs(n-last)===Math.abs(qd))return false;                     // ...at a right angle
  path.push(n);return true;
}
// Trim a path whose tip was left sitting on a crossing.
function settle(paths,p,G){const path=paths[p];
  for(;;){const t=path[path.length-1];
    if(path.length>1&&others(paths,t,p).length){path.pop();continue;}
    if(G&&path.length>1&&G.cells[t].t==="tunnel"&&!isJump(G,path[path.length-2],t)){path.pop();continue;} // never stop inside a tunnel mouth
    break;}}
// Color of each path at each cell. A crossing (not on a bridge) gives both streams the union of their incoming colors.
function computeColors(G,paths){
  const col=paths.map(p=>p.map(()=>G.cells[p[0]].mask));
  for(let it=0;it<12;it++){
    let changed=false;
    paths.forEach((path,p)=>{
      let c=col[p][0];
      for(let i=1;i<path.length;i++){
        const cell=path[i];
        if(G.cells[cell].t!=="bridge"){
          paths.forEach((q,k)=>{if(k===p)return;const j=q.indexOf(cell);if(j>0)c|=col[k][j-1];});
        }
        if(G.cells[cell].t==="filter")c&=~G.cells[cell].f;
        if(col[p][i]!==c){col[p][i]=c;changed=true;}
      }
    });
    if(!changed)break;
  }
  return col;
}
function nestStatus(G,paths,col){
  return G.nests.map(n=>{
    const p=paths.findIndex(path=>path.length>1&&path[path.length-1]===n.i);
    if(p<0)return {p:-1,ok:false,color:0};
    const color=col[p][col[p].length-1];
    const denOk=n.den==null||n.den===p;
    return {p,ok:color===n.mask&&denOk,color,denOk};
  });
}
function isWin(G,paths,col){return nestStatus(G,paths,col).every(s=>s.ok);}
function inkOf(paths){return paths.reduce((a,p)=>a+p.length-1,0);}
function starsFor(ink,par){return ink<=par?3:ink<=par+4?2:1;}
function solPath(G,s,dirs){const d={U:-G.w,D:G.w,L:-1,R:1};const out=[G.sources[s].i];
  for(const ch of dirs){const n=out[out.length-1]+d[ch];out.push(n);if(G.cells[n].t==="tunnel")out.push(G.partner[n]);}
  return out;}

// Every level has a stable id, and saves are keyed by it, never by position: adding or reordering chapters must
// never scramble a player's stars. Hand-made levels: "h-" + their name. Generated: chapter + slot ("c3-07"), or the
// id stored with the level when a chapter was extended (old levels keep theirs, new ones take the next numbers).
// Once a level has shipped, its id and board never change.
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function buildLevels(){
  const out=[];
  CHAPTERS.forEach(C=>{
    C.teach.forEach(n=>{const H=HAND.find(h=>h.name===n);out.push(Object.assign({},H,{ch:C.id,id:H.id||"h-"+slug(n)}));});

  });
  return out;
}

<script>
// ---------- Game ----------
const $=id=>document.getElementById(id);
const cv=$("board"),ctx=cv.getContext("2d");

// Progress format 3: everything per level is keyed by the level's stable id (see buildLevels).
// Older saves were keyed by list position; carry them over once by mapping position -> id.
const ID=i=>LEVELS[i].id,IDX=id=>LEVELS.findIndex(L=>L.id===id);
let prog=(()=>{
  const blank={v:3,all:false,stars:{},answers:{},trace:{},seen:{},plays:{},highest:0,total:0,noAds:false,sinceAd:0,lastAd:0,hintDay:"",hintsLeft:0,bonusHints:0};
  const saved=store.get("prog3",null);if(saved)return Object.assign(blank,saved);
  const old=store.get("prog2",null);if(!old)return blank;
  const byId=o=>Object.fromEntries(Object.entries(o||{}).filter(([k])=>LEVELS[+k]).map(([k,v])=>[ID(+k),v]));
  const p=Object.assign(blank,{stars:byId(old.stars),answers:byId(old.answers),trace:byId(old.trace),plays:byId(old.plays),seen:old.seen||{},all:(old.unlocked||1)>=LEVELS.length});
  p.total=Object.values(p.stars).reduce((a,b)=>a+b,0);return p;
})();
function saveProg(){store.set("prog3",prog);if(window.CR_CLOUD)window.CR_CLOUD.changed(prog);}
// Hook for the shared studio cloud save (native wrapper: Firebase sign-in with Apple/Google). It calls

}

function win(){
  won=true;wonAt=performance.now();hints=[];updateHintBtn();sfx.win();buzz([20,30,20,30,40]);
  const ink=inkOf(paths),s=starsFor(ink,G.par);
  if(daily){const at=daily;recordDaily(daily.day,s);setTimeout(()=>{if(daily===at&&won)showDailyWin(s,ink);},1300);return;}
  const id=ID(lv),fresh=!!LEVELS[lv].tangle&&!prog.trace[id];
  if(fresh)prog.trace[id]={retraces,hints:hintsUsed,pass:retraces===0&&hintsUsed===0};
  prog.stars[id]=Math.max(prog.stars[id]||0,s);prog.total=Object.values(prog.stars).reduce((a,b)=>a+b,0); // total + highest: what leaderboards will rank on
  if(lv+1>(prog.highest||0)){prog.highest=lv+1;prog.highestId=id;}
  prog.sinceAd=(prog.sinceAd||0)+1;

  const at=lv;setTimeout(()=>{if(lv===at&&won)showWin(s,ink,fresh);},1300);

// ---------- Daily River ----------
// One puzzle a day from the DAILY bank, the same for everyone on the same date. Slot = weekday (Monday gentle,
// Sunday hardest), cycling through the bank's weeks. Opens once a player reaches level DAILY_AT (they know mixing).
// Streaks: play on consecutive days; one missed day is forgiven by a grace day, which refills every 7-day run.
// prog.daily[day]=stars, prog.streak={n,best,last,grace}; total stars and highest level stay chapter-only.
const DAILY_AT=30,DAILY_EPOCH=Date.UTC(2026,0,5); // a Monday
const dayNum=(d=new Date())=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-DAILY_EPOCH)/864e5);

function dailyFor(n){const weeks=Math.max(1,Math.floor(DAILY.length/7)),wk=Math.floor(n/7),wd=((n%7)+7)%7;
  const L=DAILY[(((wk%weeks)+weeks)%weeks)*7+wd];
  return Object.assign({},L,{id:"daily-"+n,bank:L.id,name:"Daily River",day:n,tip:["Monday's river: a gentle start to the week.","Tuesday: make two mixes.","Wednesday: bridges today.","Thursday: four rivers.","Friday: watch out for mud.","Saturday: a big river with bridges.","Sunday: the week's toughest river."][wd]});}
const dailyOpen=()=>DAILY.length>0&&(prog.all||(prog.highest||0)>=DAILY_AT);

function recordDaily(n,s){
  prog.daily=prog.daily||{};const first=!prog.daily[n];prog.daily[n]=Math.max(prog.daily[n]||0,s);
  const st=prog.streak=prog.streak||{n:0,best:0,last:-9,grace:1};
  if(first&&n>st.last){const gap=n-st.last;
    if(gap===1)st.n++;else if(gap===2&&st.grace>0){st.n++;st.grace--;}else st.n=1;
    st.last=n;if(st.n%7===0)st.grace=1;st.best=Math.max(st.best,st.n);}

// ---------- Lessons ----------

  "Make purple":[

  "Odd one out":[

function gateNote(c,nextCh){return `<p>🔒 <b>${nextCh?nextCh.title:"The next chapter"}</b> opens at ★ ${chGoal(c)} in this chapter. You have ★ ${chStars(c)}. Replay levels for more stars, or use a hint to find the perfect route.</p>`;}
let taps=0,tapT=0;
$("brand").addEventListener("click",()=>{const n=performance.now();taps=n-tapT<3000?taps+1:1;tapT=n;if(taps>=5){testerUnlock();taps=0;}});
// tester builds: 5 taps on the title (up to 3 s apart, so automated clicks count) or a ?unlock=1 / #unlock=1 link

try{if(/[?&#]unlock=1\b/.test(location.search+location.hash))testerUnlock();}catch(e){}

function toast(t,ms=1900){const el=$("toast");clearTimeout(toastTimer);el.textContent=t;el.classList.add("show");
  toastTimer=setTimeout(()=>{el.classList.remove("show");toastTimer=setTimeout(()=>{el.textContent="";},300);},ms);}
function clearToast(){clearTimeout(toastTimer);const el=$("toast");el.classList.remove("show");el.textContent="";}
function laterToast(t){const at=lv;setTimeout(()=>{if(lv===at&&!lesson)showNote(t);},400);} // a lesson says it better
// First-time explanations stay up in the coach panel until "Got it" (Muse: a 2 s toast is easy to miss). After that
// first time, the same message is a quick toast.
function teachOnce(key,t){if(!lesson&&!prog.seen["note:"+key]){prog.seen["note:"+key]=1;saveProg();showNote(t);}else toast(t);}
let pendingNote=null; // held until the finger lifts, so a note never pops up over a drag
function showNote(t){if(active>=0){pendingNote=t;return;}if(lesson&&!lesson.note)return toast(t);lesson={steps:[{say:t}],i:0,t0:performance.now(),note:true};clearToast();renderCoach();}

// ---------- drawing ----------
const C=(i)=>{const x=i%G.w,y=(i-x)/G.w;return [(x+.5)*cs,(y+.5)*cs];};
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawShapeAlways(x,y,r,shape){const o=opts.shapes;opts.shapes=true;drawShape(x,y,r,shape);opts.shapes=o;}
function drawShape(x,y,r,shape){
  ctx.beginPath();
  if(shape==="round"||!(opts.shapes||LV().homes)){ctx.arc(x,y,r,0,Math.PI*2);}
  else if(shape==="square"){rrect(x-r*.92,y-r*.92,r*1.84,r*1.84,r*.45);}
  else if(shape==="drop"){ctx.moveTo(x,y-r*1.25);ctx.bezierCurveTo(x+r*1.1,y-r*.2,x+r*1.05,y+r,x,y+r);ctx.bezierCurveTo(x-r*1.05,y+r,x-r*1.1,y-r*.2,x,y-r*1.25);}
  else if(shape==="star"){for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.6:r*1.2;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
  else if(shape==="diamond"){ctx.moveTo(x,y-r*1.2);ctx.lineTo(x+r*1.05,y);ctx.lineTo(x,y+r*1.2);ctx.lineTo(x-r*1.05,y);ctx.closePath();}
  else if(shape==="hex"){for(let k=0;k<6;k++){const a=k*Math.PI/3;ctx.lineTo(x+Math.cos(a)*r*1.05,y+Math.sin(a)*r*1.05);}ctx.closePath();}
}
function critter(x,y,r,shape,mask,glow,blink,phase){
  const color=COLORS[mask];
  ctx.save();
  if(phase!=null){const w=Math.sin(phase);ctx.translate(x,y);ctx.rotate(w*.16);ctx.scale(1+.07*Math.abs(w),1-.07*Math.abs(w));ctx.translate(-x,-y);} // waddle
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=glow;ctx.fillStyle=color;drawShape(x,y,r,shape);ctx.fill();ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.arc(x-r*.35,y-r*.4,r*.28,0,Math.PI*2);ctx.fill();
  // face
  const ey=y-r*.08,ex=r*.36,er=Math.max(1.2,r*.24);
  if(mask===7){ctx.strokeStyle="#2a1a10";ctx.lineWidth=Math.max(1,r*.16);ctx.beginPath();ctx.moveTo(x-ex-er,ey);ctx.lineTo(x-ex+er,ey);ctx.moveTo(x+ex-er,ey);ctx.lineTo(x+ex+er,ey);ctx.moveTo(x-r*.3,y+r*.45);ctx.quadraticCurveTo(x,y+r*.25,x+r*.3,y+r*.45);ctx.stroke();ctx.restore();return;}
  ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(x-ex,ey,er,blink?er*.25:er,0,0,Math.PI*2);ctx.ellipse(x+ex,ey,er,blink?er*.25:er,0,0,Math.PI*2);ctx.fill();
  if(!blink){ctx.fillStyle="#13202e";ctx.beginPath();ctx.arc(x-ex,ey+er*.15,er*.55,0,Math.PI*2);ctx.arc(x+ex,ey+er*.15,er*.55,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

// A little wooden footbridge running up/down the cell, with rails, posts and a shadow on the water.
function drawBridge(i,now){
  const x=(i%G.w)*cs,y=Math.floor(i/G.w)*cs,w=cs*.5,l=x+(cs-w)/2;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.35)";rrect(l+cs*.04,y+cs*.06,w,cs*.9,cs*.08);ctx.fill();
  const g=ctx.createLinearGradient(l,0,l+w,0);g.addColorStop(0,"#8a6038");g.addColorStop(.5,"#b9864f");g.addColorStop(1,"#8a6038");
  ctx.fillStyle=g;rrect(l,y+cs*.02,w,cs*.96,cs*.08);ctx.fill();
  ctx.strokeStyle="rgba(60,36,18,.7)";ctx.lineWidth=Math.max(1,cs*.022);
  for(let k=1;k<7;k++){const yy=y+cs*.02+k*cs*.96/7;ctx.beginPath();ctx.moveTo(l+2,yy);ctx.lineTo(l+w-2,yy);ctx.stroke();}
  ctx.strokeStyle="#e2b77c";ctx.lineWidth=Math.max(1.5,cs*.045);ctx.lineCap="round";ctx.fillStyle="#f0cf9a";
  [l+cs*.03,l+w-cs*.03].forEach(rx=>{ctx.beginPath();ctx.moveTo(rx,y+cs*.06);ctx.lineTo(rx,y+cs*.94);ctx.stroke();
    [.08,.5,.92].forEach(f=>{ctx.beginPath();ctx.arc(rx,y+cs*f,cs*.045,0,Math.PI*2);ctx.fill();});});
  if(bridgeIntro&&now-bridgeIntro<4000){const a=(now-bridgeIntro)/4000,pl=.5+.5*Math.sin(now/180);
    ctx.strokeStyle=`rgba(255,240,200,${(1-a)*(.5+.5*pl)})`;ctx.lineWidth=cs*.06;ctx.beginPath();ctx.arc(x+cs/2,y+cs/2,cs*(.55+.08*pl),0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}
// ---------- rocks, mountains and caves ----------
// A lone rock is a boulder in the stream. Rocks that touch join into one mountain ridge; tall peaks get snow.
// Terrain is the backdrop, so it's kept slate-blue and quiet; the streams are the stars.
const isRock=(x,y)=>x>=0&&y>=0&&x<G.w&&y<G.h&&G.cells[y*G.w+x].t==="rock";
function rockGroups(){
  const comp=G.cells.map(()=>-1),size=[];
  G.cells.forEach((c,i)=>{if(c.t!=="rock"||comp[i]>=0)return;const id=size.length,st=[i];let n=0;comp[i]=id;
    while(st.length){const j=st.pop(),x=j%G.w,y=(j-x)/G.w;n++;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const k=j+dx+dy*G.w;if(isRock(x+dx,y+dy)&&comp[k]<0){comp[k]=id;st.push(k);}});}
    size.push(n);});
  return {comp,size};
}
// Underground channel pairs, numbered in reading order of their first pool; both pools share a rim color and a glyph.
// The glyphs are deliberately not critter shapes, so a pool never reads as a shape home.
const TUN_COLORS=["#5fe0d0","#ff9ad5","#c8f06a"],TUN_GLYPHS=["tri","moon","plus"];
function tunnelPair(i){const firsts=Object.keys(G.partner).map(Number).filter(k=>k<G.partner[k]).sort((a,b)=>a-b);return firsts.indexOf(Math.min(i,G.partner[i]));}
function poolInfo(i){const x=i%G.w,y=(i-x)/G.w;return {x,y,cx:(x+.5)*cs,cy:(y+.5)*cs,pair:tunnelPair(i)};}
function glyph(b,kind,x,y,r){
  b.beginPath();
  if(kind==="tri"){b.moveTo(x,y-r);b.lineTo(x+r*.95,y+r*.7);b.lineTo(x-r*.95,y+r*.7);b.closePath();b.fill();}
  else if(kind==="moon"){b.arc(x,y,r,Math.PI*.3,Math.PI*1.7);b.arc(x+r*.5,y,r*.78,Math.PI*1.6,Math.PI*.4,true);b.closePath();b.fill();}
  else{const t=r*.38;b.rect(x-t,y-r,2*t,2*r);b.rect(x-r,y-t,2*r,2*t);b.fill();}
}
// An underground channel: a calm, deep pool where the stream sinks into the ground, with a ring of wet stones,
// a rim in the pair's color and the pair's glyph on the bank above it.
function drawPool(b,i,rnd){
  const {cx,cy,pair}=poolInfo(i),mc=TUN_COLORS[pair%3],R=cs*.33,edge=blobPts(cx,cy,R,.14,rnd,12);
  b.save();
  for(let k=0;k<10;k++){const a=rnd()*Math.PI*2,d=R+cs*(.05+rnd()*.05);b.fillStyle=`rgba(190,225,245,${.04+rnd()*.06})`;b.beginPath();b.ellipse(cx+Math.cos(a)*d,cy+Math.sin(a)*d,cs*(.06+rnd()*.05),cs*(.03+rnd()*.03),a+1.5,0,Math.PI*2);b.fill();} // ripples at the edge
  b.fillStyle="#3e4c55";smoothPath(b,blobPts(cx,cy,R+cs*.07,.16,rnd,13));b.fill();                // muddy bank
  for(let k=0;k<13;k++){const a=k/13*Math.PI*2+rnd()*.35,r=cs*(.025+rnd()*.03),d=R+cs*(.02+rnd()*.03);  // wet stones, all different
    b.fillStyle=["#6c7a86","#58656f","#7d8a95","#4f5b64"][Math.floor(rnd()*4)];smoothPath(b,blobPts(cx+Math.cos(a)*d,cy+Math.sin(a)*d,r,.4,rnd,6,.8));b.fill();}
  const g=b.createRadialGradient(cx,cy+cs*.03,cs*.02,cx,cy,R);g.addColorStop(0,"#000308");g.addColorStop(.65,"#04121f");g.addColorStop(1,"#123650");
  b.fillStyle=g;smoothPath(b,edge);b.fill();                                                        // the deep water
  b.strokeStyle=hexA(mc,.85);b.lineWidth=Math.max(1.5,cs*.028);smoothPath(b,edge);b.stroke();          // pair rim, following the water's edge
  b.strokeStyle="rgba(200,235,255,.16)";b.lineWidth=cs*.014;b.beginPath();b.arc(cx,cy,R*.78,Math.PI*1.1,Math.PI*1.55);b.stroke(); // sheen
  // the pair's glyph sits big in the middle of the dark water, glowing in the rim color (Muse, v0.22: the small mark
  // on the bank was still easy to miss); about half the pool across
  b.globalAlpha=.9;b.fillStyle=mc;b.shadowColor=mc;b.shadowBlur=cs*.2*dpr;glyph(b,TUN_GLYPHS[pair%3],cx,cy+cs*.01,R*.52);b.globalAlpha=1;
  b.restore();
}
// An irregular, organic outline (no clean circles): radius wobbles round the shape.
function blobPts(cx,cy,r,jit,rnd,n=14,sy=1){const pts=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2,rr=r*(1-jit/2+rnd()*jit);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*sy]);}return pts;}
function smoothPath(b,pts){b.beginPath();const m=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2],n=pts.length;let s0=m(pts[n-1],pts[0]);b.moveTo(...s0);
  for(let k=0;k<n;k++){const q=m(pts[k],pts[(k+1)%n]);b.quadraticCurveTo(pts[k][0],pts[k][1],q[0],q[1]);}b.closePath();}
// A beaver dam: a messy heap of sticks, mud and a few logs piled along a straight run of blocked cells,
// with sticks poking out at all angles and water foaming unevenly against it. No clean outline anywhere.
function drawDam(b,cells,rnd){
  const pts=cells.map(i=>[(i%G.w+.5)*cs,(Math.floor(i/G.w)+.5)*cs]).sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
  const [x0,y0]=pts[0],[x1,y1]=pts[pts.length-1],hor=y0===y1,ux=hor?1:0,uy=hor?0:1,len=Math.hypot(x1-x0,y1-y0);
  const at=(f,o)=>[x0+ux*f+uy*o,y0+uy*f+ux*o],th=cs*.5;
  // ragged outline of the heap: wobbling width down each side, blunt uneven ends
  const side=[],steps=Math.max(6,Math.round((len+cs)/(cs*.16)));
  for(let k=0;k<=steps;k++){const f=-cs*.42+(len+cs*.84)*k/steps,end=Math.min(1,Math.min(k,steps-k)/2.2);side.push([f,th/2*(.55+.45*end)*(.8+rnd()*.45)]);}
  const outline=[...side.map(([f,o])=>at(f,o)),...side.slice().reverse().map(([f,o])=>at(f,-o*(.85+rnd()*.3)))];
  for(let k=0;k<steps*3;k++){const f=-cs*.45+rnd()*(len+cs*.9),o=(rnd()<.5?-1:1)*th*(.45+rnd()*.25),[fx,fy]=at(f,o); // uneven foam
    b.fillStyle=`rgba(190,225,245,${.05+rnd()*.08})`;b.beginPath();b.ellipse(fx,fy,cs*(.05+rnd()*.07),cs*(.03+rnd()*.04),rnd()*3,0,Math.PI*2);b.fill();}
  b.fillStyle="#3d2e24";smoothPath(b,outline);b.fill();                                              // packed mud
  b.fillStyle="rgba(90,70,52,.5)";for(let k=0;k<cells.length*8;k++){const [mx,my]=at(rnd()*len+(rnd()-.5)*cs*.6,(rnd()-.5)*th*.6);b.beginPath();b.ellipse(mx,my,cs*(.04+rnd()*.06),cs*(.03+rnd()*.04),rnd()*3,0,Math.PI*2);b.fill();}
  b.lineCap="round";const sticks=["#5a4635","#6a5340","#7d634b","#8c7155","#9c8262"];
  const stick=(dark)=>{const f=rnd()*(len+cs*.7)-cs*.35,o=(rnd()-.5)*th*.8,a=rnd()*Math.PI,l=cs*(.16+rnd()*.3)*(rnd()<.15?1.6:1),[mx,my]=at(f,o);
    const ex=Math.cos(a)*l/2,ey=Math.sin(a)*l/2,bend=(rnd()-.5)*cs*.06;
    b.strokeStyle=sticks[Math.floor(rnd()*(dark?2:5))];b.lineWidth=cs*(.022+rnd()*.03);
    b.beginPath();b.moveTo(mx-ex,my-ey);b.quadraticCurveTo(mx-ey/l*bend*8,my+ex/l*bend*8,mx+ex,my+ey);b.stroke();
    if(rnd()<.3){const t=.3+rnd()*.4,tx=mx-ex+2*ex*t,ty=my-ey+2*ey*t,ta=a+(rnd()<.5?.7:-.7);b.lineWidth*=.6;b.beginPath();b.moveTo(tx,ty);b.lineTo(tx+Math.cos(ta)*l*.25,ty+Math.sin(ta)*l*.25);b.stroke();}}; // twig
  for(let k=0;k<cells.length*14;k++)stick(true);
  for(let k=0;k<cells.length;k++){const f=(k+.15+rnd()*.7)/cells.length*len,o=(rnd()-.5)*th*.35,ll=cs*(.45+rnd()*.3),a=(hor?0:Math.PI/2)+(rnd()-.5)*.6; // logs, not lined up
    const [mx,my]=at(f,o),ax=mx-Math.cos(a)*ll/2,ay=my-Math.sin(a)*ll/2,bx=mx+Math.cos(a)*ll/2,by=my+Math.sin(a)*ll/2;
    b.strokeStyle="#5f4a37";b.lineWidth=cs*(.1+rnd()*.04);b.beginPath();b.moveTo(ax,ay);b.lineTo(bx,by);b.stroke();
    b.strokeStyle="rgba(150,120,90,.55)";b.lineWidth=cs*.03;b.beginPath();b.moveTo(ax-Math.sin(a)*cs*.02,ay-Math.cos(a)*cs*.02*0+(-cs*.02));b.lineTo(bx,by-cs*.02);b.stroke();
    if(rnd()<.6){b.fillStyle="#c2a27a";b.beginPath();b.ellipse(bx,by,cs*.05,cs*.045,a,0,Math.PI*2);b.fill();
      b.strokeStyle="#94704a";b.lineWidth=cs*.01;b.beginPath();b.arc(bx,by,cs*.025,0,Math.PI*2);b.stroke();}}
  for(let k=0;k<cells.length*12;k++)stick(false);
  for(let k=0;k<cells.length*2;k++){const [mx,my]=at(rnd()*len,(rnd()-.5)*th*.9);b.fillStyle=rnd()<.5?"rgba(110,150,80,.7)":"rgba(150,130,60,.7)"; // a few leaves caught in it
    b.beginPath();b.ellipse(mx,my,cs*.035,cs*.018,rnd()*3,0,Math.PI*2);b.fill();}
}
// A cluster of rounded boulders in the stream: 1-3 rocks per blocked cell.
function drawBoulders(b,cells,rnd){
  const rocks=[];
  cells.forEach(i=>{const cx=(i%G.w+.5)*cs,cy=(Math.floor(i/G.w)+.5)*cs,n=1+Math.floor(rnd()*2.4);
    for(let k=0;k<n;k++){const r=cs*(n===1?.3:k?.17+rnd()*.06:.24+rnd()*.05),a=rnd()*Math.PI*2,d=n===1?0:cs*(.08+rnd()*.1);
      rocks.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,r});}});
  rocks.forEach(q=>{for(let k=0;k<5;k++){const a=rnd()*Math.PI*2,d=q.r*(.75+rnd()*.3);b.fillStyle=`rgba(190,225,245,${.05+rnd()*.07})`;b.beginPath();b.ellipse(q.x+Math.cos(a)*d,q.y+Math.sin(a)*d,cs*(.05+rnd()*.05),cs*(.03+rnd()*.03),a+1.5,0,Math.PI*2);b.fill();}}); // uneven foam
  rocks.sort((p,q)=>p.y-q.y).forEach(q=>{
    const g=b.createRadialGradient(q.x-q.r*.35,q.y-q.r*.4,q.r*.1,q.x,q.y,q.r);g.addColorStop(0,"#a7b3bd");g.addColorStop(.7,"#6c7984");g.addColorStop(1,"#4a5560");
    b.fillStyle=g;smoothPath(b,blobPts(q.x,q.y,q.r,.28,rnd,9,.85));b.fill();
    b.fillStyle="rgba(255,255,255,.14)";smoothPath(b,blobPts(q.x-q.r*.3,q.y-q.r*.35,q.r*.3,.4,rnd,7,.6));b.fill();
    if(rnd()<.35){b.fillStyle="rgba(110,170,110,.45)";b.beginPath();b.ellipse(q.x+q.r*.2,q.y-q.r*.5,q.r*.3,q.r*.12,.3,0,Math.PI*2);b.fill();}});
}
// All blockers and pools are painted on their own layer, then dropped onto the riverbed once with one soft shadow.
// Blocked cells that touch form one blocker: a straight run becomes a beaver dam, anything else a boulder cluster.
function drawTerrain(b,rnd,W,H){
  const {comp,size}=rockGroups();
  const L=document.createElement("canvas");L.width=Math.ceil(W*dpr);L.height=Math.ceil(H*dpr);const t=L.getContext("2d");t.scale(dpr,dpr);
  size.forEach((n,id)=>{const cells=G.cells.map((c,i)=>i).filter(i=>comp[i]===id),xs=new Set(cells.map(i=>i%G.w)),ys=new Set(cells.map(i=>Math.floor(i/G.w)));
    if(n>=2&&(xs.size===1||ys.size===1))drawDam(t,cells,rnd);else drawBoulders(t,cells,rnd);});
  G.cells.forEach((c,i)=>{if(c.t==="tunnel")drawPool(t,i,rnd);});
  b.save();b.shadowColor="rgba(2,8,16,.55)";b.shadowBlur=cs*.18*dpr;b.shadowOffsetX=cs*.05*dpr;b.shadowOffsetY=cs*.08*dpr;
  b.drawImage(L,0,0,W,H);b.restore();
}
// Sandy riverbed with pebbles and weed, drawn once per board size.
function makeBed(W,H){
  const c=document.createElement("canvas");c.width=Math.ceil(W*dpr);c.height=Math.ceil(H*dpr);const b=c.getContext("2d");b.scale(dpr,dpr);
  let seed=(daily?5000+daily.day:lv)*977+13;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

function loop(now){if(G)draw(now);requestAnimationFrame(loop);}

// keep the board across live updates
window.claude?.hot?.snapshot?.(()=>({lv,paths,daily:!!daily}));
function boot(data){
  const cur=store.get("cur",null),ci=typeof cur==="string"?IDX(cur):Number.isInteger(cur)?cur:-1; // older saves stored the position
  const start=data&&Number.isInteger(data.lv)?data.lv:Math.min(ci>=0?ci:0,openCount()-1);
  if(data&&data.daily&&dailyOpen()){daily=dailyFor(dayNum());startLevel("daily",data.paths);}else startLevel(Math.max(0,start),data&&data.paths);
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body>
