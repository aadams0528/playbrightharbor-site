<style>
/* Layout: one continuous screen. Stats bar, the living garden scene, a slim garden bar, then the puzzle panel that refills itself after every solve. */
:root {
  color-scheme: light;
  --page: #EAF4E6;
  --page-2: #F6FAF2;
  --ink: #1D3A2A;
  --ink-soft: #557060;
  --card: #FFFFFF;
  --line: #D5E5CC;
  --marigold: #F6A92E;
  --marigold-2: #FFC860;
  --marigold-ink: #3E2402;
  --leaf: #3E8E3A;
  --leaf-2: #63B451;
  --berry: #D63D63;
  --wood: #E9C98A;
  --wood-2: #C9984F;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, #DDF0F7 0%, var(--page) 55%, var(--page-2) 100%);
  color: var(--ink); font-family: var(--body); font-size: 16px;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 10px; }

/* Stats */
.top { display: flex; align-items: center; gap: 8px; }
.stat {
  display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.9);
  border-radius: 999px; padding: 3px 12px 3px 4px; font-weight: 700; font-size: 17px;
  font-variant-numeric: tabular-nums; box-shadow: 0 1px 0 rgba(29,58,42,.08), inset 0 0 0 1.5px var(--line);
}
.stat svg { width: 26px; height: 26px; display: block; }
.stat.bump, .pill.bump { animation: bump .35s ease; }
button.stat { border: 0; color: inherit; }
.stat .pref { display: flex; align-items: center; margin-left: -2px; }
.stat .pref svg { width: 20px; height: 20px; }
.stat .caret { width: 12px !important; height: 12px !important; opacity: .55; margin-left: -2px; }
@keyframes bump { 50% { transform: scale(1.15); } }
.lvl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 0 2px; border: 0; background: none; text-align: left; }
.stages { display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin: 6px 0 4px; }
.stages div { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.stages svg { width: 58px; height: 84px; display: block; margin: 0 auto; }
.stages i { font-style: normal; font-size: 20px; color: var(--ink-soft); padding-bottom: 30px; }
.howto p { margin: 8px 0; line-height: 1.4; }
.lvl b { font-family: var(--display); font-size: 15px; line-height: 1; }
.bar { height: 9px; border-radius: 99px; background: rgba(255,255,255,.9); box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--leaf-2), var(--leaf)); transition: width .8s ease; }
.lvl small { color: var(--ink-soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); box-shadow: inset 0 0 0 1.5px var(--line); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* Garden scene */
.scene-wrap { position: relative; border-radius: 26px; overflow: hidden; box-shadow: 0 10px 24px -14px rgba(29,58,42,.55), 0 0 0 3px rgba(255,255,255,.85); }
#scene { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; touch-action: manipulation; }
#scene .plot { cursor: pointer; }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite; }
.growing { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .8s cubic-bezier(.25,1.7,.5,1); }
.picked { transform-box: fill-box; transform-origin: 50% 100%; animation: pickup .45s ease-in forwards; }
@keyframes sway { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
@keyframes grow { 0% { transform: scale(.55, .45); } 100% { transform: scale(1); } }
@keyframes pickup { to { transform: translateY(-30px) scale(.3); opacity: 0; } }
.cloud { animation: drift linear infinite; }
@keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(460px); } }
.rays { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mote { animation: mote 7s ease-in-out infinite; }
@keyframes mote { 0%, 100% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(8px, -14px); opacity: .9; } }
.bfly { animation: fly 16s ease-in-out infinite; }
.bfly .wing { transform-box: fill-box; transform-origin: 100% 50%; animation: flap .25s ease-in-out infinite alternate; }
.bfly .wing.r { transform-origin: 0% 50%; }
@keyframes flap { to { transform: scaleX(.35); } }
@keyframes fly {
  0% { transform: translate(40px, 150px); } 20% { transform: translate(150px, 110px); } 40% { transform: translate(300px, 160px); }
  60% { transform: translate(250px, 230px); } 80% { transform: translate(90px, 210px); } 100% { transform: translate(40px, 150px); }
}
#scene .decor { cursor: grab; touch-action: none; }
#scene .decor.drag { cursor: grabbing; }
#scene .decor.drag > g { filter: drop-shadow(0 8px 5px rgba(20,40,28,.35)); }
.swim { transform-box: fill-box; transform-origin: 50% 50%; animation: swim 5s ease-in-out infinite alternate; }
.swim.b { animation-duration: 6.5s; animation-delay: -2s; }
@keyframes swim { to { transform: translate(9px, 3px) rotate(10deg); } }
.gname {
  position: absolute; left: 10px; top: 10px; border: 0; border-radius: 999px; padding: 4px 12px 4px 6px;
  background: rgba(255,255,255,.9); box-shadow: 0 3px 10px -5px rgba(29,58,42,.6); display: flex; align-items: center; gap: 6px;
  font-weight: 700; font-size: 13px; max-width: calc(100% - 20px);
}
.banner.show ~ .gname { opacity: 0; pointer-events: none; }
.gname { transition: opacity .3s; }
.gname svg { width: 20px; height: 20px; flex: none; }
.gname em { font-style: normal; color: var(--ink-soft); font-weight: 400; white-space: nowrap; }
.gname.done em { color: var(--leaf); font-weight: 700; }
.pill { position: relative; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; border-radius: 99px; padding: 0 5px; background: var(--berry); color: #fff; font-size: 11.5px; display: grid; place-items: center; }
.pill.hasready { animation: btnpulse 1.6s ease-in-out infinite; box-shadow: inset 0 0 0 2px var(--marigold), 0 2px 0 var(--marigold); }
.order { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 18px; box-shadow: inset 0 0 0 2px var(--line); margin-bottom: 10px; }
.order.ready { box-shadow: inset 0 0 0 2.5px var(--marigold); background: #FFFBF0; }
.order .who svg { width: 54px; height: 54px; display: block; }
.order .od { flex: 1; min-width: 0; }
.order .od b { font-family: var(--display); font-size: 18px; line-height: 1.1; }
.order .od small { display: block; color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
.order .od small svg { width: 15px; height: 15px; vertical-align: -3px; }
.need { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.need span, .basket span { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 14px; background: #F0F5EC; border-radius: 99px; padding: 2px 9px 2px 2px; }
.need span.ok { background: #DDF1D2; color: var(--leaf); }
.need svg, .basket svg { width: 24px; height: 24px; }
.order .buy { width: auto; padding: 10px 14px; }
.basket { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.packets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.packet { border: 0; border-radius: 16px; padding: 6px 4px 8px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; font-size: 13.5px; }
.packet.on { box-shadow: inset 0 0 0 3px var(--marigold); background: #FFF8E6; }
.packet[disabled] { opacity: .45; cursor: default; }
.packet .pk { width: 100%; height: 70px; border-radius: 11px; display: grid; place-items: center; }
.packet .pk svg { height: 64px; max-width: 100%; }
.packet small { font-weight: 400; color: var(--ink-soft); font-size: 11.5px; min-height: 1.2em; }
.goal { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.goal .ck { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #F0F5EC; box-shadow: inset 0 0 0 2px var(--line); color: #fff; font-weight: 800; }
.goal.met .ck { background: var(--leaf-2); box-shadow: none; }
.goal p { margin: 0; flex: 1; }
.goal b { font-variant-numeric: tabular-nums; }
.gcard { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); margin-top: 8px; }
.gcard.here { box-shadow: inset 0 0 0 2.5px var(--leaf-2); }
.gcard .thumb { width: 92px; height: 60px; border-radius: 11px; overflow: hidden; flex: none; }
.gcard .thumb svg { width: 100%; height: 100%; display: block; }
.gcard div { flex: 1; min-width: 0; }
.gcard b { font-family: var(--display); font-size: 18px; display: block; line-height: 1.1; }
.gcard small { color: var(--ink-soft); }
.gcard .buy { width: auto; padding: 8px 14px; }
.sec { font-family: var(--display); font-size: 19px; margin: 14px 0 2px; }
#grain { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
.scene-wrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 60px rgba(60,40,10,.18); }
#scene .head { transform-box: fill-box; transform-origin: 50% 50%; transition: transform 1.8s ease; }
#scene.dusk .head { transform: scale(.68); }
#beeMove { transition: transform 2.4s cubic-bezier(.45,0,.3,1); }
.bob { animation: bob .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.wxchip { position: absolute; right: 10px; top: 10px; border: 0; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.88); box-shadow: 0 3px 10px -5px rgba(29,58,42,.6); display: grid; place-items: center; transition: opacity .3s; }
.wxchip svg { width: 26px; height: 26px; }
.wxchip.snap { top: 56px; }
.pinspin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 5s linear infinite; }
.critter { cursor: pointer; }
.critter .cin { animation: fadein .8s ease-out; }
.critter .cbob { transform-box: fill-box; transform-origin: 50% 100%; animation: cbob 2.6s ease-in-out infinite; }
@keyframes cbob { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-1.5px) scaleY(1.04); } }
.critter.bye .cin { transition: transform .7s ease-in, opacity .7s; transform: translateX(22px); opacity: 0; }
.wish { cursor: pointer; }
.shoot { animation: shoot 2.9s linear forwards; }
@keyframes shoot { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-170px, 64px); opacity: 0; } }
.hearts { display: flex; align-items: center; gap: 2px; margin-top: 3px; font-size: 12px; color: var(--ink-soft); }
.hearts svg { width: 14px; height: 14px; }
.hearts em { font-style: normal; margin-left: 5px; }
.friends { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; }
.friends > div > svg { width: 44px; height: 44px; display: block; margin: 0 auto; }
.friends small svg { width: 12px; height: 12px; vertical-align: -1px; }
.friends b { display: block; font-size: 12px; line-height: 1.15; margin-top: 2px; }
.friends small { font-size: 12px; color: #D6436B; font-weight: 700; }
.critters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.critters div { background: #F4F8F0; border-radius: 14px; padding: 6px 4px; text-align: center; }
.critters svg { width: 44px; height: 40px; display: block; margin: 0 auto; }
.critters .unseen svg { filter: brightness(0); opacity: .16; }
.critters b { display: block; font-size: 13px; }
.critters small { display: block; font-size: 11px; color: var(--ink-soft); line-height: 1.2; }
.namein { width: 100%; box-sizing: border-box; font: 700 20px var(--display); padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: #FFFDF6; color: var(--ink); }
.namein:focus { outline: none; border-color: var(--marigold); }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--leaf); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.wxchip.snap svg { width: 22px; height: 22px; }
.pickhint { pointer-events: none; }
.pickhint .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: hintpulse 1.5s ease-out infinite; }
@keyframes hintpulse { 0% { transform: scale(.55); opacity: .95; } 100% { transform: scale(1.35); opacity: 0; } }
.pickhint .tag { animation: hintbob 1.5s ease-in-out infinite alternate; }
@keyframes hintbob { to { transform: translateY(-3px); } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }
#flash.on { opacity: .85; transition: none; }
.postcard img { width: 100%; border-radius: 14px; display: block; box-shadow: 0 6px 18px -10px rgba(29,58,42,.6); }
.postcard .row { display: flex; gap: 10px; margin-top: 12px; }
.postcard .row .buy { padding: 12px; text-decoration: none; color: inherit; }
.banner.show ~ .wxchip { opacity: 0; pointer-events: none; }
.story { background: linear-gradient(160deg, #FFF4F7, #FFFBEF); }
.story .od b { color: var(--berry); }
.story .tale { font-size: 14px; color: var(--ink); margin: 2px 0 0; line-height: 1.35; }
.album { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)); gap: 4px 6px; align-items: center; margin-top: 6px; }
.album span { font-size: 13px; font-weight: 700; }
.album i { display: grid; place-items: center; aspect-ratio: 1; border-radius: 12px; background: #F4F8F0; font-style: normal; color: #B8C6B0; font-weight: 800; }
.album i svg { width: 80%; height: 80%; }
.album i.gold { background: #FFF6D8; }
.album em { font-style: normal; font-size: 11px; color: var(--ink-soft); text-align: center; }
.decor-new { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.25,1.7,.5,1); }

.banner {
  position: absolute; left: 50%; top: 10px; transform: translate(-50%, -140%); width: max-content; max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 18px;
  background: rgba(255,255,255,.96); box-shadow: 0 8px 20px -8px rgba(29,58,42,.5);
  transition: transform .45s cubic-bezier(.3,1.4,.5,1);
}
.banner.show { transform: translate(-50%, 0); }
.banner svg { width: 40px; height: 40px; flex: none; }
.banner b { font-family: var(--display); font-size: 18px; line-height: 1.1; display: block; }
.banner span { font-size: 14px; color: var(--ink-soft); }

/* Garden bar */
.gbar { display: flex; align-items: center; gap: 8px; }
.today { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.today .dots { display: flex; gap: 2px; flex: none; }
.today .dots svg { width: 22px; height: 26px; display: block; transition: all .3s; }
.today .dots .off { opacity: .28; filter: grayscale(1); }
.today p { margin: 0; font-size: 13px; line-height: 1.25; color: var(--ink-soft); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today p b { overflow: hidden; text-overflow: ellipsis; }
.today p b { color: var(--ink); font-family: var(--display); font-size: 15px; display: block; line-height: 1.1; }
.pill {
  border: 0; border-radius: 999px; padding: 6px 11px 6px 7px; display: flex; align-items: center; gap: 6px;
  background: #fff; box-shadow: inset 0 0 0 1.5px var(--line), 0 2px 0 var(--line); font-weight: 700; font-size: 14.5px; flex: none;
}
.pill svg { width: 22px; height: 22px; }
.pill[disabled] { opacity: .5; cursor: default; }
.pill.ready { box-shadow: inset 0 0 0 2px #7CC0E8, 0 2px 0 #7CC0E8; }

/* Puzzle panel */
.panel {
  position: relative; background: var(--card); border-radius: 26px; padding: 12px 14px 14px;
  box-shadow: 0 1px 0 rgba(29,58,42,.06), 0 12px 30px -20px rgba(29,58,42,.5);
  overflow: hidden; min-height: 330px;
}
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 6px; padding: 0 14px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px;
  background: #F0F5EC; color: var(--ink-soft); position: relative;
}
.chip.on { background: var(--ink); color: #fff; }
.chip[disabled] { opacity: .5; cursor: default; }
.chip .new { position: absolute; top: -4px; right: -4px; background: var(--berry); color: #fff; font-size: 10px; border-radius: 99px; padding: 1px 5px; }
.pz-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 2px 8px; }
.pz-title h2 { font-family: var(--display); font-size: 24px; line-height: 1; margin: 0; }
.pz-title span { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.pz-stage { animation: slidein .45s cubic-bezier(.2,1,.4,1); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.pz-msg { text-align: center; min-height: 1.4em; margin: 12px 0 2px; font-weight: 700; color: var(--ink-soft); font-size: 15px; }
.pz-msg.bad { color: var(--berry); }
.pz-tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.tool { border: 0; border-radius: 14px; padding: 8px 14px; background: #F0F5EC; font-weight: 700; font-size: 14.5px; display: flex; gap: 6px; align-items: center; }
.tool svg { width: 18px; height: 18px; }

.clue { text-align: center; margin: 0 0 12px; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.clue small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.slots { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 50px)); gap: 6px; justify-content: center; margin-bottom: 16px; }
.slot {
  aspect-ratio: .88; border: 0; border-radius: 13px; padding: 0;
  background: linear-gradient(180deg, #E7D3B8, #F3E7D6); box-shadow: inset 0 3px 6px rgba(90,56,32,.25);
  font-family: var(--display); font-weight: 800; font-size: clamp(22px, 7vw, 30px); text-transform: uppercase; color: #4A2E12;
}
.slot.full { background: linear-gradient(180deg, #FFF8EA, #F6E6C6); box-shadow: 0 3px 0 #D9B97F, inset 0 0 0 1.5px #E6CC97; }
.slot.lock { background: linear-gradient(180deg, #E4F5DC, #CDEABF); color: var(--leaf); box-shadow: 0 3px 0 #9FCB8B; }
.slots.good .slot { background: linear-gradient(180deg, var(--leaf-2), var(--leaf)); color: #fff; box-shadow: 0 3px 0 #2B6A28; animation: hop .4s ease both; }
.slots.good .slot:nth-child(2) { animation-delay: .05s; } .slots.good .slot:nth-child(3) { animation-delay: .1s; } .slots.good .slot:nth-child(4) { animation-delay: .15s; }
.slots.good .slot:nth-child(5) { animation-delay: .2s; } .slots.good .slot:nth-child(6) { animation-delay: .25s; } .slots.good .slot:nth-child(7) { animation-delay: .3s; } .slots.good .slot:nth-child(8) { animation-delay: .35s; }
@keyframes hop { 50% { transform: translateY(-8px); } }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 360px; margin: 0 auto; }
.tile {
  width: 56px; height: 56px; border: 0; border-radius: 50%; padding: 0;
  background: radial-gradient(circle at 35% 28%, #FFF6DF 0 18%, var(--wood) 55%, var(--wood-2) 100%);
  box-shadow: 0 4px 0 #A9783A, inset 0 -3px 6px rgba(120,70,20,.25);
  font-family: var(--display); font-weight: 800; font-size: 27px; text-transform: uppercase; color: #4A2B0C;
  transition: transform .1s;
}
.tile:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 #A9783A; }
.tile.used { visibility: hidden; }

.target { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 0 0 12px; }
.sunbadge { position: relative; width: 92px; height: 92px; display: grid; place-items: center; }
.sunbadge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sunbadge b { position: relative; font-family: var(--display); font-weight: 800; font-size: 36px; color: #5A3205; font-variant-numeric: tabular-nums; }
.now { text-align: center; }

.numgrid { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 80px)); gap: 6px 10px; justify-content: center; }
.num { position: relative; aspect-ratio: 1; border: 0; background: transparent; padding: 0; font-family: var(--display); font-weight: 800; font-size: 26px; color: #4A2B0C; transition: transform .18s cubic-bezier(.3,1.6,.5,1); }

.memgrid { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 80px)); gap: 8px; justify-content: center; perspective: 800px; }
.card { aspect-ratio: .8; border: 0; padding: 0; background: transparent; }

.card.done { animation: matched .5s ease; }
@keyframes matched { 50% { transform: scale(1.08); } }

.celebrate {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: radial-gradient(circle at 50% 45%, rgba(255,250,232,.97), rgba(255,255,255,.93));

}
.celebrate h3 { font-family: var(--display); font-size: 42px; margin: 0; line-height: 1; color: var(--leaf); animation: pop .5s cubic-bezier(.3,1.7,.5,1); }
.celebrate p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.celebrate .gains { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.celebrate .gains span { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 99px; padding: 4px 12px 4px 6px; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--line); }
.celebrate .gains svg { width: 24px; height: 24px; }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }

/* Speed meter */
.meter { position: relative; height: 30px; border-radius: 99px; background: #F0F5EC; overflow: hidden; margin: 0 0 10px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 99px; background: linear-gradient(90deg, #FFE27A, #FFB020); transform-origin: left center; }
.meter i.quick { background: linear-gradient(90deg, #FFC9A0, #F28A3A); }
.meter span { position: relative; display: flex; align-items: center; gap: 6px; height: 100%; padding-left: 8px; font-weight: 700; font-size: 13.5px; color: #5A3205; white-space: nowrap; }
.meter span svg { width: 22px; height: 22px; flex: none; }
.meter.calm i { opacity: 0; }
.meter.calm span { color: var(--ink-soft); }
.meter .combo { margin-left: auto; margin-right: 10px; color: var(--berry); font-family: var(--display); font-weight: 800; font-size: 15px; }
.celebrate h3.fast { background: linear-gradient(90deg, #F6A92E, #E8436B 55%, #7A5AC6); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 46px; }
.celebrate h3.quick { color: #E8761A; }
.celebrate .tag { font-size: 12px; font-weight: 800; color: #fff; background: var(--berry); border-radius: 99px; padding: 1px 6px; margin-left: 2px; }
.celebrate .streakline { font-family: var(--display); font-weight: 800; color: var(--berry); font-size: 18px; }
.gauge { display: flex; gap: 2px; align-items: center; }
.gauge i { width: 8px; height: 11px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #D8E6EC; transition: background .3s; }
.gauge i.on { background: #3E9BD6; }
.pill.full { animation: btnpulse 1.6s ease-in-out infinite; box-shadow: inset 0 0 0 2px #3E9BD6, 0 2px 0 #3E9BD6; }
@keyframes btnpulse { 50% { transform: scale(1.06); } }
.rainbow { opacity: 0; }
.rainbow.show { animation: rainbow 2.8s ease forwards; }
@keyframes rainbow { 0% { opacity: 0; } 20%, 70% { opacity: .75; } 100% { opacity: 0; } }
.bee { animation: buzz 13s ease-in-out infinite; }
.bee .bw { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .08s linear infinite alternate; }
@keyframes buzz {
  0% { transform: translate(90px, 150px); } 15% { transform: translate(160px, 190px) ; } 30% { transform: translate(240px, 160px); }
  45% { transform: translate(300px, 210px); } 60% { transform: translate(210px, 240px); } 80% { transform: translate(120px, 210px); } 100% { transform: translate(90px, 150px); }
}
.birds { animation: birds 38s linear infinite; }
@keyframes birds { 0% { transform: translate(-60px, 40px); } 60%, 100% { transform: translate(460px, 10px); } }
.birds path { animation: wingbeat .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes wingbeat { to { transform: scaleY(.4); } }
.firefly { animation: firefly 5s ease-in-out infinite; }
@keyframes firefly { 0%, 100% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(10px, -12px); opacity: 1; } }

.nextbtn { margin-top: 10px; border: 0; border-radius: 18px; padding: 14px 34px; font-family: var(--display); font-weight: 800; font-size: 22px;

.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  if (!usedHint && !P.away && P.t0 != null && elapsed >= 0) tier = elapsed <= P.par / 2 ? 2 : elapsed <= P.par ? 1 : 0;
  S.combo = tier ? S.combo + 1 : 0; S.lastWinAt = Date.now();
  const speedBonus = [0, 5, 10][tier];

  const coins = 5 + bloomsBefore * 2 + speedBonus + comboBonus;
  const dropsWon = tier;
  S.solved++;

  }
  const seedsWon = 1 + (dailyNow ? 1 : 0);
  save();
  await wait(550);

  const cele = $("cele");
  const answer = type === "word" ? (P.alt ? `${P.solvedAs.toUpperCase()} is a real word too, so it counts! The clue meant ${P.word.toUpperCase()}.` : `The word was ${P.solvedAs.toUpperCase()}.`) : "";
  const secs = elapsed < Infinity ? (elapsed / 1000).toFixed(1) : null;
  const title = tier === 2 ? `<h3 class="fast">Speedy!</h3>` : tier === 1 ? `<h3 class="quick">Quick!</h3>` : `<h3>${pick(CHEERS)}</h3>`;
  const DROP = '<svg viewBox="0 0 24 24"><path d="M12 2 C16 8 19 11 19 15 a7 7 0 0 1 -14 0 C5 11 8 8 12 2z" fill="#3E9BD6"/><ellipse cx="9.5" cy="14" rx="1.6" ry="2.8" fill="#BFE4F7"/></svg>';
  cele.innerHTML = `${title}<p>${answer}${tier ? ` Bonus water for a quick answer.` : ""}</p>` +
    (S.combo >= 2 ? `<p class="streakline">Quick streak ×${S.combo}: +${comboBonus} bonus coins</p>` : "") +
    `<div class="gains"><span>${SEED}+${seedsWon}</span><span>${COIN}+${coins}${speedBonus ? `<em class="tag">+${speedBonus} quick</em>` : ""}</span>${dropsWon ? `<span>${DROP}+${dropsWon}</span>` : ""}</div>`;
  cele.hidden = false;
  const panelPt = centerOf(cele);
  sparkle(panelPt.x, panelPt.y - 30, ["#FFE066", "#9AD27F", "#F9B4C9", "#ffffff"], 22, 4);

  // Coins fly from the panel and from every bloom; water drops fly to the watering can.
  const coinTo = centerOf($("coinStat"));
  S.coins += coins;
  const onCoin = () => { SFX.coin(); bump("coinStat"); renderHud(); };
  for (let c = 0; c < 1 + tier * 3; c++) fly("coin", panelPt, coinTo, 4 + c * 3, onCoin);
  let bi = 0;
  for (let i = 0; i < S.plotCount; i++) {
    const p = S.plots[i];
    if (p && p.st === 3) { const from = plotPoint(i, -80); fly("coin", from, coinTo, 10 + bi * 4, onCoin); bi++; }
  }
  if (tier) {
    const was = S.drops; S.drops = Math.min(3, S.drops + dropsWon);
    for (let d = 0; d < dropsWon; d++) fly("water", panelPt, centerOf($("waterBtn")), 8 + d * 6, () => { bump("waterBtn"); renderHud(); });
    if (was < 3 && S.drops >= 3) setTimeout(() => banner("Your watering can is full!", "Tap the watering can to grow every plant.", CAN), 900);
  }
  if (tier === 2) { const r = $("rainbow"); r.classList.remove("show"); void r.getBoundingClientRect(); r.classList.add("show"); }
  const sr = scene.getBoundingClientRect();
  floatText(`+${coins}`, sr.left + sr.width / 2, sr.top + sr.height * 0.35, tier === 2 ? "#E8436B" : "#E8761A", tier ? 34 : 26);
  advanceClock();
  await wait(450);
  // Growth
  const res = growAll();
  drawGarden();
  if (res.grown.length) { SFX.grow(); res.grown.forEach((i) => { const pt = plotPoint(i, -30); sparkle(pt.x, pt.y, ["#B5E48C", "#ffffff", "#FFE066"], 6, 1.5); }); }
  const levelled = afterGrowth(res);
  critterTick();
  // Seeds: fly to empty beds (planted automatically) or to the seed counter.
  S.seeds += seedsWon;
  const planted = autoPlant(panelPt);
  for (let j = planted; j < seedsWon; j++) fly("seed", panelPt, centerOf($("seedStat")), j * 6, () => { bump("seedStat"); renderHud(); });
  if (dailyNow) banner("Your garden is set for today", `Daily Bouquet done. +1 bonus seed. ${streakNow()}-day streak!`, headIcon("tulip"));
  renderHud();
  if (levelled) drawGarden();
  await wait(700);
  cele.insertAdjacentHTML("beforeend", `<button class="nextbtn" id="nextBtn">Next puzzle</button><p style="font-size:13px">Take a look at your garden first if you like.</p>`);
  cele.classList.add("rest");
  $("nextBtn").addEventListener("click", () => { SFX.tap(); cele.hidden = true; cele.classList.remove("rest"); startPuzzle(S.mode === "mix" ? nextType() : type); }, { once: true });
}

    if (cardURL) URL.revokeObjectURL(cardURL);
    cardURL = URL.createObjectURL(blob);
    cardFile = new File([blob], "my-mind-garden.png", { type: "image/png" });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [cardFile] }));
    openSheet(`<div class="sh-head"><div><h2>Your garden postcard</h2><p>Send it to someone who'd like to see your garden.</p></div><button class="close" data-sh="close" aria-label="Close">×</button></div>
      <div class="postcard"><img id="cardImg" src="${cardURL}" alt="A postcard of your garden">
      <div class="row">${canShare ? `<button class="buy can" data-sh="share">Share</button>` : ""}<button class="buy${canShare ? "" : " can"}" data-sh="savecard">Save picture</button></div>
      <p class="muted" style="font-size:14px;margin:10px 0 0">You can also press and hold the picture to save it.</p></div>`);
  } catch (e) { toast("Sorry, the postcard didn't work this time."); }
});
function makeGrain() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 160; const g = c.getContext("2d"), d = g.createImageData(160, 160);
    for (let i = 0; i < d.data.length; i += 4) { const r = Math.random(), lite = r > 0.5; d.data[i] = lite ? 255 : 70; d.data[i + 1] = lite ? 250 : 55; d.data[i + 2] = lite ? 235 : 35; d.data[i + 3] = Math.random() < 0.6 ? Math.random() * 16 : 0; }
    g.putImageData(d, 0, 0); $("grain").style.backgroundImage = `url(${c.toDataURL()})`; $("grain").style.backgroundSize = "160px";
  } catch (e) {}
}
function boot() {
  $("coinIcon").innerHTML = COIN; $("seedIcon").innerHTML = SEED; $("waterIcon").innerHTML = CAN; $("shopIcon").innerHTML = BRUSH; $("basketIcon").innerHTML = BASKET;
  S.plotCount = Math.max(S.plotCount, plotsFor(level()));
  S.plots.forEach((p) => { if (p) delete p.pending; });
  if (!S.started) { S.started = true; S.seeds = 3; autoPlant(null); }
  refillOrders();
  shownCoins = null;
  makeGrain(); buildScene(); applySky(S.clock); drawGarden(); renderHud(); checkWeather();
  startPuzzle(S.mode === "mix" && unlocked().length > 1 ? nextType() : (unlocked().includes(S.mode) ? S.mode : "word"));
  if (awayAtLoad >= DEW_MS) setTimeout(morningDew, 900);
  setTimeout(() => { if (Math.random() < 0.4) spawnCritter(); }, 2600);
  if (S.solved === 0) setTimeout(() => banner("Welcome to Mind Garden", "Your seeds are planted. Solve puzzles to help them grow.", plantSVG("tulip", 1, { vb: "-30 -40 60 44" })), 600);
}
boot();
})();
