<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; a vertical timeline rail (OLDEST at top, NEWEST at bottom) holds five draggable cards. */
:root{
  --bg:#e8edf2; --paper:#fbfcfd; --ink:#1b2836; --muted:#5a6878; --line:#c3cfdb;
  --accent:#e8a21a; --accent-ink:#3a2700; --plate:#dde6ee;
  --good:#2e9a58; --near:#d4a106; --miss:#cf5440;
  --shadow:0 1px 0 rgba(27,40,54,.06),0 6px 18px -10px rgba(27,40,54,.35);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  --card-h:80px; --gap:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111922; --paper:#1b2531; --ink:#e7edf3; --muted:#9aa8b7; --line:#2f3d4d;
  --accent:#f2b23a; --accent-ink:#2a1c00; --plate:#243241;
  --good:#3fb56e; --near:#e0b21d; --miss:#e06650;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111922; --paper:#1b2531; --ink:#e7edf3; --muted:#9aa8b7; --line:#2f3d4d;
  --accent:#f2b23a; --accent-ink:#2a1c00; --plate:#243241;
  --good:#3fb56e; --near:#e0b21d; --miss:#e06650;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.logo{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.logo b{color:var(--accent)}
.hbtns{display:flex;gap:6px}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:18px;display:grid;place-items:center}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--plate);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meta h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.pill{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.diff{display:flex;gap:6px}
.diff button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700;color:var(--muted)}
.diff button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.board{display:grid;grid-template-columns:30px 1fr;gap:10px}
.rail{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:2px}
.rail::before{content:"";position:absolute;top:22px;bottom:22px;left:50%;width:2px;transform:translateX(-50%);background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.rail span{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);background:var(--bg);padding-block:4px}
.list{position:relative;touch-action:none}
.card{position:absolute;left:0;right:0;height:var(--card-h);display:grid;grid-template-columns:var(--card-h) 1fr auto;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:top .22s cubic-bezier(.3,.7,.3,1),transform .15s,box-shadow .15s,border-color .3s;cursor:grab;user-select:none;-webkit-user-select:none}
.card.drag{transition:transform .15s,box-shadow .15s;z-index:5;transform:scale(1.03) rotate(-.6deg);box-shadow:0 18px 30px -14px rgba(0,0,0,.45);cursor:grabbing}
.plate{height:100%;display:grid;place-items:center;font-size:36px;background:var(--plate);border-right:1px solid var(--line);overflow:hidden}
.plate img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.plate.h{background:color-mix(in srgb,#7d93c9 22%,var(--plate))}
.plate.i{background:color-mix(in srgb,#e8a21a 22%,var(--plate))}
.plate.f{background:color-mix(in srgb,#d9708a 22%,var(--plate))}
.plate.s{background:color-mix(in srgb,#5a9fb5 24%,var(--plate))}
.plate.p{background:color-mix(in srgb,#6fae6a 22%,var(--plate))}
.ctext{padding:8px 10px 8px 12px;min-width:0;font-weight:700;font-size:15.5px;line-height:1.2;text-wrap:balance}
.ctext small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}
.moves{display:flex;flex-direction:column;height:100%;border-left:1px solid var(--line)}
.moves button{flex:1;width:40px;border:0;background:transparent;color:var(--muted);font-size:13px}
.moves button+button{border-top:1px solid var(--line)}
.moves button:disabled{opacity:.25;cursor:default}
.year{display:none;font-family:var(--mono);font-weight:700;font-size:19px;padding-inline:12px;letter-spacing:-.02em}
.card.done{cursor:pointer}
.card.done .moves{display:none}
.card.done .year{display:block}
.card.g{border-color:var(--good);box-shadow:inset 6px 0 0 var(--good),var(--shadow)}
.card.n{border-color:var(--near);box-shadow:inset 6px 0 0 var(--near),var(--shadow)}
.card.m{border-color:var(--miss);box-shadow:inset 6px 0 0 var(--miss),var(--shadow)}
.card.g .year{color:var(--good)} .card.n .year{color:var(--near)} .card.m .year{color:var(--miss)}
.card.hinted::after{content:"💡";position:absolute;top:4px;left:calc(var(--card-h) - 22px);font-size:15px}
.card.flip{animation:flip .6s ease}
@keyframes flip{0%{transform:perspective(700px) rotateX(0)}50%{transform:perspective(700px) rotateX(90deg)}100%{transform:perspective(700px) rotateX(0)}}
.card.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.04)}}

.actions{display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--paper);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.hint-line{font-size:14px;color:var(--muted);text-align:center;min-height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.connect{font-size:16px;background:var(--plate);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0}
#stories{display:flex;flex-direction:column;gap:8px}
#stories[hidden]{display:none}
.storylist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.storylist h3{margin:8px 0 0;font-size:15px}
.xcard.done{cursor:pointer}

.result{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.result h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;text-wrap:balance}
.grid-emoji{font-size:28px;letter-spacing:4px}
.fact{font-size:15px;background:var(--plate);border-radius:12px;padding:10px 12px}
.fact b{font-family:var(--mono)}
.fact a{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1;min-width:140px}
.next{font-size:14px;color:var(--muted)}
.next b{font-family:var(--mono);color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.sheet{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:end center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet>div{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px;max-width:430px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.sheet h2{margin:0;font-family:var(--display);font-size:24px}
.sheet p{margin:0}
.remind{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.remind p{margin:0;font-weight:700}
.remind select,.remindset select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px;align-self:center}
body.banner{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
.remindset{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:24px}
.stats span{font-size:12px;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:13px}
.dist div{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center}
.dist i{display:block;height:18px;background:var(--line);border-radius:4px;min-width:18px;text-align:right;padding-right:6px;font-style:normal;box-sizing:border-box;color:var(--ink);line-height:18px}
.dist i.me{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.coach{position:absolute;right:52px;font-size:30px;pointer-events:none;z-index:6;animation:coach 1.6s ease-in-out infinite}
@keyframes coach{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{transform:translateY(-80px);opacity:1}100%{opacity:0;transform:translateY(-80px)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:auto}
textarea.copy{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2 additions: clue chips between cards, hint tags, score dial, tiers, reveal panel */
.chip{position:absolute;left:calc(var(--card-h) + 18px);height:22px;min-width:22px;padding-inline:7px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;z-index:4;pointer-events:none;box-sizing:border-box;border:1.5px solid var(--paper);transform:translateY(-50%)}
.chip.ok{background:var(--good);color:#fff}
.chip.no{background:var(--miss);color:#fff}
.tag{display:inline-block;margin-top:4px;font-family:var(--mono);font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 28%,var(--paper));color:var(--ink)}
.card.picking{outline:2px dashed var(--accent);outline-offset:2px}
.tries{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.tries i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.tries i.used{background:var(--accent)}
.offer{background:color-mix(in srgb,var(--accent) 16%,var(--paper));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px}
.offer .btn{padding:10px 14px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px}
.scoreline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score{font-family:var(--mono);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em}
.score small{font-size:18px;color:var(--muted)}
.tier{font-family:var(--display);font-weight:800;font-size:24px}
.star{font-size:14px;color:var(--muted)}
.pairs{display:flex;gap:6px;font-size:30px;line-height:1}
.near{font-size:15px;border-left:4px solid var(--near);padding:4px 0 4px 10px}
.card .year{font-size:22px}
.card.done .tagwrap{display:none}
.milestone{font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent)}
.tester{display:flex;gap:8px;flex-wrap:wrap}
.tester .btn{padding:8px 12px;font-size:14px}
.reasons{display:flex;flex-direction:column;gap:8px}
.reasons button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700}
.tabs{grid-template-columns:repeat(4,1fr)}
.tabs button{padding:9px 4px}
#archive{display:flex;flex-direction:column;gap:8px}
#archive h2,#expert h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.arow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.arow b{font-family:var(--mono)}
.arow small{display:block;color:var(--muted);font-size:13px}
.arow .res{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--muted)}
.arow .res.done{color:var(--ink)}
#expert{display:flex;flex-direction:column;gap:10px}
.xcard{display:grid;grid-template-columns:64px 1fr 92px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-height:72px}
.xcard .plate{font-size:30px}
.xcard input{width:76px;margin-right:12px;font:inherit;font-family:var(--mono);font-weight:700;font-size:20px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--bg);color:var(--ink);box-sizing:border-box}
.xcard input:focus{outline:3px solid var(--accent);outline-offset:1px}
.xcard .xres{font-family:var(--mono);font-weight:700;font-size:19px;text-align:center;padding-right:10px}
.xcard .xres small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.xcard.g{border-color:var(--good);box-shadow:inset 6px 0 0 var(--good),var(--shadow)}
.xcard.n{border-color:var(--near);box-shadow:inset 6px 0 0 var(--near),var(--shadow)}
.xcard.m{border-color:var(--miss);box-shadow:inset 6px 0 0 var(--miss),var(--shadow)}
.crowd{font-size:15px;border-left:4px solid var(--accent);padding:4px 0 4px 10px;margin:0}
.email{font-family:var(--mono);font-size:15px;user-select:all;-webkit-user-select:all;background:var(--bg);padding:8px 10px;border-radius:8px}
</style>

<canvas id="fx"></canvas>
<div class="app">
  <header>
    <div class="brand"><div class="logo">When<b>ly</b></div></div>
    <div class="hbtns">
      <button class="icon" id="bStats" aria-label="Your stats">📊</button>
      <button class="icon" id="bHelp" aria-label="How to play">?</button>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tDaily" aria-selected="true">Today</button>
    <button role="tab" id="tArchive" aria-selected="false">Archive</button>
    <button role="tab" id="tPractice" aria-selected="false">Practice</button>
    <button role="tab" id="tExpert" aria-selected="false">Expert</button>
  </div>
  <div class="meta" id="meta">
    <h1 id="title">Oldest at the top</h1>
    <span class="pill" id="pill"></span>
    <div class="diff" id="diff" hidden>
      <button data-g="30" aria-pressed="true">Easy</button>
      <button data-g="10" aria-pressed="false">Medium</button>
      <button data-g="3" aria-pressed="false">Hard</button>
    </div>
  </div>
  <section class="result" id="result" hidden></section>
  <div class="board" id="board">
    <div class="rail"><span>OLDEST</span><span>NEWEST</span></div>
    <div class="list" id="list"></div>
  </div>
  <section id="stories" hidden><div class="fact" id="fact"></div><p class="star" style="margin:0" id="storyTip">Tap any card below for its story.</p></section>
  <p class="sr" id="sr" aria-live="polite"></p>
  <div id="play">
    <div class="offer" id="offer" hidden>
      <span>Stuck? Put one card in its right spot. This gives up the ⭐ bonus.</span>
      <button class="btn primary" id="bPlace">Place a card</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="bHint">💡 Hint</button>
      <button class="btn primary" id="bLock">Check my order</button>
    </div>
    <div class="tries" id="tries"></div>
    <p class="hint-line" id="hintLine">Drag the cards, or use the arrows.</p>
    <p style="text-align:center;margin:0"><button class="linkbtn" id="bGiveUp" hidden>Show the answer</button></p>
  </div>
  <section id="archive" hidden></section>
  <section id="expert" hidden></section>
  <footer id="foot">Bright Harbor Games</footer>
</div>

<script>
// [year, emoji, title, did-you-know, category, Wikipedia article]
// Categories: h history, i invention, f fun & pop culture, s space & science, p sports & places
const EVENTS = [
[1066, "⚔️", "Battle of Hastings", "William of Normandy won and became king of England, so he is remembered as William the Conqueror.", "h", "Battle_of_Hastings"],

[1271, "🐫", "Marco Polo sets off for China", "He was 17 when he left Venice. He didn't come home for 24 years.", "h", "Marco_Polo"],
[1455, "📖", "Gutenberg Bible is printed", "It was one of the first big books printed with movable metal type in Europe. About 49 copies survive.", "i", "Gutenberg_Bible"],
[1492, "⛵", "Columbus reaches the Americas", "He landed in the Bahamas in October after about five weeks at sea.", "h", "Voyages_of_Christopher_Columbus"],

[1564, "🎭", "William Shakespeare is born", "He was born in Stratford-upon-Avon and wrote about 39 plays.", "f", "William_Shakespeare"],
[1588, "⚓", "Spanish Armada is defeated", "Storms wrecked more Spanish ships than the English fleet did.", "h", "Spanish_Armada"],
[1607, "🛶", "Jamestown is founded", "It was the first lasting English settlement in North America, in what is now Virginia.", "h", "Jamestown,_Virginia"],
[1610, "🔭", "Galileo spots moons around Jupiter", "He saw four of them with a telescope he built himself. They are still called the Galilean moons.", "s", "Galilean_moons"],
[1620, "🚢", "The Mayflower lands at Plymouth", "About 100 passengers made the trip. The ship was only about 100 feet long.", "h", "Mayflower"],

// ---------- funnel analytics ----------
// Every event goes to Firebase Analytics in the apps (once its config files are added) and to gtag on
// the web if the page loads it. A local tally (tester tools) shows the events fire.
function track(name,params={}){
  try{S.ev=S.ev||{};S.ev[name]=(S.ev[name]||0)+1;save()}catch(e){}
  try{if(window.Capacitor?.isNativePlatform?.())window.Capacitor.Plugins.FirebaseAnalytics?.logEvent({name,params}).catch(()=>{})}catch(e){}
  try{window.gtag&&gtag("event",name,params)}catch(e){}
}
// Day-2 return: the first time a player opens the daily on the day after their first daily.
function trackOpen(n){
  if(S.lastOpen===n)return;
  if(S.firstDay==null)S.firstDay=n;
  const since=n-S.firstDay;S.lastOpen=n;save();
  track("daily_open",{puzzle:n,days_since_first:since});
  if(since===1)track("day2_return",{puzzle:n});
}

    const j=await (await fetch(`https://firestore.googleapis.com/v1/${crowdDoc(n)}?key=${CROWD.apiKey}`)).json(),f=j.fields||{},v=k=>+(f[k]?.integerValue||0);
    return crowdCache[n]={plays:v("plays"),s:[0,1,2,3].map(i=>v("s"+i))};
  }catch(e){return null}
}
// For each neighboring pair in the true order: was it swapped in the order you locked in?
function swapsOf(order){const t=sortIds(G.ids);return t.slice(0,-1).map((a,i)=>order.indexOf(a)>order.indexOf(t[i+1]))}
async function showCrowd(){
  const el=$("#crowd");if(!el)return;
  const c=await crowdGet(G.n);if(!c||c.plays<CROWD.min||$("#crowd")!==el)return;
  const t=sortIds(G.ids);let i=c.s.indexOf(Math.max(...c.s));const pct=Math.round(100*c.s[i]/c.plays);
  if(pct<10){el.innerHTML=`Most players got every pair right today.`;el.hidden=false;return}
  const mine=swapsOf(G.finalOrder||G.order)[i];
  el.innerHTML=`<b>${pct}%</b> of players swapped <b>${EVENTS[t[i]][2]}</b> and <b>${EVENTS[t[i+1]][2]}</b>. ${mine?"You did too.":"You beat the crowd on this one."}`;
  el.hidden=false;
}

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function today(){const d=new Date();d.setDate(d.getDate()+S.offset);return d}
function dayNum(d=today()){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((t-EPOCH)/864e5)+1}
const yr=id=>EVENTS[id][0];

// ---------- dealing ----------
// Rules: 5 cards, never two from the same year, every pair at least `gap` years apart,
// daily puzzles also need 2+ anchor cards and one near-miss pair (neighbors within 2x the gap).
function pick(n,gap,r,daily){
  for(let g=gap;g>=1;g=Math.floor(g*0.7)){
    for(let tries=0;tries<200;tries++){
      const pool=shuffle(EVENTS.map((e,i)=>i),r),out=[];
      for(const i of pool){if(out.every(j=>Math.abs(yr(j)-yr(i))>=g)){out.push(i);if(out.length===n)break}}
      if(out.length<n)continue;
      if(daily&&!dailyOk(out,g))continue;
      return out;
    }
  }
}
function dailyOk(ids,g){
  if(ids.filter(i=>ANCHOR[i]).length<2)return false;
  const y=ids.map(yr).sort((a,b)=>a-b);
  return y.slice(1).some((v,i)=>v-y[i]<=Math.max(2*g,g+6));
}
function scramble(ids,r){
  const t=sortIds(ids);let o;
  do{o=shuffle(ids,r)}while(o.filter((x,i)=>x===t[i]).length>1);
  return o;
}
const sortIds=ids=>ids.slice().sort((a,b)=>yr(a)-yr(b));

// ---------- scoring ----------
// Pairs: of the 10 pairs of cards, how many are the right way round (60%).
// Closeness: how far cards sit from their true spots (30%). Run: longest stretch of correct neighbors (10%).
// That makes up to 90 points, scaled by the try you solved it on; finishing with no hints adds the last 10.
function quality(order){
  const t=sortIds(order),n=order.length;let pairs=0,tot=0,dist=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){tot++;if(yr(order[i])<yr(order[j]))pairs++}
  order.forEach((id,i)=>dist+=Math.abs(t.indexOf(id)-i));
  const maxDist=Math.floor(n*n/2);
  let run=0,best=0;for(let i=0;i<n-1;i++){if(t.indexOf(order[i+1])===t.indexOf(order[i])+1){run++;best=Math.max(best,run)}else run=0}
  return {pairs,tot,q:.6*pairs/tot+.3*(1-dist/maxDist)+.1*best/(n-1)};
}
// The ⭐ bonus needs a finish with no hints, no placed card and no "Show the answer".
const noHelp=()=>G.hintsUsed===0&&!(G.placed||[]).length&&!G.gaveUp;
function finalScore(){
  const {q}=quality(G.order),f=[1,.85,.7][Math.min(G.attempt,TRIES)-1];
  return Math.round(90*q*f)+(noHelp()?10:0);
}
function helpLine(){
  if(noHelp())return "⭐ No help, +10 bonus";
  const p=[];if(G.hintsUsed)p.push(`${G.hintsUsed} hint${G.hintsUsed>1?"s":""} used`);
  if((G.placed||[]).length)p.push("1 card placed");
  return p.length?p.join(" · ")+" · no ⭐":"no ⭐";
}
// Spoiler-free tiles: one per neighboring pair in the TRUE order.
// 🟩 you had them next to each other, right way round; 🟨 right way round but apart; 🟥 swapped.
function pairTiles(){
  const t=sortIds(G.order);
  return t.slice(0,-1).map((a,i)=>{const b=t[i+1],pa=G.order.indexOf(a),pb=G.order.indexOf(b);return pa>pb?"🟥":pb===pa+1?"🟩":"🟨"}).join("");
}

// ---------- state ----------
let G=null,practiceGap=30,tutorial=false;
function fresh(kind,ids,order){return{kind,ids,order,attempt:1,known:{},hints:{},hintsUsed:0,placed:[],done:false}}
// The puzzle for day n is the same for everyone, so the archive can rebuild any past day.
function dateOf(n){const d=new Date(EPOCH);d.setDate(d.getDate()+n-1);return d}
const themeOf=n=>SCHEDULE[n]?SCHEDULE[n][0]:"";
function dealFor(n){
  const wd=dateOf(n).getDay(),r=rng(n*7919+13);
  // A hand-picked puzzle for this day wins; otherwise the dealer picks one by the rules above.
  const hand=SCHEDULE[n]&&SCHEDULE[n][1].map(t=>EVENTS.findIndex(e=>e[2]===t));
  const ids=hand&&hand.every(i=>i>=0)?hand:pick(5,DAY_GAP[wd],r,true);
  return {ids,order:scramble(ids,r),wd};
}
function newDaily(){
  const n=dayNum(),wd=today().getDay();
  trackOpen(n);
  const saved=S.days[n];
  if(saved&&saved.g){G=saved.g;G.n=n;G.wd=wd;return}
  const d=dealFor(n);G=fresh("daily",d.ids,d.order);G.n=n;G.wd=wd;
  track("puzzle_start",{mode:"daily",puzzle:n});
}
// Past days: a finished puzzle shows its result; anything else plays as an archive puzzle,
// which never touches the streak or the daily stats.
function newArchive(n){
  const saved=S.days[n];
  if(saved&&saved.g&&saved.g.done){G=saved.g.kind==="daily"?{...saved.g,kind:"archive",live:true}:saved.g;return}
  if(saved&&saved.g){G=saved.g;G.kind="archive";return}
  const d=dealFor(n);G=fresh("archive",d.ids,d.order);G.n=n;G.wd=d.wd;
  track("puzzle_start",{mode:"archive",puzzle:n});
}
function newPractice(){const r=rng((Math.random()*1e9)|0),ids=pick(5,practiceGap,r,false);G=fresh("practice",ids,scramble(ids,r));track("puzzle_start",{mode:"practice",gap:practiceGap})}
function newTutorial(){
  const find=t=>EVENTS.findIndex(e=>e[2].startsWith(t));
  const ids=[find("First moon"),find("Gutenberg"),find("First iPhone")];
  G=fresh("tutorial",ids,ids.slice());
}
function persist(){if(G.kind==="daily"||G.kind==="archive"){S.days[G.n]={...(S.days[G.n]||{}),g:G};save()}}

// ---------- render ----------
const list=$("#list");let cardEls={};const GAP=16;
function cardH(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--card-h"))}
function slotTop(i){return i*(cardH()+GAP)}
function build(){
  list.innerHTML="";cardEls={};
  list.style.height=(slotTop(G.order.length)-GAP)+"px";
  G.order.forEach(id=>{
    const e=EVENTS[id],el=document.createElement("div");
    el.className="card";el.tabIndex=0;el.dataset.id=id;
    el.innerHTML=`<div class="plate ${e[4]}" aria-hidden="true">${ART.has(e[5])?`<img src="${ART_BASE}${e[5]}.jpg" alt="" draggable="false">`:e[1]}</div><div class="ctext">${e[2]}<span class="tagwrap"></span></div><div class="moves"><button aria-label="Move up">▲</button><button aria-label="Move down">▼</button></div><div class="year">${e[0]}</div>`;
    const [up,dn]=el.querySelectorAll(".moves button");
    up.onclick=ev=>{ev.stopPropagation();move(id,-1)};dn.onclick=ev=>{ev.stopPropagation();move(id,1)};
    up.addEventListener("pointerdown",ev=>ev.stopPropagation());dn.addEventListener("pointerdown",ev=>ev.stopPropagation());
    el.addEventListener("pointerdown",startDrag);
    el.addEventListener("keydown",ev=>{if(G.done)return;if(ev.key==="ArrowUp"){ev.preventDefault();move(id,-1);el.focus()}if(ev.key==="ArrowDown"){ev.preventDefault();move(id,1);el.focus()}if(ev.key==="Enter"&&picking){pickCard(id)}});
    el.addEventListener("click",()=>{if(G.done){showFact(id);$("#fact").scrollIntoView({block:"nearest",behavior:"smooth"})}else if(picking)pickCard(id)});
    list.appendChild(el);cardEls[id]=el;
  });
  layout();
}
function hintText(id){const h=G.hints[id];if(!h)return"";const y=yr(id);return h===1?`${Math.floor(y/100)}00s`:`${Math.floor(y/10)}0s`}
function layout(){
  // Keep the page order the same as the on-screen order so screen readers and Tab follow the cards.
  if(!drag){
    const kids=[...list.querySelectorAll(".card")].map(c=>+c.dataset.id);
    if(kids.some((id,i)=>id!==G.order[i])){const act=document.activeElement;G.order.forEach(id=>list.appendChild(cardEls[id]));if(act&&list.contains(act))act.focus()}
  }
  const n=G.order.length;
  G.order.forEach((id,i)=>{
    cardEls[id].setAttribute("aria-label",G.done?`${EVENTS[id][2]}, ${yr(id)}`:`${EVENTS[id][2]}, position ${i+1} of ${n}`);const el=cardEls[id];if(!el.classList.contains("drag"))el.style.top=slotTop(i)+"px";
    const [up,dn]=el.querySelectorAll(".moves button");up.disabled=i===0;dn.disabled=i===G.order.length-1;
    const tw=el.querySelector(".tagwrap"),ht=hintText(id),pl=G.placed.includes(id);
    tw.innerHTML=(ht||pl)?`<br>${ht?`<span class="tag">💡 ${ht}</span> `:""}${pl?`<span class="tag">📌 placed</span>`:""}`:"";
  });
  drawChips();
}
// Clues from earlier checks: for two cards that sit next to each other now, show ✓ if we know
// that order is right and ✗ if we know it's wrong. Nothing is shown for pairs you haven't checked.
function drawChips(){
  list.querySelectorAll(".chip").forEach(c=>c.remove());
  if(G.done||drag)return;
  for(let i=0;i<G.order.length-1;i++){
    const a=G.order[i],b=G.order[i+1],k=a+">"+b,rk=b+">"+a;
    let v=null;if(G.known[k]!==undefined)v=G.known[k];else if(G.known[rk]!==undefined)v=!G.known[rk];
    if(v===null)continue;
    const c=document.createElement("div");c.className="chip "+(v?"ok":"no");
    c.textContent=v?"✓ in order":"✗ reversed";c.style.top=(slotTop(i+1)-GAP/2)+"px";list.appendChild(c);
  }
}
function move(id,d){const i=G.order.indexOf(id),j=i+d;if(G.done||j<0||j>=G.order.length)return;[G.order[i],G.order[j]]=[G.order[j],G.order[i]];buzz(8);layout();persist();announce(id);feedbackLine()}
function announce(id){$("#sr").textContent=`${EVENTS[id][2]} moved to position ${G.order.indexOf(id)+1} of ${G.order.length}.`}
// What the last check found, kept apart from the live ✓/✗ tags on the cards as they sit now.
function feedbackLine(){
  if(G.done||G.kind==="tutorial"||picking)return;
  const h=$("#hintLine");
  if(G.attempt<2){h.textContent="Drag the cards, or use the arrows.";return}
  let ok=0,no=0,un=0;
  for(let i=0;i<G.order.length-1;i++){const a=G.order[i],b=G.order[i+1];let v=G.known[a+">"+b];if(v===undefined&&G.known[b+">"+a]!==undefined)v=!G.known[b+">"+a];v===undefined?un++:v?ok++:no++}
  h.innerHTML=`${G.lastOk!=null?`<b>Your last check (try ${G.attempt-1}):</b> ${G.lastOk} of ${G.order.length-1} neighbors were in order.<br>`:""}As the cards sit now: ${ok} ✓ · ${no} ✗${un?` · ${un} not checked yet`:""}. A ✓ means that pair is the right way round, not that a card is in its final spot.`;
}

// ---------- drag ----------
let drag=null;
function startDrag(ev){
  if(G.done||picking||ev.button>0)return;
  const el=ev.currentTarget,id=+el.dataset.id;
  drag={el,id,y0:ev.clientY,top0:parseFloat(el.style.top),moved:false};
  el.setPointerCapture(ev.pointerId);
  el.addEventListener("pointermove",onDrag);el.addEventListener("pointerup",endDrag);el.addEventListener("pointercancel",endDrag);
}
function onDrag(ev){
  if(!drag)return;const dy=ev.clientY-drag.y0;
  if(!drag.moved&&Math.abs(dy)<4)return;
  if(!drag.moved){drag.moved=true;drag.el.classList.add("drag");hideCoach();drawChips()}
  const n=G.order.length,top=Math.max(-10,Math.min(slotTop(n-1)+10,drag.top0+dy));
  drag.el.style.top=top+"px";
  const slot=Math.max(0,Math.min(n-1,Math.round(top/slotTop(1)))),cur=G.order.indexOf(drag.id);
  if(slot!==cur){G.order.splice(cur,1);G.order.splice(slot,0,drag.id);buzz(6);layout()}
}
function endDrag(){
  if(!drag)return;const el=drag.el;
  el.removeEventListener("pointermove",onDrag);el.removeEventListener("pointerup",endDrag);el.removeEventListener("pointercancel",endDrag);
  el.classList.remove("drag");const did=drag.id,moved=drag.moved;drag=null;layout();persist();if(moved){announce(did);feedbackLine()}
}

// ---------- hints ----------
// Each hint is used on one card you pick: the first shows its century, a second on the same card its decade.
let picking=false;
function hint(){
  if(G.done)return;
  if(picking){stopPicking();return}
  if(G.hintsUsed>=MAX_HINTS){toast("No hints left for this puzzle");return}
  picking=true;Object.values(cardEls).forEach(c=>c.classList.add("picking"));
  $("#hintLine").textContent="Tap a card to see its century. Tap the same card again later for its decade.";
  $("#bHint").textContent="Cancel";
}
function stopPicking(){picking=false;Object.values(cardEls).forEach(c=>c.classList.remove("picking"));updateButtons();feedbackLine()}
function pickCard(id){
  const h=G.hints[id]||0;
  if(h>=2){toast("That card already shows its decade");return}
  G.hints[id]=h+1;G.hintsUsed++;stopPicking();layout();track("hint_used",{mode:G.kind,level:h+1});
  const el=cardEls[id];el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
  $("#hintLine").textContent=`💡 Hint ${G.hintsUsed} of ${MAX_HINTS} used. Hints give up the ⭐ bonus.`;
  persist();
}
function place(){
  if(G.done)return;
  const t=sortIds(G.order),i=G.order.findIndex((id,k)=>yr(id)!==yr(t[k]));
  if(i<0){toast("Every card is already in its spot!");return}
  const id=t[i],cur=G.order.indexOf(id);G.order.splice(cur,1);G.order.splice(i,0,id);
  G.placed.push(id);G.offerUsed=true;layout();track("place_card",{mode:G.kind});
  const el=cardEls[id];el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
  $("#offer").hidden=true;$("#hintLine").textContent=`📌 "${EVENTS[id][2]}" is now in its right spot.`;
  updateButtons();persist();
}
function updateButtons(){
  const b=$("#bHint");b.disabled=G.done||G.hintsUsed>=MAX_HINTS;
  b.textContent=G.hintsUsed>=MAX_HINTS?"💡 0 left":`💡 Hint`;
  $("#bLock").textContent=G.kind==="tutorial"?"Check my order":`Check my order`;
  $("#tries").innerHTML=G.kind==="tutorial"?"":`Try ${G.attempt} of ${TRIES} ${Array.from({length:TRIES},(_,i)=>`<i class="${i<G.attempt?"used":""}"></i>`).join("")}`;
  $("#bGiveUp").hidden=G.kind==="tutorial"||G.attempt<2;
  $("#offer").hidden=G.kind==="tutorial"||G.attempt<3||G.offerUsed;
}

// ---------- checking ----------
function check(){
  if(G.done)return;stopPicking();hideCoach();
  const t=sortIds(G.order),perfect=G.order.every((id,i)=>yr(id)===yr(t[i]));
  if(G.kind!=="tutorial")track("check",{mode:G.kind,try:G.attempt,solved:perfect?1:0});
  if(perfect||G.attempt>=TRIES||G.kind==="tutorial"){finish();return}
  // record what this check tells you about each neighboring pair
  for(let i=0;i<G.order.length-1;i++){const a=G.order[i],b=G.order[i+1];G.known[a+">"+b]=yr(a)<yr(b)}
  const ok=G.order.slice(0,-1).filter((a,i)=>yr(a)<yr(G.order[i+1])).length;
  G.lastOk=ok;G.attempt++;layout();updateButtons();persist();feedbackLine();
  $("#sr").textContent=`${ok} of ${G.order.length-1} neighbors are in order. Try ${G.attempt} of ${TRIES}.`;
  buzz(20);
}
function giveUp(){
  if(G.done)return;
  const {q}=quality(G.order),f=[1,.85,.7][Math.min(G.attempt,TRIES)-1],pts=Math.round(90*q*f*.5);
  const s=sheet(`<h2>Show the answer?</h2><p>This ends the puzzle. You'll get half the points your current order would earn (<b>${pts}</b> right now) and no ⭐. Your streak still counts.</p><button class="btn ghost" id="bShowYes">Show the answer</button>`,"Keep trying");
  $("#bShowYes").onclick=()=>{s.remove();G.gaveUp=true;track("show_answer",{mode:G.kind,try:G.attempt});finish()};
}

function finish(){
  G.done=true;stopPicking();
  const t=sortIds(G.order),pos=G.order.map((id,i)=>{const d=Math.abs(t.indexOf(id)-i);return d===0?"g":d===1?"n":"m"});
  G.score=G.gaveUp?Math.round(90*quality(G.order).q*[1,.85,.7][Math.min(G.attempt,TRIES)-1]*.5):finalScore();
  G.tiles=pairTiles();G.marks=pos;
  if(G.kind==="daily"){recordDaily();crowdSend(G.n,swapsOf(G.order));remindSync()}
  if(G.kind==="tutorial"){S.tutorialDone=true;save();track("tutorial_done")}
  else track("puzzle_done",{mode:G.kind,puzzle:G.n||0,score:G.score,tries:Math.min(G.attempt,TRIES),hints:G.hintsUsed,placed:G.placed.length,gave_up:G.gaveUp?1:0});
  list.querySelectorAll(".chip").forEach(c=>c.remove());
  G.order.forEach((id,i)=>{const el=cardEls[id];setTimeout(()=>{el.classList.add("done","flip",pos[i]);countUp(el.querySelector(".year"),yr(id));buzz(12)},i*320)});
  $("#play").hidden=true;
  setTimeout(()=>{G.order=t;layout();if(G.score>=90||G.milestone)fireworks();showResult()},G.order.length*320+800);
  persist();
}
// The year spins up to its value as each card flips.
function countUp(el,y){
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const s=y-60,t0=performance.now(),D=650;
  const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(s+(y-s)*e);if(p<1)requestAnimationFrame(f)};f(t0);
}
function recordDaily(){
  const n=G.n;let note="";
  const missed=S.lastDay?n-S.lastDay-1:0;
  if(S.lastDay===n-1)S.streak++;
  else if(missed>0&&S.freezes>=missed&&S.streak>0){S.freezes-=missed;S.streak++;note=`❄️ A streak freeze saved your streak.`}
  else S.streak=1;
  S.best=Math.max(S.best,S.streak);S.lastDay=n;S.played++;S.total+=G.score;
  const tn=tier(G.score);S.tiers[tn]=(S.tiers[tn]||0)+1;
  if(S.streak%7===0&&S.freezes<2){S.freezes++;note+=(note?" ":"")+`❄️ You earned a streak freeze (you have ${S.freezes}).`}
  if(MILESTONES.includes(S.streak))G.milestone=S.streak;
  G.note=note;save();
}

// ---------- result ----------
function nearMiss(){
  const t=sortIds(G.order);let best=null;
  for(let i=0;i<t.length-1;i++){const gap=yr(t[i+1])-yr(t[i]);if(!best||gap<best.gap)best={a:t[i],b:t[i+1],gap}}
  const swapped=G.finalOrder&&G.finalOrder.indexOf(best.a)>G.finalOrder.indexOf(best.b);
  const A=EVENTS[best.a][2],B=EVENTS[best.b][2],yrs=best.gap===1?"1 year":best.gap+" years";
  return `🔗 <b>${A}</b> and <b>${B}</b> happened only ${yrs} apart!${swapped?" You had them the wrong way round.":""}`;
}
function surpriseCard(){ // the card you had furthest from its spot (or the oldest card if you were perfect)
  const t=sortIds(G.ids);let id=t[0],far=0;
  (G.finalOrder||t).forEach((c,i)=>{const d=Math.abs(t.indexOf(c)-i);if(d>far){far=d;id=c}});return id;
}
function showResult(){
  const r=$("#result"),n=G.ids.length;$("#board").after($("#stories"));
  if(G.kind==="tutorial"){
    r.innerHTML=`<h2>${G.marks.every(m=>m==="g")?"You've got it!":"That's the idea!"}</h2>
      <p style="margin:0">In the real game you get 5 cards and 3 tries. After each try, a green ✓ between two cards means that pair is the right way round, and a red ✗ means it's reversed.</p>
      <div class="row"><button class="btn primary" id="go">Play today's puzzle</button></div>`;
    r.hidden=false;showStories(sortIds(G.ids)[0]);$("#go").onclick=()=>{tutorial=false;setMode("daily")};return;
  }
  const replay=G.kind==="replay",share=replay?"":shareText(),how=G.gaveUp?"Answer shown":G.marks.every(m=>m==="g")?`Solved on try ${Math.min(G.attempt,TRIES)} of ${TRIES}`:`Not solved in ${TRIES} tries`;
  r.innerHTML=`${G.milestone?`<div class="milestone">🎉 ${G.milestone}-day streak!</div>`:""}
    <div class="scoreline"><span class="score">${G.score}<small>/100</small></span><span class="tier">${tier(G.score)}</span></div>
    <div class="pairs" aria-label="Your result">${G.tiles}</div>
    <p class="star" style="margin:0">${how} · ${helpLine()}</p>
    <p class="connect">${nearMiss()}</p>
    ${replay?`<p class="next" style="margin:0">Just for fun. Your saved score for #${G.n} stays <b>${G.orig}</b>.</p>`:""}

function lockExpert(){

  AdMob.showBanner({adId:u.banner,adSize:"ADAPTIVE_BANNER",position:"BOTTOM_CENTER",margin:0,isTesting:ADS_TESTING}).catch(()=>{bannerOn=false;document.body.classList.remove("banner")});
}
function hideBanner(){if(!bannerOn)return;bannerOn=false;document.body.classList.remove("banner");AdMob?.removeBanner().catch(()=>{})}
async function loadPrice(){
  if(!Purchases)return;
  try{
    const {products}=await Purchases.getProducts({productIdentifiers:[REMOVE_ADS],productType:"inapp"});
    if(products[0]?.priceString)removePrice=products[0].priceString;
    const {purchases}=await Purchases.getPurchases({productType:"inapp"});
    if(purchases.some(t=>t.productIdentifier===REMOVE_ADS)&&!S.noAds){S.noAds=true;save();hideBanner()}
  }catch(e){}
}
async function buyNoAds(){
  if(!Purchases)return toast("Purchases work in the iPhone and Android apps.");
  try{
    await Purchases.purchaseProduct({productIdentifier:REMOVE_ADS,productType:"inapp",quantity:1,isConsumable:false});
    S.noAds=true;save();hideBanner();track("remove_ads");toast("Ads removed. Thank you!");
    document.querySelectorAll(".noads").forEach(b=>b.remove());
  }catch(e){if(!/cancel/i.test(String(e?.message||e)))toast("The purchase didn't go through. You were not charged.")}
}
async function restoreNoAds(){
  if(!Purchases)return toast("Restore works in the iPhone and Android apps.");
  try{await Purchases.restorePurchases()}catch(e){}
  await loadPrice();toast(noAds()?"Remove ads restored.":"Nothing to restore.");
}
async function remindSync(){
  const LN=NATIVE&&PLUG.LocalNotifications;if(!LN)return;
  try{
    const ids=Array.from({length:14},(_,i)=>({id:100+i}));
    await LN.cancel({notifications:ids});
    if(!S.remind)return;
    const [h,m]=S.remind.split(":").map(Number),now=new Date(),n0=dayNum(),doneToday=!!(S.days[n0]&&S.days[n0].g&&S.days[n0].g.done);
    const list=[];
    for(let i=0;i<14;i++){
      const at=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,h,m);
      if(at<=now||(i===0&&doneToday))continue;
      const n=n0+i,th=themeOf(n);
      const body=i<=1&&S.streak>=2?`Keep your ${S.streak}-day streak going. Puzzle #${n} is ready.`:th?`Today's theme: ${th}. Five cards, oldest at the top.`:`Puzzle #${n} is ready. Five cards, oldest at the top.`;
      list.push({id:100+i,title:"Whenly",body,schedule:{at,allowWhileIdle:true}});
    }
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}
function buzz(ms){try{if(NATIVE)PLUG.Haptics?.impact({style:ms<=10?"LIGHT":ms<=20?"MEDIUM":"HEAVY"});else navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function fireworks(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx"),x=c.getContext("2d"),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,P=[];
  const cols=["#e8a21a","#2e9a58","#5a9fb5","#d9708a","#7d93c9"];
  for(let b=0;b<3;b++){const cx=W*(.25+.25*b),cy=H*(.25+.1*(b%2));for(let i=0;i<50;i++){const a=Math.random()*6.28,s=(2+Math.random()*5)*devicePixelRatio;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,c:cols[i%5],d:b*12})}}
  let f=0;(function step(){x.clearRect(0,0,W,H);let alive=0;for(const p of P){if(f<p.d){alive++;continue}if(p.l<=0)continue;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=.08*devicePixelRatio;p.vx*=.98;p.l--;x.globalAlpha=Math.min(1,p.l/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,4*devicePixelRatio,4*devicePixelRatio)}f++;if(alive)requestAnimationFrame(step);else x.clearRect(0,0,W,H)})();
}
// Hidden tester tools: tap the footer 5 times.
let footTaps=0;$("#foot").addEventListener("click",()=>{if(++footTaps<5)return;footTaps=0;
  const s=sheet(`<h2>Tester tools</h2><p>Today is puzzle #${dayNum()} (offset ${S.offset} days).</p><div class="tester"><button class="btn ghost" data-t="next">Go to next day</button><button class="btn ghost" data-t="skip">Skip a day</button><button class="btn ghost" data-t="reset">Reset all progress</button></div><p class="star">Reports saved: ${S.reports.length}</p><p class="star">Funnel events on this device: ${Object.entries(S.ev||{}).map(([k,v])=>k+" "+v).join(" · ")||"none yet"}</p><button class="btn ghost" data-t="crowd">${S.fakeCrowd?"Hide":"Show"} sample crowd stats</button>`,"Close");
  s.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t==="next")S.offset++;if(t==="skip")S.offset+=2;if(t==="crowd")S.fakeCrowd=!S.fakeCrowd;if(t==="reset"){S={days:{},tiers:{},streak:0,best:0,played:0,total:0,freezes:0,offset:0,reports:[],tutorialDone:true}}save();s.remove();setMode("daily");toast(`Now on puzzle #${dayNum()}`)})});

// ---------- wire up ----------
$("#bLock").onclick=check;$("#bHint").onclick=hint;$("#bPlace").onclick=place;$("#bGiveUp").onclick=giveUp;$("#bHelp").onclick=help;$("#bStats").onclick=stats;
$("#tDaily").onclick=()=>{if(!tutorial)setMode("daily")};$("#tPractice").onclick=()=>{if(!tutorial)setMode("practice")};
$("#tArchive").onclick=()=>{if(!tutorial)setMode("archive")};$("#tExpert").onclick=()=>{if(!tutorial)setMode("expert")};
$("#diff").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;practiceGap=+b.dataset.g;$("#diff").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));newPractice();render()});
if(!S.tutorialDone){tutorial=true;newTutorial();render()}else setMode("daily");
initAds().then(loadPrice);remindSync();document.addEventListener("visibilitychange",()=>{if(!document.hidden)remindSync()});
</script>
