<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column. Shop front on top, the shelf unit is the stage, tools along the bottom. */
:root{
  --wall:#dfe8dc; --wall-deep:#c6d6c4;
  --wood:#7a5236; --wood-light:#a37552; --wood-dark:#4f3322;
  --ink:#24302b; --ink-soft:#5a6a62; --paper:#fbf8f1;
  --awning:#2f7d74; --butter:#f4c95d; --plum:#8a4a7a; --good:#3d9a63; --stamp:#c8443c;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 20% 0%,#eef4ea 0%,var(--wall) 55%);background-color:var(--wall);color:var(--ink);font-family:var(--body);margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box;position:relative}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}

.top{display:flex;align-items:center;gap:7px;padding-block:10px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.3px;color:var(--awning);margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:9px;font-weight:800;letter-spacing:.8px;white-space:nowrap;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--wall-deep);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.pill .coin,.flycoin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,var(--butter) 55%,#d9a93a);box-shadow:inset 0 -2px 0 #c8962c}
.pill.bump{animation:pop .35s}
.iconbtn{background:var(--paper);border:2px solid var(--wall-deep);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:17px;font-weight:800;padding:0}
.flycoin{position:fixed;z-index:30;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.7,1),opacity .7s}

.front{position:relative;border-radius:16px;overflow:hidden;flex:none;background:var(--wall-deep)}
.front svg{display:block;width:100%;height:auto}
.bubble{position:absolute;right:10px;top:6px;background:var(--paper);border-radius:14px;padding:5px 8px 4px;box-shadow:0 2px 0 rgba(0,0,0,.12);display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px}
.bubble::after{content:"";position:absolute;bottom:-7px;right:30px;border:7px solid transparent;border-top-color:var(--paper);border-bottom:0}
.bubble svg{width:30px;height:30px}
.bubble .x{font-family:var(--display);color:var(--plum);font-size:13px}
.bubble.pop{animation:pop .4s}
.say{position:absolute;left:10px;right:110px;bottom:8px;background:rgba(36,48,43,.88);color:var(--paper);font-weight:700;font-size:12px;line-height:1.35;padding:7px 10px;border-radius:10px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none}
.say.show{opacity:1;transform:none}
.say b{color:var(--butter)}
.queue{position:absolute;left:8px;top:6px;display:flex;align-items:center;gap:5px;background:rgba(251,248,241,.92);border-radius:12px;padding:3px 7px 3px 8px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.queue .q{display:flex;align-items:center;margin-left:2px}
.queue .q svg:first-child{width:22px;height:22px;background:#fff;border-radius:50%}
.queue .q svg:last-child{width:18px;height:18px;margin-left:-3px}
.medal{font-size:14px;filter:none;transition:opacity .3s,filter .3s}
.medal.lost{opacity:.35;filter:grayscale(1)}
.flybag{position:fixed;z-index:30;width:44px;pointer-events:none;transition:transform .65s cubic-bezier(.4,-.2,.6,1),opacity .65s}
.toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);font-weight:800;padding:6px 12px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{animation:toast 1.5s}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%)}15%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-80%)}}
.cust{transform-box:fill-box;transform-origin:50% 100%}
.cust.happy{animation:hop .6s}
.walkin{transform-box:fill-box;animation:walkin .7s ease-out}
@keyframes walkin{from{transform:translateX(70px);opacity:0}}
@keyframes hop{30%{transform:translateY(-10px) scaleY(1.05)}60%{transform:translateY(0) scaleY(.95)}}
.cattail{transform-box:fill-box;transform-origin:100% 50%;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(-18deg)}}
.catwalk{animation:catwalk 22s ease-in-out infinite}
@keyframes catwalk{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(-86px)}100%{transform:translateX(0)}}
.mote{animation:mote 7s linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(18px,-26px);opacity:0}}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.025)}}

.levelline{display:flex;justify-content:space-between;align-items:center;padding-block:10px 4px;gap:8px}
.levelline h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;white-space:nowrap}
.levelline .meta{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;gap:8px}
.stars{display:inline-flex;gap:1px;font-size:15px;letter-spacing:-1px}
.stars .on{color:#e8a91c}.stars .off{color:#b9c7b7}
.streak{background:var(--plum);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;white-space:nowrap}

.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.unit{position:relative;border-radius:14px;padding:10px;display:grid;gap:10px;width:100%;box-sizing:border-box;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.035) 0 3px,transparent 3px 11px),linear-gradient(160deg,#5e3f2a,var(--wood-dark));
  box-shadow:0 8px 0 rgba(60,40,25,.25),0 18px 30px rgba(60,40,25,.18)}
.unit::before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(115deg,rgba(255,236,190,.16),transparent 45%);pointer-events:none}
.cubby{position:relative;border-radius:8px;display:flex;flex-direction:column-reverse;align-items:center;padding:6px 0 0;border:0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 9px),linear-gradient(#563826,#6e4a33);
  box-shadow:inset 0 4px 8px rgba(0,0,0,.38),inset 0 -2px 0 rgba(255,255,255,.05)}
.cubby::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-6px;height:9px;background:linear-gradient(var(--wood-light),#8d6243);border-radius:3px;box-shadow:0 3px 3px rgba(0,0,0,.35)}
.cubby .slot{width:var(--item);height:var(--item);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.6,1)}
.cubby .slot svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 1px rgba(0,0,0,.28))}
.cubby.sel .lift{transform:translateY(-14px) scale(1.04,1.08)}
.cubby.sel{box-shadow:inset 0 4px 8px rgba(0,0,0,.38),0 0 0 3px var(--butter)}
.cubby.hintTo{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 4px 8px rgba(0,0,0,.38),0 0 0 4px #fff3b0,0 0 18px #ffe27a}}
.cubby.bad{animation:shake .3s}
.cubby.done{background:linear-gradient(#55704f,#64835e)}
.cubby.extra{outline:2px dashed var(--butter);outline-offset:-4px}
.slot.land{animation:land .32s ease-out}
.slot.done{animation:setbounce .5s ease-out}
.bag{position:absolute;inset:8px 6px 6px;display:grid;place-items:center;animation:bagin .35s ease-out}
.bag svg{width:min(100%,calc(var(--item)*1.5));height:auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.stampmark{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:2px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.72);z-index:3}
.stampmark.slam{animation:slam .45s cubic-bezier(.2,1.4,.5,1)}
@keyframes land{0%{transform:translateY(-16px) scale(.92,1.12)}55%{transform:translateY(2px) scale(1.12,.86)}80%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes setbounce{30%{transform:translateY(-10px)}60%{transform:translateY(0) scale(1.1,.9)}}
@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.6);opacity:0}60%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(.92)}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
@keyframes bagin{from{transform:translateY(10px) scale(.85);opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{40%{transform:scale(1.15)}}
.hand{position:absolute;font-size:30px;pointer-events:none;z-index:5;animation:tapme 1.1s infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));left:50%;bottom:-34px;margin-left:-12px}
@keyframes tapme{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:12px 14px}
.tool{background:var(--paper);border:2px solid var(--wall-deep);border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;position:relative;box-shadow:0 3px 0 var(--wall-deep)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wall-deep)}
.tool b{font-size:19px;line-height:1.1}
.tool:disabled{opacity:.45;cursor:default}
.tool .cost{font-size:10px;font-weight:800;color:var(--plum);line-height:1}
.tool .badge{position:absolute;top:-7px;right:-4px;background:var(--plum);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px}

.sheet{position:fixed;inset:0;background:rgba(36,48,43,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.card{background:var(--paper);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-height:90%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.card h3{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 4px;text-wrap:balance}
.card h4{font-family:var(--display);font-weight:600;font-size:17px;margin:16px 0 6px}
.card p{margin:6px 0;line-height:1.45;color:var(--ink-soft);font-weight:600}
.big{display:block;width:100%;border:0;border-radius:14px;background:var(--awning);color:#fff;font-weight:800;font-size:17px;padding:14px;margin-top:14px;box-shadow:0 4px 0 #1f5a53}
.big.alt{background:var(--wall);color:var(--ink);box-shadow:0 4px 0 var(--wall-deep)}
.stats{display:flex;gap:10px;margin:14px 0 4px}
.stats div{flex:1;background:var(--wall);border-radius:12px;padding:10px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.stats small{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
.stats strong{font-family:var(--display);font-size:24px}
.bigstars{display:flex;justify-content:center;gap:8px;font-size:42px;margin:6px 0 2px}
.bigstars span{animation:starin .4s backwards}
.bigstars .off{color:#d6ddd3}.bigstars .on{color:#e8a91c;text-shadow:0 3px 0 #c58a0c}
.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-30deg)}}
.ups,.regs{display:grid;gap:8px;margin-top:12px}
.up{display:flex;align-items:center;gap:12px;background:var(--wall);border-radius:14px;padding:10px 12px;border:0;text-align:left;width:100%}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .nm{flex:1;font-weight:800;min-width:0}
.up .nm small{display:block;font-weight:600;color:var(--ink-soft);font-size:12px}
.up .pr{font-weight:800;background:var(--butter);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.up.own .pr{background:var(--good);color:#fff}
.up:disabled{opacity:.55}
.reg{display:flex;gap:12px;align-items:flex-start;background:var(--wall);border-radius:14px;padding:10px 12px}
.reg svg{width:52px;height:52px;flex:none;background:var(--paper);border-radius:12px}
.reg .nm{font-weight:800}
.reg .nm small{color:var(--plum);font-weight:800;margin-left:6px}
.reg p{margin:3px 0 0;font-size:13px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.lv{border:0;border-radius:12px;background:var(--wall);padding:8px 0 5px;font-family:var(--display);font-weight:600;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:1px}
.lv{position:relative}.lv .stars{font-size:11px}
.lv .rib{position:absolute;top:-6px;right:-4px;font-size:13px}
.lv.cur{background:var(--awning);color:#fff;box-shadow:0 3px 0 #1f5a53}
.lv.cur .stars .off{color:#8fc0b9}
.lv:disabled{opacity:.4}
.dailycard{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#f7e3b0,#f4c95d);border-radius:16px;padding:12px 14px;border:0;width:100%;text-align:left;margin-top:12px}
.dailycard b{font-family:var(--display);font-size:18px;display:block}
.dailycard span{font-weight:700;font-size:13px;color:#6b5320}
.dailycard .go{margin-left:auto;font-size:24px}
.share{background:var(--wall);border-radius:12px;padding:10px;font-weight:800;text-align:center;margin-top:10px;user-select:text;-webkit-user-select:text}
.rules{margin:10px 0 0;padding-left:20px;line-height:1.5;font-weight:600;color:var(--ink-soft)}
.rules b{color:var(--ink)}
.row2{display:flex;gap:10px}
.row2 .big{flex:1}
.linkbtn{border:0;background:none;color:var(--plum);font-weight:800;padding:0;font-size:12px}
.cubby.canTo{box-shadow:inset 0 4px 8px rgba(0,0,0,.38),0 0 0 2px rgba(255,243,176,.75)}
.slot.reveal{animation:reveal .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes reveal{0%{transform:scale(.4) rotate(-12deg);opacity:.2}60%{transform:scale(1.18)}100%{transform:none}}
.slot.wob{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,80%,100%{transform:none}86%{transform:rotate(-6deg)}93%{transform:rotate(6deg)}}
.stuck{position:absolute;left:8px;right:8px;top:8px;z-index:6;background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:up .25s ease-out;text-align:center}
.stuck b{font-family:var(--display);font-size:17px;display:block}
.stuck p{margin:2px 0 8px;font-weight:700;font-size:13px;color:var(--ink-soft)}
.stuck .row2 button{flex:1;border:0;border-radius:10px;padding:9px 6px;font-weight:800;font-size:13px;background:var(--wall);box-shadow:0 3px 0 var(--wall-deep)}
.stuck .row2 button.go{background:var(--awning);color:#fff;box-shadow:0 3px 0 #1f5a53}
.intro{display:flex;justify-content:center;gap:10px;margin:12px 0 4px;align-items:center;font-size:26px;font-weight:800;color:var(--ink-soft)}
.intro svg{width:56px;height:56px}
.bar{height:10px;border-radius:999px;background:var(--wall);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--butter),#e8a91c);border-radius:999px;transition:width .8s ease-out}
.prog{font-size:13px;font-weight:800;color:var(--ink-soft);margin-top:10px;display:flex;justify-content:space-between}
.reveal .rv{position:relative;border-radius:16px;overflow:hidden;margin:-4px 0 10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.reveal .rv svg{display:block;width:100%;height:auto}
.reveal .zoom{position:relative;animation:zoomin 1.1s .1s ease-in-out forwards}
@keyframes zoomin{to{transform:scale(1.9)}}
.reveal .after{position:absolute;inset:0;animation:rvfade 1s .5s backwards}
.reveal .after::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,226,140,.55),transparent 70%);animation:warm 1.6s .6s backwards;opacity:0}
@keyframes rvfade{from{opacity:0}}
@keyframes warm{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.spark{position:absolute;width:0;height:0}
.spark i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #fff3b0;animation:spark 1s .8s backwards;opacity:0}
.spark i:nth-child(1){--a:0deg}.spark i:nth-child(2){--a:45deg}.spark i:nth-child(3){--a:90deg}.spark i:nth-child(4){--a:135deg}.spark i:nth-child(5){--a:180deg}.spark i:nth-child(6){--a:225deg}.spark i:nth-child(7){--a:270deg}.spark i:nth-child(8){--a:315deg}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1.4)}100%{opacity:0;transform:rotate(var(--a)) translateX(46px) scale(.4)}}
.quote2{background:var(--wall);border-radius:12px;padding:8px 12px;color:var(--ink)!important}
.quote2 b{color:var(--plum)}
.moment{display:flex;gap:12px;align-items:flex-start;background:var(--wall);border-radius:16px;padding:10px 12px;margin:10px 0 4px;animation:up .35s ease-out}
.moment svg{width:64px;height:64px;flex:none;background:var(--paper);border-radius:14px}
.moment b{font-family:var(--display);font-size:17px}
.moment p{margin:3px 0 0;color:var(--ink);font-size:14px}
.hearts{color:var(--plum);letter-spacing:1px}
.hearts .new{display:inline-block;animation:heart .7s .35s backwards}
@keyframes heart{0%{transform:scale(0);opacity:0}60%{transform:scale(1.6)}100%{transform:none}}
.service{background:#f6ecd2;border-radius:12px;padding:7px 12px;color:var(--ink)!important;font-size:13px}
.seq .s1{animation:fadein .4s .9s backwards}.seq .s2{animation:fadein .4s 1.4s backwards}
.seq .bigstars span{animation-delay:1s}.seq .bigstars span:nth-child(2){animation-delay:1.15s}.seq .bigstars span:nth-child(3){animation-delay:1.3s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.winregs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.winregs span{margin-right:4px}
.winregs div{display:flex;align-items:center;gap:6px;background:var(--wall);border-radius:12px;padding:4px 10px 4px 4px;font-weight:800;font-size:12px}
.winregs svg{width:34px;height:34px;background:var(--paper);border-radius:9px}
.winregs .h{color:var(--plum)}
.harrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.harrow .dash{animation:dash .8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.cols{display:flex;flex-direction:column;flex:1;min-height:0}
.main{display:flex;flex-direction:column;flex:1;min-height:0}
@media (min-width:860px){
  #app{max-width:1020px}
  .cols{flex-direction:row;gap:28px;align-items:center}
  .cols .side{flex:1.1}
  .cols .main{flex:1;height:100%;max-width:480px}
  .side .front{border-radius:20px}
}

/* ---------- rng ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- rules ---------- */
const CAP=4;
const topRun=st=>{if(!st.length)return 0;const k=st[st.length-1].k;let n=0;for(let i=st.length-1;i>=0&&st[i].k===k;i--)n++;return n};
const isDone=st=>st.length===CAP&&st.every(x=>x.k===st[0].k);
function canMove(S,a,b){
  if(a===b)return 0;const A=S[a],B=S[b];
  if(!A.length||isDone(A)||B.length>=CAP)return 0;
  const k=A[A.length-1].k;
  if(B.length&&B[B.length-1].k!==k)return 0;
  return Math.min(topRun(A),CAP-B.length);
}

/* solver on plain kind arrays (sees through boxes). jitter>0 randomises tie-breaks to look for shorter routes */
function solve(stacks,limit,jitter,R,pred){
  const start=stacks.map(s=>s.slice());
  const seen=new Set();let nodes=0;const path=[];
  const key=S=>S.map(s=>s.join(",")).sort().join("|");
  const run=s=>{let n=0;const k=s[s.length-1];for(let i=s.length-1;i>=0&&s[i]===k;i--)n++;return n};
  const full=s=>s.length===CAP&&s.every(x=>x===s[0]);
  function dfs(S){
    if(S.every(s=>!s.length||full(s)))return true;
    if(++nodes>limit)return false;
    const kk=key(S);if(seen.has(kk))return false;seen.add(kk);
    const moves=[];
    for(let a=0;a<S.length;a++){const A=S[a];if(!A.length||full(A))continue;const r=run(A),k=A[A.length-1];
      let emptyTried=false;
      for(let b=0;b<S.length;b++){if(a===b)continue;const B=S[b];if(B.length>=CAP)continue;
        if(B.length&&B[B.length-1]!==k)continue;
        if(!B.length){if(r===A.length||emptyTried)continue;emptyTried=true}
        const n=Math.min(r,CAP-B.length);
        const score=(B.length?10:0)+(n===r?5:0)+(B.length&&B.every(x=>x===k)?8:0)+(n===r&&A.length===r?6:0)+(jitter?R()*jitter:0);
        moves.push([a,b,n,score])}}
    moves.sort((x,y)=>y[3]-x[3]);
    for(const [a,b,n] of moves){
      const T=S.map(s=>s.slice());T[b].push(...T[a].splice(T[a].length-n,n));
      if(pred&&!pred(T))continue;
      path.push([a,b]);if(dfs(T))return true;path.pop();
      if(nodes>limit)return false}
    return false}
  const ok=dfs(start);solve.hitLimit=!ok&&nodes>limit;return ok?path.slice():null;
}
function bestPar(st,seed,pred){
  const R=rng(seed);let best=null;
  for(let i=0;i<6;i++){const s=solve(st,20000,i?12:0,R,pred);if(s&&(!best||s.length<best))best=s.length}
  return best;
}

function makeLevel(n,spare,seed,boxes,must){
  const R=rng(seed);
  for(let tries=0;tries<60;tries++){
    const pick=[...KINDS.keys()];
    for(let i=pick.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
    const use=must?must.concat(pick.filter(k=>!must.includes(k))).slice(0,n):pick.slice(0,n);
    const pool=[];use.forEach(k=>{for(let i=0;i<CAP;i++)pool.push(k)});
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    const st=[];for(let i=0;i<n;i++)st.push(pool.slice(i*CAP,i*CAP+CAP));
    for(let i=0;i<spare;i++)st.push([]);
    if(st.some(s=>s.length===CAP&&s.every(x=>x===s[0])))continue;
    let pairs=0;st.forEach(s=>{for(let i=1;i<s.length;i++)if(s[i]===s[i-1])pairs++});
    if(pairs>n*1.2)continue;
    const sol=solve(st,n>=7?60000:25000);
    if(!sol||sol.length<Math.max(2,n*2-1))continue;
    const par=bestPar(st,seed^0x5bd1)||sol.length;
    return {stacks:st.map(s=>s.map((k,i)=>({k,h:!!boxes&&i<s.length-1&&R()<boxes}))),par};
  }
  return null;
}
/* L12 introduces boxes on a small board; every level ending in 5 after L10 is a breather one step easier */
function levelSpec(L){
  if(L===12)return{n:4,spare:2,boxes:.3};
  if(L>10&&L%10===5){const s=baseSpec(L-5);return{n:Math.max(4,s.n-1),spare:2,boxes:L<20?0:s.boxes*.6}}
  return baseSpec(L);
}
function baseSpec(L){
  if(L<=2)return{n:2,spare:1,boxes:0};
  if(L<=5)return{n:3,spare:2,boxes:0};
  if(L<=11)return{n:4,spare:2,boxes:0};
  if(L<=20)return{n:5,spare:2,boxes:L>=12?.25:0};
  if(L<=35)return{n:6,spare:2,boxes:.4};
  if(L<=60)return{n:7,spare:2,boxes:.5};
  return{n:8,spare:2,boxes:.55};
}

let G=null,gameId=0;
const later=(fn,ms)=>{const id=G.id;setTimeout(()=>{if(G&&G.id===id)fn()},ms)};
const solved=()=>G.stacks.every(s=>!s.length||isDone(s));

function startLevel(opts){
  opts=opts||{};
  const daily=!!opts.daily;const L=opts.level||save.level;
  let made,name;
  if(daily){
    made=makeLevel(5,2,hash("daily"+todayStr()),.35);name="Daily Shelf";
  }else if(L===1){
    made={stacks:[[0,0,0,1],[1,1,1],[0]].map(s=>s.map(k=>({k,h:false}))),par:2};name="Level 1";
  }else{
    const fv=favorFor(L),fm=fv&&favorLevel(L,fv);
    made=fm&&Object.assign({},fm,{stacks:JSON.parse(JSON.stringify(fm.stacks))});
    if(!made){const spec=levelSpec(L);
      made=makeLevel(spec.n,spec.spare,hash("lvl"+L),spec.boxes)||makeLevel(spec.n,spec.spare+1,hash("lvl+"+L),0)}
    name="Level "+L;

  hideClosed();
  G={id:++gameId,over:false,servedNow:[],gain:{},stacks:made.stacks,init:JSON.stringify(made.stacks),par:made.par,name,daily,level:L,moves:0,sel:-1,hintTo:-1,hist:[],extraUsed:false,extraIdx:null,
     kinds:kindsIn,sold:[],cust:null,custs:[],tips:0,streak:0,helped:false,hand:L===1&&!daily,handStep:0,
     seed:daily?hash("order"+todayStr()):hash("order"+L),day:dy,theme:dy?dayInfo(dy.d).theme:"default",
     favorOffer:made.favor||null,favor:null};
  buildQueue();
  renderAll();
  // one-time cards, shown one after another
  const cards=[];
  if(dy&&dy.b===1&&!save.dayOpen[dy.d])cards.push(next=>showDay(dy.d,next));
  if(G.favorOffer&&!keep(G.favorOffer.keep))cards.push(next=>showFavor(next));
  if(made.stacks.some(s=>s.some(x=>x.h))&&!save.seen.boxes)cards.push(next=>showIntro("boxes",next));
  else if(G.medalOk&&!G.hand&&!save.seen.service)cards.push(next=>showIntro("service",next));
  const run=()=>{const c=cards.shift();if(c)c(run);else closeSheet()};
  if(cards.length)run();
  else if(dy&&dy.b>1&&opts.resume)toast(`${dayInfo(dy.d).t} · shelf ${dy.b} of ${PER}`);
}
/* ---------- favors ---------- */
const favorFor=L=>{const dy=dayOf(L);if(!dy||dy.b!==PER)return null;const D=DAYS[dy.d-1];return D&&D.favor};
const favPred=(F,B)=>{const full=(T,k)=>T.some(s=>s.length===CAP&&s[0]===k&&s.every(x=>x===k));return T=>!(full(T,B)&&!full(T,F))};
/* the sale order the queue would use, from a solver route (optionally obeying a favor) */
function orderFrom(st,seed,pred){
  const sol=solve(st,40000,10,rng(seed),pred);
  if(!sol)return null;
  const S=st.map(s=>s.slice()),order=[];
  const full=s=>s.length===CAP&&s.every(x=>x===s[0]);
  for(const [a,b] of sol){const n=Math.min(topRun(S[a].map(k=>({k}))),CAP-S[b].length);
    S[b].push(...S[a].splice(S[a].length-n,n));if(full(S[b])&&!order.includes(S[b][0]))order.push(S[b][0])}
  return {order,sol};
}
/* a favor board: both kinds on the shelf, the usual queue serves B first, and a route exists that sells F first.
   Prefer boards where the favor really changes the plan (it costs extra moves, so par is reset for it) */
const FAVCACHE={};
function favorLevel(L,fv){
  if(L in FAVCACHE)return FAVCACHE[L];
  const spec=levelSpec(L),n=Math.max(4,spec.n),seed=hash("order"+L),pred=favPred(fv.F,fv.B);
  let pick=null;
  for(let t=0;t<40;t++){
    const m=makeLevel(n,2,hash("fav"+L+"#"+t),spec.boxes,[fv.F,fv.B]);if(!m)continue;
    const st=m.stacks.map(s=>s.map(x=>x.k));
    const nat=orderFrom(st,seed);if(!nat||nat.order.indexOf(fv.B)>nat.order.indexOf(fv.F))continue;
    const fo=orderFrom(st,seed,pred);if(!fo)continue;
    const fpar=bestPar(st,seed^0x5bd1,pred)||fo.sol.length;
    const cand=Object.assign(m,{fpar:Math.max(fpar,m.par),favor:fv});
    if(fpar>m.par){pick=cand;break}
    if(!pick)pick=cand;
  }
  return FAVCACHE[L]=pick;
}
function favorState(){
  if(!G.favor)return null;
  const f=G.sold.indexOf(G.favor.F),b=G.sold.indexOf(G.favor.B);
  if(f>=0&&(b<0||f<b))return "done";
  return b>=0?"missed":"open";
}
function acceptFavor(){
  const fv=G.favorOffer;G.favor=fv;G.par=FAVCACHE[G.level].fpar;
  buildQueue(favPred(fv.F,fv.B));G.lastCust=undefined;renderAll();
  toast("Favor accepted · the queue has changed");
}
function showFavor(next){
  const fv=G.favorOffer,p=PEOPLE.find(x=>x.id===fv.by),K=KEEPS[fv.keep];
  const other=G.custs.find(c=>c.want===fv.B);

/* one customer per kind on the shelf, in a fixed order. The order comes from a real solution,
   so serving everyone in turn (Perfect service) is always possible. */
const saleOrder=pred=>orderFrom(G.stacks.map(s=>s.map(x=>x.k)),G.seed,pred);
function buildQueue(pred){
  const R=rng(G.seed^0x9e37);
  const so=saleOrder(pred);
  G.medalOk=!!so;G.orderSol=so?so.sol:null;
  let order=so?so.order:G.kinds.slice();
  if(!so)for(let i=order.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  const pool=PEOPLE.map((p,i)=>i);for(let i=pool.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const used=new Set();
  G.custs=order.map(want=>{
    let pi=pool.find(i=>PEOPLE[i].fav===want&&!used.has(i));
    if(pi==null)pi=pool.find(i=>!used.has(i));
    if(pi==null){used.clear();pi=pool.find(i=>PEOPLE[i].fav!==want)??pool[0]}
    used.add(pi);return {p:PEOPLE[pi],want,st:0};
  });
  G.cust=curCust();
}

function tap(i){
  if(G.over)return;
  const st=G.stacks[i];
  G.hintTo=-1;G.revealed=null;hideStuck();
  if(G.sel<0){
    if(!st.length||isDone(st)){bad(i);return}
    G.sel=i;sfx.pick();renderUnit();return;
  }
  if(G.sel===i){G.sel=-1;renderUnit();return}
  const n=canMove(G.stacks,G.sel,i);
  if(!n){bad(i);return}
  const doneBefore=G.stacks.map(isDone);
  G.hist.push(JSON.stringify({s:G.stacks,sold:G.sold,m:G.moves,t:G.tips,k:G.streak,cs:G.custs.map(c=>c.st),g:G.gain,sn:G.servedNow}));
  const A=G.stacks[G.sel];
  const hidden=[];G.stacks.forEach((s2,a)=>s2.forEach((x,j)=>{if(x.h)hidden.push([a,j])}));
  const moved=A.splice(A.length-n,n);moved.forEach(x=>x.h=false);st.push(...moved);
  if(A.length)A[A.length-1].h=false;
  G.moves++;G.sel=-1;
  if(G.hand){G.handStep++;if(G.handStep>1)G.hand=false}
  sfx.drop();
  // every cubby that just became a full set celebrates, however it was formed
  const fresh=G.stacks.map((s2,j)=>isDone(s2)&&!doneBefore[j]?j:-1).filter(j=>j>=0);
  const wasHidden=[];fresh.forEach(j=>G.stacks[j].forEach((x,q)=>{if(x.h)wasHidden.push([j,q]);x.h=false}));
  const srcIdx=G.stacks.indexOf(A);
  G.revealed=hidden.filter(([a,j])=>a===srcIdx&&j===A.length-1&&!A[j].h).concat(wasHidden);
  if(G.revealed.length)setTimeout(()=>beep(780,.09,"triangle"),120);
  renderAll({i,n},fresh);
  const pause=wasHidden.length?1000:420;
  fresh.forEach(j=>{const ev=sell(G.stacks[j][0].k);later(()=>celebrateSet(j,ev),pause)});
  if(solved()){G.over=true;later(()=>{if(solved())win()},fresh.length?pause+1700:700)}
  else later(checkStuck,fresh.length?900:350);
}

const plain=()=>G.stacks.map(s=>s.map(x=>x.k));
function anyMove(){for(let a=0;a<G.stacks.length;a++)for(let b=0;b<G.stacks.length;b++)if(canMove(G.stacks,a,b))return true;return false}
function isStuck(){if(!anyMove())return true;const sol=solve(plain(),30000);return !sol&&!solve.hitLimit}
function checkStuck(){
  if(G.over||!isStuck())return;
  G.stuck=true;
  const host=$("stage");hideStuck();
  const d=document.createElement("div");d.className="stuck";d.id="stuckBox";
  d.innerHTML=`<b>This shelf is stuck</b><p>No way to sell everything from here. That's fine, it happens!</p><div class="row2"><button class="go" id="sUnstick">Back to a good spot</button>${G.extraUsed?"":`<button id="sExtra">Extra cubby</button>`}</div>`;
  host.appendChild(d);sfx.bad();

/* the rules of a sale, applied the moment a set completes; the show follows in celebrateSet */
function sell(k){
  if(G.sold.includes(k))return null;
  const fb=favorState();
  G.sold.push(k);
  const fa=favorState(),fav=fa!==fb?fa:null;
  const cur=curCust(),who=G.custs.find(c=>!c.st&&c.want===k);
  let coins=1,inOrder=false;
  if(who){
    if(who===cur){G.streak++;inOrder=true;who.st=1}
    else{G.streak=0;who.st=2}
    coins=3*(inOrder?Math.min(3,G.streak):1);
    // story progress is held on the board and only saved when the level is finished, so Undo takes it back
    const p=who.p,step=(save.story[p.id]||0)+(G.gain[p.id]||0);
    G.gain[p.id]=(G.gain[p.id]||0)+1;
    G.servedNow=G.servedNow.filter(x=>x!==p.id).concat(p.id);
    var line=p.story[Math.min(step,p.story.length-1)];
  }else G.streak=0;
  G.tips+=coins;
  return {k,who,cur,coins,inOrder,mult:Math.min(3,G.streak),line,fav};

function celebrateSet(j,ev){

  const k=st[0].k;
  const c=$("unit").children[j];
  if(c){const sl=[...c.querySelectorAll(".slot")];sl.forEach((s,q)=>{s.classList.remove("done","reveal","land");s.style.animationDelay=((sl.length-1-q)*.04)+"s";s.classList.add("pack")})}
  later(()=>{
    const c=$("unit").children[j];if(!c||!isDone(G.stacks[j]))return;
    c.querySelectorAll(".slot,.bag,.stampmark").forEach(s=>s.remove());
    c.insertAdjacentHTML("beforeend",`<div class="bag">${bagArt(k)}</div><div class="stampmark slam">SOLD</div>`);
    c.classList.remove("shine");void c.offsetWidth;c.classList.add("shine");
  },300);
  sfx.stamp();
  if(!ev)return;
  if(ev.who){
    const p=ev.who.p;
    say(`<b>${p.nm}:</b> ${ev.line}`);
    if(ev.inOrder){
      toast(ev.mult>1?`Tip streak x${ev.mult}! +${ev.coins}`:`${p.nm} tipped +${ev.coins}`);
      later(()=>flyBag($("unit").children[j],k,true),320);
      later(()=>{renderFront(true);sfx.bell()},900);
      later(()=>{G.cust=curCust();renderFront();const b=$("bubble");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")},1700);
    }else{
      toast(`${p.nm} took their ${KINDS[k].name.toLowerCase()} early +${ev.coins} · streak reset`);
      renderFront();
    }
  }else toast(`Sold ${KINDS[k].name.toLowerCase()} +1`);
  if(ev.fav){const fp=PEOPLE.find(x=>x.id===G.favor.by);
    later(()=>{renderFavNote();
      if(ev.fav==="done"){toast(`Favor done! ${fp.nm} will stop by at closing`);say(`<b>${fp.nm}:</b> ${G.favor.thanks}`)}
      else toast(`${KINDS[G.favor.B].name} went first · favor missed. Undo to try again`)},1500)}
  flyCoins(c,Math.min(6,ev.coins));renderHud();
}

function win(){
  sfx.win();
  const stars=starsFor(G.moves,G.par,G.helped);
  const L=G.level;const prev=G.daily?0:(save.stars[L]||0);
  let earned=G.tips,firstClear=false;
  if(G.daily)earned+=25;
  else if(!prev){firstClear=true;earned+=5+G.kinds.length+stars*2}
  else if(stars>prev)earned+=(stars-prev)*3;
  const dy=G.day;
  // the day's log feeds the closing scene
  if(dy&&firstClear){if(save.dayLog.d!==dy.d)save.dayLog={d:dy.d,gain:{}};for(const id in G.gain)save.dayLog.gain[id]=(save.dayLog.gain[id]||0)+G.gain[id]}
  for(const id in G.gain){save.story[id]=(save.story[id]||0)+G.gain[id];save.served+=G.gain[id]}
  G.gain={};
  // favors: a kept favor earns its keepsake, handed over at closing (or right away on a replay)
  let gift=null;const closing=dy&&dy.b===PER&&firstClear;
  if(G.favorOffer&&!keep(G.favorOffer.keep)){const rec=save.days[dy.d]=save.days[dy.d]||{};
    const fs=favorState();
    if(fs==="done"){rec.fav="done";gift=G.favorOffer.keep;if(!closing)save.keeps.push(gift)}
    else if(rec.fav!=="done")rec.fav=G.favor?"missed":"declined";}
  const inOrder=G.custs.filter(c=>c.st===1).length,perfect=G.medalOk&&inOrder===G.custs.length;
  if(perfect&&(G.daily||!save.service[L])){earned+=5;if(!G.daily)save.service[L]=1}
  save.coins+=earned;
  let extra="";
  if(G.daily){
    const d=todayStr(),y=todayStr(-1);
    // one missed day a week is forgiven
    const graceOk=save.daily.last===todayStr(-2)&&(!save.daily.grace||(new Date(d)-new Date(save.daily.grace))>=7*864e5);
    if(save.daily.last!==d){if(graceOk&&save.daily.last!==y)save.daily.grace=d;save.daily.streak=save.daily.last===y||graceOk?save.daily.streak+1:1;save.daily.best=Math.max(save.daily.best,save.daily.streak);save.daily.last=d;save.daily.doneMoves=G.moves}
    extra=`<div class="share" id="shareTxt">Shelvy Daily ${d} · ${"★".repeat(stars)}${"☆".repeat(3-stars)} · ${G.moves} moves${perfect?" · 🎀":""} · 🔥${save.daily.streak}</div><button class="big alt" id="copyShare">Copy share line</button>`;
  }else{
    save.stars[L]=Math.max(prev,stars);
    if(L===save.level)save.level++;
  }
  persist();renderHud();
  const nextUp=UPS.find(u=>!has(u.id));
  const why=stars===3?"Spotless. Not a single wasted move.":G.helped&&G.moves<=G.par?"Hints and extra cubbies cap a level at 2 stars.":G.moves===G.par+1?"Just 1 move from perfect!":`Finish in ${G.par} moves or fewer for 3 stars.`;
  const shopLine=nextUp?`<div class="prog"><span>Next for your shop: ${nextUp.ic} ${nextUp.nm}</span><span>${Math.min(save.coins,nextUp.cost)}/${nextUp.cost}</span></div><div class="bar"><i id="upBar" style="width:${Math.min(100,(save.coins-earned)/nextUp.cost*100)}%"></i></div>`:`<p>Your shop is fully fixed up.</p>`;
  const regs=G.servedNow.map(id=>{const p=PEOPLE.find(x=>x.id===id),n=Math.min(6,save.story[id]||0);return `<div>${faceSvg(p)}${p.nm} <span class="h">${"♥".repeat(n)}${"♡".repeat(6-n)}</span></div>`}).join("");
  const lastId=G.servedNow[G.servedNow.length-1],lastP=lastId&&PEOPLE.find(x=>x.id===lastId);
  const hn=lastP?Math.min(6,save.story[lastId]):0;
  const moment=lastP?`<div class="moment">${faceSvg(lastP)}<div><b>${lastP.nm}</b> <span class="hearts">${[0,1,2,3,4,5].map(i=>`<span class="${i<hn-1?"on":i===hn-1?"on new":""}">${i<hn?"♥":"♡"}</span>`).join("")}</span><p>“${lastP.story[Math.min(save.story[lastId],lastP.story.length)-1]}”</p></div></div>`:"";
  const service=G.medalOk?`<p class="service">${perfect?`🎀 <b>Perfect service!</b> Everyone served in the order they came in.`:`${inOrder} of ${G.custs.length} customers served in order. Serve each one before selling anything else for 🎀.`}</p>`:"";
  const full=firstClear||(G.daily&&save.daily.doneMoves===G.moves&&save.daily.last===todayStr());
  const nextL=Math.min(L+1,save.level);
  const favLine=G.favor?`<p class="service">${gift?`🤝 <b>Favor kept!</b> ${PEOPLE.find(x=>x.id===G.favor.by).nm} ${closing?"will drop by at closing time.":"has something for you."}`:`🤝 Favor missed this time. Try again from the Levels map whenever you like.`}</p>`:"";
  const nextLabel=G.daily?"Play on":closing?"Close up shop 🌙":dy&&nextL===L+1&&dayOf(nextL).d===dy.d?`Shelf ${dy.b+1} of ${PER}`:"Level "+nextL;
  sheet(`<div class="${full?"seq":""}" id="winBody"><h3>${G.daily?"Daily Shelf done":"Shelves sorted!"}</h3>${dy?`<p class="sub" style="margin:-4px 0 0;font-weight:800;font-size:13px">${dayInfo(dy.d).t} · shelf ${dy.b} of ${PER}</p>`:""}
    ${moment}
    <div class="s1"><div class="bigstars">${starSpans(stars)}</div>
    <p>${why}</p>${service}${favLine}</div>
    <div class="s2"><div class="stats"><div><small>Moves</small><strong>${G.moves}</strong></div><div><small>Par</small><strong>${G.par}</strong></div><div><small>Coins</small><strong>+${earned}</strong></div></div>
    ${G.servedNow.length>1?`<div class="winregs"><span>Also served</span>${G.servedNow.slice(0,-1).map(id=>faceSvg(PEOPLE.find(x=>x.id===id))).join("")}</div>`:""}
    ${shopLine}
    ${extra}
    <div class="row2"><button class="big alt" id="goMap">Levels</button>${stars<3&&!G.daily?`<button class="big alt" id="goRetry">Try again</button>`:""}<button class="big" id="goNext">${nextLabel}</button></div>
    ${gift&&!closing?`<button class="big alt" id="goGift">${KEEPS[gift].ic} See what ${PEOPLE.find(x=>x.id===KEEPS[gift].by).nm} brought</button>`:""}
    ${nextUp&&save.coins>=nextUp.cost&&!closing?`<button class="big alt" id="goShop">Fix up shop, then ${G.daily?"play on":"Level "+nextL}</button>`:""}</div></div>`,
    root=>{
      const wb=root.querySelector("#winBody");root.querySelector(".card").addEventListener("pointerdown",()=>wb.classList.remove("seq"),{once:true});
      const ub=root.querySelector("#upBar");if(ub&&nextUp)setTimeout(()=>ub.style.width=Math.min(100,save.coins/nextUp.cost*100)+"%",250);
      root.querySelector("#goNext").onclick=closing?()=>openClosing(dy.d,gift):()=>{closeSheet();startLevel(G.daily?{}:{level:nextL})};
      const gg=root.querySelector("#goGift");if(gg)gg.onclick=()=>revealKeep(gift,"default",()=>{closeSheet();startLevel({level:nextL})},"Level "+nextL);
      const rt=root.querySelector("#goRetry");if(rt)rt.onclick=()=>{closeSheet();startLevel({level:L})};
      root.querySelector("#goMap").onclick=openMenu;
      const gs=root.querySelector("#goShop");if(gs)gs.onclick=()=>{startLevel(G.daily?{}:{level:nextL});openShop()};
      const cp=root.querySelector("#copyShare");if(cp)cp.onclick=()=>{const t=root.querySelector("#shareTxt").textContent;
        try{navigator.clipboard.writeText(t).then(()=>cp.textContent="Copied",()=>selectShare(root))}catch(e){selectShare(root)}};
    },true);
}
function selectShare(root){const el=root.querySelector("#shareTxt");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* tools */
function undoOnce(){const h=JSON.parse(G.hist.pop());G.stacks=h.s;G.sold=h.sold;G.moves=h.m;G.tips=h.t;G.streak=h.k;
  G.custs.forEach((c,i)=>c.st=h.cs[i]);G.cust=curCust();G.gain=h.g;G.servedNow=h.sn;
  if(G.extraIdx!=null&&G.extraIdx>=G.stacks.length)G.extraIdx=null}
$("tUndo").onclick=()=>{if(G.over||!G.hist.length)return;hideStuck();const was=favorState();undoOnce();G.sel=-1;G.hintTo=-1;G.revealed=null;sfx.drop();renderAll();if(was==="missed"&&favorState()==="open")toast("Favor back on")};
$("tRestart").onclick=()=>{if(G.over)return;hideStuck();G.revealed=null;G.stacks=JSON.parse(G.init);G.moves=0;G.sel=-1;G.hintTo=-1;G.hist=[];G.sold=[];G.tips=0;G.streak=0;G.extraUsed=false;G.extraIdx=null;G.helped=false;G.custs.forEach(c=>c.st=0);G.cust=curCust();G.gain={};G.servedNow=[];renderAll()};
$("tExtra").onclick=()=>{if(G.over||G.extraUsed)return;hideStuck();G.extraUsed=true;G.helped=true;G.stacks.push([]);G.extraIdx=G.stacks.length-1;sfx.bell();toast("An extra cubby, on the house");renderAll()};
$("tHint").onclick=()=>{
  if(G.over)return;
  let sol=favorState()==="open"?solve(plain(),40000,0,null,favPred(G.favor.F,G.favor.B)):null;
  if(!sol)sol=solve(plain(),40000);
  if(!sol||!sol.length){if(!solve.hitLimit)checkStuck();else toast("Try an Undo, then ask again");return}
  const [a,b]=sol[0];G.sel=a;G.hintTo=b;G.helped=true;G.hand=false;sfx.pick();
  renderUnit();renderHud();toast("Follow the arrow");
};
$("btnMute").onclick=()=>{save.muted=!save.muted;persist();renderHud();if(!save.muted)beep(660,.08)};

/* sheets */
function sheet(html,bind,noDismiss){
  const host=$("sheetHost");
  host.innerHTML=`<div class="sheet" id="sheetBg"><div class="card" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg=$("sheetBg");
  if(!noDismiss)bg.addEventListener("click",e=>{if(e.target===bg)closeSheet()});
  bind&&bind(bg);
  const f=bg.querySelector("button");f&&f.focus({preventScroll:true});
}
function closeSheet(){$("sheetHost").innerHTML=""}

function openShop(){
  const rows=UPS.map(u=>`<button class="up${has(u.id)?" own":""}" data-id="${u.id}" ${!has(u.id)&&save.coins<u.cost?"disabled":""}>
     <span class="ic">${u.ic}</span><span class="nm">${u.nm}<small>${u.d}</small></span><span class="pr">${has(u.id)?"Owned":u.cost}</span></button>`).join("");
  sheet(`<h3>Fix up your shop</h3><p>Spend coins from tidy shelves and happy customers. You have <b>${save.coins}</b>.</p><div class="ups">${rows}</div><button class="big alt" id="closeShop">Done</button>`,root=>{
    root.querySelectorAll(".up").forEach(b=>b.onclick=()=>{const u=UPS.find(x=>x.id===b.dataset.id);if(has(u.id)||save.coins<u.cost)return;
      save.coins-=u.cost;save.owned.push(u.id);persist();renderFront();renderHud();revealUpgrade(u)});
    root.querySelector("#closeShop").onclick=closeSheet;
  });
}

/* a bought upgrade gets its moment: the whole shop, before fading to after, with a sparkle where it lands */
function revealUpgrade(u){
  const p=PEOPLE.find(x=>x.id===u.by);
  const own=save.owned;save.owned=own.filter(x=>x!==u.id);const before=frontSvg(p,false,false);save.owned=own;
  const after=frontSvg(p,true,false);
  const [x,y]=u.at;
  sheet(`<div class="reveal"><div class="rv"><div class="zoom" style="transform-origin:${x/480*100}% ${y/180*100}%">${before}<div class="after">${after}</div><div class="spark" style="left:${x/480*100}%;top:${y/180*100}%">${"<i></i>".repeat(8)}</div></div></div>
    <h3>New: ${u.ic} ${u.nm}</h3><p class="quote2"><b>${p.nm}:</b> “${u.line}”</p>
    <div class="row2"><button class="big alt" id="rvShop">Shop</button><button class="big" id="rvOk">Lovely</button></div></div>`,root=>{
    root.querySelector("#rvOk").onclick=closeSheet;root.querySelector("#rvShop").onclick=openShop;
  });
  setTimeout(()=>{sfx.bell();setTimeout(()=>beep(1560,.2,"sine",.04),180)},500);
}
/* a keepsake arrives: the person hands it over and it appears in the shop front */
function revealKeep(k,theme,onDone,doneLabel){
  const K=KEEPS[k],p=PEOPLE.find(x=>x.id===K.by);
  save.keeps=save.keeps.filter(x=>x!==k);const before=frontSvg(p,false,false,theme);
  save.keeps.push(k);persist();const after=frontSvg(p,true,false,theme);
  const [x,y]=K.at;
  sheet(`<div class="reveal"><div class="rv"><div class="zoom" style="transform-origin:${x/480*100}% ${y/180*100}%">${before}<div class="after">${after}</div><div class="spark" style="left:${x/480*100}%;top:${y/180*100}%">${"<i></i>".repeat(8)}</div></div></div>
    <h3>${K.ic} ${K.nm}</h3><p class="quote2"><b>${p.nm}:</b> “${K.line}”</p><p style="font-size:13px">A keepsake for your shop front. It stays there for good.</p>
    <button class="big" id="kpOk">${doneLabel||"Lovely"}</button></div>`,root=>{root.querySelector("#kpOk").onclick=onDone||closeSheet},true);
  renderFront();
  setTimeout(()=>{sfx.bell();setTimeout(()=>beep(1560,.2,"sine",.04),180)},500);
}
/* closing time after the day's third shelf: what changed today, then a peek at tomorrow */
function openClosing(d,gift){
  if(gift&&!keep(gift))return revealKeep(gift,"night",()=>openClosing(d,null),"Close up");
  const D=dayInfo(d),N=dayInfo(d+1),nf=N.favor,np=nf&&PEOPLE.find(x=>x.id===nf.by);
  const log=save.dayLog.d===d?save.dayLog.gain:{};
  const faces=Object.keys(log).map(id=>{const p=PEOPLE.find(x=>x.id===id),n=Math.min(6,save.story[id]||0);return `<div>${faceSvg(p)}${p.nm} <span class="h">+${log[id]}♥</span></div>`}).join("");
  const fv=D.favor,rec=save.days[d]||{},kept=fv&&keep(fv.keep);
  const favLine=!fv?"":kept?`<p class="service">${KEEPS[fv.keep].ic} <b>New in your shop:</b> ${KEEPS[fv.keep].nm}, from ${PEOPLE.find(x=>x.id===fv.by).nm}.</p>`
    :`<p class="service">${PEOPLE.find(x=>x.id===fv.by).nm}’s ${KEEPS[fv.keep].nm.toLowerCase()} is still waiting. Replay shelf ${PER} of Day ${d} from the Levels map to take the favor.</p>`;
  sheet(`<div class="closing"><div class="rv">${frontSvg(null,false,false,"night")}</div>
    <h3>Closing time</h3><p style="margin-top:-4px;font-weight:800;font-size:13px">Day ${d} · ${D.t}</p>
    ${faces?`<p style="margin:8px 0 0;font-weight:800;font-size:12px;color:var(--ink-soft)">TODAY YOU SERVED</p><div class="today">${faces}</div>`:""}
    ${favLine}
    <div class="keepprev${np?" peek":""}">${np?`<div class="pk">${keepArt(nf.keep)}</div>`:""}<div><b>Tomorrow: ${N.t}</b><small>${D.next}</small></div></div>
    <div class="row2"><button class="big alt" id="closeUp">Close up for now</button><button class="big" id="openDay">Open Day ${d+1}</button></div></div>`,root=>{
      root.querySelector("#openDay").onclick=()=>{closeSheet();startLevel({level:dayFirst(d+1)})};
      root.querySelector("#closeUp").onclick=()=>{closeSheet();showClosed(d)};
    },true);
}
/* the shop stays shut on screen until the player opens the next day; their place is already saved */
function showClosed(d){
  G.theme="night";renderFront();hideClosed();
  const el=document.createElement("div");el.className="stuck";el.id="closedBox";
  el.innerHTML=`<b>Closed for the night</b><p>Your place is saved. Day ${d+1} is ready when you are.</p><div class="row2"><button class="go" id="cOpen">Open Day ${d+1}</button></div>`;
  $("stage").appendChild(el);el.querySelector("#cOpen").onclick=()=>startLevel({level:dayFirst(d+1)});
}
function hideClosed(){const b=$("closedBox");if(b)b.remove()}
function openMenu(){
  const d=todayStr();const doneToday=save.daily.last===d;
  const totalStars=Object.values(save.stars).reduce((a,b)=>a+b,0);
  const cell=(L,label)=>{const locked=L>save.level;const s=save.stars[L]||0;
    return `<button class="lv${L===save.level?" cur":""}" data-l="${L}" ${locked?"disabled":""} aria-label="${label}${locked?", locked":`, ${s} stars`}">${locked?"🔒":L}${locked?"":starHtml(s)}${save.service[L]?`<span class="rib" aria-label="perfect service">🎀</span>`:""}</button>`};
  // the lesson, then one row per shop day
  let cells=`<div class="dayrow"><div class="dl"><b>Lesson</b>First shelf</div>${cell(1,"Lesson")}<span class="lv" style="visibility:hidden"></span><span class="lv" style="visibility:hidden"></span><span class="kp"></span></div>`;
  const lastDay=Math.max(3,dayOf(Math.max(DAY0,save.level)).d+1);
  for(let d=1;d<=lastDay;d++){const D=dayInfo(d),fv=D.favor;
    cells+=`<div class="dayrow"><div class="dl"><b>Day ${d}</b>${D.t}</div>${[0,1,2].map(i=>cell(dayFirst(d)+i,`Day ${d} shelf ${i+1}`)).join("")}<span class="kp${fv&&!keep(fv.keep)?" no":""}" title="${fv?KEEPS[fv.keep].nm+(keep(fv.keep)?"":" (take the favor on shelf 3)"):""}">${fv?KEEPS[fv.keep].ic:""}</span></div>`}
  sheet(`<h3>Shelvy</h3><p>${totalStars} stars collected · ${save.served} regulars served</p>
   <button class="dailycard" id="mDaily"><span style="font-size:30px">📅</span><span><b>Daily Shelf</b><span>${doneToday?`Done today in ${save.daily.doneMoves} moves · 🔥${save.daily.streak}`:`Today's shelf is open · 🔥${save.daily.streak} streak`}</span></span><span class="go">›</span></button>
   <h4>Levels</h4><div class="days">${cells}</div>
   <div class="row2"><button class="big alt" id="mRegs">Regulars</button><button class="big alt" id="mHelp">How to play</button></div>
   <button class="big" id="mClose">Keep playing</button>`,root=>{
    root.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{closeSheet();startLevel({level:+b.dataset.l})});
    root.querySelector("#mDaily").onclick=()=>{closeSheet();startLevel({daily:true})};
    root.querySelector("#mRegs").onclick=openRegulars;
    root.querySelector("#mHelp").onclick=openHelp;
    root.querySelector("#mClose").onclick=closeSheet;
  });
}
function openRegulars(){
  const rows=PEOPLE.map(p=>{const n=save.story[p.id]||0;
    const hearts="♥".repeat(Math.min(6,n))+"♡".repeat(Math.max(0,6-n));
    const body=n?`“${p.story[Math.min(n,p.story.length)-1]}”`:`Not served yet. Loves ${KINDS[p.fav].name.toLowerCase()}.`;
    return `<div class="reg">${faceSvg(p)}<div><div class="nm">${p.nm}<small>${hearts}</small></div><p>${body}</p></div></div>`}).join("");
  sheet(`<h3>Your regulars</h3><p>Serve a regular what they asked for and their story moves on.</p><div class="regs">${rows}</div><button class="big alt" id="back">Back</button>`,root=>{root.querySelector("#back").onclick=openMenu});
}
function openHelp(){
  sheet(`<h3>How to play</h3>
  <ol class="rules"><li><b>Tap a cubby</b> to pick up the top goods.</li><li><b>Tap another cubby</b> to set them down, on an empty spot or on the same kind.</li><li>Fill a cubby with <b>4 of one kind</b> and it sells.</li><li>Each customer <b>tips</b> when the goods they asked for sell. The strip at the top left shows who's <b>next</b>.</li><li>Sell the current customer's goods <b>before anything else</b> and tips double, then triple: a <b>tip streak</b>. Selling something else first resets the streak (they still tip).</li><li>Serve everyone in the order they arrive for <b>🎀 Perfect service</b>. It's optional, and always possible.</li><li>Finish within par for <b>3 stars</b>.</li><li>Each <b>shop day</b> is three shelves, then closing time. On the last shelf a regular may ask a <b>favor</b>: say yes and the queue changes to suit them, with par set to match. Keep it and they bring a keepsake for your shop.</li></ol>
  <p>No timer. If a shelf gets stuck we'll tell you and take you back to a good spot. Undo is free, hints are free, and you get one extra cubby per level (hints and extra cubbies cap a level at 2 stars). Boxes show what's inside once they reach the top.</p>
  <button class="big" id="ok">Let's sort</button>
  <p style="font-size:12px;margin-top:14px">Prototype v${VERSION} · Bright Harbor Games. <button class="linkbtn" id="reset">Reset progress</button></p>`,root=>{
    root.querySelector("#ok").onclick=closeSheet;
    root.querySelector("#reset").onclick=e=>{if(e.target.dataset.sure){const m=save.muted;save=fresh();save.muted=m;persist();closeSheet();startLevel()}else{e.target.dataset.sure=1;e.target.textContent="Tap again to reset"}};
  });
}
function todayStr(off=0){const t=new Date(Date.now()+off*864e5);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`}

$("brandSub").textContent="Bright Harbor Games · v"+VERSION;
$("btnShop").onclick=openShop;$("btnMenu").onclick=openMenu;
window.addEventListener("resize",()=>{if(G){layout();drawArrow()}});

window.__shelvy={get G(){return G},solve,makeLevel,levelSpec,tap,startLevel,isStuck,canMove,revealUpgrade,UPS,save:()=>save,favorState,favPred,dayOf,openClosing,KEEPS};
startLevel({resume:true});
})();
</script>
</body>
</html>
