<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<!-- Tilt River prototype v0.1 (working title; backlog L1 "Tilt boat run"). Unlisted test page: not linked from the site. Replace this file to update. -->
<title>Tilt River (test version)</title>
<style>
:root {
  --ink: #213a34; --ink2: #5c7068; --card: rgba(255,251,240,.96); --cardLine: rgba(60,50,30,.12);
  --accent: #2f8f7d; --accentInk: #ffffff; --warm: #e0893a; --bad: #d4553f; --good: #2f9b5a;
  --btn: #ffffff; --btnInk: #213a34; --shade: rgba(20,30,25,.45); --land: #6c8546;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #eef3ea; --ink2: #b3c2b8; --card: rgba(28,40,36,.96); --cardLine: rgba(255,255,255,.1);
    --accent: #4fb9a2; --accentInk: #10221d; --btn: #2a3d37; --btnInk: #eef3ea; --shade: rgba(0,0,0,.55); --land: #4f6435;
  }
}
:root[data-theme="dark"] {
  --ink: #eef3ea; --ink2: #b3c2b8; --card: rgba(28,40,36,.96); --cardLine: rgba(255,255,255,.1);
  --accent: #4fb9a2; --accentInk: #10221d; --btn: #2a3d37; --btnInk: #eef3ea; --shade: rgba(0,0,0,.55); --land: #4f6435;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--land); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font-family: "Nunito", "Trebuchet MS", system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hide { display: none !important; }
#hud { position: fixed; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 12px 0; display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
#hud .pill { white-space: nowrap; background: rgba(255,251,240,.88); color: #213a34; border-radius: 14px; padding: 6px 11px; font-weight: 800; font-size: 17px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
#hud .pill small { font-weight: 700; font-size: 12px; color: #5c7068; margin-left: 2px; }
#hud .grow { flex: 1; display: flex; justify-content: center; gap: 8px; }
#pauseBtn { pointer-events: auto; border: 0; font: inherit; cursor: pointer; width: 40px; height: 36px; padding: 0; }
#hull span { display: inline-block; width: 14px; height: 18px; margin: 0 1px; vertical-align: -3px;
  background: #9a6a3c; border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%; border: 2px solid #6b4425; }
#hull span.lost { background: transparent; border-color: rgba(107,68,37,.35); }
#delta.good { color: #2f9b5a; } #delta.bad { color: #d4553f; }
#tip { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top)) + 52px);
  width: min(92vw, 400px); background: var(--card); color: var(--ink); border-radius: 18px; padding: 12px 14px 12px 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,.25); display: flex; gap: 12px; align-items: center; pointer-events: none; }
#tip .step { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; }
#tip .txt { font-size: 17px; font-weight: 700; line-height: 1.3; }
#tip .sub { font-size: 14px; color: var(--ink2); margin-top: 2px; line-height: 1.3; }
#tipIcon { flex: none; width: 54px; height: 54px; }
#toast { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 10px); transform: translateX(-50%);
  background: var(--card); color: var(--ink); padding: 10px 14px; border-radius: 14px; font-weight: 700; font-size: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.25); width: max-content; max-width: 90vw; text-align: center; pointer-events: none; }
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.screen.dim { background: var(--shade); }
.panel { width: min(100%, 380px); background: var(--card); border-radius: 24px; padding: 20px 18px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.3); text-align: center; }
.panel h1 { margin: 0; font-size: 34px; letter-spacing: .3px; line-height: 1.05; }
.panel h1 small { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); letter-spacing: 0; margin-top: 4px; }
.panel h2 { margin: 0 0 4px; font-size: 26px; }
.panel p { margin: 6px 0; color: var(--ink2); font-size: 15px; line-height: 1.4; }
.big { display: block; width: 100%; border: 0; border-radius: 16px; padding: 13px 12px; margin-top: 10px; font: inherit; font-size: 19px; font-weight: 800; cursor: pointer;
  background: var(--accent); color: var(--accentInk); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.big small { display: block; font-size: 13px; font-weight: 700; opacity: .85; margin-top: 1px; }
.big.alt { background: var(--btn); color: var(--btnInk); border: 2px solid var(--cardLine); box-shadow: none; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.row button { flex: 1; border: 2px solid var(--cardLine); background: var(--btn); color: var(--btnInk); border-radius: 14px; padding: 9px 6px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
.row button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accentInk); }
.lbl { font-size: 12px; font-weight: 800; color: var(--ink2); text-transform: uppercase; letter-spacing: .5px; margin-top: 14px; text-align: left; }
.stats { display: flex; gap: 8px; margin: 12px 0 4px; }
.stats div { flex: 1; background: rgba(47,143,125,.1); border-radius: 14px; padding: 8px 4px; }
.stats b { display: block; font-size: 24px; }
.stats span { font-size: 12px; font-weight: 700; color: var(--ink2); }
.new { color: var(--warm); font-weight: 800; }
.foot { font-size: 12px; color: var(--ink2); margin-top: 12px; }
#tester { margin-top: 10px; }
</style>
</head>
<body>
<canvas id="c" aria-label="River game"></canvas>

<div id="hud" class="hide">
  <button id="pauseBtn" class="pill" aria-label="Pause">II</button>
  <div class="grow">
    <div class="pill" id="distPill"><span id="dist">0</span><small>m</small></div>
    <div class="pill" id="timePill"><span id="time">0:00.0</span> <small id="delta"></small></div>
    <div class="pill" id="coinPill"><span id="coins">0</span><small>coins</small></div>
  </div>
  <div class="pill" id="hull" aria-label="Boat health"></div>
</div>

<div id="tip" class="hide" role="status" aria-live="polite">
  <canvas id="tipIcon" width="108" height="108"></canvas>
  <div><div class="step" id="tipStep"></div><div class="txt" id="tipTxt"></div><div class="sub" id="tipSub"></div></div>
</div>
<div id="toast" class="hide" role="status" aria-live="polite"></div>

<div id="menu" class="screen">
  <div class="panel">
    <h1 id="title">Tilt River<small>prototype v0.1 · working title</small></h1>
    <p>Tilt your phone to steer down the river. Grab coins, miss the rocks, ride the white rapids.</p>
    <button class="big" id="playEndless">Endless river<small id="bestEndless">Go as far as you can</small></button>
    <button class="big" id="playDaily">Daily River<small id="bestDaily">Same river for everyone today</small></button>
    <div class="lbl">Steering</div>
    <div class="row" id="steerRow">
      <button data-steer="tilt" aria-pressed="false">Tilt phone</button>
      <button data-steer="thumb" aria-pressed="false">Thumb drag</button>
    </div>
    <div class="row">
      <button id="howBtn">How to play</button>
      <button id="soundBtn" aria-pressed="true">Sound on</button>
    </div>
    <div class="foot" id="walletLine"></div>
    <div id="tester" class="hide row"><button id="resetTut">Reset lesson</button><button id="resetAll">Reset all</button></div>
  </div>
</div>

<div id="pause" class="screen dim hide">
  <div class="panel">
    <h2>Paused</h2>
    <button class="big" id="resume">Keep going</button>
    <button class="big alt" id="recenter">Recenter tilt<small>Hold the phone how you like, then tap</small></button>
    <button class="big alt" id="quit">Back to menu</button>
  </div>
</div>

<div id="result" class="screen dim hide">
  <div class="panel">
    <h2 id="resTitle"></h2>
    <p id="resLine"></p>
    <div class="stats" id="resStats"></div>
    <p id="resNote"></p>
    <button class="big" id="again">Go again</button>
    <button class="big alt" id="toMenu">Menu</button>
  </div>
</div>

<script>
(function () {
'use strict';
// ---------- storage (single store helper) ----------
var PFX = 'tiltriver.';
var store = {
  get: function (k, d) { try { var v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(PFX + k); } catch (e) {} }
};
var qs = new URLSearchParams(location.search);
function resetAll() { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(PFX) === 0) localStorage.removeItem(k); }); } catch (e) {} }
if (qs.get('fresh') === '1') resetAll();

// ---------- helpers ----------
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function h1(i, s) { var x = Math.sin(i * 127.1 + (s || 0) * 311.7) * 43758.5453; return x - Math.floor(x); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function todayKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dailyNumber() { var d = new Date(); var a = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); return Math.floor((a - Date.UTC(2026, 9, 29)) / 864e5) + 1; }
function fmtTime(t) { var m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function $(id) { return document.getElementById(id); }

// ---------- canvas ----------
var cv = $('c'), ctx = cv.getContext('2d');
var VW = 400;            // world width in units
var W, H, DPR, SC, OX, VH, BOAT_SY;
function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  var gw = Math.min(W, H * 0.66); SC = gw / VW; OX = (W - gw) / 2; VH = H / SC; BOAT_SY = VH * 0.74;
}
addEventListener('resize', resize); resize();

// ---------- world ----------
var STEP = 10; // river sample spacing (units). 10 units = 1 m
var DAILY_LEN = 15000; // 1500 m
var game = null;

function River(seed, gentleUntil) {
  var r = mulberry(seed), cx = [], hw = [], x = 200, slope = 0, tSlope = 0, seg = 0, wPh = r() * 9, wPh2 = r() * 9;
  this.cx = cx; this.hw = hw; this.decor = [];
  var self = this;
  this.diff = function (d) { return smooth((d - 1500) / 32000); };
  this.ext = function (n) {
    while (cx.length < n) {
      var i = cx.length, d = i * STEP, df = self.diff(d), calm = d < gentleUntil ? 0.35 : 1;
      if (--seg <= 0) { tSlope = (r() * 2 - 1) * lerp(0.28, 0.5, df) * calm; seg = 18 + r() * 40; }
      slope += (tSlope - slope) * 0.06; x += slope * STEP;
      var h = lerp(122, 70, df) + Math.sin(i * 0.031 + wPh) * 14 + Math.sin(i * 0.087 + wPh2) * 6;
      if (d < gentleUntil) h = Math.max(h, 125);
      var lo = h + 22, hi = VW - h - 22;
      if (x < lo) { x = lo; slope = Math.abs(slope) * 0.4; tSlope = Math.abs(tSlope); }
      if (x > hi) { x = hi; slope = -Math.abs(slope) * 0.4; tSlope = -Math.abs(tSlope); }
      cx.push(x); hw.push(h);
      if (i % 4 === 0) self.addDecor(i, r);
    }
  };
  this.at = function (d) { if (d < 0) d = 0; var f = d / STEP, i = Math.floor(f); if (i < 0) i = 0; self.ext(i + 3); var t = f - i; return { x: lerp(cx[i], cx[i + 1], t), h: lerp(hw[i], hw[i + 1], t) }; };
  this.addDecor = function (i, r) {
    var d = i * STEP;
    for (var side = -1; side <= 1; side += 2) {
      var n = r() < 0.45 ? 1 : 2;
      for (var k = 0; k < n; k++) {
        var gap = 2 + r() * 95, roll = r(), type = roll < 0.5 ? 'pine' : roll < 0.72 ? 'bush' : roll < 0.9 ? 'boulder' : 'slab';
        if (gap < 10 && type === 'pine') type = r() < 0.5 ? 'bush' : 'boulder';
        self.decor.push({ d: d + r() * 40, side: side, gap: gap, type: type, s: type === 'pine' ? 13 + r() * 12 : type === 'slab' ? 18 + r() * 22 : type === 'bush' ? 7 + r() * 7 : 6 + r() * 9, seed: r() * 1000 });
      }
    }
  };
}

function newGame(mode) {
  var seed, daily = mode === 'daily';
  if (daily) seed = hashStr('tiltriver-daily-' + todayKey());
  else if (mode === 'attract') seed = 4242;
  else seed = (Math.random() * 4294967296) >>> 0;
  var riv = new River(seed, mode === 'tutorial' ? 99999 : 1500);
  riv.ext(400);
  var g = {
    mode: mode, river: riv, objR: mulberry(seed ^ 0x9e3779b9), d: 0, x: riv.cx[0], vx: 0, t: 0, coins: 0, hull: 3, invuln: 0,
    boost: 0, slow: 0, scrape: 0, rocks: [], coinsArr: [], boosts: [], parts: [], wake: [], spawnD: mode === 'tutorial' ? 1e12 : 1400,
    safeO: 0, safeD: 0, over: false, finished: false, ghostRec: [], ghostT: 0, ghost: null, best: 0, shake: 0, flow: 0, tut: null, lastMoveL: 0, lastMoveR: 0
  };
  if (daily) { g.ghost = store.get('ghost.' + todayKey(), null); }
  if (mode === 'endless') g.best = store.get('bestEndless', 0);
  if (mode === 'tutorial') g.tut = { step: 0, t: 0, minX: g.x, maxX: g.x, startX: g.x, endD: 0, tries: 0, hitOnce: false };
  return g;
}

// ---------- spawner ----------
function rockShape(r, seedv) {
  var pts = [], n = 9 + Math.floor(h1(seedv, 3) * 4);
  for (var i = 0; i < n; i++) { var a = i / n * Math.PI * 2, rr = r * (0.78 + h1(seedv + i, 7) * 0.32); pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.86]); }
  return pts;
}
function addRock(g, d, x, r) { g.rocks.push({ d: d, x: x, r: r, pts: rockShape(r, d * 0.37 + x), seed: d + x }); }
function addCoinLine(g, d, offset, n, drift) {
  var riv = g.river;
  for (var k = 0; k < n; k++) {
    var dd = d + k * 30, a = riv.at(dd), o = clamp(offset + Math.sin(k * 0.55) * drift, -0.75, 0.75), cx = a.x + o * a.h;
    var near = g.rocks.some(function (rk) { return Math.abs(rk.d - dd) < rk.r + 16 && Math.abs(rk.x - cx) < rk.r + 14; });
    if (!near) g.coinsArr.push({ d: dd, x: cx, got: false });
  }
  return d + n * 30;
}
function spawn(g) {
  var riv = g.river, R = g.objR;
  while (g.spawnD < g.d + VH + 400) {
    var d = g.spawnD, df = riv.diff(d), a = riv.at(d);
    if (g.mode === 'daily' && d > DAILY_LEN - 150) { g.spawnD = 1e12; break; }
    var spacing = lerp(250, 135, df) * (0.85 + R() * 0.35), roll = R();
    if (roll < 0.09 && d - (g.lastBoost || 0) > 1600) {
      var bx = a.x + (R() * 2 - 1) * 0.35 * a.h;
      g.boosts.push({ d: d, x: bx, w: 58, used: false }); g.lastBoost = d;
      addCoinLine(g, d + 70, (bx - a.x) / a.h, 5, 0.1);
      g.spawnD = d + 260; continue;
    }
    if (roll < 0.33) { g.spawnD = addCoinLine(g, d, (R() * 2 - 1) * 0.55, 5 + Math.floor(R() * 4), 0.25 + R() * 0.3) + spacing * 0.5; continue; }
    // rock row: one rock, sometimes two later on. Always leave a wide gap that the boat can
    // reach from the last row's safe line (offsets are measured from the river's centre).
    var two = df > 0.2 && R() < lerp(0.15, 0.55, df), placed = false;
    var dt2 = (d - g.safeD) / (lerp(200, 360, df) * 1.65), budget = MAX_LAT * 0.45 * dt2;
    for (var tries = 0; tries < 14 && !placed; tries++) {
      var rs = [], k, cnt = two && tries < 10 ? 2 : 1;
      for (k = 0; k < cnt; k++) { var rr = lerp(13, 21, R()) + df * 5; rs.push({ o: (R() * 2 - 1) * (a.h - rr - 4), r: rr }); }
      rs.sort(function (p, q) { return p.o - q.o; });
      var edges = [-a.h], ok = true;
      rs.forEach(function (p) { edges.push(p.o - p.r, p.o + p.r); });
      edges.push(a.h);
      var bestO = null;
      for (k = 0; k + 1 < edges.length; k += 2) {
        var gl = edges[k], gr = edges[k + 1];
        if (gr - gl < -4) ok = false;
        if (gr - gl < 62) continue;
        var cl = clamp(g.safeO, gl + 24, gr - 24);
        if (Math.abs(cl - g.safeO) <= budget && (bestO === null || Math.abs(cl - g.safeO) < Math.abs(bestO - g.safeO))) bestO = cl;
      }
      if (ok && bestO !== null) {
        rs.forEach(function (p) { addRock(g, d + (R() - 0.5) * 10, a.x + p.o, p.r); });
        g.safeO = bestO; g.safeD = d; placed = true;
        // shore rocks so hugging a bank is never a free ride; they never touch the safe line
        for (var sd = -1; sd <= 1; sd += 2) {
          var br = 12 + R() * 6, bo = sd * (a.h - br * 0.3);
          if (R() < lerp(0.3, 0.6, df) && Math.abs(bo - g.safeO) > br + 34 && !rs.some(function (p) { return Math.abs(p.o - bo) < p.r + br; })) addRock(g, d + (R() - 0.5) * 30, a.x + bo, br);
        }
      }
    }
    if (R() < 0.35) addCoinLine(g, d + spacing * 0.45, (R() * 2 - 1) * 0.5, 3, 0.1);
    g.spawnD = d + spacing;
  }
  // forget old things
  var cut = g.d - 120;
  if (g.rocks.length > 60) g.rocks = g.rocks.filter(function (o) { return o.d > cut; });
  if (g.coinsArr.length > 120) g.coinsArr = g.coinsArr.filter(function (o) { return o.d > cut; });
  if (g.boosts.length > 20) g.boosts = g.boosts.filter(function (o) { return o.d > cut; });
}

// ---------- input ----------
var steerMode = store.get('steer', null);
var coarse = matchMedia && matchMedia('(pointer: coarse)').matches;
if (!steerMode) steerMode = (coarse && 'DeviceOrientationEvent' in window) ? 'tilt' : 'thumb';
var tiltRaw = 0, tiltZero = null, tiltSeen = false, tiltListening = false, permAsked = false;
var keyL = false, keyR = false, drag = null;
function onOri(e) {
  var ang = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  var v = ang === 90 ? e.beta : (ang === -90 || ang === 270) ? -e.beta : e.gamma;
  if (v == null) return;
  tiltSeen = true; tiltRaw = v;
}
function listenTilt() { if (!tiltListening) { addEventListener('deviceorientation', onOri); tiltListening = true; } }
function needsPermission() { return typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'; }
if (!needsPermission() && 'DeviceOrientationEvent' in window) listenTilt();
function askTilt() {
  if (!needsPermission()) { listenTilt(); return Promise.resolve(true); }
  if (permAsked && tiltListening) return Promise.resolve(true);
  permAsked = true;
  return DeviceOrientationEvent.requestPermission().then(function (s) { if (s === 'granted') { listenTilt(); return true; } return false; }).catch(function () { return false; });
}
var SENS = 20; // degrees of tilt for full steering
function tiltSteer() {
  if (!tiltSeen || steerMode !== 'tilt') return 0;
  if (tiltZero == null) tiltZero = tiltRaw;
  var v = tiltRaw - tiltZero;
  if (Math.abs(v) < 1.5) return 0;
  v = v > 0 ? v - 1.5 : v + 1.5;
  return clamp(v / SENS, -1, 1);
}
addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft' || e.key === 'a') keyL = true; if (e.key === 'ArrowRight' || e.key === 'd') keyR = true; if (e.key === 'Escape' || e.key === 'p') pauseGame(); });
addEventListener('keyup', function (e) { if (e.key === 'ArrowLeft' || e.key === 'a') keyL = false; if (e.key === 'ArrowRight' || e.key === 'd') keyR = false; });
cv.addEventListener('pointerdown', function (e) { if (!game || game.mode === 'attract') return; drag = { id: e.pointerId, px: e.clientX, bx: game.x, lastX: e.clientX }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', function (e) { if (drag && e.pointerId === drag.id) drag.lastX = e.clientX; });
function endDrag(e) { if (drag && e.pointerId === drag.id) drag = null; }
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// ---------- sound ----------
var soundOn = store.get('sound', true), AC = null;

    c.fillStyle = '#c98f1e'; c.beginPath(); c.ellipse(co.x, y, 7 * Math.max(sp2, 0.22), 7, 0, 0, 7); c.fill();
    c.fillStyle = '#f2c84b'; c.beginPath(); c.ellipse(co.x, y, 5.4 * Math.max(sp2, 0.18), 5.4, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,250,220,.85)'; c.beginPath(); c.ellipse(co.x - 1.6 * sp2, y - 2, 1.6 * sp2, 1.6, 0, 0, 7); c.fill();

function drawDecor(c, de, x, y) {

function drawBoat(c, x, y, tilt, ghost, boosting) {

    c.beginPath(); c.moveTo(0, -16); c.bezierCurveTo(6, -11, 7, -2, 6.4, 8.5); c.quadraticCurveTo(6, 12.5, 0, 13); c.quadraticCurveTo(-6, 12.5, -6.4, 8.5); c.bezierCurveTo(-7, -2, -6, -11, 0, -16); c.closePath();
    c.fillStyle = '#b07a46'; c.fill();
    c.strokeStyle = 'rgba(90,55,25,.55)'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(-2.5, -12); c.lineTo(-3.5, 11); c.moveTo(2.5, -12); c.lineTo(3.5, 11); c.stroke();
    c.fillStyle = '#8a5a30'; c.fillRect(-6.5, -4, 13, 2.6); c.fillRect(-6.2, 6, 12.4, 2.4);
    // rower: hat + shoulders

    c.fillStyle = '#e9c27a'; c.beginPath(); c.arc(0, 1, 2.6, 0, 7); c.fill();
    // oars
    c.strokeStyle = '#5b3a1e'; c.lineWidth = 1.3; var o = Math.sin(performance.now() / 160) * 0.35;

function ghostAt(gh, t) {

  return { d: lerp(a[1], b[1], k), x: lerp(a[2], b[2], k), vx: (b[2] - a[2]) / Math.max(0.001, b[0] - a[0]) };
}
function ghostTimeAtD(gh, d) {

  var lo = 0, hi = s.length - 1;

// tutorial icon
var tipC = $('tipIcon').getContext('2d');
function drawTipIcon(t) {

// ---------- flow ----------
var paused = false, last = 0, toastT = 0;
function toast(msg, sec) { $('toast').textContent = msg; $('toast').classList.remove('hide'); toastT = sec || 3; }
function updHull() { var h = ''; for (var i = 0; i < 3; i++) h += '<span class="' + (i < game.hull ? '' : 'lost') + '"></span>'; $('hull').innerHTML = h; }
function hudTick(g) {
  $('dist').textContent = Math.floor(g.d / 10);
  if (g.mode === 'daily') {
    $('time').textContent = fmtTime(g.t);
    var dl = $('delta');
    if (g.ghost) { var gt = ghostTimeAtD(g.ghost, g.d); if (gt != null && g.t > 2) { var df = g.t - gt; dl.textContent = (df >= 0 ? '+' : '−') + Math.abs(df).toFixed(1) + 's'; dl.className = df > 0 ? 'bad' : 'good'; } else dl.textContent = ''; }
  }
}
function show(id, on) { $(id).classList.toggle('hide', !on); }
function startRun(mode) {

  game = newGame(mode); tiltZero = null; paused = false;
  show('menu', false); show('result', false); show('pause', false); show('hud', true); show('tip', false);
  show('timePill', mode === 'daily'); show('coinPill', mode !== 'daily'); show('hull', mode !== 'tutorial');
  $('coins').textContent = '0'; $('delta').textContent = ''; updHull();
  if (mode === 'tutorial') tutShow(game);
  if (steerMode === 'tilt') setTimeout(function () { if (game && game.mode !== 'attract' && !tiltSeen) { steerMode = 'thumb'; toast('No tilt sensor here, so drag your thumb to steer.', 4); if (game.tut && game.tut.step === 0) tutShow(game); } }, 1500);
}
var pendingMode = null;
function endTutorial(g) {
  store.set('tutDone', true); g.over = true; show('tip', false);
  var next = pendingMode || 'endless'; pendingMode = null;
  setTimeout(function () { startRun(next); toast(next === 'daily' ? 'Daily River #' + dailyNumber() + ': same river for everyone today' : 'Endless river: how far can you go?', 3); }, 200);
}
function sink(g) {
  g.over = true; g.sunk = true; burst(g, g.x, g.d, '#b07a46', 18); burst(g, g.x, g.d, '#ffffff', 16); noise(0.6, 0.4, 300);
  var m = Math.floor(g.d / 10);
  addWallet(g.coins);
  setTimeout(function () {
    if (g.mode === 'endless') {
      var best = store.get('bestEndless', 0), isNew = m > best; if (isNew) store.set('bestEndless', m);
      result('Your boat sank', isNew ? '<span class="new">New best!</span>' : 'Best: ' + best + ' m', [[m + ' m', 'distance'], [g.coins, 'coins']], 'The river gets faster and twistier the farther you go.');
    } else {

    }

}

  g.over = true; addWallet(g.coins); tone(660, 0.15, 'sine', 0.12, 990); setTimeout(function () { tone(990, 0.25, 'sine', 0.12, 1320); }, 150);
  var key = 'daily.' + todayKey(), prev = store.get(key, null), t = Math.round(g.t * 10) / 10, isNew = !prev || t < prev.time;
  if (isNew) { store.set(key, { time: t, coins: g.coins }); store.set('ghost.' + todayKey(), { s: g.ghostRec }); clearOldGhosts(); }
  result('Finished!', 'Daily River #' + dailyNumber() + (isNew && prev ? ' · <span class="new">New best!</span>' : isNew ? '' : ' · Best ' + fmtTime(prev.time)),
    [[fmtTime(t), 'time'], [g.coins, 'coins'], [3 - g.hull, 'bumps']], isNew ? 'Go again to race your ghost. A new river comes tomorrow.' : 'Your ghost still has the best time. Try again!');
}
function clearOldGhosts() { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(PFX + 'ghost.') === 0 && k !== PFX + 'ghost.' + todayKey()) localStorage.removeItem(k); }); } catch (e) {} }

function result(title, line, stats, note) {
  $('resTitle').textContent = title; $('resLine').innerHTML = line; $('resNote').textContent = note;
  $('resStats').innerHTML = stats.map(function (s) { return '<div><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('');
  show('hud', false); show('result', true);
}
var lastMode = 'endless';

function toMenu() {
  show('pause', false); show('result', false); show('hud', false); show('tip', false); paused = false;
  game = newGame('attract'); refreshMenu(); show('menu', true);

function refreshMenu() {

var taps = 0, tapT = 0;

if (qs.get('tester') === '1') show('tester', true);

function frame(ts) {

requestAnimationFrame(frame);

window.__TR = { newGame: newGame, update: update, spawn: spawn, speedOf: speedOf, River: River, DAILY_LEN: DAILY_LEN, get game() { return game; }, VHset: function (v) { VH = v; BOAT_SY = v * 0.74; } };
