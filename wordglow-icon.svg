<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#3b4290"/>
      <stop offset="0.55" stop-color="#262c66"/>
      <stop offset="1" stop-color="#171b45"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffcf4a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffcf4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#ffbf2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0a0c25" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- burst rays -->
  <g transform="translate(512 500)" fill="#7f8cff" opacity="0.35" style="mix-blend-mode:screen">
    <path d="M0 0 L-40 -520 L40 -520Z"/><path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(30)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(60)"/><path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(90)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(120)"/><path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(150)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(180)"/><path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(210)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(240)"/><path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(270)"/>
    <path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(300)"/><path d="M0 0 L-40 -520 L40 -520Z" transform="rotate(330)"/>
  </g>
  <circle cx="512" cy="500" r="360" fill="url(#glow)"/>
  <!-- flying tiles -->
  <g filter="url(#shadow)">
    <rect x="128" y="168" width="150" height="150" rx="30" fill="#ff8a76" transform="rotate(-18 203 243)"/>
    <rect x="770" y="150" width="128" height="128" rx="26" fill="#5fd8ac" transform="rotate(16 834 214)"/>
    <rect x="770" y="730" width="140" height="140" rx="28" fill="#6cc1ff" transform="rotate(-12 840 800)"/>
    <rect x="118" y="740" width="118" height="118" rx="24" fill="#b39bff" transform="rotate(20 177 799)"/>
  </g>
  <g font-family="'Baloo 2', 'Arial Rounded MT Bold', sans-serif" font-weight="800" fill="#1d2147" text-anchor="middle">
    <text x="203" y="285" font-size="112" transform="rotate(-18 203 243)">A</text>
    <text x="834" y="252" font-size="96" transform="rotate(16 834 214)">E</text>
    <text x="840" y="845" font-size="104" transform="rotate(-12 840 800)">R</text>
    <text x="177" y="843" font-size="88" transform="rotate(20 177 799)">T</text>
  </g>
  <!-- sparks -->
  <g fill="#fff3c2">
    <circle cx="330" cy="330" r="12"/><circle cx="700" cy="330" r="9"/><circle cx="300" cy="660" r="9"/><circle cx="720" cy="690" r="13"/>
    <circle cx="512" cy="150" r="10"/><circle cx="512" cy="880" r="8"/>
  </g>
  <!-- hero W tile -->
  <g transform="rotate(-6 512 512)" filter="url(#shadow)">
    <rect x="292" y="292" width="440" height="440" rx="84" fill="#d99a16"/>
    <rect x="292" y="282" width="440" height="424" rx="84" fill="url(#tile)"/>
    <rect x="322" y="306" width="380" height="70" rx="35" fill="#ffffff" opacity="0.28"/>
    <text x="512" y="622" text-anchor="middle" font-family="'Baloo 2', 'Arial Rounded MT Bold', sans-serif" font-weight="800" font-size="330" fill="#1d2147">W</text>
    <text x="680" y="680" text-anchor="middle" font-family="'Baloo 2', 'Arial Rounded MT Bold', sans-serif" font-weight="800" font-size="64" fill="#1d2147" opacity="0.7">4</text>
  </g>
</svg>
