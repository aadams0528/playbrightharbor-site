<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sumburst (test version)</title>
<!-- Google Analytics (Firebase web app "Bright Harbor site"): counts visits and the game's track() events from testers. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column. Brand + streak/coins, scoreboard with the big target, chalkboard board,
   tray of three pieces, tools, and a bottom menu (Quests, Sums, Daily/Endless, Help) like Spellburst. */
:root{
  --bg:#eef2ec; --fg:#1d2a26; --muted:#5d6e68; --panel:#ffffff; --line:#cfdad4;
  --board:#1f3b33; --slot:#2a4a41; --slot-hi:#36594e;
  --accent:#e5484d; --accent-fg:#ffffff; --gold:#ffd23f; --ok:#2f9e6a; --over:#ff5d5d;
  --n1:#ff6b6b; --n2:#ff9f43; --n3:#ffd23f; --n4:#7bd389; --n5:#3ec1d3;
  --n6:#5b8def; --n7:#a07cf0; --n8:#f06bc6; --n9:#c9a27a;
  --tile-ink:#1b1f2b;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --fg:#e9f1ed; --muted:#9db0a9; --panel:#17221f; --line:#2a3a35;
  --board:#0b1f1a; --slot:#1b3830; --slot-hi:#25483d; --accent:#ff6b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --fg:#e9f1ed; --muted:#9db0a9; --panel:#17221f; --line:#2a3a35;
  --board:#0b1f1a; --slot:#1b3830; --slot-hi:#25483d; --accent:#ff6b6f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding:8px 16px calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0px));
  -webkit-user-select:none;user-select:none;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1;margin:0}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.62rem;color:var(--muted);letter-spacing:.04em}
.pills{display:flex;gap:6px}
.pill{font:700 .9rem var(--body);border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:.35em .75em;cursor:pointer;display:inline-flex;align-items:center;gap:.3em}
.pill .plus{color:var(--accent);font-weight:800}
.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}

.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.lvl{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.1}
.lvl small,.score small{display:block;font-family:var(--body);font-weight:600;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.target{display:flex;flex-direction:column;align-items:center;line-height:1}
.target span{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.target b{font-family:var(--display);font-weight:800;font-size:2.9rem;color:var(--accent);line-height:.95}
.target.newt b{animation:newt 1.2s ease-out}
@keyframes newt{20%{transform:scale(1.5)}}
.score{text-align:right;font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .4s ease}
.chainline{min-height:1.2em;text-align:center;font-weight:700;font-size:.85rem;color:var(--ok)}
.hint{min-height:2.6em;display:block;text-align:center;font-weight:600;font-size:.92rem;padding:0 4px;margin:0}
.hint.tut{background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:6px 10px}
.tut-skip{font:600 .8rem var(--body);background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:2px 4px}

.boardwrap{position:relative;align-self:center;width:min(100%,max(250px,calc(100dvh - 415px)))}
@media (max-height:700px){.foot{display:none}.brand small{display:none}}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:4px;padding:6px;background:var(--board);border-radius:14px;touch-action:none;aspect-ratio:1/1;width:100%}
.cell{min-width:0;min-height:0;border-radius:7px;background:var(--slot);position:relative;display:flex;align-items:center;justify-content:center}
.cell.ghost{background:var(--slot-hi);outline:2px dashed rgba(255,255,255,.35);outline-offset:-3px}
.cell.target-cell{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:var(--slot-hi);box-shadow:0 0 0 3px var(--gold) inset}}
.tile{width:100%;height:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;color:var(--tile-ink);font-size:clamp(1rem,5.6vw,1.7rem);line-height:1;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.45);position:relative}
.tile.land{animation:land .18s ease-out}
@keyframes land{0%{transform:scale(1.15)}100%{transform:scale(1)}}
.tile.glow{outline:3px solid var(--gold);outline-offset:-1px;box-shadow:0 0 14px var(--gold)}
.tile.toomuch{outline:3px solid var(--over);outline-offset:-1px}
.tile.pop{animation:pop .3s ease-in forwards}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.tile.star{background:conic-gradient(var(--n1),var(--n3),var(--n4),var(--n5),var(--n7),var(--n1))}
.tile .bomb{position:absolute;top:1px;right:2px;font-size:.5em}
.cell.erasable .tile{animation:wob .5s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.shake1{animation:shake .3s}
.shake2{animation:shake .45s 2}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}

.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;white-space:pre-line;text-align:center;
  background:rgba(12,24,20,.86);color:#fff;font-weight:700;font-size:.95rem;line-height:1.3;padding:.55em 1em;border-radius:14px;max-width:92%;
  animation:toast var(--toast-ms,1300ms) ease-out forwards}
.toast.big{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.15;color:var(--gold)}
/* Messages worth reading pop in and hold still, then fade where they are. News (quests, sum book) sits lower so a new blast never covers it. */
.toast.hold{animation-name:toastHold}
.toast.news{top:70%}
@keyframes toastHold{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}14%{transform:translate(-50%,-50%) scale(1)}86%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-60%)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}18%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}

.over{position:absolute;inset:0;z-index:7;background:rgba(10,20,16,.82);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow-y:auto;text-align:center;color:#fff;padding:14px}
.over[hidden]{display:none}
.over h2{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;line-height:1}
.over p{margin:6px 0}
.over>div{margin:auto 0}
.over .big{font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--gold);line-height:1;margin:6px 0}
.over .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
/* "More from Bright Harbor": a quiet card for our other live games. */
.promo{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.1);color:inherit;text-decoration:none;text-align:left;font-size:.82rem;line-height:1.25}
.promo small{display:block;font-size:.68rem;opacity:.75}
.promo-icon{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--gold);font-size:1.1rem}
.promo-go{flex:none;margin-left:auto;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--gold);color:#14231f}
.over .promo{display:inline-flex;margin-top:8px;padding:4px 6px 4px 4px;gap:8px;font-size:.78rem}
.over .promo-icon{width:24px;height:24px;border-radius:7px;font-size:.85rem}
.over .promo-go{padding:3px 9px}
@media (max-height:700px){.over{padding:8px}.over h2{font-size:1.6rem}.over .big{font-size:2rem;margin:2px 0}.over p{margin:3px 0}.over .row{margin-top:5px}}
#sheet .promo{background:none;border:1px solid var(--line,rgba(0,0,0,.12));margin:0 0 10px}

.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;touch-action:none}
.slot{height:clamp(78px,12dvh,110px);display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:grab}
.slot.cant{opacity:.35}
.slot.hinted{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.slot.used{visibility:hidden}
.piece{display:grid;gap:3px}
.piece .tile{font-size:1.05rem;border-radius:6px}
.float{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:grid;gap:4px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3))}
.float .tile{font-size:clamp(1rem,5.6vw,1.7rem)}

.tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
button{font-family:var(--body)}
.tool{font-weight:700;font-size:.9rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:.5em .95em;cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.tool.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tool .n{font-variant-numeric:tabular-nums;background:var(--line);color:var(--fg);border-radius:999px;padding:0 .45em;font-size:.8rem}
.tool.empty{opacity:.55}
@media (max-width:400px){.tools{gap:6px}.tool{padding:.45em .7em;font-size:.85rem}}
.tool.nudge{border-color:var(--gold);animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 3px var(--gold)}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;max-width:110px;height:var(--tabh);background:none;border:none;color:var(--fg);font-weight:700;font-size:.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.tab .ti{font-size:1.3rem;line-height:1}
.tab[aria-expanded="true"]{color:var(--accent)}
.tab .dot{position:absolute;top:9px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.tab .dot[hidden]{display:none}

.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,16,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.modal.dock{z-index:35;background:rgba(10,20,16,.25)}
.sheet{background:var(--panel);color:var(--fg);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);user-select:text;-webkit-user-select:text}
.sheet h3{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0 0 6px;line-height:1.1}
.sheet h4{margin:14px 0 6px;font-size:.95rem}
.sheet p{margin:0 0 8px;color:var(--muted);line-height:1.45}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{font-weight:700;font-size:1rem;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:.7em 1.2em;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.btn.plain,.btn.ghost{background:var(--panel);color:var(--fg);border-color:var(--line)}
.btn.ad::before{content:"▶ "}
.btn:disabled{opacity:.45;cursor:default}
.over .btn{font-size:.9rem;padding:.6em 1em}
.over .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.adbox{background:var(--bg);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.adbox .count{display:block;font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--accent)}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.g-text{font-weight:700}
.g-reward{font-weight:700;color:var(--ok);font-size:.85rem;white-space:nowrap}
.g-prog{font-weight:800;font-family:var(--display);white-space:nowrap}
.g-sub{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.qbar{grid-column:1/-1;height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.25em .7em;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip.long{border-color:var(--gold)}
.helpbody ul{padding-left:1.1em;margin:6px 0;line-height:1.5}
.helpbody li{margin-bottom:6px}
.cloudbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:.9rem}
.cloudbox small{display:block;color:var(--muted);margin:2px 0 8px}
.cloudbox .btn{width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.cal .dow{font-weight:700;color:var(--muted)}
.cal .d{padding:6px 0;border-radius:8px;background:var(--bg)}
.cal .d.on{background:#ffe7c2}
.cal .d.today{outline:2px solid var(--accent)}
.cal .blank{background:none}
.shop-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.shop-row .what{font-weight:700}
.shop-row .what small{display:block;font-weight:400;color:var(--muted)}
.shop-row .btn{min-width:5.5rem;padding:.5em 1em;font-size:.9rem}
.offer{background:#fff3c2;color:#5a4300!important;border-radius:10px;padding:8px 10px;font-weight:700}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
.restore{text-align:center;margin:6px 0 0}
.foot{text-align:center;font-size:.7rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>


<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <div class="top">
    <h1 class="brand">Sum<span>burst</span><small>by Bright Harbor Games</small></h1>
    <div class="pills">
      <button class="pill" id="streakbtn" type="button" aria-label="Daily streak">🔥 <b id="streakn">0</b></button>
      <button class="pill" id="coinpill" type="button" aria-label="Coins, open the shop">🪙 <b id="coinn">0</b> <span class="plus" aria-hidden="true">+</span></button>
    </div>
  </div>
  <div class="scores">
    <div class="lvl" id="lvl"><small>Level</small>1</div>
    <div class="target" id="targetbox"><span>Make</span><b id="target">10</b></div>
    <div class="score" id="score"><small>Score</small>0</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="chainline" id="chain" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
  <div class="boardwrap" id="boardwrap"><div class="board" id="board" aria-label="Game board"></div><div class="over" id="over" hidden></div></div>
  <div class="tray" id="tray"></div>
  <div class="tools">
    <button id="eraser" class="tool" type="button" aria-pressed="false">Eraser <span class="n" id="eraserN">0</span></button>
    <button id="shuffle" class="tool" type="button">Shuffle <span class="n" id="shuffleN">0</span></button>
    <button id="hintbtn" class="tool" type="button">💡 Hint</button>
    <button id="sound" class="tool" type="button" aria-pressed="true">🔊</button>
  </div>
  <div class="foot">Sumburst test version · ads and purchases are samples · <a href="https://playbrightharbor.com/feedback.html?game=sumburst" target="_blank" rel="noopener" style="color:inherit;font-weight:700">Send feedback</a> · <a href="https://playbrightharbor.com/insiders.html" target="_blank" rel="noopener" style="color:inherit;font-weight:700">Join Insiders</a></div>
</div>

<nav class="tabbar" aria-label="Menu">
  <button id="tab-quests" class="tab" type="button"><span class="ti" aria-hidden="true">🎯</span>Quests<i class="dot" id="questdot" hidden></i></button>
  <button id="tab-sums" class="tab" type="button"><span class="ti" aria-hidden="true">📒</span>Sums</button>
  <button id="tab-mode" class="tab" type="button"><span class="ti" aria-hidden="true" id="mode-icon">📅</span><span id="mode-label">Daily</span></button>
  <button id="tab-help" class="tab" type="button"><span class="ti" aria-hidden="true">❓</span>Help</button>
</nav>
<template id="help-tpl">
  <h3>How to play</h3>
  <a class="btn plain" id="feedback" href="https://playbrightharbor.com/feedback.html?game=sumburst" target="_blank" rel="noopener">✉️ Send feedback or ideas</a>
  <a class="btn plain" id="insiders" href="https://playbrightharbor.com/insiders.html" target="_blank" rel="noopener">⭐ Join Insiders: play our next games first</a>
  <div class="helpbody">
    <ul>
      <li><b>Goal:</b> drag number blocks onto the board. When touching blocks in a row or column add up to <b>exactly</b> the big target number, they blast.</li>
      <li>The whole group counts, from one gap to the next. If a group goes over the target it stays stuck, so watch where you drop. While you drag, <b>gold</b> means it will blast and <b>red</b> means it's too much.</li>
      <li><b>Longer sums score more:</b> 2 blocks x1, 3 blocks x2, 4 blocks x3, 5 or more x4. So 2 + 3 + 5 beats 4 + 6.</li>
      <li><b>Combos:</b> one drop that blasts two sums (a row and a column) adds 50% for each extra sum.</li>
      <li><b>Hint:</b> tap 💡 Hint to see a drop that blasts.</li>
      <li><b>Chains:</b> blast again within 2 drops of your last blast and it scores more: x1.5, then x2, up to x3.</li>
      <li>From level 3, special blocks appear. A <b>★ star</b> counts as whatever number finishes the sum. A <b>💣 bomb</b> also blasts the 8 blocks around it.</li>
      <li><b>🎯 Quests</b> give you three small missions at a time. Finish one to win an eraser, a shuffle or coins. Tap Quests at the bottom to see them, plus your big lifetime goals.</li>
      <li>Every different sum you blast goes into your <b>📒 sum book</b>. Finding half the ways to make a target pays 50 coins, and all of them 100. Can you find every way to make 10?</li>
      <li>A sum of 4 or more blocks earns an <b>eraser</b> (hold up to 3). Every 8 blasts earns a <b>shuffle</b> (hold up to 3).</li>
      <li><b>Levels:</b> score enough points and you get a fresh board. The target grows from 10 to 12, then 15, then mixes it up. Levels get slowly harder.</li>
      <li><b>Coins:</b> earn them by finishing levels, quests and your daily streak. Spend them on erasers, shuffles or a second chance.</li>
      <li><b>Daily streak:</b> blast at least one sum every day to grow your streak and earn more coins each day. Tap the 🔥 to see your calendar.</li>
      <li>You get three new pieces once all three are used. The game ends when no piece fits and you have no erasers or shuffles left.</li>
      <li><b>Endless</b> starts easy and gets harder each level. The <b>📅 Daily Board</b> gives everyone the same pieces today. Switching between them keeps your place in each.</li>
    </ul>
    <div class="btns"><button type="button" class="btn plain" id="tut-replay">Replay the tutorial</button></div>
  </div>
</template>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const N=8, $=id=>document.getElementById(id);

// ---------- random + days ----------
function mulberry(a){
  const next=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  next.seed=()=>a;   // lets a saved game pick up the same piece sequence
  return next;
}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const dayKey=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};

const mult=len=>len>=5?4:len>=4?3:len>=3?2:1;

// ---------- pieces ----------
const SH={
  one:[[0,0]], h2:[[0,0],[0,1]], v2:[[0,0],[1,0]], h3:[[0,0],[0,1],[0,2]], v3:[[0,0],[1,0],[2,0]],
  l1:[[0,0],[1,0],[1,1]], l2:[[0,0],[0,1],[1,0]], l3:[[0,0],[0,1],[1,1]], l4:[[0,1],[1,0],[1,1]],
  h4:[[0,0],[0,1],[0,2],[0,3]], v4:[[0,0],[1,0],[2,0],[3,0]], sq:[[0,0],[0,1],[1,0],[1,1]], t1:[[0,0],[0,1],[0,2],[1,1]], t2:[[0,1],[1,0],[1,1],[1,2]]
};
function shapePool(l){
  if(l<=3) return ['one','one','one','h2','v2','h2','v2','h3','v3'];
  if(l<=6) return ['one','one','h2','v2','h2','v2','h3','v3','l1','l2','l3','l4'];
  if(l<=9) return ['one','h2','v2','h3','v3','h3','v3','l1','l2','l3','l4'];
  // 4-block pieces ease in from level 10, so the board starts to feel tight
  if(l<=14) return ['one','h2','v2','h3','v3','h3','v3','l1','l2','l3','l4','h4','v4','sq'];
  return ['h2','v2','h3','v3','l1','l2','l3','l4','h4','v4','sq','t1','t2'];
}
function genValue(){
  const maxV=Math.min(9,T-1);
  // Helper numbers pair with a block already on the board; they get rarer as levels go up.
  // The Daily Board pairs with the last number dealt instead, so everyone gets the exact same pieces.
  const help=mode==='daily'?0.4:Math.max(0.1,0.5-0.04*Math.max(0,level-3));
  if(rng()<help){
    if(mode==='daily'){ if(lastV&&T-lastV>=1&&T-lastV<=9) return lastV=T-lastV; }
    else{ const opts=board.filter(t=>t&&!t.star&&T-t.v>=1&&T-t.v<=9); if(opts.length) return T-opts[ri(0,opts.length-1)].v; }
  }
  if(T>12&&rng()<0.5) return lastV=ri(3,maxV);   // bigger targets lean on middle numbers so 3-block sums happen
  return lastV=ri(1,maxV);
}
function pieceSelfBlasts(cells){
  const b=Array(N*N).fill(null);
  cells.forEach(c=>b[(c.r+2)*N+c.c+2]=c.t);
  return findRuns(b).length>0;
}
function genPiece(){
  const pool=shapePool(level);
  for(let tries=0;tries<30;tries++){
    const name=pool[ri(0,pool.length-1)];
    const cells=SH[name].map(([r,c])=>({r,c,t:{v:genValue(),star:false,bomb:false}}));
    if(level>=3&&name==='one'&&rng()<0.10) cells[0].t={v:null,star:true,bomb:false};
    else if(level>=3&&rng()<0.06) cells[ri(0,cells.length-1)].t.bomb=true;
    if(!pieceSelfBlasts(cells)) return {cells};
  }
  return {cells:[{r:0,c:0,t:{v:1,star:false,bomb:false}}]};
}
const newTray=()=>{tray=[genPiece(),genPiece(),genPiece()]};

// ---------- rules ----------
// A blast happens when a whole group of touching blocks in a row or column
// (from one gap to the next) adds up to exactly the target.
function lineIdx(dir,k){const a=[];for(let i=0;i<N;i++)a.push(dir==='r'?k*N+i:i*N+k);return a}
function groups(b,each){
  for(const dir of ['r','c'])for(let k=0;k<N;k++){
    const line=lineIdx(dir,k);let i=0;
    while(i<N){
      if(!b[line[i]]){i++;continue}
      let j=i,sum=0,stars=0;
      while(j<N&&b[line[j]]){const t=b[line[j]];if(t.star)stars++;else sum+=t.v;j++}
      if(j-i>=2)each(line.slice(i,j),dir,sum,stars);
      i=j;
    }
  }
}
const hits=(sum,stars)=>stars===0?sum===T:(T-sum>=stars&&T-sum<=9*stars);
function findRuns(b){const runs=[];groups(b,(cells,dir,sum,stars)=>{if(hits(sum,stars))runs.push({cells,dir})});return runs}
function tooMuch(b,touched){const out=new Set();groups(b,(cells,dir,sum,stars)=>{if(sum+stars>T&&cells.some(k=>touched.has(k)))cells.forEach(k=>out.add(k))});return out}
function fitsAt(p,r,c){return p.cells.every(x=>{const rr=r+x.r,cc=c+x.c;return rr>=0&&cc>=0&&rr<N&&cc<N&&!board[rr*N+cc]})}
// True when some piece in the tray can be dropped somewhere that blasts.
function canBlast(){
  return tray.some(p=>{if(!p)return false;for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!fitsAt(p,r,c))continue;const b=board.slice();p.cells.forEach(x=>b[(r+x.r)*N+c+x.c]=x.t);if(findRuns(b).length)return true}return false});
}
function canFit(p){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fitsAt(p,r,c))return true;return false}
// The numbers in a blasted sum, with a single star filled in as the number it stood for.
// The numbers in a blasted sum, with stars filled in. Two or more stars could stand for several splits,
// so they take the biggest numbers first (5 + ★ + ★ = 15 counts as 5 + 9 + 1).
function runValues(cells){
  const ts=cells.map(k=>board[k]);
  let stars=ts.filter(t=>t.star).length, rem=T-ts.reduce((a,t)=>a+(t.star?0:t.v),0);
  return ts.map(t=>{if(!t.star)return t.v;stars--;const v=Math.min(9,rem-stars);rem-=v;return v});
}

// ---------- sum book: every different way you've made each target ----------
let book=store.get('nb-book',{});
const sumKey=vals=>vals.slice().sort((a,b)=>a-b).join('+');
function addToBook(vals){
  if(!vals)return false;
  const k=sumKey(vals), list=book[T]||(book[T]=[]);
  if(list.includes(k))return false;
  list.push(k);store.set('nb-book',book);return true;
}
// How many ways a target can be made from 2 to 8 numbers between 1 and 9 (order doesn't matter).
const waysMemo={};
function ways(t){
  if(waysMemo[t]!=null)return waysMemo[t];
  const f=(rem,maxPart,parts)=>{if(rem===0)return parts>=2?1:0;if(parts===8)return 0;let n=0;for(let p=Math.min(9,maxPart,rem);p>=1;p--)n+=f(rem-p,p,parts+1);return n};
  return waysMemo[t]=f(t,9,0);
}

// ---------- milestones and lifetime stats ----------
const BLAST_MILESTONES=[100,500,1000,2500,5000,10000];
const LEVEL_MILESTONES={10:50,25:100,50:250,100:500};

function milestones(runs,valsList){

}

const REWARDS=['eraser','shuffle','coins'];
const REWARD_TEXT={eraser:'+1 eraser',shuffle:'+1 shuffle',coins:'+15 coins'};
let goals=[],goalCount=0;
function newGoal(exclude){
  const pool=GOALS.filter(g=>!exclude.includes(g.id)&&(!g.after||level>=g.after));
  const g=pool[Math.floor(Math.random()*pool.length)];
  return {...g,prog:0,need:g.need||1,reward:REWARDS[goalCount++%3]};
}
function resetGoals(){goalCount=0;goals=['len3','down','five'].map(id=>{const g=GOALS.find(x=>x.id===id);return {...g,prog:0,need:g.need||1,reward:REWARDS[goalCount++%3]}})}
function checkGoals(e){
  const done=[];
  goals=goals.map(g=>{
    if(!g.test(e))return g;
    const prog=g.prog+1;
    if(prog<g.need)return {...g,prog};
    done.push(g);
    if(g.reward==='eraser')erasers=Math.min(MAX_ERASERS,erasers+1);
    else if(g.reward==='shuffle')shuffles=Math.min(MAX_SHUFFLES,shuffles+1);
    else addCoins(15);
    return newGoal(goals.map(x=>x.id));
  });
  return done;
}

// ---------- feel: particles, shake, sound, haptics ----------
const fx=$('fx'),fxc=fx.getContext('2d');
let parts=[],fxRunning=false;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeFx(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fxc.setTransform(d,0,0,d,0,0)}
sizeFx();addEventListener('resize',sizeFx);
const numColor=v=>getComputedStyle(document.documentElement).getPropertyValue('--n'+v).trim()||'#ffd23f';
const GOLD='#ffd23f';
function burst(x,y,colors,n=14,power=1){
  if(reduceMotion)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*4)*power;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*power,life:1,size:4+Math.random()*6,color:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4})}
  if(!fxRunning){fxRunning=true;requestAnimationFrame(tickFx)}
}
function tickFx(){
  fxc.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.life-=.02;p.rot+=p.vr;
    fxc.save();fxc.globalAlpha=Math.max(0,p.life);fxc.translate(p.x,p.y);fxc.rotate(p.rot);fxc.fillStyle=p.color;fxc.fillRect(-p.size/2,-p.size/2,p.size,p.size*.7);fxc.restore()}
  if(parts.length)requestAnimationFrame(tickFx);else{fxRunning=false;fxc.clearRect(0,0,innerWidth,innerHeight)}
}
function shake(n){if(reduceMotion)return;const w=$('boardwrap');w.classList.remove('shake1','shake2');void w.offsetWidth;w.classList.add(n>1?'shake2':'shake1')}
function fireworks(){const r=boardEl.getBoundingClientRect();for(let i=0;i<6;i++)setTimeout(()=>burst(r.left+r.width*(.15+Math.random()*.7),r.top+r.height*(.1+Math.random()*.5),[numColor(1+i),GOLD,'#ffffff'],34,1.5),i*170)}
let actx=null,muted=store.get('nb-muted',false);
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(actx.state==='suspended')actx.resume();return actx}
function tone(freq,dur=.12,type='sine',vol=.15,delay=0,slide=0){
  if(muted)return;const a=audio();if(!a)return;
  const t0=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(freq*slide,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.03);
}
const SCALE=[0,2,4,7,9,12,14,16,19];
const SFX={

  erase:()=>tone(700,.28,'sawtooth',.05,0,.25),
  shuffle:()=>[392,494,587,698,784].forEach((f,i)=>tone(f,.07,'triangle',.09,i*.04)),
  boom:()=>{tone(110,.6,'sawtooth',.22,0,.25);tone(55,.7,'square',.18,.02,.5);tone(1800,.15,'sawtooth',.05,0,.2)},

}
function endSession(){

// ---------- messages over the board ----------
const READ_MS=3200, CASH_MS=2400;
// News (quest done, new sum, milestones) waits its turn in a line and shows one at a time.
// The next blast doesn't cut it short, and it waits while a pop-up (like level complete) is open.
let newsQ=[],newsTimer=null;
function news(text,big=false){newsQ.push([text,big]);if(!newsTimer)nextNews()}
function nextNews(){
  newsTimer=null;if(!newsQ.length)return;
  if(!$('modal').hidden||!$('over').hidden){newsTimer=setTimeout(nextNews,400);return}
  const [text,big]=newsQ.shift();toast(text,big,READ_MS,'news');newsTimer=setTimeout(nextNews,READ_MS+150);

function clearPending(keepNews){

}
function toast(text,big=false,ms=0,lane='main'){

  const t=document.createElement('div');t.className='toast '+lane+(big?' big':'')+(ms?' hold':'');t.textContent=text;
  const life=ms||(big?1600:1300);t.style.setProperty('--toast-ms',life+'ms');
  $('boardwrap').appendChild(t);setTimeout(()=>t.remove(),life);
}

// ---------- rendering ----------
function tileHTML(t){
  if(!t)return '';
  if(t.star)return '<div class="tile star">★</div>';
  return `<div class="tile" style="background:var(--n${t.v})">${t.v}${t.bomb?'<span class="bomb">💣</span>':''}</div>`;
}
function buildBoard(){boardEl.innerHTML='';for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';d.dataset.i=i;boardEl.appendChild(d)}}
const tutCell=()=>tut?LESSONS[tut.step].cell:-1;
function renderBoard(pv){
  const cells=boardEl.children;
  for(let i=0;i<N*N;i++){
    const el=cells[i],t=board[i];let cls='cell',html=tileHTML(t);
    if(pv&&pv.ghost.has(i)){html=tileHTML(pv.tiles.get(i));cls+=' ghost'}
    if(i===tutCell()&&!t&&!(pv&&pv.ghost.has(i)))cls+=' target-cell';
    if(erasing&&t)cls+=' erasable';
    el.className=cls;
    if(el._h!==html){el.innerHTML=html;el._h=html}
    const tile=el.firstElementChild;
    if(tile){tile.classList.toggle('glow',!!(pv&&pv.glow.has(i)));tile.classList.toggle('toomuch',!!(pv&&pv.much.has(i)&&!pv.glow.has(i)))}
  }
}
function pieceSize(p){return {rows:Math.max(...p.cells.map(c=>c.r))+1,cols:Math.max(...p.cells.map(c=>c.c))+1}}
function pieceEl(p,size,cls){
  const {rows,cols}=pieceSize(p),el=document.createElement('div');el.className=cls;
  el.style.gridTemplateColumns=`repeat(${cols},${size}px)`;el.style.gridTemplateRows=`repeat(${rows},${size}px)`;
  p.cells.forEach(x=>{const w=document.createElement('div');w.style.gridRow=x.r+1;w.style.gridColumn=x.c+1;w.innerHTML=tileHTML(x.t);el.appendChild(w)});

}
function renderTray(){

    const s=document.createElement('div');s.className='slot';s.dataset.i=i;trayEl.appendChild(s);
    if(!p){s.classList.add('used');return}
    if(!canFit(p))s.classList.add('cant');
    const {rows,cols}=pieceSize(p),box=s.getBoundingClientRect();
    const size=Math.max(16,Math.min(32,Math.floor((Math.min(box.width,box.height)-16)/Math.max(rows,cols,2))-3));
    s.appendChild(pieceEl(p,size,'piece'));

}
function renderHUD(){

function renderAll(){renderBoard();renderTray();renderHUD();renderCoins();renderStreak()}

let specialSeen=store.get('nb-special-seen',false), justTutored=false, levelStartHint=false;
function setHint(){
  const h=$('hint');h.classList.toggle('tut',!!tut);
  // Stuck: nothing in the tray can make the target on a crowded board. Say so, and point at the Eraser (or Shuffle).
  const stuck=!tut&&!over&&board.filter(Boolean).length>=24&&tray.some(p=>p&&canFit(p))&&!canBlast();
  const tool=stuck?(erasers?'eraser':shuffles?'shuffle':null):null;
  $('eraser').classList.toggle('nudge',tool==='eraser');$('shuffle').classList.toggle('nudge',tool==='shuffle');
  if(tut){h.innerHTML=LESSONS[tut.step].hint+' <button type="button" class="tut-skip" id="tut-skip">Skip tutorial</button>';return}
  if(justTutored)h.innerHTML=`Your turn! Make <b>${T}</b> with touching blocks. Score <b>${goalFor(level)} points</b> to clear level 1.`;
  else if(!specialSeen&&tray.some(p=>p&&p.cells.some(c=>c.t.star||c.t.bomb))){
    h.innerHTML='Special blocks! A <b>★ star</b> counts as whatever number finishes the sum. A <b>💣 bomb</b> also blasts the blocks around it.';

  }

    (tool==='eraser'?`, or tap <b>Eraser</b> to clear a block and open up a sum.`:tool==='shuffle'?`, or tap <b>Shuffle</b> for new pieces.`:'.');
  else if(levelStartHint&&level===2)h.innerHTML='Fresh board! Each level needs a few more points to clear.';
  else h.innerHTML=`Touching blocks in a row or column that add up to exactly <b>${T}</b> blast. <b>Gold</b> means it will blast!`;

// ---------- dragging ----------
let drag=null;
function cellStep(){const r=boardEl.getBoundingClientRect();const cs=(r.width-12-4*7)/8;return {cs,step:cs+4,r}}
function startDrag(i,e,slot){
  if(busy||erasing||over||!$('modal').hidden)return;
  clearHint();
  const p=tray[i];if(!p)return;
  e.preventDefault();
  if(!tut&&!canFit(p)){toast("That piece doesn't fit anywhere");buzz(15);return}
  const {cs}=cellStep(),fl=pieceEl(p,cs,'float');fl.style.gap='4px';document.body.appendChild(fl);
  const {rows,cols}=pieceSize(p),w=cols*cs+(cols-1)*4,h=rows*cs+(rows-1)*4;
  drag={i,p,fl,w,h,slot,lift:e.pointerType==='mouse'?h/2:h+cs*.9,pos:null};
  slot.style.opacity='.25';moveDrag(e);
  addEventListener('pointermove',moveDrag);addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
}
function moveDrag(e){
  if(!drag)return;
  const x=e.clientX-drag.w/2,y=e.clientY-drag.lift;
  drag.fl.style.transform=`translate(${x}px,${y}px)`;
  const {step,r}=cellStep(),a={r:Math.round((y-(r.top+6))/step),c:Math.round((x-(r.left+6))/step)};
  let pos=fitsAt(drag.p,a.r,a.c)?a:null;
  if(pos&&tut&&(pos.r+drag.p.cells[0].r)*N+pos.c+drag.p.cells[0].c!==tutCell())pos=null;
  if(JSON.stringify(pos)===JSON.stringify(drag.pos))return;
  drag.pos=pos;
  if(!pos)return renderBoard();
  const b=board.slice(),ghost=new Set(),tiles=new Map();
  drag.p.cells.forEach(x=>{const k=(pos.r+x.r)*N+pos.c+x.c;b[k]=x.t;ghost.add(k);tiles.set(k,x.t)});
  const glow=new Set();findRuns(b).forEach(run=>run.cells.forEach(k=>glow.add(k)));
  renderBoard({ghost,tiles,glow,much:tooMuch(b,ghost)});
}
function endDrag(){
  if(!drag)return;
  removeEventListener('pointermove',moveDrag);removeEventListener('pointerup',endDrag);removeEventListener('pointercancel',endDrag);
  const d=drag;drag=null;d.fl.remove();d.slot.style.opacity='';
  if(d.pos)place(d.i,d.pos);
  else{renderBoard();if(tut)toast('Drop it on the glowing square')}
}

// ---------- play ----------
function place(i,pos){
  const p=tray[i],placed=[];
  p.cells.forEach(x=>{const k=(pos.r+x.r)*N+pos.c+x.c;board[k]=x.t;placed.push(k)});
  tray[i]=null;
  if(!tut&&chain&&--chainMoves<0)chain=0;          // too many drops since the last blast
  justTutored=false;levelStartHint=false;
  renderBoard();renderTray();
  placed.forEach(k=>{const t=boardEl.children[k].firstElementChild;t&&t.classList.add('land')});
  SFX.place();buzz(8);
  if(!blast())finishTurn();
}
// Blasts every sum the last drop finished. Bombs in a sum also clear the 8 blocks around them.
function blast(){
  const runs=findRuns(board);
  if(!runs.length)return false;
  const set=new Set();runs.forEach(r=>r.cells.forEach(k=>set.add(k)));
  const extra=new Set();
  [...set].forEach(k=>{if(!board[k].bomb)return;const r=Math.floor(k/N),c=k%N;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const R=r+dr,C=c+dc;if(R>=0&&C>=0&&R<N&&C<N&&board[R*N+C]&&!set.has(R*N+C))extra.add(R*N+C)}});
  const k=runs.length,comboMult=1+.5*(k-1),chainX=tut?1:chainMult();
  const base=runs.reduce((a,r)=>a+T*mult(r.cells.length),0);
  const total=Math.round(base*comboMult*chainX)+extra.size*3;
  score+=total;
  const valsList=runs.map(r=>runValues(r.cells));
  const longest=Math.max(...runs.map(r=>r.cells.length));
  let earned=false,shuffleEarned=false,newSums=[];const goalsDone=[];
  if(!tut){
    chain=Math.min(CHAIN_MAX,chain+1);chainMoves=CHAIN_MOVES;
    blastsGame+=k;
    runs.forEach((r,i)=>{
      const vals=valsList[i],isNew=addToBook(vals);
      if(isNew)newSums.push(vals);
      if(r.cells.length>=4&&erasers<MAX_ERASERS){erasers++;earned=true}
      if(!bestRun||r.cells.length>bestRun.length)bestRun=vals||r.cells.map(()=>'?');
      goalsDone.push(...checkGoals({len:r.cells.length,dir:r.dir,vals,isNew,combo:k,chainX,
        star:r.cells.some(c=>board[c].star),bomb:extra.size>0&&r.cells.some(c=>board[c].bomb)}));
    });
    toShuffle+=k;
    while(toShuffle>=BLASTS_PER_SHUFFLE){toShuffle-=BLASTS_PER_SHUFFLE;if(shuffles<MAX_SHUFFLES){shuffles++;shuffleEarned=true}}
  }
  // Main message, then the extra news one at a time below it.
  const praise=k>1?`Combo x${comboMult}!`:longest>=5?'Amazing!':longest===4?'Great!':longest===3?'Nice!':'';
  const label=valsList.map((v,i)=>v?v.join(' + '):runs[i].cells.length+' blocks').join('\n');
  toast((praise?praise+'\n':'')+label+`\n+${total}`+(extra.size?`\nBOOM! +${extra.size*3}`:'')+(chainX>1?`\n🔗 Chain x${chainX}`:'')+(earned?'\nEraser earned!':'')+(shuffleEarned?'\nShuffle earned!':''),longest>=4||k>1||extra.size>0,CASH_MS);
  const extras=[];
  if(!tut){
    const s=markPlayed();if(s)extras.push(s);
    newSums.forEach(v=>{
      const have=(book[T]||[]).length,all=ways(T);
      extras.push([`📒 New way to make ${T}!\n${v.join(' + ')}\n${have} of ${all} found`,false]);
      if(have>=Math.ceil(all/2)&&have<all&&!store.get('nb-book-half-'+T,false)){store.set('nb-book-half-'+T,true);addCoins(50);extras.push([`📒 Halfway! ${have} of ${all} ways to make ${T}\n+50 🪙`,true])}
      if(have===all&&!store.get('nb-book-done-'+T,false)){store.set('nb-book-done-'+T,true);addCoins(100);extras.push([`📒 Every way to make ${T}!\n+100 🪙`,true])}
    });
    if(goalsDone.length){extras.push([goalsDone.map(g=>'🎯 Quest done: '+REWARD_TEXT[g.reward]).join('\n'),false]);questNews()}
    extras.push(...milestones(runs,valsList));
  }
  extras.forEach(([text,big])=>news(text,big));
  // Effects
  busy=true;renderHUD();
  const all=[...set],gap=55;
  all.forEach((key,n)=>setTimeout(()=>{
    const el=boardEl.children[key],t=board[key];if(!el||!t)return;
    const b=el.getBoundingClientRect();el.firstElementChild&&el.firstElementChild.classList.add('pop');
    burst(b.left+b.width/2,b.top+b.height/2,[t.star?GOLD:numColor(t.v),GOLD,'#ffffff'],10+all.length*2,.7+all.length*.08);
    SFX.pop(n);buzz(10);
  },n*gap));
  const done=all.length*gap;
  setTimeout(()=>{
    if(longest>=4||k>1)shake(k>1||longest>=5?2:1);
    if(longest>=4||k>1)SFX.big();
    if(longest>=5||k>2)fireworks();
    if(extra.size){SFX.boom();buzz([40,30,60]);shake(2);
      extra.forEach(key=>{const el=boardEl.children[key],t=board[key],b=el.getBoundingClientRect();el.firstElementChild&&el.firstElementChild.classList.add('pop');
        burst(b.left+b.width/2,b.top+b.height/2,[t.star?GOLD:numColor(t.v),'#ff6a3d'],12,1.1)})}
  },done);
  setTimeout(()=>{
    all.forEach(key=>board[key]=null);extra.forEach(key=>board[key]=null);
    busy=false;
    if(tut)return nextLesson();
    finishTurn();
  },done+(extra.size?450:300));
  return true;
}
function finishTurn(){
  if(tut){renderAll();setHint();return}
  if(!over&&levelPts()>=goalFor(level))return levelUp();
  if(tray.every(p=>!p))newTray();
  setHint();renderAll();
  best=Math.max(best,score);store.set(bestKey(),best);
  saveGame();
  if(!tray.some(p=>p&&canFit(p))){
    if(shuffles||erasers){erasing=!shuffles;renderAll();toast(shuffles?'No room!\nTry a shuffle':'No room!\nUse an eraser',false,READ_MS)}
    else gameOver();
  }
}
const bestKey=()=>mode==='daily'?'nb-best-daily-'+dayKey():'nb-best-endless';

// ---------- levels ----------
function seedStarters(n){
  for(let tries=0,placed=0;placed<n&&tries<200;tries++){
    const k=ri(0,N*N-1);if(board[k])continue;
    board[k]={v:ri(1,Math.min(9,T-1)),star:false,bomb:false};
    if(findRuns(board).length)board[k]=null;else placed++;
  }
}
function levelUp(){
  busy=true;erasing=false;clearPending(true);track('level_complete',{mode,level});
  if(mode==='endless'){stats.topLevel=Math.max(stats.topLevel,level+1);store.set('nb-stats',stats)}
  toast(`Level ${level} complete!`,true);SFX.big();buzz([30,40,30]);fireworks();
  const left=[];board.forEach((t,k)=>t&&left.push(k));
  left.forEach((k,n)=>setTimeout(()=>{const el=boardEl.children[k].firstElementChild;el&&el.classList.add('pop')},300+n*40));
  const earned=10+2*level,next=targetFor(level+1);
  setTimeout(()=>{
    board=Array(N*N).fill(null);renderBoard();
    openSheet(`<h3>Level ${level} complete!</h3><p>You earned</p><div class="adbox"><span class="count">+${earned} 🪙</span></div>
      <p style="margin-top:10px">Next up: level ${level+1}. ${next!==T?`New target: make <b>${next}</b>!`:`Target stays at ${next}.`}</p>
      <div class="btns"><button class="btn ad" id="dbl">Double it: watch an ad</button><button class="btn plain" id="next">Next level</button></div>`,true);
    const go=n=>{closeSheet();addCoins(n);maybeInterstitial(startNextLevel)};

// Sample between-level ad, from level 3 on, every other level, unless ads were removed.
function maybeInterstitial(then){

  levelsSinceAd=0;watchAd(then,then,'Between-level ad',true);

function startNextLevel(){

// ---------- game over, second chance, share ----------
const CONTINUE_COST=60;
function keepPlaying(){
  track('continue_used',{mode,level});continued=true;over=false;$('over').hidden=true;
  // Blow up the most crowded 3x3 area.
  let bestA=null;
  for(let r=0;r<=N-3;r++)for(let c=0;c<=N-3;c++){let n=0;for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(board[(r+a)*N+c+b])n++;if(!bestA||n>bestA.n)bestA={r,c,n}}
  const cells=[];for(let a=0;a<3;a++)for(let b=0;b<3;b++){const k=(bestA.r+a)*N+bestA.c+b;if(board[k])cells.push(k)}
  busy=true;SFX.boom();shake(2);buzz([40,30,60]);
  cells.forEach(k=>{const el=boardEl.children[k],q=el.getBoundingClientRect();el.firstElementChild&&el.firstElementChild.classList.add('pop');burst(q.left+q.width/2,q.top+q.height/2,['#ff6a3d',GOLD],14,1.2)});
  setTimeout(()=>{cells.forEach(k=>board[k]=null);busy=false;toast('Keep going!');finishTurn()},450);
}
function gameOver(){
  over=true;clearPending();SFX.over();buzz([30,60,30]);
  track('game_over',{mode,level,score,continued});
  if(mode==='daily')store.set('nb-save-daily',null);else store.set('nb-save-endless',null);
  store.set('nb-save',null);
  const sq=['🟥','🟧','🟨','🟩','🟦','🟪'];
  const share=[
    mode==='daily'?`Sumburst Daily #${dailyNo()}`:'Sumburst',
    `⭐ Level ${level} · ${score.toLocaleString()} pts · ${blastsGame} blast${blastsGame===1?'':'s'}`,
    bestRun?`Best sum: ${bestRun.join(' + ')} ${bestRun.map((_,i)=>sq[i%6]).join('')}`:'',
    'Play with me!','playbrightharbor.com',
  ].filter(Boolean).join('\n');
  const need=goalFor(level)-levelPts(),close=need<=goalFor(level)*.6;
  // Best finished score for this mode (per day for the Daily Board). A new best gets fireworks.
  const finKey='nb-final-'+(mode==='daily'?'daily-'+dayKey():'endless'),prevFinal=store.get(finKey,0);
  const newBest=score>prevFinal&&(prevFinal>0||mode==='daily');
  if(score>prevFinal)store.set(finKey,score);
  if(newBest){SFX.big();setTimeout(fireworks,250)}
  const mid=new Date();mid.setHours(24,0,0,0);const mins=Math.max(1,Math.round((mid-Date.now())/60000));
  const nextDaily=mins>=60?`${Math.floor(mins/60)}h ${mins%60}m`:`${mins}m`;
  $('over').innerHTML=`<div>
    <h2>${newBest?(mode==='daily'&&!prevFinal?`Daily #${dailyNo()} done!`:'New best!'):close?'So close!':'Board full'}</h2>
    <p>${close?`Only <b>${need} points</b> from level ${level+1}`:`You reached <b>level ${level}</b>`}</p>
    ${!continued?`<div class="row"><button class="btn ad" id="cont-ad">Keep playing: watch an ad</button><button class="btn ghost" id="cont-coins" ${coins<CONTINUE_COST?'disabled':''}>Keep playing: ${CONTINUE_COST} 🪙</button></div>`:''}
    <div class="big">${score.toLocaleString()}</div>
    <p>${blastsGame} blast${blastsGame===1?'':'s'}${bestRun?`, best sum ${esc(bestRun.join(' + '))}`:''}</p>
    ${mode==='daily'?`<p>New Daily Board in ${nextDaily}</p>`:''}
    <div class="row"><button class="btn" id="again">${mode==='daily'?'Try today again':'Play again'}</button><button class="btn ghost" id="copy">Share result</button>
      ${mode==='daily'?'<button class="btn ghost" id="endlessbtn">Play Endless</button>':'<button class="btn ghost" id="todaybtn">Play Daily Board</button>'}</div>
    ${promoForGameOver(!continued)?promoCard('over'):''}</div>`;
  $('over').hidden=false;
  $('again').onclick=()=>newGame(mode);
  if(!continued){$('cont-ad').onclick=()=>watchAd(keepPlaying);$('cont-coins').onclick=()=>{if(spendCoins(CONTINUE_COST))keepPlaying()}}
  if($('todaybtn'))$('todaybtn').onclick=()=>switchMode('daily');
  if($('endlessbtn'))$('endlessbtn').onclick=()=>switchMode('endless');
  wirePromo('over');
  $('copy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(share):Promise.reject()).then(()=>{$('copy').textContent='Copied! Paste it in a text'},()=>{openSheet(`<h3>Share result</h3><p>Copy this and paste it in a text:</p><p style="white-space:pre-line;color:var(--fg)">${esc(share)}</p><div class="btns"><button class="btn" id="sh-ok">Done</button></div>`);$('sh-ok').onclick=closeSheet})};

const IS_NATIVE=!!window.Capacitor?.isNativePlatform?.(),PLATFORM=window.Capacitor?.getPlatform?.()||'web';
const AdMob=IS_NATIVE?window.Capacitor.Plugins.AdMob:null;
// Sumburst's AdMob ad units (publisher 7780493483551677).
const AD_UNITS={
  android:{rewarded:'ca-app-pub-7780493483551677/3877267805',interstitial:'ca-app-pub-7780493483551677/8968803225'},
  ios:{rewarded:'ca-app-pub-7780493483551677/5006516646',interstitial:'ca-app-pub-7780493483551677/3693434974'},
};
// Test ads for beta builds. `npm run build:release` sets this to false; the plugin then shows real ads.
const ADS_TESTING='__BUILD__'!=='release';
let adsReady=false;
// Consent and start-up are separate steps, so a consent failure still lets ads run (as non-personalized).
// Beta builds say which step failed, so a tester can report it.
async function initAds(){
  if(!AdMob)return;
  try{
    const info=await AdMob.requestConsentInfo();
    if(info.isConsentFormAvailable&&info.status==='REQUIRED')await AdMob.showConsentForm();
  }catch(e){console.warn('Ad consent failed',e);if(ADS_TESTING)toast('Ads: consent step failed',false,READ_MS)}
  if(PLATFORM==='ios')await AdMob.requestTrackingAuthorization().catch(()=>{});
  try{await AdMob.initialize({initializeForTesting:ADS_TESTING});adsReady=true}
  catch(e){console.warn('Ads unavailable',e);if(ADS_TESTING)toast('Ads: start-up failed',false,READ_MS)}
}
// onReward when the ad finishes, onSkip when it's closed early or can't load.
// "forced" ads are the between-level interstitials, which give no reward and never block play.
function watchAd(onReward,onSkip=()=>{},title,forced=false){
  if(!AdMob)return sampleAd(onReward,onSkip,title,forced);
  const noVideo=()=>{toast('No video available right now.\nTry again soon.',false,READ_MS);onSkip()};
  if(!adsReady)return forced?onReward():noVideo();
  const units=AD_UNITS[PLATFORM]||AD_UNITS.android;
  if(forced){
    AdMob.prepareInterstitial({adId:units.interstitial,isTesting:ADS_TESTING})
      .then(()=>AdMob.showInterstitial()).catch(()=>{}).finally(onReward);
    return;
  }
  let rewarded=false,handles=[];
  const done=()=>{handles.forEach(h=>h.remove());rewarded?onReward():onSkip()};
  Promise.all([
    AdMob.addListener('onRewardedVideoAdReward',()=>{rewarded=true;track('ad_reward',{mode,level})}),
    AdMob.addListener('onRewardedVideoAdDismissed',done),
  ]).then(hs=>{handles=hs;return AdMob.prepareRewardVideoAd({adId:units.rewarded,isTesting:ADS_TESTING})})
    .then(()=>AdMob.showRewardVideoAd())
    .catch(()=>{handles.forEach(h=>h.remove());noVideo()});
}

// ---------- cloud save: progress survives an app update or a new phone ----------
// The shared studio module (cloudsave.js) handles sign-in and upload. Each game gives it this hook.
// The save is every nb-* key except the device-only ones. Merging never loses anything earned on
// either phone: best scores, unlocks and purchases win, and sum books are combined.
const OLD_DAY=/^nb-(best-daily|final-daily)-(\d{4}-\d\d-\d\d)$/;
function cloudSnapshot(){
  const out={},cutoff=dayKey(-7);
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('nb-')||DEVICE_ONLY.test(k))continue;
    const old=OLD_DAY.exec(k);if(old&&old[2]<cutoff)continue;
    const v=store.get(k,null);if(v!==null)out[k]=v;
  }
  return out;
}
const saveRank=g=>g&&g.v===3?[g.level||0,g.score||0]:null;
function betterSave(a,b){  // the further-along game of two saves
  const ra=saveRank(a),rb=saveRank(b);
  if(!rb)return ra?a:null;if(!ra)return b;
  return rb[0]>ra[0]||(rb[0]===ra[0]&&rb[1]>ra[1])?b:a;
}
function mergeKey(k,a,b){  // a = this phone, b = cloud
  if(a==null)return b;if(b==null)return a;
  if(k==='nb-coins'||k==='nb-best-endless'||/^nb-(best-daily|final)-/.test(k))return Math.max(+a||0,+b||0);
  if(/^nb-(noads|bought-coins|tutorial-done|special-seen|book-done-|book-half-|level-ms-)/.test(k))return !!(a||b);
  if(k==='nb-streak-saved')return a>b?a:b;
  if(k==='nb-book'){const m={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(t=>m[t]=[...new Set([...(a[t]||[]),...(b[t]||[])])]);return m}
  if(k==='nb-stats'){
    const m={...b,...a};['blasts','topLevel','bestCombo'].forEach(f=>m[f]=Math.max(a[f]||0,b[f]||0));
    const l=(b.longest||0)>(a.longest||0)?b:a;m.longest=l.longest||0;m.longestSum=l.longestSum||'';return m;
  }
  if(k==='nb-streak'){
    const base=(b.last||'')>(a.last||'')||(b.last===a.last&&(b.n||0)>(a.n||0))?b:a;
    return {...base,best:Math.max(a.best||0,b.best||0,base.n||0),days:[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-63)};
  }
  if(k==='nb-save-endless')return betterSave(a,b);
  if(k==='nb-save-daily')return betterSave(a&&a.day===dayKey()?a:null,b&&b.day===dayKey()?b:null);
  return a;  // nb-save (the game open on this phone) and anything new: keep this phone's
}
function mergeSaves(local,cloud){
  const m={};
  new Set([...Object.keys(local||{}),...Object.keys(cloud||{})]).forEach(k=>{
    if(DEVICE_ONLY.test(k))return;
    const v=mergeKey(k,local?.[k],cloud?.[k]);if(v!=null)m[k]=v;
  });
  return m;
}
function applyCloudSave(m){
  cloudApplying=true;  // the cloud module uploads the merged save itself, so these writes don't ask for one
  try{Object.entries(m).forEach(([k,v])=>store.set(k,v));restoreFromSave()}finally{cloudApplying=false}
}
function restoreFromSave(){
  book=store.get('nb-book',{});stats=store.get('nb-stats',stats);coins=store.get('nb-coins',0);
  streak=store.get('nb-streak',streak);specialSeen=store.get('nb-special-seen',false);
  renderCoins();renderStreak();
  // Bring back a game that got further on the other phone, unless one is mid-move or just ended.
  if(busy||drag||over)return;
  if(tut){if(!store.get('nb-tutorial-done',false))return;tut=null;closeSheet();if(!resumeGame('nb-save-endless',false))newGame('endless');setHint();news('☁️ Your progress is back!');return}
  const cur=saveRank({v:3,level,score}),saved=saveRank(store.get('nb-save-'+mode,null));
  if(saved&&(saved[0]>cur[0]||(saved[0]===cur[0]&&saved[1]>cur[1]))&&resumeGame('nb-save-'+mode,false))news('☁️ Your progress is back!');
}

// ---------- save and resume ----------
// Phones can close the app in the background, so the game is saved after every turn and picked up on the next launch.
function saveGame(){
  if(tut||over)return;
  const save={v:3,day:dayKey(),mode,level,levelBase,score,T,board,tray,erasers,shuffles,toShuffle,chain,chainMoves,continued,levelsSinceAd,
    goals:goals.map(g=>({id:g.id,prog:g.prog,need:g.need,reward:g.reward})),goalCount,seed:rng.seed(),lastV,blastsGame,bestRun};
  store.set('nb-save',save);store.set('nb-save-'+mode,save);
}
function resumeGame(key='nb-save',welcome=true){
  const g=store.get(key,null);
  if(!g||g.v!==3||(g.mode==='daily'&&g.day!==dayKey()))return false;
  if(g.goals.some(x=>!GOALS.find(d=>d.id===x.id)))return false;
  ({mode,level,levelBase,score,T,board,tray,erasers,shuffles,toShuffle,chain,chainMoves,continued,levelsSinceAd,goalCount,lastV,blastsGame,bestRun}=g);
  goals=g.goals.map(x=>({...GOALS.find(d=>d.id===x.id),...x}));
  rng=mulberry(g.seed);tut=null;over=false;busy=false;erasing=false;$('over').hidden=true;
  best=Math.max(store.get(bestKey(),0),score);
  renderModeTab();finishTurn();
  if(!over&&welcome)news(`Welcome back!\nLevel ${level} · make ${T}`);
  return true;
}
function newGame(m){
  mode=m;clearPending();track('game_start',{mode:m});
  rng=mode==='daily'?mulberry(hash('numberblast-'+dayKey())):mulberry(Math.floor(Math.random()*2**31));
  level=1;levelBase=0;score=0;T=targetFor(1);board=Array(N*N).fill(null);erasers=0;shuffles=0;toShuffle=0;chain=0;chainMoves=0;
  continued=false;levelsSinceAd=0;over=false;busy=false;erasing=false;tut=null;lastV=0;blastsGame=0;bestRun=null;
  resetGoals();closeSheet();$('over').hidden=true;
  best=store.get(bestKey(),0);
  seedStarters(4);newTray();

}

const LESSONS=[
  {tiles:{27:4},cell:28,piece:6,hint:'<b>Lesson 1 of 3: make 10.</b> Drag the <b>6</b> next to the <b>4</b>. 4 + 6 = 10, so they blast!'},
  {tiles:{34:2,35:3},cell:36,piece:5,hint:'<b>Lesson 2 of 3: longer sums.</b> Drag the <b>5</b> onto the end. 2 + 3 + 5 = 10 is worth double!'},
  {tiles:{26:6,19:6},cell:27,piece:4,hint:'<b>Lesson 3 of 3: combos.</b> Drop the <b>4</b> where it finishes a sum across and down at once.'},
];
function startTutorial(){
  clearPending();closeSheet();$('over').hidden=true;
  mode='endless';level=1;levelBase=0;score=0;T=10;chain=0;erasers=0;shuffles=0;over=false;busy=false;erasing=false;
  tut={step:0};loadLesson();
}
function loadLesson(){
  const L=LESSONS[tut.step];board=Array(N*N).fill(null);track('tutorial_step',{step:tut.step+1});
  Object.entries(L.tiles).forEach(([k,v])=>board[+k]={v,star:false,bomb:false});
  tray=[null,{cells:[{r:0,c:0,t:{v:L.piece,star:false,bomb:false}}]},null];
  renderModeTab();setHint();renderAll();
}
function nextLesson(){
  if(++tut.step<LESSONS.length)return loadLesson();
  endTutorial(false);
}
function endTutorial(skipped){
  track(skipped?'tutorial_skip':'tutorial_complete',skipped?{step:tut.step+1}:{});
  tut=null;store.set('nb-tutorial-done',true);
  newGame('endless');
  if(!skipped){
    justTutored=true;setHint();SFX.big();fireworks();
    openSheet(`<h3>🎉 Tutorial done!</h3><p>That was practice. <b>Now the real game starts.</b></p>
      <p>Make <b>${T}</b> with touching blocks. Score <b>${goalFor(level)} points</b> to clear level 1.</p>
      <div class="btns"><button class="btn" id="tut-go">Start playing</button></div>`,true);
    $('tut-go').onclick=closeSheet;
  }
}
$('hint').addEventListener('click',e=>{if(e.target.id==='tut-skip'&&tut&&!busy)endTutorial(true)});

// ---------- tools ----------
$('eraser').onclick=()=>{
  if(tut||busy||over)return;
  if(erasing){erasing=false;renderAll();return}
  if(!erasers)return offerPowerup('eraser');
  erasing=true;renderAll();toast('Tap a block to erase it');
};
boardEl.addEventListener('pointerdown',e=>{
  if(!erasing||busy)return;const c=e.target.closest('.cell');if(!c)return;const k=+c.dataset.i;if(!board[k])return;
  board[k]=null;erasers--;erasing=false;SFX.erase();buzz(10);finishTurn();
});
// Hint, like in solitaire: show a drop that blasts for a moment, with the piece ghosted in place.
let hintTimer=null;
function bestMove(){
  let best=null;
  tray.forEach((p,i)=>{if(!p)return;for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!fitsAt(p,r,c))continue;const b=board.slice();p.cells.forEach(x=>b[(r+x.r)*N+c+x.c]=x.t);
    const runs=findRuns(b);if(!runs.length)continue;
    const n=runs.reduce((a,run)=>a+run.cells.length,0);if(!best||n>best.n)best={i,r,c,n,b,runs}}});
  return best;
}
function clearHint(){
  if(!hintTimer)return;clearTimeout(hintTimer);hintTimer=null;
  document.querySelectorAll('.slot.hinted').forEach(s=>s.classList.remove('hinted'));renderBoard();
}
$('hintbtn').onclick=()=>{
  if(tut||busy||over||erasing)return;clearHint();
  const m=bestMove();track('hint_used',{level,found:!!m});
  if(!m){toast(`No ${T} to make right now.\n`+(erasers?'Try the Eraser.':shuffles?'Try a Shuffle.':'Drop a piece anywhere.'),false,READ_MS);return}
  const ghost=new Set(),tiles=new Map(),glow=new Set();
  tray[m.i].cells.forEach(x=>{const k=(m.r+x.r)*N+m.c+x.c;ghost.add(k);tiles.set(k,x.t)});
  m.runs.forEach(run=>run.cells.forEach(k=>glow.add(k)));
  renderBoard({ghost,tiles,glow,much:new Set()});
  document.querySelectorAll('.slot')[m.i]?.classList.add('hinted');
  hintTimer=setTimeout(clearHint,2600);
};
$('shuffle').onclick=()=>{
  if(tut||busy||over)return;
  if(!shuffles)return offerPowerup('shuffle');
  shuffles--;erasing=false;newTray();SFX.shuffle();finishTurn();
};
function renderSound(){$('sound').textContent=muted?'🔇':'🔊';$('sound').setAttribute('aria-pressed',!muted);$('sound').setAttribute('aria-label',muted?'Sound off':'Sound on')}
$('sound').onclick=()=>{muted=!muted;store.set('nb-muted',muted);renderSound()};
addEventListener('resize',()=>{if(!drag)renderTray()});

// ---------- start ----------
buildBoard();renderSound();
if(!store.get('nb-tutorial-done',false))startTutorial();
else if(!resumeGame())newGame('endless');
checkStreakAtRisk();
window.BHCloud?.init?.();  // signed in before: fetch, merge and upload quietly
initAds();
// Test hook for the playtest bot, only when the page is opened with ?test
if(/[?&]test\b/.test(location.search))window.__nb={get S(){return {board,tray,target:T,level,score,erasers,shuffles,over,busy,chain,mode,goals,tut}},findRuns,fill:()=>board.filter(Boolean).length};
})();
</script>
